[package]
name = "nzbserve"
version = "0.1.0"
edition = "2024"
description = "Nested-corpus loopback rig: builds the leg NZB and serves the leg's files as real yEnc articles over plain-TCP NNTP, reusing nzbkit's mock server."
publish = false

[dependencies]
nzbkit = { path = "../../../crates/nzbkit" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

# Standalone crate on purpose: the repo workspace must not pick this up
# (bench tooling, not a shipped crate).
[workspace]

[profile.release]
debug = false

# `[patch.crates-io]` applies from the WORKSPACE ROOT and a detached
# workspace inherits none of the repo root's, so without this table this
# rig compiles the PUBLISHED lzma-rust2 and sevenz-rust2 while every
# shipped binary compiles the vendored forks - a rig measuring code the
# product does not run. Kept in step with the root table by
# `tools/detached-lock-gate.py`, which reads the LOCK rather than this
# table: copying the table is not enough on its own when the fork's
# version is behind the one the lock holds (both agree today).
[patch.crates-io]
sevenz-rust2 = { path = "../../../vendor/sevenz-rust2" }
lzma-rust2 = { path = "../../../vendor/lzma-rust2" }
