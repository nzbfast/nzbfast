[workspace]
members = [
    "crates/nzbkit",
    "crates/nzbfast",
    "crates/nzbfast-ffi",
    "crates/nzbtray",
    "vendor/rars",
    "vendor/tiny_http",
]
# nzbfast-ffi is deliberately NOT a default member: it turns on
# nzbfast's `ffi` feature, and feature unification would then compile
# the whole module tree a second time (as the lib target) in every
# workspace-wide build and test run. Build it explicitly:
# `cargo build -p nzbfast-ffi --target aarch64-apple-ios-sim`.
#
# `--workspace` OVERRIDES this line, so a command that passes it gets
# none of the protection above. That is not hypothetical: ci-private's
# `cargo nextest archive` carried `--workspace` from the day it was
# written until 23 Aug 2026, so every push paid the duplicate on both
# the Linux and the Windows leg while this comment said it did not.
# Measured cold on an 18-core box with the flag as the only variable:
# the archive build goes 50.9 s -> 64.7 s wall and 381 s -> 455 s of
# CPU, the cached target/ 3.30 GB -> 5.53 GB, the archive artifact
# 159 MB -> 244 MB, and the test set 4,701 -> 6,464 - of which 1,774 are
# the nzbfast lib root re-running a strict SUBSET of the bin root's own
# tests. Byte-identical
# ones: `feature = "ffi"` has exactly ONE site in this workspace,
# `crates/nzbfast/src/lib.rs`'s crate-root `#![cfg]`, so the two roots
# compile the same module files under the same resolved features and
# the duplicate sampled nothing. Before adding `--workspace` to anything
# that BUILDS (as opposed to `cargo metadata`, `cargo fmt` or another
# command that emits no artifacts), price it - and prefer naming the
# package, which is how the two clippy gates reach nzbfast-ffi today
# without dragging the ffi feature through a link step.
default-members = ["crates/nzbkit", "crates/nzbfast", "crates/nzbtray", "vendor/rars", "vendor/tiny_http"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/nzbfast/nzbfast"

# Workspace-wide lints; each first-party crate opts in with
# `[lints] workspace = true`. vendor/ crates keep their own tables, and
# nothing here reaches them. All four first-party crates opt in since
# 26 Aug 2026 - nzbtray was the last holdout, and it is nearly all Win32
# `unsafe`, so it was the crate that most wanted the two below.
[workspace.lints.rust]
clashing_extern_declarations = "deny"
# The unsafe-policy ratchet, on since 26 Aug 2026 (TODO 307 item 3).
#
# WHAT `deny` BUYS OVER THE DEFAULT, since the honest answer is "less
# than it looks and still worth having": in edition 2024 this lint is
# already warn-by-default (measured, not assumed - a probe crate at
# edition 2024 with a bare deref in an `unsafe fn` warns with nothing
# configured), and CI's clippy gate runs `-D warnings`, so the tree was
# already held to it by that ONE job. Denying it here moves the refusal
# into every ordinary `cargo build` / `cargo check` / `cargo test`, so a
# lane sees it at the moment it writes the code rather than at the gate
# - and it survives an edition that ever relaxes the default.
unsafe_op_in_unsafe_fn = "deny"
# `--cfg fuzzing` is set by cargo-fuzz for every crate in its build, and
# par2repair reads it to lower the verify pool's byte gate so
# par2_verify_diff can reach the parallel branch. Declared here or the
# ordinary build warns it is unexpected, and CI's clippy runs -D warnings.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

# Burned down 1 Aug 2026 from 32 categories to these. CI runs clippy with
# -D warnings and no -A escapes at all, so anything not listed here blocks
# - including dead_code and unused_assignments, which used to be waived on
# the command line. What is left splits in two: everything above the
# divider is still debt (fix one, delete its line); everything below it
# is house style, is expected to stay, and says why.
[workspace.lints.clippy]
# The other half of the 26 Aug 2026 unsafe ratchet, and the half that
# actually found something: every `unsafe` block, `unsafe impl` and
# `unsafe fn` body must carry a `// SAFETY:` line on the line above
# saying WHY it is sound. 53 first-party sites had no such line when
# this went on - 49 the host clippy gate reaches, plus four that ONLY
# `--target x86_64-pc-windows-gnu` can see (three in nzbkit's logtee
# log-capper, one in the GetDiskFreeSpaceExW arm of diskfree). Every one
# was documented rather than rewritten: the deliverable was the argument
# and the ratchet, not a refactor of working platform code.
#
# ONE CLIPPY RUN SHOWS ONE LAYER, which is the same trap CLAUDE.md's
# SIXTEENTH gate entry writes up for the Windows recipe and it applies
# to the host run just as hard: a lib that fails to compile is never
# followed by the bin and test targets that depend on it, so four
# errors in nzbkit's lib hid 38 more behind them. Turning either of
# these on somewhere new means ITERATING to exit 0, not fixing the
# batch the first run named.
#
# A `// SAFETY:` note states the INVARIANT that makes the operation
# sound - which pointer is live, which contract the caller already owes,
# why the bit pattern is valid. "This is safe" is not one. Where the
# obligation is the caller's, say so and point at the `# Safety` clause
# that puts it there.
undocumented_unsafe_blocks = "deny"
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
ptr_arg = "allow"
assertions_on_constants = "allow"
unnecessary_unwrap = "allow"

# --- below this line: kept on purpose, not debt ---
# The two doc lints below are a house-style clash, not debt. Copy rules ban
# em-dashes, so an aside is written as a spaced hyphen, and reflowing
# puts one at the start of a line - which markdown then reads as a
# bullet, making the rest of the paragraph a
# "lazy continuation". Clippy's fix indents the paragraph under the
# phantom bullet, which entrenches the misparse instead of fixing it.
# Neither crate publishes rustdoc, so the rendering is not worth
# reflowing 126 comments over.
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
# Also style, not debt: the 15 remaining sites are numeric kernels and
# fixtures where the index IS the value - gf16's log/exp tables, RAR5's
# `<< (7 * i)` vint, the PAR2 matrix product, `format!("big.7z.{i+1}")`.
# enumerate()/zip() reads worse in every one.
needless_range_loop = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
# Drop symbol tables: smaller binaries, and removes build-host-varying
# symbol data - part of making release builds attestable/reproducible.
strip = "symbols"

# ---------------------------------------------------------------------
# The vendored RAR engine is a FIXTURE BUILDER for most of this repo's
# tests, and at opt-level 0 it was the single largest cost in CI.
#
# ~32 sites across four test files (extract/{chase_shape,chase,nested,
# sfx}_tests.rs) build REAL compressed RAR volumes with
# `Rar50VolumeWriter` - an actual LZ bitstream, not a header shell -
# because a chase test that fed a hand-crafted fixture would prove
# nothing about the decoder. That compression is rars code, and an
# unoptimized LZ inner loop is 7-10x off its own release speed.
#
# What that cost, measured 23 Aug 2026 on run 32653896109:
#
#   nzbkit extract::chase::chase_shape_tests::
#     a_chase_survives_trimming_the_volume_its_deferred_walk_resumes_in
#       272.2s on windows-unit shard 4 (of that shard's 451.7s)
#       177.4s on linux-tests  shard 3 (of that shard's 309.5s)
#
# It is ONE test, and locally it was the entire nzbkit lib suite's wall
# clock: 85.575s for the suite, 85.509s of it that test, with the other
# 1,768 tests finishing inside it. Split with a standalone probe, 76.4s
# of its 109.5s was `Rar50VolumeWriter` compressing the 37 MB fixture -
# no nzbfast code involved, and nothing the test is there to prove.
#
# The fixture cannot simply be made smaller: the test needs three
# volumes EACH over `HOLDS_CAP_FLOOR` (8 MiB) or the finish volume never
# trims and the regression it pins (TODO 220/250, the deferred header
# walk re-reading a trimmed prefix) cannot occur at all. The size is the
# field condition, so the answer is to make the engine fast, not the
# fixture weak.
#
# Measured with this override, same box, same tests:
#
#   fixture build (37 MB -> 3 volumes)   76.4s -> 10.2s   7.5x
#   the test above                      109.6s -> 10.8s  10.1x
#   whole nzbkit lib suite (1769 tests)  85.6s -> 47.0s   -45%
#
# All 1,769 pass either way, identical volume sizes out of the writer.
# The suite's new floor is `pool::fault_rigs`, which paces real sleeps
# and is not a codegen cost - correctly untouched by this.
#
# On CI, rars-attributable work was 34% / 37% / 42% / 59% of measured
# test time on the four windows-unit shards, so this is the lever on the
# slowest shard rather than a saving spread thinly.
#
# THE COST, measured: rars recompiles in 5.2s instead of 1.8s, once per
# build job - and it recompiles on every run regardless, because git
# checkout stamps its sources newer than any cached artifact. 3.4
# seconds on the build leg to take minutes off the test legs.
#
# CONFIRMED ON CI, 23 Aug 2026, after this landed: windows-unit's
# slowest shard went 486s to ~316s (mean of 2 runs), and the build step
# was unchanged within noise (817s to ~827s). So the prediction above
# held on the leg it was about. Note the whole of that win is THIS
# change: the nzbkit test-target merge that landed right after it moved
# the same number not at all, and its own header carries that
# correction.
#
# `debug-assertions` and `overflow-checks` are NOT touched and stay ON -
# verified with `cargo build -v`, which shows `-C opt-level=2` and
# `-C debug-assertions=on` together. This changes codegen only, so every
# runtime check the suite relies on (and tools/overflow-gate.py's whole
# subject) still fires. Optimizing is not the same as trusting.
#
# NOT extended to `package."*"` (all dependencies), which was tried and
# is NOT justified here: the other slow CI tests (index::evict,
# index::segmig, par2ntt) are 2-4s locally against 19-30s on a Windows
# runner, so they are bound by that runner's cores and filesystem, not
# by unoptimized dependency code - optimizing every dependency measured
# no faster on them and would buy a large cold-build cost for nothing.
#
# `dev` covers rars as a DEPENDENCY of nzbkit's tests; `test` covers
# rars's own test target. Both, or half the win is missing.
[profile.dev.package.rars]
opt-level = 2

[profile.test.package.rars]
opt-level = 2
