[package]
name = "nzbfast"
version = "1.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Speed-focused NZB downloader"

[lints]
workspace = true

[dependencies]
nzbkit = { path = "../nzbkit", default-features = false }
# The bottom layer, cut out by step 2 of
# research/PLAN-NZBFAST-CRATE-SPLIT-2026-09-01.md. Its 30 modules are
# re-imported under their old names in main.rs and lib.rs
# (`pub(crate) use nzbfast_core::diag;`), so every `crate::diag::...`
# path in the modules that stayed here resolves unchanged.
nzbfast-core = { path = "../nzbfast-core" }
# The extraction, repair and filing layer, cut out by step 3 of the same
# plan. Its nine modules are re-imported under their old names in main.rs
# and lib.rs (`pub(crate) use nzbfast_unpack::smart;`), so every
# `crate::smart::...` path in the modules that stayed here resolves
# unchanged.
nzbfast-unpack = { path = "../nzbfast-unpack" }
# The search, index-scan and metadata layer, cut out by the same step.
# Its twelve modules are re-imported under their old names in main.rs and
# lib.rs (`pub(crate) use nzbfast_meta::wall;`), so every
# `crate::wall::...` path in the modules that stayed here resolves
# unchanged - INCLUDING the slim build, because the wall/wall_slim swap
# is a cfg inside that crate now rather than a `#[path]` pair here.
nzbfast-meta = { path = "../nzbfast-meta" }
# The download engine - the one-pass fetch, decode, settle and tail
# pipeline - cut out by step 4 of the same plan. Its one module is
# re-imported under its old name in main.rs and lib.rs
# (`pub(crate) use nzbfast_engine::get;`) and globbed at both roots, so
# every `crate::get::...` path and every bare name the CLI shells and
# serve/ resolve through `use get::*;` is unchanged.
nzbfast-engine = { path = "../nzbfast-engine" }
# The daemon layer of serve - the `Daemon` type, its queue and history
# stores, its settings, its persistence and the background state - cut
# out by lane 2 of Option C in the same plan. Its 71 units are
# re-imported under their old names in `src/serve/mod.rs`
# (`pub(crate) use nzbfast_daemon::daemon;`), so every
# `crate::serve::<unit>::...` path in the api, tasks and wiring layers
# that stayed here resolves unchanged.
nzbfast-daemon = { path = "../nzbfast-daemon" }
# The background-lane layer of serve - the scheduled and long-running
# tasks - cut out by lane 3 of Option C in the same plan. It is a SIBLING
# of nzbfast-api: both stand on nzbfast-daemon and neither names the
# other, which is what lets cargo check them in parallel. Its one unit is
# re-imported under its old name in `src/serve/mod.rs`
# (`pub(crate) use nzbfast_tasks::tasks;`), so every
# `crate::serve::tasks::...` path in the api and wiring layers resolves
# unchanged.
nzbfast-tasks = { path = "../nzbfast-tasks" }
# The request layer of serve - the JSON API, the SABnzbd-compatible
# surface and the embedded web pages - cut out by lane 3 of Option C in
# the same plan. A SIBLING of nzbfast-tasks: neither names the other, so
# cargo checks them in parallel. Its eight units are re-imported under
# their old names in `src/serve/mod.rs`
# (`pub(crate) use nzbfast_api::sabcompat;`), so every
# `crate::serve::<unit>::...` path in the wiring layer resolves
# unchanged - INCLUDING the web assets: `dashboard` below forwards to
# this crate's own feature, and its build.rs writes the OUT_DIR members
# `assets.rs` reads.
nzbfast-api = { path = "../nzbfast-api" }
# `parallel` turns on rars' multithreaded RAR5 block decode (unrar-parity
# extraction wall speed; members >=16MB fan symbol decode across 4 workers).
rars = { path = "../../vendor/rars", features = ["parallel"] }
# Native 7z extraction (Apache-2.0, pure Rust - keeps the zero-external-tools
# stance). Decode-only: no `compress` encoder, no wasm; aes256/bzip2/ppmd
# cover the encrypted + non-LZMA methods real posts use.
sevenz-rust2 = { version = "0.22", default-features = false, features = ["aes256", "bzip2", "ppmd"] }
anyhow = "1"
# `env` backs `--config`'s NZBFAST_CONFIG fallback: the container sets that
# variable for the daemon, and without it a `docker exec … import-sab` wrote
# a config.local.json the daemon never reads (issue #8).
clap = { version = "4", features = ["derive", "env"] }
# `signal`: SIGTERM/SIGINT reach the same wind-down the tray's Quit item
# uses, so `docker stop` hands the provider's sessions back with a QUIT
# instead of orphaning them until its idle timeout (issue #13).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
# Vendored + hardened: upstream 0.12.0 (the newest release) has two
# unauthenticated one-request permanent kills and no way to set a socket
# timeout. See vendor/tiny_http/VENDORING.md. `ssl-rustls` is the daemon's
# opt-in native HTTPS (§129 2a): a rustls acceptor on tiny_http's own accept
# loop, fed a prebuilt rustls::ServerConfig from take_listener.
tiny_http = { path = "../../vendor/tiny_http", features = ["ssl-rustls"] }
# Dual-stack listener for an IPv6 --bind (issue #58): std's TcpListener
# offers no way to clear IPV6_V6ONLY, and Windows defaults it ON - so
# `--bind ::` there answered IPv6 alone and an IPv4-only client (Radarr
# on 127.0.0.1) was refused. take_listener builds the socket itself and
# hands it to tiny_http prebuilt. Already in the lockfile via tokio -
# no new dependency tree.
socket2 = "0.6"
# Two consumers, one entry: §129 2a builds the daemon's HTTPS server config
# (--tls-cert/--tls-key, fed prebuilt into tiny_http), and §129 2e is the
# native SMTP sender's client TLS (whose ClientConfig is nzbkit's shared
# one, so the trust anchors + NZBFAST_EXTRA_CA match the NNTP path). Both
# name the aws-lc-rs provider explicitly, because the tree links both
# aws-lc-rs and ring and a bare builder() panics at run time.
rustls = { version = "0.23", features = ["aws-lc-rs"] }
# Startup-time certificate sanity for --tls-cert: an expired or not-yet-valid
# cert fails fast with the file named, instead of every browser refusing with
# its own wording while the daemon log shows nothing.
x509-parser = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
ureq = "2"
# Update-manifest binary verification (auto-update): sha256 for payload
# integrity, ed25519 for manifest authenticity (a signature the update
# origin cannot forge without the offline signing key).
sha2 = "0.11"
# §129 4a webhook signing (X-NzbFast-Signature). Already in the lockfile
# via nzbkit's RAR5 crypto - no new dependency tree.
hmac = "0.13"
ed25519-dalek = "3"
hex = "0.4"
# OS entropy for the first-run API key. That key is the only thing
# standing between a LAN and the daemon's full control API, so it must
# come from the platform CSPRNG - not from RandomState (see fresh_secret,
# which is fine for a capability URL and is NOT used here).
getrandom = "0.4"
# IMDb datasets ratings file is gzip'd TSV (keyless nightly download),
# and webasset.rs gzips the embedded pages at respond time - so
# this is unconditional now (nzbkit already depends on it regardless,
# so slim builds gain no new crate).
flate2 = "1"
# M28 wall thumbnails: decode cached posters (jpeg/png/webp sources),
# resize, re-encode jpeg. No default features - just the codecs.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
libc = "0.2"
# 0.10 to MATCH nzbkit: the download path hashes with md-5 0.10 (which
# carries the asm backend on x86), and bench-cpu must measure the same
# implementation. 0.11 here meant the bench timed a different MD5 than
# downloads use.
md-5 = "0.10"
crc32fast = "1.5.0"
rpassword = "7"
qrcodegen = "1.8.0"
notify = "8.2.0"
# Structured logging. The subscriber writes to the process's own
# stdout/stderr, which is what logtee tees into the dashboard's log pane -
# so the viewer keeps working with no plumbing of its own (see logging.rs).
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
# `fmt` + `registry` only. NOT `env-filter`: that feature pulls
# matchers/regex-automata in for its span-field syntax, which nothing here
# uses - `filter::Targets` parses the same `info,queue=debug` grammar for
# per-target levels and costs no new crates. `ansi` stays off: the output
# goes to a pipe (logtee) and into an HTML <pre>, where escape codes are
# garbage, not colour.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }

# mimalloc as the global allocator on macOS + Linux (the two platforms we
# ship as native binaries and Docker/NAS images; the Windows cross-build
# keeps the system allocator - mingw + mimalloc is unvalidated, see below).
# Two independent reasons it earns its place:
#   - macOS: the system allocator (xzone malloc) never returns freed
#     pipeline buffers to the OS - malloc_zone_pressure_relief is a
#     measured no-op - so a finished job leaves GBs resident forever.
#     mi_collect(true) marks them reusable (phys_footprint drops to
#     ~nothing, next job flips the same pages back in ~140 ms).
#   - Linux (the constrained-CPU target: 4-core ARM NAS, Celeron, Pi):
#     under the pipeline's per-article alloc/free churn plus the
#     extractor's hold buffers, mimalloc beats both musl malloc (slow,
#     lock-heavy) and glibc malloc (arena fragmentation) on throughput
#     and RSS. The shipped Linux binaries are glibc/-gnu today, so this
#     lands on the real NAS artifact, not a hypothetical musl one.
# The idle-trim in serve.rs calls mi_collect(true) under the same cfg;
# nzbkit::mem::trim() (glibc malloc_trim) stays as a harmless no-op once
# mimalloc owns the heap.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }

# The trash crate has no Android or iOS backend (no system trash exists
# on either); the delete path refuses there and the files stay, same as
# a refused delete on any other platform.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5.2.6"

# GetDiskFreeSpaceExW for disk_stat - the min-free download guard and the
# dashboard's free-space readout both go dark without it. Same crate and
# version nzbtray already links, so the windows build gains no new
# dependency. libc has no statvfs on windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # GetLocalTime, for the quota ledger's local-midnight rollover.
    "Win32_System_SystemInformation",
    # serve/peeracct.rs: which account owns the far end of a loopback
    # connection (GetExtendedTcpTable -> pid -> token user SID), the
    # second factor on the first-run handoff token.
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Threading",
] }

# Kernel TLS, Linux only and off by default - see nzbkit's `ktls`
# feature. Built in with `cargo build --features ktls`, then armed at
# run time with NZBFAST_KTLS=1.
[features]
default = ["indexer", "dashboard"]
# The indexer stack: newsgroup index + scan loop, Spotnet, availability
# oracle, wall/browse, and the metadata enrichment workers. Slim builds
# (phones, small boxes) disable it; queue/history/download pipeline are
# untouched and sqlite drops out of the binary entirely.
#
# It PULLS IN `dashboard`, because the wall is a dashboard page: /wall is
# served by the same `respond_shell` the dashboard is, off the same shared
# design tokens, so an indexer with no page to render it on is not a
# configuration anything wants. Stating it here is what keeps every
# existing `#[cfg(feature = "indexer")]` site correct with no second
# condition on it - indexer implies dashboard, so WALL_HTML exists
# wherever the shell machinery does.
#
# It FORWARDS to `nzbfast-core/indexer` too: four core modules
# (identity, interests, ratelimit, xrel) carry single sites of this
# gate, and forwarding is what keeps them ONE switch rather than two -
# a slim build turns both off together and `slim-check` compiles what
# the phones ship.
indexer = [
    "nzbkit/indexer",
    "nzbfast-core/indexer",
    "nzbfast-meta/indexer",
    "nzbfast-daemon/indexer",
    "nzbfast-tasks/indexer",
    "nzbfast-api/indexer",
    "dep:image",
    "dashboard",
]
# The browser-facing web UI: the dashboard and wall shells, the user's own
# stylesheet, the 27 i18n catalogues, the 16 manuals, the favicons and the
# web manifest - about 11.5 MB of source before build.rs gzips it, and
# every byte of it exists to be read in a browser.
#
# ON in `default`, so every desktop build is exactly what it was. OFF in
# the slim build, which is what the PHONES are: both mobile shells drive
# the engine over the local API and render natively (SwiftUI, Compose),
# and TODO 281 IO3b wants it gone from the STORE binary in particular -
# an app that ships a whole web UI reachable at localhost is the
# web-shaped app App Review guideline 4.2 is about, and it is a door
# nothing in the product opens.
#
# A headless small box that wants the web UI without the indexer builds
# `--no-default-features --features dashboard`. Nothing user-facing has
# ever documented a slim build, so this takes nothing away from anyone;
# what it buys is that the dashboard-off configuration is COMPILED BY CI
# on every push - `slim-check`, and both legs of mobile-targets.yml -
# rather than being a store-only shape nobody builds until a release.
dashboard = ["nzbfast-api/dashboard"]
ktls = ["nzbkit/ktls"]
# Embedded/in-process hosting (the iOS staticlib via crates/nzbfast-ffi).
#
# It gated the whole of src/lib.rs until the crate-split step 4.5 (2 Sep
# 2026), which is why that root used to compile to EMPTY in an ordinary
# build. It does not any more - lib.rs is the package's one root and
# carries the module tree in every configuration - so what this feature
# turns on now is the three `embedded_*` entry points at the foot of that
# file and nothing else. Still off by default, because a desktop build
# has no host process to be embedded in.
ffi = []
# Build-gate for the six heavy [[test]] targets at the bottom of this
# file (TODO 116b). EMPTY on purpose - it compiles no code in or out;
# its only effect is whether cargo builds the targets that name it in
# required-features. Per-push CI does not pass it, so those targets stop
# paying link time and disk there; nightly.yml (their home) and
# pr-check.yml pass `--features heavy-tests` where they run them.
heavy-tests = []

# NO `flate2` HERE ANY MORE. `precompress_pages` moved to
# `crates/nzbfast-api/build.rs` with the `include_bytes!` sites that read
# its output (lane 3 of Option C): `env!("OUT_DIR")` names the OUT_DIR of
# the package being compiled, so the two halves cannot live apart. What
# is left in this package's build.rs is the Windows icon, VERSIONINFO
# and manifest, plus the beta serial, and none of it needs a dependency.

# Signing tooling for the update manifest (keygen + detached sign) lives
# in examples/update_sign.rs so the daemon and the release pipeline use
# the exact same ed25519 implementation. getrandom seeds keygen.
[dev-dependencies]
# The same crate as the normal dependency above, with its test seams
# switched on. Six items this crate's tests reach for were `#[cfg(test)]`
# while the two crates were one, and `cfg(test)` is invisible across a
# crate boundary whatever the visibility - so they are behind
# `test-support` now (its own note in nzbfast-core/Cargo.toml lists
# them). Declared as a DEV dependency so the feature is on whenever a
# test target is built and off in `cargo build -p nzbfast`, which is the
# shipped binary.
nzbfast-core = { path = "../nzbfast-core", features = ["test-support"] }
# Same crate as the normal dependency above with ITS test seams on:
# `smart`'s trash-test globals (`trash_globals_steady`,
# `one_trash_test_at_a_time`, `force_trash_unresponsive`) are
# `#[cfg(test)]` items that tests_jobs.rs and splitjoin's own tests
# take, and a `cfg(test)` item is invisible across a crate boundary
# whatever its visibility.
nzbfast-unpack = { path = "../nzbfast-unpack", features = ["test-support"] }
# Same crate as the normal dependency above with ITS test seams on:
# `testutil::test_daemon` (the fixture every api-layer test builds a
# Daemon with) and `storecut` (the durable-write fault injection
# api/queue/custody_tests.rs arms) are `#[cfg(test)]` items, and a
# `cfg(test)` item is invisible across a crate boundary whatever its
# visibility. Both are inert until a test in the same process arms
# them, so the daemon binary an integration test SPAWNS - which
# carries every dev-dependency feature this package turns on -
# behaves exactly as the shipped one does.
nzbfast-daemon = { path = "../nzbfast-daemon", features = ["test-support"] }
# Same crate as the normal dependency above with ITS test seam on:
# `par2repair::adopt::disabled_for_screen` reads NZBFAST_TEST_NO_ADOPTION
# only in a build that carries this feature, which is what lets a lane
# point the deterministic repeating-payload screen at the whole e2e suite
# (research/PAYLOAD-TRAP-PATH-DEPENDENT-CENSUS-2026-09-04.md). A DEV
# dependency, so the feature is on for every test target - including the
# `nzbfast` binary those targets SPAWN - and off in
# `cargo build -p nzbfast`, which is the shipped binary. Nothing sets the
# variable by default; the lever is inert until a lane arms it.
nzbkit = { path = "../nzbkit", default-features = false, features = ["test-support"] }
getrandom = "0.4"
# The posting-layout generator behind the `layouts` test target: a
# profile in `crates/postfast/catalog/` goes in and a deterministic
# layout (files, articles, headers, NZB, faults, and the end state the
# client must reach) comes out. DEV-only on purpose - it is test
# infrastructure and the shipped binary must not carry the archive
# writers and the toml parser it pulls in.
postfast = { path = "../postfast" }
# Seed-harvest migration tests open the daemon's closed index directly to
# model a pre-manifest database. This is the same version/features nzbkit's
# index tests already compile, so it adds no production dependency.
rusqlite = { version = "0.40.1", features = ["hooks"] }
# TLS daemon tests (§129 2a): rcgen mints the test certificate (end-entity,
# basicConstraints CA:FALSE by construction - the CaUsedAsEndEntity trap a
# hand-run `openssl req -x509` falls into), and rustls is the verifying
# client that fetches / and /api over https trusting exactly that cert.
rcgen = { version = "0.14.9", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
# The 7z ENCODER, for building container fixtures in the extraction tests.
# Dev-only on purpose: resolver 2 does not unify dev-dependency features
# into a normal build, so `cargo build` still links the decode-only
# configuration declared above and the shipped binary gains no encoder.
sevenz-rust2 = { version = "0.22", default-features = false, features = [
    "aes256",
    "bzip2",
    "ppmd",
    "compress",
] }

# The six heavy integration targets, build-gated behind `heavy-tests`
# (TODO 116b). Their home is nightly.yml: daemon/e2e/leak_soak by an
# actual decision, and index_size_cap/http_wedge/queue_soak because they
# MEASURE ELAPSED TIME - a different kind of test, not merely a dearer
# one. ci-private's per-push nextest already filtered all six from
# RUNNING, but `-E 'not binary(x)'` filters running only, so each still
# paid full link time and disk on every push - on Linux the linker
# copies DWARF INTO each statically linked executable. This gate stops
# the BUILD.
#
# The shape deliberately preserves the auto-enrolment default that
# ci-private.yml's long note insists on: a test target added tomorrow
# carries no required-features, so it builds AND runs on push
# automatically. The only names anyone maintains are the few below that
# must not.
#
# Run locally with e.g.:
#   cargo test -p nzbfast --test daemon --features heavy-tests -- --test-threads=1
[[test]]
name = "daemon"
required-features = ["heavy-tests"]

[[test]]
name = "e2e"
required-features = ["heavy-tests"]

[[test]]
name = "leak_soak"
required-features = ["heavy-tests"]

[[test]]
name = "index_size_cap"
required-features = ["heavy-tests"]

[[test]]
name = "http_wedge"
required-features = ["heavy-tests"]

[[test]]
name = "queue_soak"
required-features = ["heavy-tests"]
