[package]
name = "nzbtray"
# Keep in lockstep with crates/nzbfast (the version source of truth) -
# the installer stamps that string on both exes' packaging.
version = "1.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(windows)'.dependencies]
# The daemon is always 127.0.0.1, but it is not always plain HTTP: with
# tls_cert/tls_key set it binds HTTPS, and a tray without a TLS stack
# could not probe, open, stop, upgrade or quit its own engine (M1). So
# `tls` is on - it brings rustls with RING only (ureq pins it
# default-features = false), not aws-lc-sys, so nothing new has to build
# for the Windows target.
ureq = { version = "2", default-features = false, features = ["tls"] }
# Declared directly for the custom loopback verifier in `loopback_tls` -
# same version and the same ring-only feature set ureq asks for, so this
# adds no crate the `tls` feature above did not already pull in.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
serde_json = "1"
# Launcher handshake: the tray proves the listener on a port is the daemon
# whose runtime.json it just read, BEFORE handing over the stored API key.
# Same crate the daemon and nzbkit already use, so nothing new enters the
# tree - see probe_body::proof_matches.
sha2 = "0.10"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The tray itself is Windows-only, but the probe-body classifier that
# decides attach-vs-spawn is compiled and tested on every host, so its
# JSON parser and hash have to be reachable off Windows too. Dev-only:
# nothing is added to what actually ships.
serde_json = "1"
sha2 = "0.10"
