# Z2: the map carries a password.

[layout]
name = "z2-meta-password"
seed = 22
note = """
<meta type="password"> is the one place a client can learn a post's
password before it has opened anything, and a4-meta-password in the
NESTED corpus (bench/nested-corpus) is the shape this ports. It was
credited to the capability corpus until 3 Sep 2026, which has no such
leg - its legs are n01 to n37 and none of them carries a password at
all. The schema refuses the meta unless [container] password is set, so
the map can state a password that exists rather than one it invented.

The password is inert in this row and that is the point of putting it
here rather than waiting: no container means nothing to open, so what
is being pinned is that a map carrying a password is still an ordinary
map - it parses, the client reads the meta, and the download is not
changed by it. The row where the password is USED needs an encrypted
container, which is the container plane's C4 and C5, and that row will
select this same key.

notasecret, obviously, per the catalog's rule about anything real.
"""

[source]
files = [{ name = "Locked.Feature.mkv", bytes = 32768 }]

[container]
password = "notasecret"

[encoding]
article_bytes = 8192

[nzb]
meta_password = true

[expect]
complete = true

[expect.ladder]
reaches = ""
