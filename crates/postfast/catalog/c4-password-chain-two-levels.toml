# C4 + C13: two encrypted levels, a DIFFERENT password at each.

[layout]
name = "c4-password-chain-two-levels"
seed = 116
note = """
The password chain, which is the shape a single `[container] password`
cannot state and the reason the inner table grew a password of its own.

Two levels, both data-encrypted, and the passwords DIFFER. That matters
because a stack sharing one password is passed by a client that tries
the one password it was given at every level, which is a much weaker
property than the one this row is about.

HOW THE SECOND PASSWORD REACHES THE CLIENT, which is the whole row.
A real post can announce ONE password, so the NZB's
<meta type="password"> carries the outermost - the one a downloader
meets first, and the only one it could use without having opened
anything yet. The inner password is not announced anywhere. It rides
INSIDE the outer archive, as an ordinary text file beside the inner
archive, which is what the `text` key on a sibling is for.

That is not a carrier this catalog invented for itself. The client
already harvests password candidates from each level's own outputs -
`nzbfast_unpack::rarfix::passwords::harvest_password_candidates` reads
the trimmed lines of small .txt/.nfo/.diz files sitting beside the
archive it is about to open - so a level that drops the next level's
password in a text file is exactly the shape that path exists to
unlock. Before the `text` key a profile could only emit noise of a
stated length, which says nothing, so the outermost password was the
only one a generated layout could ever deliver.

So a green row here is three separate claims: the client read the meta
for the outer password, it kept denesting past a level that held
something besides an archive, and it harvested the inner password from
a file it had itself just written. Measured rather than assumed, 4 Sep 2026: with the sibling
replaced by an unrelated 40-byte file the row FAILS, and it fails in
the shape this note predicts - the client lands the outer level, cannot
open the inner one, reports "an archive in the output directory could
not be unpacked" and leaves the payload sealed. Without that arm a
green row here would also be green if the client had guessed the inner
password, or if the generator had quietly written both levels under the
outer one.

Both passwords are furniture. They travel in the clear - one in the NZB
head, one in a text file inside an archive whose password is in the NZB
head - which is the point of the shape and why nothing real goes here.
"""

[source]
files = [{ name = "chained.bin", bytes = 20000 }]

[container]
kind = "rar-stored"
encryption = "data"
password = "outer-fixture-pw"
siblings = [{ name = "password.txt", text = "inner-fixture-pw" }]

[[container.inner]]
kind = "rar-stored"
encryption = "data"
password = "inner-fixture-pw"

[nzb]
meta_password = true

[expect]
complete = true

[expect.ladder]
reaches = ""
