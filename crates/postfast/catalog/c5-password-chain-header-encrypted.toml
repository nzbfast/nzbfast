# C5 + C13: a chain whose levels are HEADER-encrypted, one password each.

[layout]
name = "c5-password-chain-header-encrypted"
seed = 117
note = """
c4-password-chain-two-levels with both levels' file lists gated as well
as their data, which asks the client for something strictly harder.

Under C4 the client can open the inner archive far enough to see what
is in it and only fails on the bytes, so a candidate password can be
checked against a readable header. Here it cannot: without the right
password `ArchiveReader::read` refuses the inner archive with
NeedPassword before it reaches an entry, so the client has to try
candidates against an archive that tells it nothing until one works.
A client that only harvests passwords when it can first identify what
it is looking at passes the C4 chain and fails this row.

The candidate it needs is in a text file the OUTER level carried, which
the client wrote out itself one level earlier - see the C4 chain's note
for why that is the only way a second password can travel and for the
measured control arm proving it is what unlocks the row.

Kept as a separate row rather than folded into the C4 chain because the
two fail differently and a single row could only report one of them.
"""

[source]
files = [{ name = "chained-sealed.bin", bytes = 20000 }]

[container]
kind = "rar-stored"
encryption = "header"
password = "outer-fixture-pw"
siblings = [{ name = "password.txt", text = "inner-fixture-pw" }]

[[container.inner]]
kind = "rar-stored"
encryption = "header"
password = "inner-fixture-pw"

[nzb]
meta_password = true

[expect]
complete = true

[expect.ladder]
reaches = ""
