# C4 + C13 + C14 + C7 + C12 + Z2: a password chain whose INNER level is
# a 7z, reached with a password the outer level carries.

[layout]
name = "c4-c13-password-chain-7z-inner"
seed = 183
note = """
`c4-password-chain-two-levels` with the inner level's FORMAT changed: a
RAR archive over a 7z archive, both data-encrypted, and the passwords
differ. That two-level row carries the argument for the chain in full and
this note does not repeat it; what follows is what changes when the inner
level is not a RAR.

HOW THE SECOND PASSWORD REACHES THE CLIENT is unchanged, because it is
the only carrier there is. A post announces ONE password, in
`<meta type="password">`, and that is the outermost - the one a
downloader meets before it has opened anything. The inner password rides
inside the outer archive as an ordinary text file beside the inner
archive, which is what a sibling's `text` key is for, and the client
already harvests trimmed lines out of small .txt/.nfo/.diz files sitting
beside the archive it is about to open
(`nzbfast_unpack::rarfix::passwords::harvest_password_candidates`).

WHAT IS NEW is the level the harvested password is spent on. That harvest
feeds a per-container key probe, and the 7z arm of it had NO layout row
pointing at it: an encrypted 7z was the one shape where the client's disk
ladder had a password probe of its own with nothing generated to aim at
it. A client that harvested a candidate and then only ever tried it on a
RAR passes `c4-password-chain-two-levels` and fails this row.

The two passwords DIFFER, which is the load-bearing half. A stack sharing
one password is passed by a client that tries the one password it was
given at every level, which is a much weaker property; and it would also
be passed by a GENERATOR that had quietly written both levels under the
outer password. `container.rs`'s
`an_inner_seven_zip_level_encrypts_under_its_own_password` is the
generator-side pin for the second of those, and it asserts the inner
archive does NOT open with the outer password.

The inner level is `7z-stored`, so this row does not also carry C3: the
compressed corners are `c4-encrypted-7z-data` and
`c5-encrypted-7z-header`, and a row that varied the storage mode as well
would answer two questions with one exit code.

MEASURED RATHER THAN ASSUMED, 4 Sep 2026, at the link this row exists
for. With the sibling's `text` replaced by a WRONG password and nothing
else changed, the row FAILS, and the log says which link broke: the
client opens the outer level with the meta password, writes and reads the
note ("password.txt (0.0 MB) decrypted"), and then reports "an archive in
the output directory could not be unpacked" over the inner 7z. So the
green row is the harvest reaching the 7z probe and not the client having
guessed, and not the generator having written both levels under one
password.

Both passwords are furniture. They travel in the clear - one in the NZB
head, one in a text file inside an archive whose password is in the NZB
head - which is the point of the shape and why nothing real goes here.

The end state is the payload file and the password note, which is
ordinary text the post carries rather than recovery data anything spends.
"""

[source]
files = [{ name = "chained.bin", bytes = 16000 }]

[container]
kind = "rar-stored"
encryption = "data"
password = "outer-fixture-pw"
siblings = [{ name = "password.txt", text = "sevenz-fixture-pw" }]

[[container.inner]]
kind = "7z-stored"
encryption = "data"
password = "sevenz-fixture-pw"

[nzb]
meta_password = true

[expect]
complete = true

[expect.ladder]
reaches = ""
