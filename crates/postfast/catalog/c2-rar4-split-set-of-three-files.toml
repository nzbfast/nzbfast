# C2 on the OTHER container generation: several files in ONE split RAR4
# set.

[layout]
name = "c2-rar4-split-set-of-three-files"
seed = 173
note = """
The RAR4 twin of nc-r1-split-stored-set-of-three-files: a stored set
split into volumes carrying three files directly, written by the
rar15_40 writer instead of the RAR5 one.

It is here because it was a named writer gap until 4 Sep 2026.
`rar15_40::write::write_stored_volumes` and `::write_compressed_volumes`
each split ONE member across the volumes, so a RAR4 set holding more
than one file had no emitter and `crate::container` refused it by name
rather than approximating it. The plurals are
`::write_stored_volume_set` and `::write_compressed_volume_set`, made in
the fork at the upstream rars fork and hand-ported into vendor/rars.

The RAR4 set needed one thing its RAR5 twin did not. A single member is
split across EVERY volume, so the split flags alone chain the set and
the writer never wrote an end-of-archive block. A multi-member set has
volumes whose last file is complete, and a reader stops at the first of
those unless an ENDARC block says another volume follows: unrar 7.23
wrote one member out of three before that flag was added. So this row
is a chaining test as much as a member-count one.

Three files and not one on purpose, so the row reaches the plural
emitter rather than the single-member one. WHERE the cuts fall was
misdescribed here until 16 Sep 2026, in a sentence this row inherited
from its RAR5 twin and which CONTRADICTED the paragraph above it: it
claimed the members do not align with the volume cut, that the middle
file straddles a boundary and that a member-aligned set would carry no
split flag. Read out of the emitted RAR4 block headers, `volume_bytes`
is the PAYLOAD budget per volume with headers counted on top, so 24000
bytes of legacy-feature.bin fill the first three volumes to the byte:

  .rar  legacy-feature.bin  8000 of 24000  CONT_NEXT
  .r00  legacy-feature.bin  8000 of 24000  CONT_PREV, CONT_NEXT
  .r01  legacy-feature.bin  8000 of 24000  CONT_PREV         <- the cut
  .r02  legacy-sample.bin   3000 of  3000  whole
        legacy-notes.txt     300 of   300  whole

The paragraph above is the accurate one, and this is the shape it
describes: `.r01` ends on a complete member with no continuation flag,
which is exactly the volume a reader stops at unless the ENDARC block
says another follows. Split flags are written regardless, on
legacy-feature.bin, so the row exercises the plural split-store arm too.
It passes over the member-aligned cut because its volume names are
descriptive; the opaque-named variant, where that cut is load bearing
and no name can group the set, is
`c6-c2-opaque-volumes-over-three-members`.

The end state is the three payload files and the PAR2 index. The
volumes are spent by the unpack and a clean run never fetches the
parity.
"""

[source]
files = [
    { name = "legacy-feature.bin", bytes = 24000 },
    { name = "legacy-sample.bin", bytes = 3000 },
    { name = "legacy-notes.txt", bytes = 300 },
]

[container]
kind = "rar-stored"
version = "rar4"
volume_bytes = 8000
volume_style = "r00"

[recovery]
kind = "par2"
redundancy_pct = 10

[encoding]
article_bytes = 4000

[expect]
complete = true

[expect.ladder]
reaches = ""
