# P10 over P2: the only file in the post that announces itself as parity
# is the one file that is not parity. A gap row until 10 Sep 2026; the
# engine handles it now and it is graded on its exact tree.

[layout]
name = "n2-p2-p10-par2-named-decoy"
seed = 210
note = """
The first row for P10, spec section 7.C (workload W1, "packet sniff",
matrix rows M4-18/19/28). A post names a file `.par2` and its bytes are
not a PAR2 set, and what should decide is the packets rather than the
suffix.

It is `cc-n02-p2-opaque-recovery-names` with ONE plane added, and that
is deliberate: the payload and the real recovery set ride under tokens
exactly as they do there, the real set is found by content or not at
all, and the end state that row asserts is reached. So a failure here
is the decoy and nothing else, and the two rows are each other's
control arm.

WHAT THE DECOY IS, and why it is not random bytes. A client decides a
file is parity on a ladder of rungs: the extension, the packet magic,
the framing walk, each packet's own MD5 seal, and last whether what the
packets say adds up to a set. Random bytes under a `.par2` name are
turned away on the second rung and say nothing about the three above
it. This decoy carries a genuine Main packet and a genuine Creator
packet cut from a real creator's index - correct seals, a real
recovery-set id - then a framing-valid cell whose seal is junk, then
junk. It clears every rung but the last: the set it declares has no
FileDesc packet, so it names no member, checks nothing and can rebuild
nothing. `crate::recovery`'s `create_decoy` argues the shape at length.

WHAT THE ROW MEASURED WHEN IT LANDED, three arms, run 4 Sep 2026 on
this same profile with only the decoy's bytes changed. All three were
RED, and the row was a gap row:

  * The shipped decoy (Main + Creator + junk): the client ACTIVATES it -
    `[par2] set live: 0 file(s), block size 4096` - and only at settle
    does the F11 guard catch it, `the activated recovery set names no
    files (damaged index?)`. By then the real set's volumes have been
    deferred as recovery data and the payload has been published under
    its token.
  * Creator packet only, no Main: `[par2] activation failed (no valid
    PAR2 Main packet found in the input) - falling back to post-download
    verify`. The verifier goes off and never comes back.
  * Junk with no packet magic at all: the same line, the same end state.

The row's greenness did not depend on how deep the decoy went. What the
depth buys is the row's value AFTER the fix: the second and third arms
fail at ACTIVATION and the first does not, so a fix that only retried
when activation FAILED would leave the shipped arm broken. The shipped
arm is the one that stays load-bearing, and it is the one this profile
posts.

WHAT FIXED IT, 10 Sep 2026, and it is deliberately not in the in-stream
activation path at all. Both arms converge at settle - the F11 guard
already turns "a live set that names nothing" into "no set" - and the
pass that can rescue the job from there was already written and simply
unreachable. `get::settle::noset::disk_par2_fallback` magic-sniffs the
deferred volumes on disk and adopts the token-named payload back under
its FileDesc name, and it ran only when the DOWNLOAD had gone wrong. On
this post the download is perfect: every article arrives and decodes,
so the job read as complete and shipped an obfuscated filename. Two
changes, one at each end of that:

  * `settle_without_set` now also enters the fallback arm when the
    directory pass it already runs read a recovery set off disk whose
    member is not there under the name it gives, AND volumes were
    identified in-stream by packet magic. The volume FETCH inside the
    arm keeps the old condition: this door is opened for NAMING, and on
    a job whose payload all arrived there is nothing to buy with wire.
  * `par2repair`'s renamed-set fallback skips a set that declares NO
    file names. That fallback attempts every set in the directory, so
    it attempted the decoy's - whose Main packet lists a file id no
    FileDesc describes - got `Malformed`, and failed the whole
    directory, taking the real set's verdict with it. A set that names
    nothing is no set, which is the same rule F11 applies one layer up.
    A set with SOME descriptors missing, a genuinely damaged index, is
    untouched and still reports its error.

THE DEFECT THIS PINS. `nzbfast get` classifies by NZB subject, so the
`.par2`-named decoy is the job's only par2-main slot and the only input
in-stream activation ever sees; the real set rides under tokens and is
deferred by the in-stream sniff as recovery data. Whether activation
then succeeds on a set naming nothing or fails outright, in-stream
naming is disarmed for the whole job. A poster who ships one
`.par2`-named blob therefore cost an obfuscated post every real name in
it. The end state now matches
`cc-n02-p2-opaque-recovery-names`, which is this row with the decoy
plane removed and is its control arm.

`p3-p10-decoy-beside-an-announced-set` is the same decoy beside a set
the post ANNOUNCES, and it passed throughout: two sets are adopted, the
one that names nothing does not stop the one that does, and the decoy
lands byte-exact. It is the arm that had to stay green through the fix,
and did.
"""

[source]
files = [{ name = "Sniffed.Decoy.2026.mkv", bytes = 120000 }]

[naming]
wire = "opaque"

[recovery]
kind = "par2"
redundancy_pct = 20
names = "opaque"
decoy = { name = "extras.par2", bytes = 3072 }

[encoding]
article_bytes = 40000

[expect]
# Graded on the EXACT tree since 10 Sep 2026: the payload under the name
# its FileDesc gives it, and the decoy beside it byte-exact - the same
# two assertions `p3-p10-decoy-beside-an-announced-set` makes. The gap
# row's `arrives`/`exits`/`gap` keys are gone with the gap.
complete = true

[expect.ladder]
reaches = ""
