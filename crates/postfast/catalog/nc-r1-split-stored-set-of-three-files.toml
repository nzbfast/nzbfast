# C2 + P1: the corpus's baseline leg, and the first profile to put
# SEVERAL files in ONE split store set.

[layout]
name = "nc-r1-split-stored-set-of-three-files"
seed = 161
note = """
The nested corpus's `r1-depth1-store` leg: a stored RAR5 set split into
volumes with a PAR2 set beside it, carrying three files directly - a
feature, a sample, and a small text sidecar. Its README calls it the
shape every client automates, and it is the commonest layout on the
wire.

It is here because it was the last shape in that corpus this generator
could not emit at all, and the reason was not a schema hole: no writer
in `rars` built it. `Rar50VolumeWriter::stored_entry`,
`::encrypted_stored_entry`, `rar15_40::write::write_stored_volumes` and
`::write_compressed_volumes` each split ONE member across the volumes,
and only `::compressed_entries` took a slice, so a split STORE set
holding more than one file had no emitter and `crate::container`
refused it by name rather than approximating it. Gap H0 of
research/POSTFAST-VS-NESTED-CORPUS-2026-09-03.md; closed 4 Sep 2026 by
`Rar50VolumeWriter::stored_entries`, made in the fork at the upstream rars fork
and synced into vendor/rars, and checked against unrar 7.23 as well as
against our own reader.

Three files and not one on purpose, so the row reaches the plural
emitter rather than the single-member one. WHERE the volume cuts fall
was misdescribed here until 16 Sep 2026: this note claimed the members
do not align with the cut, that the middle file straddles a boundary
and that a set whose members filled a volume exactly would carry no
split flag. Read out of the emitted headers, `volume_bytes` is the
PAYLOAD budget per volume with headers counted on top, so 24000 bytes
of feature.bin fill volumes 1 to 3 to the byte:

  vol 1  feature.bin  8000 of 24000  SPLIT_AFTER
  vol 2  feature.bin  8000 of 24000  SPLIT_BEFORE, SPLIT_AFTER
  vol 3  feature.bin  8000 of 24000  SPLIT_BEFORE            <- the cut
  vol 4  sample.bin   3000 of  3000  whole
         notes.txt     300 of   300  whole

So the first member ends exactly on a cut, sample.bin is whole in
volume 4 and straddles nothing, and volume 3's last member carries no
continuation flag - which is the boundary-between-members shape this
note said the row avoids. Split flags are written regardless, on
feature.bin, so the row does exercise the split-store arm it was added
for; what it also exercises, and nobody knew, is a cut between whole
members. It passes over that cut because its volume names are
descriptive, so the obfuscated partition that groups on headers alone
never sees this set. The opaque-named variant of the same cut is
`c6-c2-opaque-volumes-over-three-members`, written the day this note
was corrected, and that is the row where the cut is load bearing.

The end state is the three payload files and the PAR2 index. The
volumes are spent by the unpack and a clean run never fetches the
parity.
"""

[source]
files = [
    { name = "feature.bin", bytes = 24000 },
    { name = "sample.bin", bytes = 3000 },
    { name = "notes.txt", bytes = 300 },
]

[container]
kind = "rar-stored"
volume_bytes = 8000

[recovery]
kind = "par2"
redundancy_pct = 10

[expect]
complete = true

[expect.ladder]
reaches = ""
