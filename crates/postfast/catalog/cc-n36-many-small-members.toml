# E6 / P3 at FILE-COUNT scale: 120 members, one set, nothing on the
# wire carrying a name.

[layout]
name = "cc-n36-many-small-members"
seed = 155
note = """
Expresses bench/capability-corpus leg n36-many-small.

Every other recovery row in this catalog is one to four members, so
each of them measures naming and verification at BYTE scale and none of
them measures it at file-count scale. This one is 120 members of 8 KiB:
under a megabyte of payload in total, and 120 FileDesc packets, 120
opaque wire names and 120 renames to get right.

WHAT ONLY SHOWS UP HERE. A per-file cost that is invisible over four
members is visible over 120, and so is any rule that is quadratic in
the member count rather than linear. So is a rename step that is
correct for each file on its own and collides across a set once there
are enough of them to collide. The corpus row calls it the per-file
overhead drill and asks for all 120 under their real names with nothing
left as a token, which is exactly what the oracle grades.

The members are the same length on purpose. A set of files that differ
in length lets a matcher separate them by length alone, and this row is
not about that: the descriptors distinguish them and nothing else has
to. Their bytes still differ, because [source] draws every file from
one stream in list order.

One article each, so the article count is the file count and no part
of the row is measuring multi-part reassembly.
"""

