[package]
name = "nzbkit"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Engine library for nzbfast: NZB parsing, yEnc codec, NNTP pool, scheduler"

[lints]
workspace = true

[dependencies]
# THE LAYER BELOW. Every module this crate does not declare itself comes
# from here and is re-exported at the root under its old name, so every
# `nzbkit::<module>::` path in the workspace - and in the DETACHED fuzz
# workspace, which names the same paths - resolves unchanged. See
# src/lib.rs and nzbkit-base/Cargo.toml for the cut.
#
# `default-features = false` is load-bearing: base's own default turns
# `indexer` on, and a slim build of this crate must not get it back
# through the dependency. The feature forwards explicitly below.
nzbkit-base = { path = "../nzbkit-base", default-features = false }
# Events only - nzbkit is a library and installs no subscriber. The
# binary does that (nzbfast::logging), so nzbkit's [pool] / [par2] lines
# reach the same log pane as everything else, stamped the same way. No
# default features: `attributes` (the #[instrument] proc macro) and
# `log` compatibility are both unused here.
tracing = { version = "0.1", default-features = false, features = ["std"] }
memchr = "2"
# Only `BufMut::limit`, so a body read can land in a `Vec`'s spare
# capacity through `read_buf` without a `set_len` of our own (already
# compiled: tokio's io-util pulls it).
bytes = "1"
quick-xml = "0.42"
thiserror = "2"
crc32fast = "1"
libc = "0.2"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# User-definable categories: the one rule-matching engine (regex, falling
# back to keyword substring) shared with the daemon's Smart Folders.
regex-lite = "0.1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1"
# Already in the tree as rustls' crypto provider; named directly so
# `bench-cpu` can measure the TLS AEAD with the SAME implementation the
# download path uses. Every downloaded byte is decrypted, so on a weak
# core that term belongs in the per-byte budget next to md5 and decode.
aws-lc-rs = "1.17"
# `hooks` moved here from [dev-dependencies] on 25 Aug 2026 (TODO 300):
# `progress_handler` stopped being a test-only affordance the day the
# pooled readers got a query budget, and `index/deadline.rs` is
# production code. The dep is optional, so this widens the feature set of
# `indexer` builds only - a slim build still has no rusqlite at all.
rusqlite = { version = "0.40.1", features = [
    "bundled",
    "functions",
    "hooks",
], optional = true }
rsa = "0.9"
sha1 = { version = "0.11", features = ["oid"] }
flate2 = "1"
# Already in the tree for 7z (sevenz-rust2's bzip2 feature); named
# directly so the zip reader can use the same decoder. Cargo dedupes,
# so this costs no binary size.
bzip2 = "0.6"
# Same story for zip method 14 (LZMA): sevenz-rust2 already pulls
# lzma-rust2 for 7z's LZMA/LZMA2 streams, so naming it costs no new
# dependency. `encoder` is for `zip::fixtures` (lib-visible for the
# fuzz corpus, like bzip2's and flate2's always-present encoder
# halves); nothing in the shipping call graph reaches it.
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "encoder"] }
# RAR5 encrypted store-mode sets: AES-256-CBC + PBKDF2-HMAC-SHA256
# (RustCrypto - pure Rust, no new C in the tree).
aes = "0.9"
cbc = "0.2"
hmac = "0.13"
sha2 = "0.11"
# yEnc body-layer encryption spike (Tensai75 draft, TODO: yencrypt.rs
# header): XChaCha20-Poly1305 per segment + Argon2id key derivation.
# Same RustCrypto stack/major line as the aes/hmac entries above.
argon2 = "0.6"
chacha20poly1305 = "0.11"
# FF1 (NIST SP 800-38G) needs arbitrary-precision Feistel halves: a
# radix-253 control line is a ~hundred-digit number.
#
# WAS an edge and not a crate while this said "0.4": der-parser pulls
# num-bigint 0.4 transitively and cargo unified the two. The 3 Sep 2026
# bump to 0.5 (dependabot #58) ended that - der-parser is still on 0.4,
# so the lockfile now carries BOTH and this dependency costs a real
# crate compile. Taken anyway: 0.5 is where the arithmetic fixes land,
# `ff1.rs` is the only caller, and the NIST FF1-AES256 vectors in its
# tests pass identically on either. `[bans] multiple-versions = "warn"`
# in deny.toml is what keeps that duplicate from being a gate failure.
num-bigint = "0.5"
# Nested one-pass phase 2: the chasing decompressor drives the vendored
# RAR engine's streaming reader over still-arriving inner volumes.
rars = { path = "../../vendor/rars" }
# Nested one-pass phase 3: inner 7z archives parse + decode in-stream
# through a blocking Read+Seek view of the arriving bytes.
# `deflate` is free: flate2 is already a direct dependency above, so the
# decoder is linked either way and a deflate-in-7z archive stops
# declining. zstd/brotli/lz4 are the remaining codecs 7z permits; each
# would add a real dependency, so they stay off until one is seen.
sevenz-rust2 = { version = "0.22", default-features = false, features = ["aes256", "bzip2", "deflate", "ppmd"] }

# PAR2 hashes every downloaded byte through MD5; the asm backend is
# ~25% faster than the portable soft path - a slow-x86 win (docker
# amd64, old desktops). md5-asm has a compile_error! on Windows (both
# MSVC and mingw) and md-5 falls back to soft off-x86, hence the gate.
#
# WINDOWS IS NO LONGER SOFT, so do not read the gate above as saying it
# is (3 Sep 2026). nzbkit-base's `md5fast` module carries a Rust
# inline-assembly MD5 block function - LLVM assembles it, so it builds
# under MSVC where this C crate cannot - and `md5fast::Md5` is the alias
# every payload-hashing site in the workspace uses: the assembly on
# Windows x86-64, `md5::Md5` verbatim everywhere else, which is what
# keeps this entry load-bearing. Measured +28.7% on an i5-10600KF.
# That module's header is the full story.
[target.'cfg(all(target_arch = "x86_64", not(target_os = "windows")))'.dependencies]
md-5 = { version = "0.10", features = ["asm"] }

# There is deliberately NO matching aarch64 `asm` entry for sha2 beside
# the md-5 one above, and re-adding one is not possible: sha2 0.11 has
# no `asm` feature. It was needed on sha2 0.10, which reached the
# aarch64 SHA-256 extensions ONLY under that feature - gated in its
# source as `all(feature = "asm", target_arch = "aarch64")` - so every
# SHA-256 here ran soft on Apple Silicon and on the arm64 image, and a
# target-gated entry (fe5c0a16b, 21 Aug 2026) bought 456 -> 2411 MiB/s.
# sha2 0.11 does the same detection in its DEFAULT path instead
# (`cpufeatures::new!(sha2_hwcap, "sha2")`, falling back to
# soft::compress), so the wave that landed the same day subsumed that
# entry and it was removed with it. The C sha2-asm crate, and the
# Windows `compile_error!` the gate existed to dodge, are out of the
# graph entirely now.
#
# Unchanged by any of it: this is not a throughput win. SHA-256 is not
# on the per-byte download path (that is yEnc + md5 for PAR2 + crc32) -
# it is tens of milliseconds off a KDF that runs once per encrypted
# archive and is memoised in KDF_CACHE after that. And ARM64 Windows
# still gets soft SHA-256, because cpufeatures answers a flat `false`
# there whichever sha2 major asks it.

# The kTLS optional dependency was here until the nzbkit-base cut and is
# nzbkit-base's now, with the `nntp` module that names it; the `ktls`
# feature below is a forward.

# FSCTL_SET_SPARSE for the Windows write path (disk.rs): out-of-order
# positioned writes into a set_len file make NTFS zero-fill everything
# between valid-data-length and the write offset - measured ~1.6x write
# amplification on the 6 Aug line-rate campaign. Marking the output
# sparse turns that zero-fill into a hole. Same crate and version
# nzbfast already links.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    # logtee's Windows size cap: GetFileType (is stdout really a file?)
    # and GetFinalPathNameByHandleW (an APPEND handle cannot truncate
    # itself, so the cap needs the path to open a second one).
    "Win32_Storage_FileSystem",
] }

[features]
default = ["indexer"]
# The indexer stack: newsgroup index, Spotnet source, availability
# oracle - sqlite's only consumers. Slim builds (phones, small boxes)
# disable it and the whole bundled-sqlite C build drops out of the
# binary. Queue/history are JSON and unaffected.
indexer = ["nzbkit-base/indexer", "dep:rusqlite"]
# Off by default: the receive path this replaces is the one every
# platform shares, and kTLS only exists on Linux.
# `nntp` is base, so the optional dependency is declared THERE and this is
# a pure forward. ci-private's `ktls-check` job still says
# `-p nzbkit --features ktls` and still reaches the code.
ktls = ["nzbkit-base/ktls"]
# Build-gate for the [[test]] targets at the bottom of this file
# (TODO 116b): the two elapsed-time suites and, since 1 Sep 2026, the
# three hand-run allocator rigs. EMPTY on purpose - it compiles no code
# in or out; its only effect is whether cargo builds the targets that
# name it in required-features. Per-push CI does not pass it, so those
# targets stop paying link time and disk there; nightly.yml passes
# `--features heavy-tests` where it runs the suites (the rigs are all
# `#[ignore]`d and run by hand only).
# Forwards to base as well: `par2gen_large_set` came down with `par2gen`,
# and CLAUDE.md's clippy gate passes `--features nzbkit/heavy-tests`.
heavy-tests = ["nzbkit-base/heavy-tests"]
# Forwards the layer below's test seam so a crate ABOVE this facade can
# reach it. `nzbkit-base/test-support` is what compiles
# `par2repair::adopt::disabled_for_screen`'s env read - the deterministic
# repeating-payload screen - into a build, and the `nzbfast` test binaries
# spawn the `nzbfast` BINARY, which resolves its nzbkit through the
# package's own dependency graph rather than through this crate's
# dev-dependencies. So `nzbfast` turns it on with a DEV dependency of its
# own and `cargo build -p nzbfast` still never sees it.
test-support = ["nzbkit-base/test-support"]

[dev-dependencies]
# The layer below with ITS test seam on: `journal`'s tests take
# `renameclaim::never_renames_over_a_neighbour`, and a `cfg(test)` item is
# invisible from another crate whatever its visibility. Through a DEV
# dependency, so `cargo build -p nzbkit` never sees it - the same
# arrangement nzbfast-core's and nzbfast-unpack's `test-support` use.
nzbkit-base = { path = "../nzbkit-base", default-features = false, features = ["test-support"] }
# `hooks` is what gives the compact-abort test `progress_handler`, the
# only way to fire an interrupt from inside the rewrite's own VM loop
# rather than betting on a timer. It is a code gate (`hooks = []`
# upstream, no extra C).
#
# It used to be HERE AND NOT on the dependency above, on the argument
# that resolver 2 keeps dev-dependency features out of non-test builds
# so the shipping binary's feature set does not widen for a test. That
# argument expired on 25 Aug 2026: `index/deadline.rs` gives every
# pooled reader a query budget through the same callback, so the
# shipping binary needs it now and the feature is declared above. This
# entry stays because nzbkit's TESTS use rusqlite directly and the
# `indexer` feature is not on in every one of them; it is no longer what
# decides whether a release build has hooks. Verify the split with
# `cargo tree --no-dev-dependencies`.
rusqlite = { version = "0.40.1", features = ["hooks"] }
# Examples only. nzbkit itself emits tracing events and installs no
# subscriber (the binary does that); without one here, the PAR2 bench
# drivers' NZBFAST_REPAIR_TIMING / NZBFAST_FOLD_TRACE output would go
# nowhere - which is what those drivers exist to print.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"] }
rcgen = { version = "0.14.9", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
# 7z test fixtures are written in-process (the writer needs the encoder
# half of the crate; release builds keep it off).
sevenz-rust2 = { version = "0.22", default-features = false, features = ["aes256", "bzip2", "deflate", "ppmd", "compress"] }
# test-util: paused-clock tests (the connect-timeout regression test
# auto-advances past CONNECT_TIMEOUT instead of sleeping 20 s for real).
tokio = { version = "1", features = ["test-util"] }

# Two examples reach `nzbkit::index`, which is `indexer`-gated in
# `src/lib.rs`, and an example is a TARGET: `--all-targets` builds it in
# every configuration, so without this gate the slim line
# (`cargo check -p nzbkit --no-default-features --all-targets`, the
# configuration every phone build starts from) was red from the day the
# examples landed until 3 Sep 2026. `required-features` is the one tool
# for a target; the five integration-test MODULES with the same need
# carry `#[cfg(feature = "indexer")]` on their `mod` lines instead
# (tests/integration/main.rs says why). Never widen the production cfg
# to satisfy either.
[[example]]
name = "indexscan_bench"
required-features = ["indexer"]

[[example]]
name = "sidecar_fold_walk"
required-features = ["indexer"]

# Landed 3 Sep 2026 (bf6d69922) WITHOUT this gate, which took slim-check
# leg 2 red on main until it was found by chip 13 running the acceptance
# suite. `index_open_bench` names `nzbkit::index`, which does not exist
# under `--no-default-features`, and the slim job builds `--all-targets`
# precisely so an example cannot hide a mistake behind a plain check.
[[example]]
name = "index_open_bench"
required-features = ["indexer"]

# conn_tuner races a throttled mock over a connection ladder - an
# elapsed-time suite whose home is nightly.yml, not the push path. The
# `required-features` gate (TODO 116b) is what keeps per-push CI from
# BUILDING it: nextest's `-E 'not binary(...)'` filters running only,
# so before this gate the target still paid full link time and disk on
# every push while never running there. A test target added tomorrow
# carries no required-features and so builds AND runs on push
# automatically - the auto-enrolment default ci-private.yml's long note
# insists on stays the default. Run locally with:
#   cargo test -p nzbkit --test conn_tuner --features heavy-tests
[[test]]
name = "conn_tuner"
required-features = ["heavy-tests"]

# `par2gen_large_set` was here until the nzbkit-base cut and is now
# `crates/nzbkit-base`'s: `par2`, `par2gen` and `par2repair` are all base,
# so the suite went down with the code it exercises. Same
# `required-features` gate there.

# The three hand-run allocator rigs. Every test in them is `#[ignore]`d
# and NO CI job runs `--run-ignored` against them, so before this gate
# each was pure link cost on every push - a full 12-16 MB nzbkit-graph
# link, twice (Linux + Windows legs), for zero tests run. Same
# `required-features` gate as above; the per-push clippy gate passes
# `--features nzbkit/heavy-tests --all-targets`, so they are still
# type-checked and linted on every push - clippy does not link. They
# cannot fold into `integration` instead: each installs a
# `#[global_allocator]` counting wrapper, which would sit under every
# integration test. Audit and measurements:
# research/TEST-BINARY-FOLD-AUDIT-2026-09-01.md. Each file's own header
# carries its run line (now with `--features heavy-tests`).
[[test]]
name = "delivery_cost"
required-features = ["heavy-tests"]

[[test]]
name = "lzma_dict_window_rss"
required-features = ["heavy-tests"]

[[test]]
name = "nested_container_buffer_rss"
required-features = ["heavy-tests"]
