[package]
name = "nzbkit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nzbkit = { path = ".." }
rars = { path = "../../../vendor/rars" }
crc32fast = "1"
# `par2_verify_diff`'s oracle: the FileDesc verdict is an MD5, and the
# target has to compute it here rather than ask the code under test.
md-5 = "0.10"
# url_authority_diff's oracle: the parser ureq dials with. Fuzz-harness
# only - the daemon itself deliberately links no URL crate.
url = "2"

# Detach from the parent workspace: cargo-fuzz builds this crate on its own
# (nightly + sanitizer), and it must not perturb the main workspace build.
#
# cfg-safety-gate: detaching is exactly why this package cannot write
# `[lints] workspace = true` - the line below makes it its own workspace
# root, and a root with no `[workspace.lints]` table has nothing to inherit
# (cargo refuses the key outright). So `undocumented_unsafe_blocks` is not
# on here, and holding these targets to it would be a rule that does not
# apply. If a fuzz target ever grows an `unsafe` block, give this package
# its own `[lints.clippy]` table with that lint denied and delete this
# waiver - do NOT leave the block unheld. Zero `unsafe` here on 26 Aug 2026.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "audio_tags"
path = "fuzz_targets/audio_tags.rs"
test = false
doc = false
bench = false

