[package]
name = "parfast"
version = "1.6.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PAR2 create, verify and repair with par2cmdline's command shape and exit codes, over nzbfast's engine"
# Whether this crate is published as its own package is an open project
# decision; this keeps it off crates.io until that is settled either way.
publish = false

[lints]
workspace = true

[[bin]]
name = "parfast"
path = "src/main.rs"

[dependencies]
# The facade, not nzbkit-base: `par2`, `par2gen` and `par2repair` are
# re-exported from it under their old names, and a later lane moving a
# module between base and the facade must not reach this crate.
#
# THIS DEPENDENCY IS THE WHOLE POINT OF THE CRATE. The engine is not
# copied here and must never be: chip 13's decision D1 is one engine in
# this workspace, so every PAR2 commit - the AVX-512 fold, the repair
# race, whatever lands next - reaches this binary on its next build with
# no sync step. The interim diff-synced copy at the parfast reference tree is
# superseded and its HANDOFF.md says so.
#
# `default-features = false` because base's default turns `indexer` on
# and a PAR2 command-line tool has no business linking sqlite.
# `digest-cache` is `--digest-cache`'s store (BLAKE3); the daemon's own
# graph leaves it off.
nzbkit = { path = "../nzbkit", default-features = false, features = ["digest-cache"] }

# ONLY to give `NZBFAST_REPAIR_TIMING` somewhere to land. The engine
# emits its phase lines as tracing EVENTS, so a binary with no subscriber
# drops them silently - which is what this CLI did until 9 Sep 2026,
# while the bench driver beside it installed one and printed the lot.
# Measuring the product then meant measuring the driver instead, and the
# 13-17% the two differ by went unattributed for exactly that reason.
#
# A real dependency and NOT an optional feature, deliberately: a sink
# behind a default-off feature means the binary anyone benchmarks is not
# the binary anyone ships, which is the same class of mistake this is
# here to fix. The lean feature set is nzbkit's own line - no env-filter,
# so no regex - and nothing is installed at runtime unless the variable
# is set (`lib.rs`).
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"] }
# The macro side of the same thing: the ONE phase line this crate emits
# itself (`join_backups`), because the wait for the damaged-original
# copies happens HERE and not in the engine, and until 16 Sep 2026 its
# seconds were charged to the engine's `patch` phase.
tracing = { version = "0.1", default-features = false, features = ["std"] }

# Ctrl-C. The engine's cancel is a gate its loops poll
# (`par2repair::control`, 12 Sep 2026); this crate's job is to flip it
# from a signal, which is a `signal()` on unix and a console handler on
# Windows, both from crates the tree already carries. `ctrlc` was tried
# first and pulls `dispatch2`, `block2` and `objc2` onto the macOS build
# for the same forty lines (`control.rs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
