[package]
name = "nzbfast-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI for embedding the nzbfast engine in a host app (iOS staticlib)"

[lints]
workspace = true

# staticlib is the product (linked into the iOS app); rlib keeps
# `cargo check`/tests working on the host.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Slim on purpose: the phones ship without the indexer stack OR the
# browser-facing pages (TODO 281 IO3b - `dashboard` is a default
# feature, and this is the store binary), and the ffi feature is what
# turns nzbfast's lib root from empty into the real module tree.
#
# `default-features = false` here is the WHOLE of what keeps the pages
# out, and cargo resolves features PER INVOCATION - so it holds only
# while this crate is built on its own. A `--workspace` build, or one
# naming `-p nzbfast` alongside it, unifies with the bin's `default`
# and hands the staticlib the dashboard back. packaging/ios/build-ffi.sh
# builds `-p nzbfast-ffi` alone for that reason and says so.
nzbfast = { path = "../nzbfast", default-features = false, features = ["ffi"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
