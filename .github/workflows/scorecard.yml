# OpenSSF Scorecard, on the PUBLIC repo only. TODO 106 phase 1.3.
#
# Scorecard only evaluates public repos, and it is a public SIGNAL as
# much as a check: publish_results feeds the OpenSSF API, which gives
# the README a live badge and downstream packagers (winget, Scoop,
# Homebrew reviewers have all looked at this repo's provenance story)
# something to cite. weaver runs it; nobody else in the field does.
# Ships with the .github sync and activates on the mirror's next
# publish - the `if:` keeps it inert on the private side.
name: scorecard
on:
  schedule:
    - cron: "30 6 * * 3"
  push:
    branches: [main]
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    if: github.repository == 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Both required by the action: SARIF upload to code scanning, and
      # the OIDC token that authenticates publish_results.
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      # Into code scanning, same pane as the CodeQL findings.
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
