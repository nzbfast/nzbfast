# The Compose Android app's gate: `:app:testDebugUnitTest` and
# `:app:lintDebug`, neither of which ran on any runner anywhere until this
# workflow existed (lint on 25 Aug 2026, the tests on 27 Aug).
#
# WHY THIS EXISTS. Android lint is NOT part of `assembleDebug`, and no
# workflow asked for it by name, so `grep -rn lintDebug .github/workflows/`
# returned nothing at all. It went red on 6 Aug 2026 in `0324c3c3` -
# a `MissingSuperCall` in `MainActivity.onUserLeaveHint` that entered PiP
# without chaining, plus five `UnsafeOptInUsageError` in `PlayerScreen` -
# and stayed red for SEVENTEEN DAYS with nobody told. It was found by hand
# on 13 Aug and fixed on 23 Aug in `df83cd5a0`. Fixing the six errors did
# not fix the hole: the next media3 call or missed `super` reopens it in
# exactly the same silence. This is what closes it.
#
# THE STATED BLOCKER WAS WRONG, and that is worth writing down because it
# is why this waited two days after the errors were fixed.
# The lane that fixed the errors wrote down, in its own notes, the
# reason it did not also wire the job: no CI runner here has the Android
# SDK, so wiring it up is a job-shaped change - an SDK setup step plus a
# cache - rather than a line in an existing job. The first half is false. The GitHub-hosted ubuntu image ships
# the Android SDK at `/usr/local/lib/android/sdk` and exports ANDROID_HOME
# and ANDROID_SDK_ROOT pointing at it - nightly.yml has been DELETING that
# directory since long before this workflow existed, in its `sudo rm -rf
# /usr/share/dotnet /usr/local/lib/android ...` disk-reclaim step, which is
# direct evidence in this repo that it is there. Only `platforms;android-36`
# has to be added, because compileSdk is 36 and the image tracks a release
# or two behind; the step below does that and nothing else.
#
# IT NEEDS NO RUST AND NO NDK, which is the fact that makes it cheap.
# `fetch-engine.sh` stages `libnzbfast.so` into `app/engine/arm64-v8a/`
# and that directory is gitignored and absent from a fresh checkout, so
# the obvious fear is that lint cannot run without a cargo-ndk build of
# the engine first. Measured 25 Aug 2026 on the dev Mac against a tree
# with NO engine directory at all: `:app:lintDebug` is BUILD SUCCESSFUL in
# 38 seconds. `jniLibs.srcDir("engine")` naming a directory that does not
# exist is not an error to AGP, and lint analyses Kotlin and the manifest,
# neither of which the engine binary participates in. So this job is a
# JDK, a gradle distribution and the SDK, and never a cross-compiler.
#
# WHY THE JVM TESTS ARE HERE TOO, added 27 Aug 2026. `:app:testDebugUnitTest`
# is 32 JUnit tests under `app/src/test/`, and until that date
# `grep -c testDebugUnitTest .github/workflows/android-lint.yml` was 0, so
# they executed on no runner anywhere - the same silence the lint half of
# this file was written to end, one gradle task over. Lint does not reach
# them: it analyses Kotlin and the manifest and never loads a test class.
#   They are not ordinary unit tests. They are the ONLY thing holding the
# app to the frozen mobile API contract in
# `packaging/android/compose-app/CONTRACT.md` - each one parses a response
# SNAPSHOT recorded from a real daemon, so a daemon-side shape change the
# app's parsers cannot read becomes a red test here rather than a phone
# that quietly shows nothing.
#   The sharpest of them is `playbackWithoutQueueIdleIsNotIdle`. A daemon
# predating the 26 Aug `queue_idle` contract addition answers WITHOUT that
# key, and `EngineService` STOPS THE ENGINE when it reads true - so absent
# has to read false, and the four pre-addition `playback_*.json` fixtures
# are the only honest negative case that will ever exist. CONTRACT.md says
# in as many words not to re-record them. Nothing ran the test that rests
# on that.
#   Like lint, this needs no engine binary and no NDK: they are plain JVM
# JUnit 4 against the standalone `org.json` artifact (the
# `testImplementation` block in app/build.gradle.kts), with no Robolectric
# and no device.
#
# WHY A SECOND STEP, AND NOT A SECOND TASK OR A SECOND JOB. Three shapes
# were available and the two rejected ones each lose something concrete.
#   A SECOND TASK on the existing step - `./gradlew :app:testDebugUnitTest
# :app:lintDebug` - is the cheapest of the three (one JVM start, one
# configuration phase) and is wrong twice over. The run's step list would
# name the failure "lint" whatever actually broke; and gradle stops at the
# first failing task, so ONE red test hides every lint error behind it.
# You would fix the test, push, and only then learn lint was red too -
# the seventeen-day silence at the top of this file, in miniature, once
# per round trip.
#   A SECOND JOB is distinguishable at the top of the run and pays for it
# three times: a second checkout, a second sdkmanager, and a second
# restore of the ~130 MB gradle cache, plus compiling the debug variant
# twice. It also puts two jobs on ONE cache key - on a cold key both miss,
# both build, and both reach the save step, where the loser logs `Unable
# to reserve cache with key ...`. Noise rather than breakage, but noise
# bought with runner minutes.
#   A SECOND STEP keeps one setup, one cache pair and one compilation of
# the debug variant (`testDebugUnitTest` runs `compileDebugKotlin`, which
# `lintDebug` then finds up to date), while the run's own step list names
# which half went red. Measured on the dev Mac 27 Aug 2026 with warm
# gradle caches and `app/build` deleted first: 26 s for the tests then
# 19 s for lint, against 29 s for both tasks in one invocation. So this
# shape costs about 16 s a run against a 20-minute budget, and buys a red
# that says what it is.
#   The masking problem is then closed explicitly rather than by ordering.
# The lint step carries `if: ${{ !cancelled() && steps.tests.conclusion !=
# 'skipped' }}`, so a failing test cannot suppress a lint error - while a
# failure in SETUP, which leaves the test step skipped, correctly skips
# lint too instead of running it into the same missing SDK. Tests go first
# because they are the sharper signal and because their compilation is the
# one lint then reuses.
#
# THE NAME STAYS `android-lint`, which is now narrower than what the job
# does, and that is a decision rather than an oversight. `android-lint.yml`
# is cited by path from the backlog, from three development handoff
# documents and from the live work-claims ledger, nothing mechanical reads
# either the workflow name or the job name, and renaming the file to match
# would strand every one of those citations to buy a label. The STEP names
# are what a person reading a red run actually sees, and those are exact.
#
# WHY ITS OWN WORKFLOW RATHER THAN A JOB IN size-gate.yml. That file's
# every-branch placement is earned by being BUILD-FREE - checkout plus a
# python script, seconds of runner time - and its `paths:` union already
# fires on nearly every push (`**/*.sh`, `**/*.py`, `*.md`). A gradle
# build hung off that union would spin a compile on pushes that touch no
# Android source at all. macapp.yml settled this exact question the same
# way on 24 Aug 2026 and for the same two reasons; this is that
# precedent applied one platform over.
#
# WHY NOT pr-check.yml, which is where the other packaging gates live.
# That workflow is `on: pull_request` AND gated to the public repo, so on
# this repo's push-to-main flow it does not run at all - putting a gate
# there is putting it where development is not. See the note at the head
# of the `packaging-gates` job in size-gate.yml.
#
# WARNINGS ARE TOLERATED, ERRORS ARE NOT. `abortOnError` is AGP's default
# and lint's error tier is what this gate is for. No `-Werror` flag, on
# the judgement macapp.yml made about its two tolerated Swift warnings:
# a gate that is red the day it lands is a gate somebody switches off.
#   The census below is read off the RUNNER's own
# `lint-results-debug.xml` (run 33065896167, 27 Aug 2026), not off a
# local run, and it is 0 errors and 17 warnings - `8x UseKtx`,
# `4x GradleDependency`, `2x NewerVersionAvailable`,
# `1x AndroidGradlePluginVersion`, `1x OldTargetApi`,
# `1x MissingApplicationIcon`. This paragraph said 14 until 27 Aug and
# named `PictureInPictureIssue` as one to look at; that one was FIXED on
# 25 Aug in `9bf49d8b6` and the count had drifted since, which is what a
# hand-maintained number in a comment does. If you move it, re-read it
# from the uploaded artifact rather than from your own box.
#   Two are decisions rather than backlog. `OldTargetApi`
# (`targetSdk = 34` against `compileSdk = 36`) is a HOLD with a measured
# reason, not an oversight: `9bf49d8b6` investigated it and left it,
# because targeting 35 caps dataSync foreground services at ~6h/24h and
# `EngineService` - a long-running exec'd native engine on exactly that
# service type - would hit the cap with nobody on this fleet able to soak
# it. It is still a Play Store shipping deadline, so it is a decision with
# an expiry. And `MissingApplicationIcon` is real and product-facing
# rather than a style note: the manifest sets no `android:icon` and the
# app has no `res/` directory at all, so the launcher draws Android's
# generic default. That belongs with the APK release train (TODO 281 AN5)
# and its icon masters already exist under `packaging/icon/`.
name: android-lint

on:
  push:
    branches: ['**']
    paths:
      - 'packaging/android/compose-app/**'
      - '.github/workflows/android-lint.yml'
  pull_request:
    paths:
      - 'packaging/android/compose-app/**'
      - '.github/workflows/android-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    # No `github.repository` guard, on macapp.yml's reasoning: this needs
    # no private tooling, `packaging/android/` ships in PUBLIC_MANIFEST,
    # and a lint error is exactly as real on the public repo - where
    # standard runners are free - as it is here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: android-lint-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    defaults:
      run:
        working-directory: packaging/android/compose-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No setup-java action. The image exports JAVA_HOME_17_X64 for the
      # JDK it already ships, so taking it costs nothing and adds no
      # third-party action to pin and audit. 17 is not a free choice:
      # gradle 8.13 cannot run on the JDK 26 that is first on PATH on the
      # dev Mac either, which is the same trap the compose-app README
      # documents for local runs.
      - name: java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      # compileSdk is 36 (app/build.gradle.kts). The runner image ships a
      # platform or two behind, so this adds the one package that may be
      # missing and is a no-op when it is not. `yes |` answers the licence
      # prompt, which sdkmanager asks even for an already-accepted SDK.
      - name: android platform 36
        run: |
          set -eu
          echo "ANDROID_HOME=$ANDROID_HOME"
          # sdkmanager is NOT on PATH on this image even though the SDK
          # itself is - measured 25 Aug 2026, the first run of this
          # workflow died `sdkmanager: command not found` with
          # ANDROID_HOME correctly set to /usr/local/lib/android/sdk. It
          # ships under cmdline-tools; resolve it rather than assuming
          # either the PATH or one fixed version directory.
          SDKM=""
          for c in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
                   "$ANDROID_HOME"/tools/bin/sdkmanager; do
            [ -x "$c" ] && SDKM="$c" && break
          done
          [ -n "$SDKM" ] || { echo "no sdkmanager under $ANDROID_HOME"; exit 1; }
          echo "sdkmanager: $SDKM"
          "$SDKM" --list_installed || true
          yes | "$SDKM" "platforms;android-36" "build-tools;35.0.0" >/dev/null
      # The gradle distribution (~130 MB) plus the AGP, Kotlin and Compose
      # artifact graph. Keyed on the files that decide what is downloaded,
      # so a dependency bump moves the key and everything else hits.
      # restore + save as SEPARATE steps for the reason pr-check.yml gives
      # at its own cache: the combined actions/cache does NOT save when the
      # job failed, so one red run leaves the next run cold too, which is
      # worst exactly while somebody iterates on a lint fix.
      - name: cache gradle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-v1-${{ runner.os }}-${{ hashFiles('packaging/android/compose-app/gradle/wrapper/gradle-wrapper.properties', 'packaging/android/compose-app/**/*.gradle.kts') }}
      # `--no-daemon`: a gradle daemon outlives the step and buys nothing
      # on a runner that is destroyed after one build. `--console=plain`
      # because the run log is not a terminal - the rich console rewrites
      # lines in place and the log then reads as one smeared paragraph.
      #
      # Tests before lint: they are the sharper signal (a snapshot that no
      # longer parses is a contract drift, not a style note), and their
      # `compileDebugKotlin` is the one lint immediately reuses. See the
      # step-not-task-not-job argument in the header.
      - name: unit tests
        id: tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --stacktrace
      # `!cancelled()` so a red test cannot hide a red lint; the `skipped`
      # clause so a failure in SETUP (which leaves the test step skipped)
      # does not run lint into the same broken toolchain. Both halves are
      # argued in the header.
      - name: lint
        if: ${{ !cancelled() && steps.tests.conclusion != 'skipped' }}
        run: ./gradlew :app:lintDebug --no-daemon --console=plain --stacktrace
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-v1-${{ runner.os }}-${{ hashFiles('packaging/android/compose-app/gradle/wrapper/gradle-wrapper.properties', 'packaging/android/compose-app/**/*.gradle.kts') }}
      # The HTML report plus the JUnit XML, so a red run is readable - and
      # machine-readable - without reproducing the whole toolchain
      # locally. `always()` because the interesting case is the failing
      # one, and `if-no-files-found: ignore` because a job that died in
      # setup has no report to offer and should not fail twice for it.
      - name: test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-report
          path: |
            packaging/android/compose-app/app/build/reports/tests/testDebugUnitTest
            packaging/android/compose-app/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      # The HTML/XML report, so a red run is readable without reproducing
      # the whole toolchain locally. `always()` because the interesting
      # case is the failing one.
      - name: lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-report
          path: packaging/android/compose-app/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
