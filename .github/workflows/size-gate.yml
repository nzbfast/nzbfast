# a convention that lives only in a comment decays. What it costs is
# sharper here than on the website half, because there are TWO failure
# modes and only one of them is visible. A stale derivative is the picture
# a new user sees at the moment they decide whether this is an app; and if
# a file's dimensions stop matching its `sizes` string, Chromium ignores
