# is printed on every run. A second arm refuses an asset nothing points
# at, and its corpus deliberately excludes research/, .claude/ and the
# gate's own source: all three name every asset there has ever been, and
# counting them makes the arm inert rather than strict. That is not
# hypothetical - the first cut counted its own docstring and reported the
# one dead asset alive. `--selftest` first and it is the gate: every arm
# is pinned by a case verified to bite, the run prints how many assets it
# REACHED and how many corpus files it read, and both zeros are
# refusals. One pin is there because the bug happened: the skip list is
# applied to the path RELATIVE to the tree, since this repo's work
