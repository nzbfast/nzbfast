# The build-free gates (size, lock, waiver, doc, ref, overflow, bench2j,
# leg-warn, par2, provenance, iface, windows-portability, flatpak pin,
# harness, index lock, rate format, payload id, bg token, test global,
# manual parity, site parity, cross-link staleness, nav staleness, icon
# derivation), on
# EVERY branch instead of only on main.
#
# They all already run in ci-private's `check` job, and that is where
# they will stay - this workflow does not replace it. What it fixes is
# WHEN you hear about a breach.
#
# Measured 13 Aug 2026: main sat red on the `size gate` step from 12 Aug
# to 13 Aug, and in the afternoon of the 13th five more targets crossed
# the ceilings inside a few hours (zip.rs, rar.rs, repair.rs,
# get_with_progress, then queue_json, boot and tasks/indexer.rs). Not one
# of them was reported by CI. Every single one was found by whoever
# merged next, running the gate by hand.
#
# The cause is structural, not bad luck. `pr-check.yml` is gated to the
# PUBLIC repo, and ci-private's `check` job triggers on push to main
# alone, so on this repo no branch and no pull request has ever run these
# gates. A lane can breach a ceiling, pass every check it is shown, merge,
# and the breach then surfaces on somebody else's push - which is also
# why the fix is not "run the gate before pushing" advice: the lane that
# broke it is not the lane that finds out.
#
# Two properties make it cheap enough to run on everything:
#
#   - No build. Every gate here is pure python over the source text - no
#     toolchain, no cargo cache, no target dir. Checkout plus the script
#     is the whole job, seconds of runner time (measured 22 Aug 2026 on a
#     laptop: bench2j 0.03 s, provenance 0.05 s, iface 0.06 s, leg-warn
#     0.07 s, doc 0.2 s, lock 0.6 s, ref 0.8 s, size 3.4 s, flatpak pin
#     3.6 s, overflow 6.6 s with its selftest - and of the flatpak pin's
#     3.6 s, 3.5 s is its selftest waiting on the six localhost fixture
#     servers that stand in for GitHub, with the tree check itself at
#     0.08 s), which is what makes running it on every branch push
#     defensible against the cost rationale in pr-check.yml.
#   - Their own concurrency groups. In `check` the verdict is behind ~18
#     minutes of toolchain, fmt, clippy and the unit suites, and on a
#     main taking a push every ~90 seconds that job is usually queued or
#     superseded (see ci-private.yml's long note - read verdicts per job,
#     never per run). Here nothing queues behind a build, so a breach is
#     reported while the lane that caused it is still at the keyboard.
#
# Until 22 Aug 2026 this file ran the size gate alone and said the lock
# and overflow gates "belong here too" but were left out on purpose, as
# one change for one measured problem. That reasoning is retired. The
# 13 Aug failure mode is a property of ci-private's `push: branches:
# [main]` trigger, not of the size gate, so every build-free gate that
# lives only in `check` has exactly the same blind spot - and the family
# grew to four (doc-gate and ref-gate both landed on 22 Aug) while the
# follow-up waited, then to five when the bench2j gate landed later the
# same day, to six when the leg-warn gate landed after it, then to seven
# with the par2 guard, eight when the provenance gate landed the same
# evening, and nine when the iface threshold gate landed on 23 Aug 2026 -
# itself a rule that had been left in the on-box selftest, which is this
# same blind spot one deploy further out. Ten and eleven followed within
# the half hour, the lint waiver gate and the windows-portability gate,
# both wired here at landing rather than backfilled. Twelve is the
# flatpak pin gate, and it is the clearest case yet for running on every
# branch: what it refuses is three packaging files disagreeing about one
# version, a state nothing in the build can see and nobody looks at
# between releases. The pin sat on v1.1.2 through four releases before a
# human noticed - eight days in which every branch push was green and the
# Flatpak bundle would have shipped from the one release its own README
# calls unusable. A gate against slow rot is worth least on main alone,
# because on main it tells the lane after the one that stopped looking.
# Thirteen is the harness gate, landed the same day and the family's
# first subject under `crates/nzbfast/tests/`: a `pub` item in the shared
# daemon launcher that nothing calls, which the file-wide
# `#![allow(dead_code)]` that file has to carry guarantees clippy will
# never report.
# Fourteen is `web/i18n/manual-check.py`, and it is the only one here
# that was not written for CI at all - it is the sibling of
# `web/i18n/check.py`, which IS a job (ci-private's `i18n-gate`), added
# by TODO 201 with the reasoning that a hand-run script is one nobody
# runs. That reasoning was never carried across to the manual half, so
# for months the structural parity of the 15 translated manuals against
# docs/MANUAL.html was checked only when somebody thought to check it.
# On 23 Aug 2026 it was red on ALL 15 locales with one identical drift -
# the lifecycle-events sentence in docs/MANUAL.html had gained four
# `<code>` refs (job.retried, job.delete_kept, watch.picked,
# watchlist.upgraded) and no translation followed - and nothing had
# turned red when that landed. It was found by a hand run and fixed in
# cf138f226. Same failure shape as the pin gate above: slow rot in files
# no build reads, which is worth least on main alone.
# Fifteen is `web/i18n/site-check.py`, the last script in that directory
# with nothing turning it red, and the one with the most to lose by it.
# Half of what it checks is ordinary parity against the English page - id
# sets, a tag census, byte-identical `<code>` - and that half fails
# loudly. The other half is an ANONYMITY grep over the pages that cite a
# measurement, and `website/` is what gets published to gh-pages, so what
# that arm refuses is not a typo but a disclosure, and a disclosure a
# revert does not take back. It fires on nothing today, which is exactly
# what a BROKEN one looks like: a mistyped alternation or a lost
# case-insensitivity reads as a clean tree forever. That is the argument
# for running it on every branch rather than on main alone - a leak is
# worth catching on the push that wrote it, not on somebody else's - and
# it is also why this one had a `--selftest` written for it before it was
# wired at all, driving every ban entry at a sample of its own.
# Sixteen is `web/i18n/site-crosslink.py --selftest && --check`, and it
# is the first one here whose subject is GENERATED output rather than
# hand-written source. That script rewrites the cross-page links on the
# 150 localized pages so a visitor stays in-language, its output is
# committed, and until now nothing verified that what is committed is
# still what it would produce. That is the bench2j gate's story exactly,
# and that gate exists because its subject rotted twice - once two whole
# guards behind its parent, once the other way, when a hand-added hook
# made the documented remedy DESTRUCTIVE. A hand patch to one href is the
# same trap in miniature: the next regeneration undoes it and says
# nothing. `--check` writes nothing and exits 1 on the first page that
# differs. The `--selftest` joined it on 23 Aug 2026, after this entry
# had argued for a day that a fixed point test needs none: one regex
# drives both the rewrite and that script's leak scan, and breaking its
# `href="` literal left both arms dead with the job still green - the
# healthy state being zero matches, a converged tree cannot tell the
# difference, so the proof has to come from synthetic pages.
# Seventeen is `web/i18n/nav-regen.py --check`, the sibling generator,
# which grew its `--check` arm on the same day as the cross-link one and
# was deliberately left unwired for a day - because measuring it turned
# up the rot it was meant to catch. One of its three arms was DEAD: it
# placed a `<span class="langsw">` of locale codes and the regex that
# placed it looked for one, while every page has carried a `<select
# class="langsw">` of native language names with a `selected` option for
# some time. It had matched nothing on all 64 pages of the four core
# bases, for however long the markup has been a select, and gating on it
# then would have reported every picker current while checking no picker
# at all - the rubber stamp this whole family keeps growing to refuse. It
# is wired now because that arm is live: `web_picker` emits the select,
# `selected` and all, and a census of all 160 pickers on the site found
# no page had drifted while the arm was inert. Nothing had CHECKED, which
# is the argument, and the same one the pin gate and the manual gate
# above are made of.
# Eighteen, added 23 Aug 2026, is the first pair here whose subject is not
# the tree at all - it is the harness. `.claude/tools/memory-gate.py` and
# `.claude/tools/hooks-gate.py` run as SessionStart hooks on every
# session, wired in `.claude/settings.json` as `[ -x "$f" ] && python3
# "$f" --hook 2>/dev/null; true` - silent when clean, by design, so a
# session is never blocked by its own tooling. The same shape hides a
# script that has stopped working at all: `2>/dev/null` swallows any
# traceback and the trailing `; true` forces the line to exit 0 no matter
# what python3 actually returned, so a syntax error, an import error, or
# a crash reads exactly like a clean pass. Demonstrated, not assumed: a
# one-token syntax error dropped into a COPY of hooks-gate.py made the
# raw invocation exit 1 with a traceback, and the real settings.json line
# - reproduced verbatim against that same broken copy - still exited 0.
# Both scripts already carried a `--selftest` (memory-gate: 102 checks;
# hooks-gate: 11 cases) that nothing had ever run in CI - the same
# hand-run shape the FIFTH, EIGHTEENTH and NINETEENTH gates in CLAUDE.md
# all warn decays within days of landing, and two of those three did
# decay, on shipped releases. Each job below runs the selftest first,
# same as every gate above, and then a second arm the selftest cannot
# stand in for: it asserts the script is executable and that a DIRECT
# `--hook` call - no `2>/dev/null`, no trailing `; true` - exits 0. The
# selftest drives `audit()`/`report()` in-process and never touches the
# module's own top-level parse or the settings.json line, so it is blind
# to exactly the failure demonstrated above; the direct call is not. Both
# scripts deliberately swallow anything `audit()` itself raises so a
# session is never blocked - that guarantee stands and this gate does not
# fight it - but the `hook_report()` call that follows it is NOT wrapped
# in either script, so a bug there still surfaces here. See the note
# further down, where the PRIVATE gates are named, for why a `.claude/`
# path is safe to write into a file that ships.
# Nineteen is `tools/index-lock-gate.py`, wired here at landing on 23 Aug
# 2026 and left unnumbered in this list until now.
# Twenty is `tools/rate-format-gate.py`, and it is this family's first
# subject that spans THREE LANGUAGES. One rule turns a rate into a
# displayed string - MB/s whole below 1000, GB/s at two decimals at or
# above it, times eight to Mb/s and Gb/s when `unit_bits` says bits - and
# it is written three times, because neither native wrapper can call into
# the page: `rateParts` in web/dashboard.html (canonical), `fmt_rate` in
# crates/nzbtray/src/main.rs, `rateText` in
# macapp/Sources/NzbFast/StatusItem.swift. The second landed on 24 Aug
# 2026 at 17:13:14Z with a doc comment saying "this is the one place the
# rule is written twice - keep them in step"; the THIRD landed at
# 17:20:30Z, seven minutes later, saying the same thing, from a lane that
# could not see it. 9e2433cd5 corrected both comments to name all three.
# That fixed the map, not the mechanism, and the mechanism was "remember"
# - with a silent failure: a menu bar reading GB/s beside a dashboard
# reading MB/s is the bits/bytes mess the unit convention exists to stop,
# and it would ship looking like a rounding difference. Here rather than
# on main alone for the same reason as the pin gate and the manual gate:
# the lane that moves ONE of the three should see the red, not the lane
# after it. macapp.yml started compiling the mac wrapper on 24 Aug 2026,
# hours after this landed, and it does not overlap: a compiler cannot see
# this defect, because `"%.2f Gb/s"` builds exactly as well as
# `"%.2f GB/s"`. This is still the whole of what stands between a
# Swift-side unit mistake and a shipped menu bar.
# Twenty-one is `tools/bg-token-gate.py`, added 24 Aug 2026, and the
# numbering runs one behind the job count from here on: the payload-id
# gate landed the same day and was wired without a number, so there are
# thirty-two steps below and twenty-nine numbers above. Its subject is
# `--bg`, the page ground, DEFINED once in web/ui-tokens.html and
# hand-copied into five sites that cannot read a custom property - the
# dashboard's and the wall's media-scoped <meta name="theme-color">
# PAIRS, `THEME_BG` in the pre-paint script, the manifest's
# background_color and theme_color, and `pageBackground` on the mac
# window. Every one carries a comment asking the next person to keep them
# in step and nothing checked that anybody did, which is the lint-waiver
# gate's argument exactly: a convention that lives only in a comment
# decays. What makes it worth a job rather than a habit is WHERE it shows
# - those values paint the browser's own chrome, an installed window's
# title bar, the strip a window-controls-overlay install leaves beside
# the buttons, Android's address bar, iOS's status bar - so the failure
# is a bar in one colour welded to the top of a page in another, silent,
# on the most visible surface the product has. Here rather than on main
# alone because the lane that moves the palette is the one that should
# see the red. The fifth site is the argument for its roster arm: the
# survey that commissioned this gate named four, and the mac window's
# ground - a real copy, in float channels - was not among them.
# Twenty-two is `tools/claude-clippy-gate.py`, added 24 Aug 2026, and it
# is the first gate in this family whose subject is the INSTRUCTIONS
# rather than the code. CLAUDE.md tells a session "this exact line is
# what gates a push" over and over - a host clippy line in its numbered
# gate list, a Windows one quoted inside the entry about unix-only
# symbols, a slim-build line written into a prose paragraph, a formatting
# line - and ci-private.yml runs its own copy of each, in `check`,
# `windows-clippy`, `slim-check` and `fmt`. Nothing held any of the
# copies in step. Both clippy steps gained `-p nzbfast-ffi` on 23 Aug
# 2026 and neither documented copy did, and on 24 Aug a size-gate lift
# (9abdb5817) re-exported a `&Daemon` signature out of `serve`, which
# raises `Daemon`'s effective visibility to public and put its `pub`
# fields in scope for `private_interfaces`. The lib stopped compiling.
# That commit's message records re-running clippy on the host AND
# against x86_64-pc-windows-gnu, both green, because without nzbfast-ffi
# - the only crate that turns nzbfast's `ffi` feature on - the lib
# target is never compiled and the lint has no public surface to judge.
# main was red for hours with every documented gate green, and THREE
# lanes converged on the fix independently. This is the failure mode
# this file exists for, one level up: not a lane that skipped a gate, a
# lane that ran the documented gate and was told the wrong thing. It
# compares a TOKEN SET and not a string, because the spellings are
# legitimately formatted differently and a gate that is red on a rewrap
# gets loosened until it means nothing; and a block, job or step it
# cannot LOCATE is a refusal naming the anchor, because "it found
# nothing, so the tree is clean" is the rubber stamp the two generator
# gates above already demonstrated. Measured against 82cb74636^ - the
# tree as it stood while main was red - it reports four differences,
# including a `--locked` gap on both documented copies that no incident
# report ever named. The slim and fmt pairs were added the same day, and
# the slim one carried the identical defect found by widening rather than
# by an incident: `slim-check` has passed `--locked` since the hour it
# was written and the documented line never did, so the widening commit
# had to fix the line as well as add the pair. Here rather than in
# ci-private for the same reason as everything above it, and with more
# force: the lane that edits one of those steps is the lane that should
# be told the documented line no longer matches it.
# Twenty-three is `tools/ci-verdict.py --selftest`, added 24 Aug 2026, and
# it is the only step in this file that runs a script's SELFTEST and not
# the script. That is deliberate and load-bearing. `ci-verdict.py` with no
# argument is a statement about MAIN'S state - it walks the Actions API
# for the newest real conclusion per job, because a red on main is buried
# under about ten cancelled runs inside fifteen minutes - so running it
# here would red whichever lane pushed next for something they did not
# cause, which is how a gate gets muted. Its own placement is argued at
# the `ci-verdict` job in ci-private.yml and has not changed. The SELFTEST
# is a different subject: pure frozen JSON plus one file read, no network,
# no `gh` auth, about 0.2 s, and case 16 of it holds that script's ROSTER
# against ci-private.yml's job list in both directions - a job the tool
# neither judges nor excuses is a refusal naming it, and so is a rostered
# job that has vanished from the file. That refusal belongs on the
# author's push for the reason every entry above gives: whoever ADDS a job
# to ci-private.yml is the one person who knows whether its red belongs on
# main's tip, and on main alone they would learn it from the next lane's
# run. The roster was Windows-only until 24 Aug 2026, which is exactly the
# defect it now refuses: the Linux `check` job was red on the same two
# `private_interfaces` errors as windows-clippy, minutes earlier, and
# nothing reported it, so a target-independent lint was written up as a
# Windows problem. Nothing had CHECKED that the roster covered the
# workflow. It needs no new `paths:` entry - `**/*.py` and
# `.github/workflows/ci-private.yml` are both already triggers below, and
# they are exactly the pair of files that can break it.
# Twenty-four is `tools/wco-drag-gate.py`, added 24 Aug 2026, and its
# subject is the one bug on this fleet that NOBODY CAN SEE. Two pages
# declare their top bar to be the installed window's title bar - the
# dashboard's `header` (72031b498) and the wall's `.bar` (a3bb81ae8) -
# because a Chromium PWA in window-controls-overlay mode has no other
# drag handle: a WCO window that marks nothing draggable can be moved
# only by its frame edges. A drag region SWALLOWS THE PRESS, so every
# control inside one has to opt back out with `app-region:no-drag`, and
# both pages carry a hand-maintained opt-out list plus a comment asking
# the next person to extend it. Nothing checked that anybody did. The day
# somebody adds a control and does not extend the list, that control
# silently stops responding to clicks in an installed app window - and
# there is no signal anywhere: invisible in a browser tab (the media
# query never matches), invisible in the mac wrapper (WebKit has neither
# the display mode nor the env() variables), invisible to every Rust
# test, and invisible to every other job in this file. Nobody here runs a
# WCO window except when deliberately building the rig for it, which
# takes about an hour. It is not a file list: it finds every
# `app-region:drag` declaration, takes the SELECTOR each applies to,
# resolves it against that file's markup and walks the subtree - because
# a gate that hardcoded the two pages could not see the third, and a
# third page is what commissioned this one (the wall was left out of
# 72031b498 for a day precisely because the change was thought of as
# belonging to one file). Here rather than on main alone for the reason
# every entry above gives: the lane that adds a button to a bar is the
# one lane that can be told what it just broke. `--selftest` first and it
# is the gate: what this protects against is a scanner that has quietly
# stopped matching, which reads as a clean tree forever, so it pins how
# many interactive elements each fixture REACHED and floors the real
# tree. Nine of ten mutations driven against the real pages redden it;
# the tenth is a pinned blind case, a container that is empty in the
# markup and filled by script.
# Twenty-five is `tools/test-global-gate.py`, added 24 Aug 2026, and its
# subject is the one defect class no test job in this repo can see. A
# `static` counter or flag is one value for the whole process, so two
# tests that write it and then assert on what it says are reading each
# other's writes the moment they land on different threads of ONE
# process - and every test job here and in ci-private runs nextest, which
# gives each test its own process. It surfaces only under `cargo test
# --bin`/`--lib` and the `unit-one-process` job. a676367fb measured it at
# 73 failures in 200 runs on three mem-sampler tests that had been latent
# since the day they were written, and a29a8e4cc had main red for a day
# on the same shape across two modules. That commit also shipped the
# better remedy where it could - a chokepoint assertion that fires in
# every run - but the three other families on this tree (memgauge's
# gauges, smart.rs's trash flags, par2repair's NTT breaker) have no door
# to put one in and serialize by convention alone, and a raw
# `X.store(v)` from a test has no function to assert inside at all. Here
# rather than on main alone for the reason every entry above gives, and
# more sharply: these modules' tests are copies of the one above them in
# the file, so the lane that copies without the guard is the one lane
# that can be told. It scores CROSS-UNIT contention too, since 24 Aug
# 2026: a29a8e4cc's two contenders were tests of two OTHER modules,
# joined to the static only by a `pub` door, so a per-unit scan could not
# have seen the very incident that motivated the gate. All 43 doors on
# this tree were read; the one live family is `serve/tests_jobs.rs`
# reaching smart.rs's trash flags, correct today and never checked
# before. Contention is scored per CRATE, because `cargo test -p X` is
# one process per crate and pooling them manufactures a population that
# cannot exist. `--selftest` first and it is the gate - an arm that
# has quietly stopped matching reads as a clean tree forever, which this
# script's own first draft demonstrated by blanking every `#[path]`
# along with the string literals and losing the mem sampler unit.
# Twenty-six is `tools/shot-version-gate.py`, added 24 Aug 2026, and it
# is this family's first subject that is an IMAGE. Every dashboard
# capture in `website/assets/` renders the running version in its header
# pill, and nothing held those images to the crate version: all four
# versioned shots went two releases stale AT ONCE, reading `v1.1.4 beta
# 4` while crates/nzbfast/Cargo.toml was at 1.2.2, and it was caught only
# because a person looked at an image and read the number. They were
# re-shot in three separate passes on the same day (349e339e1, 1096d1adf
# and 63c54b775). tools/check-site-version.sh is the precedent and the
# reason the gap was glaring - it already holds the version STRINGS on
# the sixteen download pages to Cargo.toml, and this is the same defect
# one medium over, worse in one way: a stale download button 404s
# loudly, while a stale capture quietly shows an old product to every
# visitor and to everyone installing the PWA, since two of these images
# are downscaled by packaging/icon/make-screenshots.sh into web/screens/
# and declared in web/site.webmanifest. NO EXISTING GATE COULD EVER HAVE
# CAUGHT IT, which is the argument: `website/` is not in PUBLIC_MANIFEST,
# so `packaging/leak-check.sh --all` prints `0 public file(s) clean`
# without having scanned it - a phrase that reads exactly like a pass -
# and nothing in this repo can read a PNG. It cannot read one either, and
