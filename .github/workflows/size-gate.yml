      # are written by tools/gen-zip-fixtures.py and two are hand-made, and
      # until 31 Aug 2026 NOTHING verified any of them: no digest manifest,
      # no `--check`, no CI job, and `grep -rln gen-zip-fixtures .github/
      # tools/` returned the generator itself.
      # THE INCIDENT: a blanket `for g in tools/*.py; do python3 $g; done`
      # sweep ran the GENERATOR, which is not a gate, and rewrote six of
      # them. `git status` said `Bin 595 -> 595 bytes` six times, because
      # every file comes back the SAME SIZE, so nothing looked regenerated
      # and the sweep was two commands from staging another lane's
      # rewritten fixtures into an unrelated push.
      # A REGENERATE-AND-COMPARE `--check` CANNOT BE THE ANSWER, and that
      # was measured rather than assumed: on 7-Zip 26.02 with every
      # timestamp option off over a fixed-mtime input, the AES output still
      # differs in 419 bytes and the ZipCrypto output in 405, and in both
      # the first differing byte is the first byte of the encrypted entry
      # DATA - the salt and the encryption header, random BY SPECIFICATION.
      # Both external writers are also SKIPPED WITH A WARNING when off
      # PATH, so a regenerate-and-compare here would be a green line about
      # files it never produced.
      # SO THE MANIFEST CARRIES TWO KINDS OF CLAIM and keeping them apart
      # is the design. The sha256 is written by `--record` for the files a
      # run actually wrote, so the ordinary path keeps it true for free,
      # and it is what names the incident. Everything after it is a FROZEN
      # JUDGEMENT about what the fixture MEANS - entry names, methods,
      # encryption scheme, CRC and size, directory entries, the comment,
      # the zip64 record's shape, any prepended stub - hand-written by
      # somebody who read the tests, and `--record` never touches it.
      # Without that half the digest is trivially satisfied by
      # re-recording, which is the one edit every gate in this family
      # states as its own limit; here it can be CLOSED, because unlike a
      # PNG's pixels the meaning of a zip container is recoverable from
      # its bytes. An Info-ZIP that started emitting a SATURATED end
      # record would otherwise leave `zip64_unsaturated.zip` silently no
      # longer the thing its name, its generator's own assertion and its
      # test all say it is.
      # The compressed size is deliberately NOT recorded - it pins the
      # compressor's version rather than what the fixture is for - and the
      # payload is pinned by crc= and usize= instead.
      # Writing the manifest found one thing on its first run: `zip64.zip`
      # carries no zip64 structures at all (`allowZip64=True` permits them,
      # it does not request them), so it is recorded `zip64=none` and the
      # generator now says so. That is left for the zip suite's owner
      # rather than changed in passing.
      # Measured: 9 fixtures, 9 records, 12 entry lines, 7 generated, 9
      # reached by a test, ZERO hits and ZERO waivers. Verified against the
      # REAL files nine ways - the incident replayed (all six named), a
      # hand-patched byte, a deleted record, an unrecorded new fixture, a
      # frozen field and a frozen entry line edited by hand, a GENERATES
      # row dropped - against two controls that correctly stay green, plus
      # 40 mutations of the arms each verified to redden `--selftest`.
      # HITS LEAD AND THE FLOORS ONLY SPEAK WHEN THERE ARE NONE, because
      # every floor sits AT today's population, so an ordinary deletion
      # breaches one as well as tripping the arm that names it and
      # reporting the floor first hands the reader "this scanner has
      # stopped matching" about a scanner that is working perfectly.
      # FIX A HIT by rerunning the generator and `--record`ing what it
      # wrote, or - if the change was accidental - by restoring the named
      # files from HEAD BY NAME, never the whole directory (safe-git rule
      # 12: that command discards every uncommitted change in the path it
      # is given, and this checkout is shared). NEVER by editing a digest on its
      # own, which is the one edit the digest arm cannot see, never by
      # rewriting a frozen field so the survivors agree, and never by
      # loosening an arm so a shape it cannot read counts as absent.
      # Build-free, about a second and a half, and no new `paths:` entry -
      # `crates/**` and `**/*.py` above already reach every file it reads.
      - name: zip fixture gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/zip-fixture-gate.py --selftest && tools/zip-fixture-gate.py
      # ---- sab-parser-gate -----------------------------------------
      # parfast is a par2cmdline drop-in and SABnzbd runs it as its
      # repair binary, parsing its stdout line by line and never looking
      # at the exit code. Nothing in this repo compared parfast to SAB's
      # predicates until this gate landed: tools/conformance/run.py
      # compares it to par2cmdline, a different and only partly
      # overlapping set of lines, and its `normalise` keeps only the text
      # after the last carriage return of each physical line, so no
      # progress fragment either tool draws has ever reached a
      # conformance table in either direction. Measured 17 Sep 2026
      # against a real SAB 5.1.2, three gaps had been there since the CLI
      # shipped, two of them functional: SAB never learns which
      # obfuscated files parfast matched or consumed, and four of its
      # error branches are unreachable
      # (research/SAB-PARFAST-METER-DROPIN-2026-09-17.md, addendum A
      # and B). The contract with user-visible consequences was the one
      # with no check over it.
      # A RATCHET, NOT A BASELINE: a branch reachable today that stops
      # being reachable is a RED; a branch that has never been reachable
      # is REPORTED and does not red, which is what let this land BEFORE
      # the emit-side fix (claim sab-parfast-rename-announce) rather than
      # reddening main for everyone on the day it arrived. First run: 24
      # branches, 16 reached, 8 not, and the 8 reproduce that addendum
      # exactly from the other side.
      # WHAT RUNS HERE IS THE SOURCE ARM, and that is a stated limit
      # rather than an oversight. The gate has a FIXTURE arm that builds
      # seven damaged par2 sets and runs a real parfast over them with
      # SAB's own argv shape; this job is build-free by the whole
      # rationale at the head of this file, so no binary resolves and the
      # run says so in as many words instead of going quiet. Lanes get
      # the fixture arm for free through tools/preflight.py whenever
      # their worktree has a target/ binary, and the SOURCE arm is the
      # authoritative red-maker for a deleted emit either way - it reads
      # the Rust with comments blanked and `#[cfg(test)]` bodies
      # excluded, so a test asserting the string cannot keep a deleted
      # production emit looking alive.
      # The `--selftest` is not decoration: five of its cases spawn this
      # script as a real process and assert the exit code the shell would
      # see (0, 1 and 2). That is deliberate and it is not the usual
      # shape: a 17 Sep 2026 census of this suite found 53 gates whose
      # selftests exercise every arm in-process and therefore cannot see
      # main()'s exit code at all, which is the one thing a CI step
      # actually reads. Four more cases drive the whole FIXTURE arm
      # through a canned-output shim, so that half has coverage on a
      # runner with no parfast on it. The gate's own header carries the
      # pointer to the census.
      # FIX A HIT at the emit site, never in the roster: a branch that was
      # reachable and is not is a regression in what SABnzbd is told about
      # a repair. Advancing the ratchet - flipping a `reached` from False
      # to True - is the one roster edit that is expected and welcome, and
      # it is what the emit lane does the day it lands.
      # Build-free, about 1.5 s here, and no new `paths:` entry -
      # `crates/**` and `**/*.py` above already reach every file it reads.
      - name: SABnzbd parser contract gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/sab-parser-gate.py --selftest && tools/sab-parser-gate.py
  bench-gates:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: bench-gates-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ---- bench2j-gate --------------------------------------------
      - name: bench driver generator gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/bench2j-gate.py
      # ---- leg-warn-gate -------------------------------------------
      - name: LEG-line WARN gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/leg-warn-gate.py --selftest && tools/leg-warn-gate.py
      # ---- harness-rig-gate ----------------------------------------
      # A round driver that banks a log without a HARNESS-RIG line leaves
      # evidence nobody can attribute: jcross-position-audit's driver_label()
      # answers `(unstamped)` and refuses to guess. bc8be513d wired 24 such
      # drivers and added no ratchet, which is what this is. `--selftest`
      # first, and here it is the whole gate - the note the 24 patched
      # drivers carry names `pdrv.harness_facts` verbatim above the call, so
      # a stamp test that read comments would pass a file that copied the
      # note and not the call, and still print a green line.
      # WIDENED 21 Sep 2026, once the second census had wired its 34: the
      # scope is now the research tree less three named directories rather
      # than one directory, so a round directory added tomorrow is covered
      # with no edit. Shell joined it in the same commit - twelve of those
      # 34 are `.sh`, a language with no stamp mechanism at all until then,
      # and a gate blind to the extension reads them as a clean tree rather
      # than as hits. The script header's SCOPE section carries the reasons.
      - name: harness rig stamp gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/harness-rig-gate.py --selftest && tools/harness-rig-gate.py
      # ---- provenance-gate -----------------------------------------
      - name: driver provenance gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/provenance-gate.py --selftest && tools/provenance-gate.py
      # ---- iface-gate ----------------------------------------------
      - name: iface threshold gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/iface-excess-gate.py --selftest && tools/iface-excess-gate.py
      # ---- stall-mark-gate -----------------------------------------
      # The rig library's per-leg scans scope themselves on a byte offset
      # recorded before the leg. That is right for a client log that
      # APPENDS and wrong for one the driver TRUNCATES, which is what
      # every nzbfast arm does - so from the day the mark was written
      # until 25 Aug 2026 every leg after the first in a round could
      # silently lose conns_held=, sharded= and WARN=conn_capped, the
      # field that exists to stop a contaminated leg being published. A
      # leg that lost them reads exactly like a clean one. The one check
      # that reads this library, rig-lib-selftest.zsh, was run by no
      # workflow here for as long as it existed, and by MACHINES.md on the
      # bench box after a deploy - long after the push, the position
      # bench2j's check sat in while its subject rotted twice. It runs in
      # CI since 26 Aug 2026, in rig-selftest.yml on a macOS runner,
      # because it is macOS-only by construction; the two are complements
      # and the division is measured rather than asserted. A signature
      # function rewritten to return a constant passes THIS gate at exit 0
      # and reddens that job - verified both ways on 26 Aug 2026. Wrapper
      # under tools/ and
      # private repo only, same reason as the iface gate: that path is
      # private vocabulary and this file ships to the public repo.
      - name: stall mark identity gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/stall-mark-gate.py --selftest && tools/stall-mark-gate.py
      # ---- pool-select-gate ----------------------------------------
      # A leg log is not guaranteed to hold exactly one `[pool] run` line
      # - the download pool emits one and so does every auxiliary pool the
      # job starts (par2 side-fetch, repair, sidecar), so a leg that ran
      # the repair path emits several. Measured 27 Aug 2026: 205 of 325
      # leg logs on one bench box, correlating with the damaged fixtures.
      # Two committed readers each collapsed that set to one line and did
      # it DIFFERENTLY - `c208parse.py` took the FIRST, `ll208report.py`
      # the LAST - and on the ceiling ladder's fleet-77 leg both land on a
      # 1.5 MB/s auxiliary pool instead of the 96.0 MB/s download pool,
      # because that leg's download pool is in the MIDDLE of three. `line
      # peak`, `saturated %`, `dup spend`, `art`, `run` and `line cap N (K
      # sheds)` all come out of the selected line and all get printed into
      # tables read as round results. Same family and same argument as the
      # leg-warn gate one construct over: standalone copy-paste
      # descendants with no shared module, so the next one is a copy of
      # one of these. It is NOT a rule that largest-run always wins - a
      # multi-JOB daemon leg log wants the LAST job and a max-run selector
      # there would publish a warm-up, which is why the one waiver on the
      # tree is `linecap208d.sh` saying so in words. Build-free, well
      # under a second, and no new `paths:` entry: `**/*.py`, `**/*.sh`
      # and `**/*.zsh` are already triggers above and are exactly the
      # files it reads.
      - name: pool line selection gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/pool-select-gate.py --selftest && tools/pool-select-gate.py
      # ---- fleet-census-gate ---------------------------------------
      # A bench driver that pins a fleet and stamps per-leg records must
      # also record the fleet the WIRE held. Measured 28 Aug 2026: a
      # stored conntune knee of 32 sat under fleet rungs of 50/77/100,
      # all three rungs ran 32 sockets and landed within 0.4 MB/s, and
      # the dial line reported the rung ASKED for - three ladder rungs,
      # one fleet, three labels. The exposed population was the nine CLI
      # fault drivers that never source rig-lib at all, each carrying a
      # "guard 9 cannot see this file" comment - a declaration, not a
      # measurement - and they are hand-copied siblings, so the tenth
      # will be a copy of one of them. The population is computed (five
      # pin spellings x an own-record fingerprint), evidence must be the
      # file's own scan or scoped census, a comment mention is not an
      # invocation, loopback rigs are exempt mechanically, and the
      # waivers (provenance copies, api self-report, deliberately
      # unpinned) each carry their reason at the site. Build-free, well
      # under a second, and no new `paths:` entry: `**/*.py`, `**/*.sh`
      # and `**/*.zsh` are already triggers above and are exactly the
      # files it reads.
      - name: fleet census gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/fleet-census-gate.py --selftest && tools/fleet-census-gate.py
      # ---- rig-selftest-paths --------------------------------------
      # The PORTABLE half of the rig selftest's wiring. That selftest runs
      # on a macOS runner in rig-selftest.yml, behind a NARROW native path
      # filter - it cannot ride this workflow's filter, which is a union
      # covering `**/*.rs`, `**/*.py`, `**/*.sh` and `*.md`, because that
      # would spin a macOS runner on very nearly every push. A narrow
      # filter is a LIST, and a list is a gate that cannot see the
      # fifteenth file. This arm derives the file set from the selftest
      # ITSELF and refuses a name no pattern there matches, so a driver
      # the selftest starts replaying reddens on the AUTHOR's push instead
      # of leaving that job quietly un-triggered by the file it now reads.
      # Build-free, and `--selftest` first for the reason every gate here
      # runs its own: a matcher that has stopped matching reads as a clean
      # tree forever.
      - name: rig selftest trigger roster
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/rig-selftest-gate.py --selftest && tools/rig-selftest-gate.py --paths
      # ---- ps1-parse-gate ------------------------------------------
      # Every Windows measurement round on this fleet is a PowerShell
      # script and until 16 Sep 2026 nothing in this repository parsed
      # one, so a driver could be syntactically broken on main
      # indefinitely. One did: the window-combine driver, produced by a
      # MERGE RESOLUTION that joined a status line to the statement after
      # it - content no side of the merge had and no reviewer reads - and
      # a parse error is fatal to the WHOLE file, so every phase of every
      # round on that script died at launch for 42 minutes. The gate's
      # own header carries the provenance and the dialect limit.
      #
      # UBUNTU, NOT A WINDOWS RUNNER, and that was checked rather than
      # assumed: GitHub's ubuntu images ship PowerShell Core as `pwsh` on
      # PATH, so the parse costs this job a couple of seconds instead of a
      # Windows runner's 10x billed minutes. It is a parse and nothing
      # more - no dot-source, no execution, no profile. Measured over the
      # whole roster on an aarch64 Mac: 281 files, 1.92 MB, 2.3 s.
      #
      # The gate REFUSES rather than skipping when pwsh is absent here,
      # because GITHUB_ACTIONS is set: a runner image that dropped
      # PowerShell must red instead of going quiet. On a developer box it
      # says it could not answer and exits 0, which is why this step is
      # the one that matters.
      - name: PowerShell parse gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/ps1-parse-gate.py --selftest && tools/ps1-parse-gate.py
      # ---- coord-matcher-gate --------------------------------------
      # "Reading a box's coordination file, who is holding it RIGHT NOW?"
      # is ONE predicate, and by 18 Sep 2026 six lanes had each written
      # their own copy of it into their own driver. Every copy got
      # something different wrong, and the dangerous polarity is the OPEN
      # side: a missed close keyword costs a wait, a missed open keyword
      # reads a HELD box as FREE. `zrider-round.ps1`'s first cut had
      # TAKEOVER - a fleet OPEN word - classified as a CLOSE, and was
      # caught by that lane reading the roster rather than by any gate.
      # `research/harness/plib.ps1` carries the canonical fold now, so a
      # seventh copy is a choice rather than a gap, and this is what
      # makes it a refused one.
      #
      # BANKED ROUND SCRIPTS ARE HISTORY and this gate never asks for one
      # to be edited: all 25 pre-existing copies are frozen in its
      # BASELINE, as a ratchet - a new file reds, an edited banked
      # matcher reds, and a baseline entry that stops matching reds as
      # stale. Scope is the whole tree rather than research/harness/ on
      # purpose: the sixth copy landed in a brand-new research/rounds/
      # directory, which a harness-only scope would have missed.
      #
      # Measured over 258 committed .ps1 at origin/main: 27 hits, all 27
      # hand-confirmed genuine, 0 false positives, and 6 of the 6 known
      # copies named. The wider one-keyword predicate was built, measured
      # (50 hits, 4 plain false positives on shapes every future round
      # driver has) and REFUSED; the script's header carries that funnel.
      #
      # A THIRD ARM SINCE 20 Sep 2026 covers the UNIX side, which until
      # then nothing refused this copy on at all: both arms above are
      # PowerShell-shaped. ARM 3 wants two or more roster words tested as
      # TOKEN 0 of a line in a committed .py/.sh/.zsh, accumulated across
      # the file. Measured over 1,904 of them: 5 hits, all 5 hand-read and
      # confirmed, 0 false positives over the other 1,899.
      #
      # The split is by LANGUAGE and it is total - 0 hand-rolled matchers
      # in Python, where the roster plus 3 readers all IMPORT the
      # vocabulary, against 3 hand-rolled in shell, which has no
      # in-language import. That is the same structural gap that produced
      # the six PowerShell copies, not lanes being more careful. All three
      # shell copies are wrong in a different way and one of them DIALS
      # INTO A HELD BOX: launch250.zsh knows three words of twenty-five,
      # so a box taken with TAKEOVER or LATE-CLAIM matches nothing and the
      # last line it can see is the previous round's DONE.
      #
      # WHAT SHELL ACTUALLY DOES, over all 52 shell files that name a
      # coordination file: ~44 post a marker and decide nothing, 4 post
      # and DELEGATE the decision to python, 4 hand-roll the fold, and
      # ZERO call bench-box-gate.py's CLI. Posting is not matching and
      # this arm does not touch a poster. The zero is the weak point: the
      # CLI is documented in that file's header and has no precedent in
      # the tree, so the gate's message also names the shape 4 drivers
      # already use - post from shell, delegate the free/held decision to
      # riglock_state.py or mqueue.py. A fix rule with no precedent is the
      # kind lanes waive around.
      #
      # Build-free and about a second for both populations. It needs no
      # new `paths:` entry - `**/*.ps1`, `**/*.py`, `**/*.sh` and
      # `**/*.zsh` above already reach everything all three arms read.
      - name: coordination matcher gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/coord-matcher-gate.py --selftest && tools/coord-matcher-gate.py
      # ---- coord-writer-gate ---------------------------------------
      # The OTHER HALF of the gate above, and until 21 Sep 2026 nothing
      # gated it. That one refuses a second hand-rolled READER of a box's
      # coordination file; this one refuses a WRITER that posts a shape
      # the readers cannot see. The polarity is the unrecoverable one: a
      # driver posting `<ts> CLAIM <id>` (S2) or `CLAIM <tag> claim=<id>`
      # (S3) instead of the documented `CLAIM <ts> <id>` (S1) reads as a
      # FREE box while a lane is holding it. A read-only census of nine
      # boxes on 20 Sep found 2,656 S1 lines, 64 S2, 111 S3 and three open
      # holds - two of them LIVE - that every Python reader on the fleet
      # was blind to. The readers were widened that day; these files are
      # APPEND-ONLY, so every non-S1 line already posted stays wrong
      # forever and only the writer side can stop the next one.
      #
      # Three arms: the Unix append sites (`>>`, `tee -a`, `open(...,
      # "a")`, `append_coord`), the PowerShell ones (`Add-Content`,
      # `Out-File -Append`), and the roster's OWN S2/S3 grammar applied to
      # the marker literals inside any file those two prove is a writer -
      # which is what reaches the one-line posting helper, the dominant
      # PowerShell shape and 17 of its 189 sites. The classifier is
      # POSITIONAL, because a writer's field 1 is `$(date -u +%FT%TZ)` or
      # `{ts}` at rest, and the vocabulary, the stamp rule and the S2/S3
      # grammar are all IMPORTED through bench-box-gate.py's
      # _load_markers() rather than re-spelled - a private copy here would
      # be the exact defect the gate above exists to refuse.
      #
      # Measured over 1,926 committed .py/.sh/.zsh and 264 .ps1: 186
      # coordination writers, 307 append sites, and TWELVE non-S1 lines in
      # SIX files, 0 false positives over the other 180 writers. The Unix
      # side is clean, and its 52 S1 sites plus the 2 selftest fixtures a
      # grep counts and this gate excludes are the hand census's own 54,
      # reached by a different route. All twelve hits are BANKED round
      # drivers for a retired Windows measurement rig, frozen in the
      # script's BASELINE as a ratchet - a new file reds, an edited banked
      # driver reds, a stale entry reds as stale - because editing a banked
      # driver falsifies the record of what ran. The SIXTH file is why this gate exists rather than the
      # census being repeated by hand: the dated, careful, grep-reproducible
      # census named five, and a sixth driver two directories over posts a
      # textbook S2 open and close that the census did not reach.
      #
      # WHAT IT CANNOT SEE: the one LIVE non-S1 writer known to the census
      # lives in a DIFFERENT repository, so a clean report here says
      # nothing about it - that is a stated limit rather than coverage,
      # and the script's header carries it. The exact two lines that
      # writer emits are `--selftest` cases, so the day it is copied in,
      # this gate names it.
      #
      # Build-free, 0.9 CPU-s for the scan and 7.1 for the selftest. It
      # needs no new `paths:` entry - `**/*.ps1`, `**/*.py`, `**/*.sh` and
      # `**/*.zsh` above already reach everything all three arms read.
      - name: coordination writer gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/coord-writer-gate.py --selftest && tools/coord-writer-gate.py
      # ---- script-parse-gate ---------------------------------------
      # The same argument as the gate above, applied to the two languages
      # that carry far more of this repository: 1,259 tracked Python files
      # and 469 shell files, none of which anything here read a line of for
      # syntax until 17 Sep 2026. A grep for py_compile, compileall,
      # `bash -n`, `zsh -n` or shellcheck across the workflows, the gates
      # and the hooks returned ONE hit, and it was a shellcheck-disable
      # COMMENT. The gates under tools/ were implicitly compiled because
      # preflight runs them - about 4% of the population, and none of the
      # harness reducers or round drivers, which is the family the
      # PowerShell incident belonged to.
      #
      # THE INTERPRETER COMES FROM THE SHEBANG, NEVER THE EXTENSION, and
      # that is the whole design. Running `bash -n` over all 469 shell
      # files reports 119 failures and every one is a false positive: they
      # are zsh scripts, including the deployed bench shell library, and
      # bash has no grammar for them. The census is 239 zsh, 106 bash, 90
      # sh, 23 env-bash and 11 with no shebang at all. A gate that read the
      # extension would either red 119 clean files or invite somebody to
      # rewrite a working zsh library into bash - the `fix the SITE, never
      # the gate` rule inverted into real damage.
      #
      # No new `paths:` entry: `**/*.py`, `**/*.sh` and `**/*.zsh` above
      # are already triggers and are exactly the files this reads, and the
      # gate's own script is caught by `**/*.py`. That was CHECKED rather
      # than assumed - it is the one thing the PowerShell gate needed and
      # this one does not.
      #
      # Build-free. Measured over the committed tree on an aarch64 Mac:
      # 1,729 scripts, 14.93 MB, 2.5 s - the Python arm in-process at
      # 0.95 s, the shell arm on a thread pool at 1.49 s against 5.7 s
      # serial. It never skips and never fails open: python3 is already
      # running it and the shells are on every box and runner here.
      - name: Ensure zsh for the script parse gate
        # 239 of the shell files are zsh and the gate REFUSES rather than
        # skipping when an interpreter it needs is absent - which is the
        # right behaviour and would red this job on a runner image that
        # does not carry zsh. A no-op when it is already present, so this
        # costs nothing and removes the doubt.
        if: ${{ !cancelled() }}
        run: command -v zsh >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zsh)
      - name: Script parse gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/script-parse-gate.py --selftest && tools/script-parse-gate.py
  roster-gates:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: roster-gates-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ---- stale-heading-gate --------------------------------------
      # A backlog HEADING that still describes finished work as open is
      # what a work-selection pass reads, and it costs a whole duplicated
      # session rather than a typo: a lane reads it, takes the item, and
      # rebuilds something that landed weeks ago. The claims ledger cannot
      # stop that - it locks an item, it does not know the item is
      # finished. Six instances were found in ONE planning document on
      # 28 Aug 2026, including one whose own text said the work had
      # shipped 285 lines below the heading, and a second lane landed the
      # identical class of fix on two other items the same day.
      # THREE arms, each scoped to where it MEASURED precise: a
      # self-contradiction arm (heading unmarked, body opens with a
      # bolded whole-section closure), a cross-section arm restricted
      # to DISTINCTIVE milestone identifiers, and - added 20 Sep 2026 -
      # a DEEP-CLOSURE arm over a closure at COLUMN 0 anywhere in a body
      # of at most 250 lines. That third arm is the measured answer to a
      # class the first two leave on the table and which had by then cost
      # TWO more duplicated sessions: column 0 drops the indented
      # continuations inside checkbox items that inflate a loose
      # predicate to 42, and the length cutoff is what separates a
      # section's closure from a roadmap phase's - 10 hits / 8 true at
      # 250 lines, against 8 hits / 1 true above it. The cut is 250 and
      # not 200 because the very item that commissioned the arm has a
      # body of 201 lines, so the tighter cut would have missed the
      # defect it was built for. Both items are named in the gate's own
      # header, which is private; this job does not spell them, for the
      # reason given below. The
      # cross-section arm is
      # deliberately not run against bare section NUMBERS - measured, a
      # naive match reports 82 hits and the narrower house reference
      # forms still report 39, of which 7 of the first 9 read false,
      # because a sub-item finishing is not a section finishing.
      # Verified against the real pre-fix tree rather than fixtures: it
      # names every one of the seven, and is green after the fixes.
      # The gate names its own documents; they are private, so this job
      # does not spell them - the same reason the rig selftest rides a
      # wrapper. Build-free, well under a second, and no new `paths:`
      # entry: `*.md` and `**/*.py` above are already triggers and are
      # exactly the files it reads.
      - name: stale backlog heading gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/stale-heading-gate.py --selftest && tools/stale-heading-gate.py
      # ---- modgraph ------------------------------------------------
      # The nzbfast bin's top-level module graph, production files only:
      # no cycles, and no edge from a lower layer of the crate-split
      # plan to a higher one. Nothing else in the tree can see this -
      # cargo compiles a cyclic module graph forever, because modules
      # are not compilation units, so a back edge is invisible until
      # somebody tries to lift a crate out and finds two halves that
      # each need the other. Measured on the pre-split tree: 38 cycles
      # and 18 layer violations, every back edge one to five references
      # to a helper or a plain type.
      # The layer table in the script IS the partition a later step
      # cuts on, so a module added to main.rs with no entry there is a
      # REFUSAL rather than a quiet pass - the assignment is a decision
      # somebody makes, not a default. Build-free, about a second, and
      # no new `paths:` entry: `**/*.rs` and `**/*.py` above are
      # already triggers and are exactly the files it reads.
      - name: module graph gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/modgraph.py --selftest && tools/modgraph.py --check
      # ---- modgraph, the serve arm ---------------------------------
      # The same question one level down: serve's own 82 second-level
      # units, held to the daemon/api/tasks/wiring partition Option C
      # cuts on (research/PLAN-NZBFAST-CRATE-SPLIT-2026-09-01.md). It
      # was written with `--check` DELIBERATELY UNWIRED, because the
      # partition was a proposal the tree did not yet satisfy - twelve
      # cross-layer edges, and eight more the arm could not see. Serve
      # split lane 1b broke all twenty and wired it here in the commit
      # that broke the last one, which is what that note asked for.
      # A cross-layer edge is invisible to everything else in the tree
      # for the same reason the crate arm's cycles are: modules are not
      # compilation units, so `api` calling into `tasks` compiles
      # forever and is found only when somebody tries to cut the two
      # apart. Build-free, about a second, and it needs no new `paths:`
      # entry either.
      - name: module graph gate (serve)
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/modgraph.py --serve --check
      # ---- modgraph, the nzbkit arm --------------------------------
      # The same question in the crate BELOW the bin, and the one that
      # is the serial head of every build path in the workspace: after
      # the serve split finished, `cargo check -p nzbfast --all-targets
      # --features heavy-tests --timings` puts nzbkit's check unit at
      # 5.81 s starting at 0.16 s, so nothing else compiles for the
      # first six seconds of a 21.9 s line. This arm holds nzbkit's 61
      # top-level modules to the base/extract/pool/media/index partition
      # (research/PLAN-NZBFAST-CRATE-SPLIT-2026-09-01.md, the nzbkit
      # lane 1 note), and it went in HERE in the commit that broke the
      # last cross-crate edge - which is the rule the serve arm's own
      # entry above records, and which is why that one was written
      # unwired for a lane and a half.
      # A cross-crate edge is invisible to everything else in the tree
      # for the same reason the other two arms' are: modules are not
      # compilation units, so `config` reaching up into `pool` for a
      # constant compiles forever and is found only when somebody tries
      # to cut the two apart. Build-free, about fifteen seconds (it also
      # reads every other crate's `nzbkit::` references, which is the
      # surface a facade has to preserve), and no new `paths:` entry.
      - name: module graph gate (nzbkit)
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/modgraph.py --nzbkit --check
      # ---- flatpak-pin-gate ----------------------------------------
      # The offline half of the Flatpak release pin: the yaml's
      # `url`+`sha256`, the metainfo's newest <release> and the README
      # install example are one version, and it is not ahead of
      # Cargo.toml. A pin BEHIND Cargo.toml passes on purpose - that is
      # the normal state between the bump commit and publish-release step
      # 4d, whose `--live` mode is the other half and is not a CI job.
      # `python3` in front, unlike the twelve bare paths above, because
      # the line is byte-identical to ci-private's - the rule at the top
      # of this file is that the two can never disagree about what
      # passes, and an invocation this file spells its own way is the
      # first way they start to.
      - name: flatpak pin gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: python3 tools/flatpak-pin-gate.py --selftest && python3 tools/flatpak-pin-gate.py
      # ---- one-process-roster --------------------------------------
      # ci-private's `unit-one-process` carries no list - it reads the
      # nextest archive's inventory and runs EVERY first-party lib/bin unit
      # binary. nightly's `one-process-loaded`, the only job in the repo
      # that runs that shape under LOAD, named its binary by hand and ran
      # ONE of four. That is how
      # `pool::fault_rigs::the_line_peak_reads_the_line_with_the_fleet_dialled_together`
      # (nzbkit LIB) went red twice in 400 main runs on 23-24 Aug 2026 with
      # the loaded job running the nzbfast BIN root, and was found by a
      # human instead. This holds that matrix to the manifests: every
      # derived target is a leg or a `one-process-uncovered:` line with a
      # reason, and a renamed job, an empty matrix or a leg naming nothing
      # is a REFUSAL rather than a pass. Here rather than in ci-private
      # because the lane that adds the crate is the one lane that can be
      # told - a nightly-only signal lands on whoever pushes next. Build
      # free, about a tenth of a second.
      - name: one process roster
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: |
          tools/one-process-roster.py --selftest
          tools/one-process-roster.py
      # ---- test-target-gate ----------------------------------------
      # Every separate test target in a default-member crate links its
      # own executable on every push, and linking is the dominant cost
      # of CI's Windows leg (~10 min over what was 19 binaries, the lld
      # memo's measurement). Three rounds of folds and heavy-gating took
      # the per-push set 54 -> 14 (9ef264fc6, ff50596b3, 2988c6f44 +
      # 720cd9032), and TODO 235 proved the reduction rots by default:
      # five new top-level targets crept in within days of the first
      # fold, each paying a link it had just removed. This holds a NEW
      # target to being heavy-gated (`required-features`), the
      # `integration` fold destination, or excused at the site by a
      # `test-target-gate: <reason>` line naming the process-wide
      # property that needs its own binary - the five standing waivers
      # (rate_floor, the two cap_default pins, striped_repair_memory,
      # nzbfast_framing) are the worked examples, and
      # research/TEST-BINARY-FOLD-AUDIT-2026-09-01.md carries every
      # verdict. Build-free (tomllib over the manifests plus file
      # headers), about a tenth of a second. `Cargo.toml` was added to
      # `paths:` above for it - the root manifest's default-members list
      # is the one file it reads that nothing else triggered on.
      - name: test target gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/test-target-gate.py --selftest && tools/test-target-gate.py
      # ---- package-escape-gate -------------------------------------
      # `cargo package` includes only files BELOW the package root, so a
      # PUBLISHABLE crate reaching outside its own directory ships a
      # tarball that cannot build. TODO 84 blocker 2, 20 Sep 2026:
      # `crates/nzbkit-base/build.rs` compiled `../../vendor/rapidyenc`,
      # the packaged list was 265 files with NOT ONE of them from that
      # tree, and a `.crate` built that day would have died at
      # `cargo install` on every machine with `clang++: no such file or
      # directory`. It passed preflight, the fourteen-package clippy
      # gate, the whole nextest sweep, the Windows cross line and
      # `cargo deny` - no gate in this repository could see it, and
      # until this step the only thing standing between the next edit
      # and the same tarball was a prose comment on one constant.
      # TWO ARMS, because the blocker had two shapes and only one had
      # been found: a build script climbing out of the package root
      # (fatal - the crate does not compile for anyone who installs it),
      # and an `include_str!`/`include_bytes!`/`include!` doing the same
      # from the crate's own sources. A test-gated include is ONE TIER
      # DOWN and the gate says so rather than flattening the two:
      # measured, `cargo package`'s verify step does not compile
      # `#[cfg(test)]` code or `tests/` targets, so such a crate
      # packages, verifies, builds and installs and fails only when
      # somebody unpacks the `.crate` and runs `cargo test`. Both tiers
      # are red; the tier is in the message so a reader can price the
      # fix, not so they can skip it.
      # THE SUBJECT ROSTER IS DERIVED, never listed: a member is in when
      # it declares `documentation = "https://docs.rs/..."` plus
      # `keywords` plus `categories` and does not carry
      # `publish = false`. That selects `nzbkit-base` and `nzbkit` today,
      # which is exactly the pair TODO 84 names, and a crate that gains
      # publish metadata tomorrow is gated the day it lands. The bin and
      # daemon crates reach `../../packaging/` and `../../web/` on
      # purpose and are NOT published, so reporting them would be the
      # false-positive-prone gate that gets switched off in a week.
      # Build-free and cargo-free, which is what lets it live in this
      # checkout-only job: `cargo package --list` is the honest oracle
      # and does work (0.3 s, unaffected by blocker 1), but this job has
      # no toolchain and `tools/preflight.py` is build-free by design.
      # The ESCAPE PREDICATE is exact either way - it is the same path
      # arithmetic rustc does - and what the scan does not model is
      # cargo's file SELECTION, an error that points at refusing rather
      # than at waving through. `--cargo-crosscheck` is the opt-in arm a
      # lane with cargo can run; the gate's header has the reasoning.
      # Measured 0.26 s wall over 2 subjects and 430 files on a box at
      # load 58 with three other lanes' test runs on it - an upper bound.
      - name: package escape gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/package-escape-gate.py --selftest && tools/package-escape-gate.py
      # ---- detached-lock-gate --------------------------------------
      # A DETACHED cargo workspace commits its own Cargo.lock and reaches
      # first-party crates BY PATH, so an ordinary dependency change in
      # `crates/` refreshes the ROOT lock and silently leaves the other
      # one describing a package that no longer exists. Every cargo line
      # over `apps/parfast/` carries `--locked` on purpose, so the next
      # push dies at RESOLUTION - before a line is linted or built - with
      # `error: cannot update the lock file ... because --locked was
      # passed to prevent this`. That took `fuzz-gate` plus
      # `parfast-gui`'s `mac` and `windows` jobs red for about an hour on
      # 12 Sep 2026 (fixed in 00140c9e3a, claim `red-fuzz-gate-7763d58a`)
      # and no gate anywhere could see it: both one-process mechanisms
      # ask the ROOT manifest, which does not name that tree, and the
      # three tools that mention it read it for unrelated reasons. The
      # diagnosis is not obvious from the JOB name either - "clippy
      # (parfast GUI workspace)" was not a lint problem. The population
      # is DERIVED from the workflows (every `cargo --manifest-path` line
      # that can fire on this repository), never listed: 48 of the 50
      # tracked Cargo.lock files here are frozen `research/par-*`
      # prototypes no CI job builds, and gating those is exactly the
      # false-refusal-prone gate that gets switched off.
      # `crates/nzbkit/fuzz` is exempt on a FACT rather than by name - it
      # gitignores its lock, so there is nothing to drift, which is also
      # why its clippy line must never grow `--locked`. Build-free
      # (tomllib over the manifests, a text scan of the lock), measured
      # 0.07 s. Here rather than in ci-private alone for this family's
      # standing reason: the lane that moves the dependency is the one
      # lane that can be told.
      # SINCE 12 Sep 2026 it also carries a PATCH-PARITY arm, which is the
      # same blindness one table over: `[patch.crates-io]` applies from
      # the WORKSPACE ROOT, so a detached workspace inherits none of it
      # and `apps/parfast` was resolving `sevenz-rust2` and `lzma-rust2`
      # from crates.io while every other binary here linked the vendored
      # forks - the repo holding `lzma-rust2` 0.20.0 and 0.20.1 at once.
      # Nothing showed it: no manifest states it and no build fails on
      # it. The arm reads the LOCK and not the detached manifest's own
      # `[patch]` table, because copying that table was NOT sufficient -
      # cargo left the older-versioned patch UNUSED and exited 0 with a
      # warning. One-directional like the arms beside it: a patched name
      # the detached lock does not hold is silent, so the green state
      # needs no waiver anywhere. The root `Cargo.toml` and `vendor/**/
      # Cargo.toml` lines in the trigger list above are what fires this
      # arm on a fork bump; `apps/**` fires it on the other side.
      - name: detached workspace lock gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/detached-lock-gate.py --selftest && tools/detached-lock-gate.py
      # ---- shot-version-gate ---------------------------------------
      # Every dashboard capture in website/assets/ rendered the running
      # version in its header pill, and nothing held those images to the
      # crate version - all four went two releases stale at once, and a
      # person reading a number off an image is what caught it. No other
      # gate could see it - website/ is outside PUBLIC_MANIFEST, so
      # leak-check reports `0 public file(s) clean` without scanning it,
      # and nothing here can read a PNG.
      #   Since 1 Sep 2026 the captures carry NO version (the shoot rig
      # hides `#ver`) and this holds them to a `ui-revision` a human bumps
      # on a material UI change, plus a 90-day staleness warning that
      # never fails. The name is historical; it reads no crate version.
      # That removed a ~30-minute re-shoot from every release, including
      # releases that moved no pixel. It still cannot read a PNG: it holds
      # a human's assertion in website/SCREENSHOTS.manifest, which its
      # header states plainly rather than overclaiming.
      # `--selftest` first, and it is the gate: the run prints how many
      # assets it REACHED and how many corpus files the reference arm
      # read, and both zeros are refusals.
      - name: screenshot version gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/shot-version-gate.py --selftest && tools/shot-version-gate.py
      # ---- screens-derived-gate ------------------------------------
      # The install dialog's two screenshots are GENERATED from the same
      # captures the job above holds to the crate version, and nothing
      # verified the committed copies were still what the generator would
      # produce. `sips` is macOS-only, so this arm holds the source sha256
      # the generator recorded, plus every dimension and ratio arm - which
      # need no image tooling and catch the failure no digest can see: a
      # file whose dimensions stop matching its `sizes` string is dropped
      # from the dialog by Chromium SILENTLY. The regenerate-and-compare
      # half is `make-screenshots.sh --check`, on a mac, before a release.
      - name: install screenshot derivation gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/screens-derived-gate.py --selftest && tools/screens-derived-gate.py
      # ---- icons-derived-gate --------------------------------------
      # Every raster mark the product shows is GENERATED off the three SVG
      # masters in packaging/icon/, and nothing verified the committed
      # copies were still what the generators produce - web/icons/** was
      # not even a trigger for this workflow. qlmanage and sips are
      # macOS-only, so this arm holds the master sha256 the generators
      # recorded, plus every dimension, declaration and roster arm - which
      # need no image tooling and catch what no digest can: a `sizes` that
      # stops matching its file is ignored by Chromium SILENTLY, and it is
      # declared in THREE places per file here (the manifest and a
      # `sizes=` on both pages), while a `purpose` swap renders correctly
      # everywhere except the Android launcher it puts an inset tile on.
      # The regenerate-and-compare half is `--check` on each of the three
      # generators, on a mac, before a release.
      - name: icon derivation gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/icons-derived-gate.py --selftest && tools/icons-derived-gate.py
      # ---- icon-downstream-gate ------------------------------------
      # packaging/icon/icon-1024.png is a SOURCE as well as an output: four
      # committed rasters are downscaled from it, the Flathub icon and the
      # three QTS App Center icons, and nothing checked they were still what
      # their generators produce. The gate above covers the FIRST generation
      # and names these as out of scope because an edited master cannot go
      # unreported there - which leaves the forgotten DOWNSCALE, where that
      # gate is green and correct and these four carry the previous mark.
      # sips is macOS-only, so this arm holds the recorded master digest
      # plus the arms no digest reaches: the hicolor install size, the
      # qbuild copy list, and the grey icon's PIXELS, whose documented
      # failure is a file of the right size and the wrong colour.
      - name: downstream icon gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/icon-downstream-gate.py --selftest && tools/icon-downstream-gate.py
      # ---- memory-gate ---------------------------------------------
      # `--selftest` exercises audit()/report() in-process, same as every
      # gate above. The executable check and the direct `--hook` call are
      # the arm neither that nor any prior CI run has ever exercised - see
      # "Eighteen" at the top of this file for the demonstrated failure a
      # bare selftest cannot see: the settings.json wrapper silences a
      # broken script down to exit 0.
      - name: memory gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: test -x .claude/tools/memory-gate.py && .claude/tools/memory-gate.py --selftest && .claude/tools/memory-gate.py --hook
      # ---- hooks-gate ----------------------------------------------
      # Same two arms as the memory gate above.
      - name: hooks gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: test -x .claude/tools/hooks-gate.py && .claude/tools/hooks-gate.py --selftest && .claude/tools/hooks-gate.py --hook
      # ---- checkout-drift-hook -------------------------------------
      # `--selftest` only: the `--hook` arm fetches origin and may
      # fast-forward `main`, which on a runner's detached checkout is a
      # statement about nothing. The twelve cases build throwaway repos
      # (a bare origin with HEAD pinned to `main`, a shared-checkout
      # clone and a second clone advancing it) and drive every arm: the
      # first-parent count against a merge topology, the fast-forward,
      # the untouched unrelated dirty file, the refusal on an overlapping
      # one with the landed-leftover verdict, the topic branch, the
      # diverged main, the merge in progress and the failed fetch.
      - name: checkout drift hook
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: test -x .claude/tools/checkout-drift-hook.py && .claude/tools/checkout-drift-hook.py --selftest
      # ---- box-load-hook -------------------------------------------
      # THREE arms, and the middle one is the reason this job is not
      # decorative. The runner is a DIFFERENT ps dialect (GNU, not BSD) from
      # every box this was written on, and the script parses ps duration
      # columns BY HAND - so a rejected flag or an unexpected shape would make
      # the leak arm silently blind. `--hook` cannot catch that: with nothing
      # to report it prints nothing and exits 0, which is exactly what a
      # broken parser also does. `--check-ps` runs the real `ps` and FAILS
      # unless the table actually parsed and pid 1 is in it. `--selftest` is
      # hermetic and cannot see it; `--hook` is the settings.json arm and
      # proves the module imports and runs end to end.
      - name: box load hook
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: test -x .claude/tools/box-load-hook.py && .claude/tools/box-load-hook.py --selftest && .claude/tools/box-load-hook.py --check-ps && .claude/tools/box-load-hook.py --hook
      # ---- claude-clippy-gate --------------------------------------
      # CONTRIBUTING.md documents the clippy gate twice and ci-private runs it
      # twice, and until 24 Aug 2026 nothing held the four in step - see
      # "Twenty-two" at the top of this file for the day main was red
      # with every documented gate green. `--selftest` first, and here it
      # is the gate rather than the house habit: what this protects
      # against is an extractor that has quietly stopped matching, which
      # reads as a clean tree forever. Every arm is driven by a fixture
      # that must go red, including the two shapes that must NOT be - both
      # sides moved together in one commit, and a pure rewrap of the
      # CONTRIBUTING.md copy.
      - name: clippy doc gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/claude-clippy-gate.py --selftest && tools/claude-clippy-gate.py
      # ---- ci-verdict-roster ---------------------------------------
      # `--selftest` ONLY, and that is the whole design of this job
      # rather than an economy. `tools/ci-verdict.py` with no argument
      # is a statement about MAIN'S state - it walks the Actions API for
      # the newest real conclusion per job - so running it here would
      # red whichever lane pushed next for something they did not cause
      # and cannot fix, which is how a gate gets muted. That placement
      # decision is argued at the `ci-verdict` job in ci-private.yml and
      # it has not changed.
      #
      # The selftest is a different thing entirely: pure frozen JSON
      # plus the workflow directory, no network and no `gh` auth.
      # RE-MEASURED 17 Sep 2026 on the dev Mac: about 3.5 s of CPU, 3.3 s
      # wall on a quiet box. It read "ONE file read, about 0.2 s" until
      # then, which was true of a roster held to ci-private.yml alone and
      # had been stale since the coverage arm started classifying all 23
      # files in this directory and holding every watched one to its own.
      # Case 16 of it holds the script's roster against ci-private.yml's
      # job list in BOTH directions - a job the tool neither judges nor
      # excuses is a refusal naming it, and so is a rostered job that has
      # vanished from the file. That refusal is the thing worth having on
      # the AUTHOR's push: whoever ADDS a job to ci-private.yml is the
      # one person who knows whether its red belongs on main's tip, and
      # on main alone they learn it from the next lane's run instead.
      # Same argument the flatpak pin gate's tree mode was moved here on.
      #
      # AND SINCE 17 Sep 2026 THAT REFUSAL PRINTS A TAKE THE RED BLOCK OF
      # ITS OWN - a derived `red-roster-gates-<h>` id, the fetch step, and
      # an `::error` so the red lands on the COMMIT and not only in this
      # log. It reads no claims ledger, which is what keeps this step
      # hermetic; see `roster_selftest_lines` in tools/ci-verdict.py for
      # what that gives up and why it is the right trade here.
      #
      # It needs no new `paths:` entry: `**/*.py` and
      # `.github/workflows/ci-private.yml` are both already triggers
      # above, which is exactly the pair of files that can break it.
      - name: ci verdict roster
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: python3 tools/ci-verdict.py --selftest
      # ---- packaging-tests-roster ----------------------------------
      # The roster arm for the `packaging-gates` job at the foot of this
      # file. That job was added because five of these scripts were steps
      # in pr-check.yml and nowhere else - a public-repo pull-request gate,
      # so on this repo they had never run, and two of them had been
      # reporting a WRONG VERDICT since the day they landed - while seven
      # more ran in no workflow at all. Nothing held that roster to
      # anything, so the twentieth script added tomorrow would be unwired,
      # silent, and read as covered. A list is a gate that cannot see the
      # eleventh family, which is the same argument the roster arms in
      # nav-regen.py, shot-version-gate.py and one-process-roster.py each
      # make in their own directory.
      #
      # It RESOLVES a `run:` step rather than grepping for a mention: a
      # grep finds these paths inside COMMENTS, which is a second way to
      # read as covered while being uncovered and is how
      # packaging/tests/linux-install.sh read as wired. And a step that
      # cannot fire on this repository is not coverage either, which is
      # what keeps pr-check.yml alone from satisfying a script.
      #
      # Here rather than only in ci-private because the lane that adds the
      # script is the one lane that can be told. Build free, about a tenth
      # of a second.
      - name: packaging tests roster
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: |
          tools/packaging-tests-roster.py --selftest
          tools/packaging-tests-roster.py
      # ---- selftest-roster -----------------------------------------
      # THE LAST TWO JOBS IN THIS FILE, and they are one change: a roster over
      # every `--selftest` arm in the repo, plus the job that runs the eleven
      # arms that roster found nothing running.
      #
      # WHY A SELFTEST THAT NOTHING RUNS IS THE DEFECT. Every gate in this
      # file carries a `--selftest` because of the one failure a gate cannot
      # report about itself: a matcher that has quietly stopped matching,
      # which reads as a clean tree forever. Two demonstrated instances are
      # written up at the top of this file's siblings - nav-regen.py's picker
      # arm sat dead for months while reporting every picker current, and
      # site-crosslink.py printed OK on BOTH arms at exit 0 with its one regex
      # broken to `hrefZZZ="`. So the selftest is the load-bearing half, and a
      # selftest nobody runs is that same defect one level up.
      #
      # MEASURED 25 Aug 2026 at origin/main: 47 tracked `*.py` declare a
      # `--selftest` arm and ELEVEN had nothing running one. `tools/claims.py`
      # is the one with the most riding on it - it is the cross-machine LOCK
      # that stops two boxes building the same thing, its resolver was
      # rewritten that day in `5205dd2bf`, and its selftest went from 39 cases
      # to 62 in that same commit, all of it run only when a human typed it.
      #
      # THE ROSTER RESOLVES COMMAND POSITION, which is a sharper rule than the
      # `packaging-tests-roster` job above needs and is why it exists: every
      # appearance of `tools/pollution-bisect.py` in any workflow here is
      # inside an `echo "::error ...` advice string telling a human what to
      # run. It is not commented out, it is QUOTED - so a scan that strips
      # comments and then searches the text certifies it as wired. Being
      # NAMED is not being run, and running the TOOL is not running its
      # SELFTEST; both are asked separately.
      # This gate is in its OWN population - it declares a `--selftest` -
      # so the step below is what keeps it honest, and its selftest pins
      # that against the real tree rather than leaving it to be noticed.
      - name: selftest roster
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/selftest-roster.py --selftest && tools/selftest-roster.py
      # ---- wedge-gate ----------------------------------------------
      # The CONFIG arm only - the junit arm needs a test run and lives in
      # the test jobs themselves, which is where it can redden the shard
      # that saw the wedge. This half holds the ceiling machinery in
      # .config/nextest.toml live: `[profile.ci]` must still carry a
      # `terminate-after` (without it NOTHING in the workspace has a
      # ceiling and the junit arm is inert), every `slow-timeout` table
      # must carry one or say at its site why not, and a key nextest does
      # not define inside such a table is refused - because nextest treats
      # `terminate-aftr = 5` as a WARNING, so the ceiling vanishes in
      # silence. Here as well as in ci-private because this workflow fires
      # on branch pushes: a lane that takes the cover off should learn it
      # on its own push, not leave a silent hole for whoever wedges next.
      # `--selftest` first, and it is the gate rather than the house habit:
      # the handoff that commissioned this recorded the junit discriminator
      # as `message="test timeout"` when it is `type=`, so a version
      # written from it would have passed every run while matching nothing.
      - name: wedge gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/wedge-gate.py --selftest && tools/wedge-gate.py
      # ---- conformance table freshness ------------------------------
      # Every committed `tools/conformance/expected/*.json` holds the
      # pinned reference's answers for ONE matrix, and that matrix is
      # SOURCE - `build_matrix()` composes it in run.py, `matrix_digest()`
      # is a sha256 over the result, and each table carries the digest it
      # was captured over. So a row added, removed or re-spelled makes
      # every committed table stale at once, and `do_verify` then REFUSES
      # each of them rather than comparing part of one.
      #
      # That refusal is correct. What was missing is WHEN you hear about
      # it: ci-private's `changes` classifier forces `build=true` for any
      # `tools/conformance/*` path, so `par2-conformance` AND
      # `par2-conformance-macos` both run and both die at their FRESHNESS
      # step - after a checkout, a toolchain and a parfast build, on jobs
      # the lane that pushed the row is not watching. On 21 Sep 2026 a row
      # landed as a definition only (`73e0f2cf8`, reverted `2f734a7d7`)
      # and reddened both; preflight had run CLEAN over that exact diff,
      # run.py's own selftest included, because that selftest is hermetic
      # and says nothing about the committed tables.
      #
      # The recompute needs NO reference binary and NO build - it is the
      # committed inventory plus the source rows - and takes 0.3 s for all
      # nine tables, 1,157 rows. `shapes_digest` is deliberately NOT in it:
      # those shapes are BUILT by the reference, so an arm over them would
      # need a box that has one, or would skip. The gate's header carries
      # the design, the incident and the limits at length.
      - name: conformance table freshness
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/conformance-table-freshness-gate.py --selftest && tools/conformance-table-freshness-gate.py
  # One level BELOW `selftest-roster` in the roster-gates job, and the two
  # ask different questions. That gate asks whether a `--selftest` is RUN by
  # a workflow. This one asks whether the selftest covers its own gate's
  # EXIT CODE - because a selftest drives `check()` while CI reads `main()`,
  # and nothing connects the two. Measured 17 Sep 2026 over tools/ and
  # .claude/tools/: 70 scripts have a selftest AND a main() that can return
  # nonzero, 176 nonzero exit paths between them, and per-line mutation
  # proved 170 of the 176 BLIND - 66 gates blind on every path they have,
  # including size, ref, doc, api-contract, script-parse and waiver. A gate
  # in that state prints every finding it has and exits 0, green forever,
  # with its selftest still reporting all cases OK.
  #
  # ITS OWN JOB, not a step in the group above, and the reason is cost. It
  # imports each gate and runs that gate's own selftest THREE times - once
  # untouched, once with main() forced to always return 0, once forced to
  # always return 1 - because a selftest that never looks at the exit code
  # survives both forcings and one that pins only one direction survives
  # one. That is minutes where the steps in roster-gates are seconds each,
  # and sharing a job would put a one-second roster behind it.
  #
  # `--selftest` first is not habit here: this script is its own subject,
  # and that arm drives its own main() both ways.
  selftest-exit-code-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    # 30 AND NOT 20, RAISED 18 Sep 2026, and the reason is not the crash arm
    # that landed the same day. This job ran 12m41 and 12m14 against the old
    # 20 BEFORE that arm existed: the batch A-E sweep gave 51 gates an
    # exit-code selftest case that morning, and a job that used to take a few
    # minutes - which is what 20 was set for, and why the sibling gate jobs
    # here sit at 15 - became a twelve-minute one. The crash arm adds 227
    # CPU-seconds on top (measured; two scripts carry 85% of it, see that
    # gate's WHAT IT COSTS block), modelled at about four more minutes here.
    # A cap kill concludes `cancelled`, which is the verdict tools/ci-verdict.py
    # had to be taught to tell from a supersede, so a four-minute margin under
    # a cap is not a saving - it is a red nobody can read. Raise this again
    # rather than trimming the population: the arm is cheap and two selftests
    # are slow, which are different problems with different owners.
    #
    # 45 AND NOT 30, RAISED 18 Sep 2026 (claim
    # `red-selftest-exit-code-gate-c727086c`), and this one IS about the
    # crash arm - the paragraph above took that on trust and the runner
    # disagreed. claims.py came into the population with that arm and its
    # baseline probe blew PROBE_TIMEOUT, which was 600: the job went red on
    # 4 of 4 runs after the arm landed against 5 of 5 green before it, and
    # was never green with it in. PROBE_TIMEOUT was 1200 after that, which
    # was the real change; this cap moves with it so a probe that genuinely
    # WEDGES reports as a red naming itself rather than as the cap kill the
    # paragraph above says nobody can read. A cap costs nothing when green -
    # billing is actual minutes - so the margin is the point. The reasoning
    # and the run table are at PROBE_TIMEOUT in that gate.
    #
    # PROBE_TIMEOUT IS 1800 SINCE 21 Sep 2026 (claim
    # `claims-selftest-probe-timeout`) and this cap STAYS 45, which is the
    # one thing to check before raising that constant again. The margin the
    # paragraph above is about is now 15 minutes rather than 25: one wedged
    # probe burns 30 of the 45 while the rest of the pool drains in
    # parallel, and the job's own green runs are 12-17 minutes. That still
    # fits, and it is the reason this cap is quoted here rather than left
    # to be re-derived - the NEXT raise of PROBE_TIMEOUT has to move this
    # number too, or a wedge goes back to being an unreadable cancelled.
    # claims.py itself got ~3x cheaper in that same commit; the measurement
    # is research/CLAIMS-SELFTEST-PROBE-TIMEOUT-2026-09-21.md.
    timeout-minutes: 45
    concurrency:
      group: selftest-exit-code-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure zsh for the gates under probe
        # This gate IMPORTS each of its 74 subjects and drives their
        # main(), so it inherits every precondition they have - and
        # `tools/script-parse-gate.py` REFUSES rather than skipping when
        # an interpreter it needs is absent, which is the right
        # behaviour and is what reddened this job on 32362956
        # (run 35267425576): `the shell 'zsh' is not on PATH, and
        # riglib.sh needs it`. 239 of the committed shell files are zsh
        # and ubuntu-latest does not carry it. The `script-parse-gate`
        # job above has carried this same step since that gate landed;
        # this job acquired the same need the moment script-parse-gate
        # joined its roster, and nothing propagated the step. A no-op
        # when zsh is already present. The fix is the SITE, not the
        # subject: the gate's own refusal text says `install the shell,
        # do not drop the arm`.
        run: command -v zsh >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zsh)
      - name: install the pinned compiler for the gates under probe
        # THE SECOND SUBJECT WITH A PRECONDITION, and the zsh step above
        # does not cover it. That step fixed two of the three subjects
        # this job reported REFUSED on ba0ff3e7 (run 35268142808) -
        # script-parse-gate and bench-deploy-check, both of which need
        # zsh. `tools/checkjs-gate.py` is the third and needs neither: it
        # resolves `node_modules/typescript/lib/tsc.js` BY PATH and
        # refuses when it is absent, which a fresh CI checkout always is.
        #
        # Measured rather than reasoned, because the two exit codes do
        # not match and the mismatch is what made this look like a
        # different defect: run the gate directly in a tree with no
        # node_modules and it exits 2 (a refusal), while this job's log
        # says `RED (1)`. Both are right - `probe_subprocess` runs the
        # `--probe` WRAPPER, not the subject, and the wrapper exits 1.
        # Reproduced in a throwaway git tree carrying only package.json,
        # package-lock.json and tools/: gate rc=2, wrapper rc=1, which
        # is the log's number exactly.
        #
        # `npm ci` and not `npm install`, and no `actions/setup-node`,
        # for the reasons the `web-gates` job states at length where it
        # runs this same line: tsc's diagnostics are a function of the
        # TYPESCRIPT version, package-lock.json pins it, and `ci` refuses
        # to move the lockfile. One package, under a second from cache.
        #
        # Run even when the zsh step failed, so one missing precondition
        # cannot mask the other's verdict. The job still reds if any step
        # did.
        if: ${{ !cancelled() }}
        run: npm ci --no-audit --no-fund
      - name: selftest exit-code gate
        run: tools/selftest-exit-code-gate.py --selftest && tools/selftest-exit-code-gate.py

  shell-selftests:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: shell-selftests-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # THE SHELL HALF of the selftest roster. tools/selftest-roster.py built
      # its population from `git ls-files '*.py'` until 26 Aug 2026, so no
      # shell selftest outside packaging/tests/ was rostered by anything -
      # that directory has its own gate, and between the two there was a hole
      # the size of every other .sh in the repo. It went the way this family
      # always goes: `tools/publish-site.sh --self-test` was RED on
      # origin/main and had been since the day it was written, 6 of 7, because
      # `git init --bare` points HEAD at init.defaultBranch and git's built-in
      # is still `master` while every world it builds pushes `main` - so the
      # one world that clones checked out nothing. Nobody knew, because
      # nothing ran it.
      #
      # All four are hermetic and together take under two seconds - they build
      # throwaway git repos and shim every privileged call. Each was measured
      # on this box before being wired, and the run to WATCH is the first one
      # on a Linux runner: a sibling of these was 30/30 on the dev Mac and
      # 26/30 on the first Linux box ever to execute it.
      #
      # bench-accounts.sh's arm is an `exec` of bench-accounts-parse.py's,
      # which the job below already runs. It is wired anyway rather than
      # waived on that ground: what this step adds is that the WRAPPER still
      # dispatches, which is the half a direct call to the python cannot see.
      # parfast-rigs.sh is the same shape and is here for the same reason -
      # its wrapper `exec`s the parser's selftest before it reads a roster
      # or opens an ssh, so the arm is hermetic and costs nothing.
      #
      # `packaging/scan-release-assets.sh --self-test` is NOT here and that
      # is measured, not stylistic: it is `#!/bin/zsh`, and ubuntu-latest has
      # no zsh. Wired here first, it failed on the runner with exit 127,
      # `cannot execute: required file not found` - found by a probe branch
      # before it could redden anybody else's push, which is the whole reason
      # this family probes rather than reasons. It belongs in
      # `packaging-gates` below, which installs zsh for exactly this and is
      # where the other packaging scripts already run. Everything left here
      # is `#!/bin/sh` and was verified under REAL dash locally, because
      # ubuntu's /bin/sh is dash while this fleet's is bash in posix mode -
      # the other half of the same trap.
      #
      # build-release-apk.sh's arm is hermetic for a reason worth knowing
      # before touching it: every one of its seven cases is a READ (the
      # crate version, two properties of app/build.gradle.kts, the tracked
      # tree, its own asset name), plus one sub-invocation that is refused
      # at the keystore check before it can reach cargo, gradle, the NDK
      # or a JDK. None of that is on a runner and none of it needs to be.
      # Verified under real dash locally, per the trap above.
      #
      # packaging/ci-private-strip.sh is the fifth, added 2 Sep 2026 with
      # the script itself (TODO 323). It owns the rules that take the
      # private trees out of the exported ci-private.yml, and both callers
      # - the publisher and the pre-commit leak scan - execute it rather
      # than restating it, so a rule that stopped matching would take the
      # pre-commit arm silently blind AND break publishing. Its selftest
      # pins both directions: a prose citation refused, and the
      # load-bearing classifier literals ACCEPTED, which is the arm that
      # decides whether the check survives contact. `#!/bin/sh`, hermetic,
      # under a second, and verified under real dash locally per the trap
      # above.
      #
      # packaging/privrefs-scan.sh is the sixth, and it is the OTHER half
      # of the same file. publish-public.sh carries two refusals about the
      # private tree; ci-private-strip.sh closed the first, and this one
      # closes the second - the scan of the finished export for a file
      # that reaches back into research/. It derives both the regex and
      # the export's removal set out of publish-public.sh, so a derivation
      # that stopped matching would either take the pre-commit arm blind
      # or start refusing the four files the export deliberately deletes.
      # Its selftest pins that pair, and then drives the REAL
      # packaging/leak-check.sh in a throwaway root for both directions:
      # a citation from crates/, docs/ and web/ refused, and every removed
      # file - pesto_fixtures.rs included, which `is_exempt` does NOT
      # cover - accepted with its real bytes. `#!/bin/sh`, hermetic, ~1 s,
      # verified under real dash locally per the trap above.
      - name: shell selftests
        run: |
          .claude/tools/bench-accounts.sh --selftest
          .claude/tools/parfast-rigs.sh --selftest
          packaging/freebsd/smoke.sh --self-test
          tools/publish-site.sh --self-test
          packaging/android/build-release-apk.sh --self-test
          packaging/ci-private-strip.sh --selftest
          packaging/privrefs-scan.sh --selftest
  web-gates:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: web-gates-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ---- rate-format-gate ----------------------------------------
      # The one rule that turns a rate into a string is written three
      # times - the dashboard's `rateParts`, the Windows tray's
      # `fmt_rate`, the mac menu bar's `rateText` - because neither
      # native surface can call into the page. The second and third
      # landed SEVEN MINUTES apart on 24 Aug 2026, each with a doc
      # comment saying it was the second copy. Here as well as in
      # ci-private because a threshold moves in ONE of the three on the
      # author's own push, and the failure is silent: a menu bar reading
      # GB/s beside a dashboard reading MB/s ships looking like a
      # rounding difference. `--selftest` first, and it is the gate: the
      # extractor pins three functions BY NAME across three languages,
      # and one that quietly stops matching reports a clean tree forever
      # - nav-regen's dead picker arm, above, for months.
      #
      # `macapp/**` is in this workflow's paths filter for this job and
      # no other reason. macapp.yml compiles the wrapper as of 24 Aug
      # 2026, but a COMPILER cannot see this defect: `"%.2f Gb/s"` builds
      # exactly as well as `"%.2f GB/s"`. So this stays the only thing in
      # CI that can catch a Swift-side unit mistake.
      - name: rate format gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/rate-format-gate.py --selftest && tools/rate-format-gate.py
      # ---- nav-destinations-gate -----------------------------------
      # The same shape as the gate directly above, for the product's
      # NAVIGATION rather than its speed formatter: `dashboard / wall /
      # settings / manual` is written out THREE times - the dashboard's
      # header, the wall's bar, and web/ui-manualnav.html, which build.rs
      # folds into the sixteen manuals - with no shared code, because
      # none of the three surfaces can call into the others.
      # rate-format-gate's own history is why this exists rather than a
      # comment: that rule was written twice, a doc comment said not to
      # add a third, and a third landed SEVEN MINUTES later. A drift here
      # is a nav that changes shape as you move through the app, which is
      # the exact defect the shared nav was introduced to end.
      - name: nav destinations gate
        if: ${{ !cancelled() }}
        run: tools/nav-destinations-gate.py --selftest && tools/nav-destinations-gate.py
      # ---- bg-token-gate -------------------------------------------
      # `--bg` is defined in web/ui-tokens.html and its VALUES are copied
      # into five sites that cannot read a custom property: the two pages'
      # media-scoped <meta name="theme-color"> pairs, THEME_BG in the
      # pre-paint script, the manifest's two colours, and the mac window's
      # pageBackground. Every one carries a comment asking the next person
      # to keep them in step and nothing checked that anybody did. Here as
      # well as in ci-private because these values paint the BROWSER'S OWN
      # chrome - an installed window's title bar, Android's address bar,
      # iOS's status bar - so a drift is a bar in one colour welded to the
      # top of a page in another, on the most visible surface there is, and
      # the lane that moves the palette should see the red rather than the
      # lane after it. `--selftest` first, and it is the gate: the arms pin
      # two symbols BY NAME across four languages and normalise `#000`
      # against `#000000`, and one that quietly stops matching reports a
      # clean tree forever - nav-regen's dead picker arm, above, for months.
      - name: bg token gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/bg-token-gate.py --selftest && tools/bg-token-gate.py
      # ---- wco-drag-gate -------------------------------------------
      # Two pages declare their top bar to be the installed window's drag
      # handle, because a Chromium PWA in window-controls-overlay mode has
      # no other one. A drag region SWALLOWS THE PRESS, so every control
      # inside it has to opt back out with `app-region:no-drag`, and both
      # pages carry a hand-maintained list plus a comment asking the next
      # person to extend it. A control added and not listed silently stops
      # responding to clicks in an installed window, and NOTHING else on
      # this fleet would ever say so - not a browser tab (the media query
      # never matches), not the mac wrapper (WebKit has neither the display
      # mode nor the env() variables), not a Rust test, not another job
      # here. Here rather than in ci-private because the lane that adds the
      # button is the one lane that can be told. `--selftest` first, and it
      # is the gate: it pins how many interactive elements each fixture
      # reached, so a scanner that has quietly stopped matching shows a
      # zero instead of the clean tree it would otherwise report forever.
      - name: wco drag gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/wco-drag-gate.py --selftest && tools/wco-drag-gate.py
      # ---- event-arm-gate ------------------------------------------
      # `handleLifeEvents` in web/dashboard.html dispatches on `e.kind`
      # through an if/else-if chain with NO fallthrough arm, so a kind it
      # does not name is DROPPED IN SILENCE - the daemon-side emit test
      # stays green, the 27 catalogues still carry its string, and every
      # other gate here stays green. That is how `job.switched` and
      # `job.replaced` reached every webhook subscriber and no dashboard
      # for four hours on 24 Aug 2026, found by a person reading the page.
      # It does not demand an arm for everything: seven of the 23 kinds
      # are STATES the queue payload already renders, and each carries a
      # waiver at its emit site naming the surface that does. The point is
      # that the question cannot be skipped. `--selftest` first, and it is
      # the gate: it pins how many kinds, arms and manual entries each
      # fixture reached, so a scanner that has quietly stopped matching
      # shows a zero instead of the clean tree it would report forever.
      - name: event arm gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/event-arm-gate.py --selftest && tools/event-arm-gate.py
      # ---- js-scope-gate -------------------------------------------
      # A call, in the dashboard's inline JavaScript, to a name that is
      # declared only inside some OTHER function: a guaranteed
      # ReferenceError the moment that line runs. `saveInterests` shipped
      # one - every `put` in web/dashboard.html is a const local to a
      # different function, so `put('s_index_groups', ...)` threw on the
      # SUCCESS path and took pollIdxStats() and the "Saved" toast with
      # it, so a save that WORKED looked like one that did nothing. Here
      # rather than only in ci-private because the failure mode is a green
      # screen telling the user a write happened: nothing turns red, so
      # the push that introduces it is the only moment anyone will look.
      # Nothing else can report it either - `node --check` is syntax only
      # and passed throughout, the five other gates that open this file
      # each scan for one construct, and CodeQL has no undeclared-variable
      # query for JavaScript at all (measured 25 Aug 2026: 352 queries,
      # and the two near neighbours both need a WRITE, because they are
      # about accidental globals). `--selftest` first, and it is the gate:
      # this is a hand-written lexer over 20,000 lines of HTML, and one
      # that quietly stops matching reports a clean page forever, which is
      # what nav-regen's dead picker arm did for months.
      - name: js scope gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/js-scope-gate.py --selftest && tools/js-scope-gate.py
      # ---- checkjs-gate --------------------------------------------
      # The ONE step in this workflow that installs anything, and it is a
      # single package pinned to an exact version with an integrity hash.
      # No `actions/setup-node`: the runner's preinstalled node is a HOST
      # here, and tsc's diagnostics are a function of the TYPESCRIPT
      # version, which package-lock.json fixes. `npm ci` rather than
      # `npm install` because ci refuses to move the lockfile - an install
      # that quietly resolved a different compiler is the whole thing the
      # pin exists to stop. The i18n-gate job's `node web/i18n/extract.js`
      # is the precedent for using node in a build-free gate at all.
      - name: install the pinned compiler
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: npm ci --no-audit --no-fund
      # `tsc --checkJs` over the inline JavaScript of web/dashboard.html and
      # web/wall.html, in place - no bundler, no modules, no build step, and
      # the pages ship exactly as they are on disk. It is the first stage
      # of a costed modularization plan whose remaining stages were closed
      # as answered on 26 Aug 2026: the page is near feature-complete, so
      # the tooling tax of a module split would not be repaid.
      # It exists because tools/js-scope-gate.py cannot hold all of the
      # class it was written for and says so: it screens a call to a name
      # declared SOMEWHERE ELSE in the file, so a name declared NOWHERE is
      # outside its population. One was live on main - `loadStatus&&loadStatus()`
      # in saveSetupLine, where the guard that reads as "call it if it
      # exists" is itself the ReferenceError, so the line-speed save threw
      # on its SUCCESS path and the "Line speed saved." toast never fired.
      # Found by this gate on its first run, in the very function whose
      # comment records the last fix to this class. Here rather than only in
      # ci-private because the failure mode is a green screen telling the
      # user a write happened: nothing turns red, so the push that
      # introduces it is the only moment anyone will look. `--selftest`
      # first, and it is the gate - a compiler that has quietly stopped
      # checking reports a clean page forever, which is what nav-regen's
      # dead picker arm did for months, so a LIVE PROBE runs on every
      # invocation and refuses the whole run if the same binary, flags and
      # prelude stop reporting a name declared nowhere.
      - name: checkjs gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/checkjs-gate.py --selftest && tools/checkjs-gate.py
      # ---- journeys-gate -------------------------------------------
      # journeys/README.md's "House rules for adding one" and a comment at
      # the head of journeys/tests/complete.spec.ts write down three rules
      # for the browser-journey suite that exists to catch what the source
      # scans over web/dashboard.html cannot: no `page.waitForTimeout` (a
      # fixed wait on this box is a guess about another session's cargo
      # build), `retries: 0` in playwright.config.ts (CONTRIBUTING.md's
      # FORTY-FIRST gate's argument one suite over - a journey that only
      # passes on the second go has found something), and no test hook
      # added to the shipped markup. VERIFIED on origin/main 27 Aug 2026:
      # `git grep -ln journeys -- tools/` returned nothing - the rules
      # lived only in prose. Build-free: no npm, no cargo. `--selftest`
      # first, and it is the gate rather than the habit: a scanner that
      # has quietly stopped matching reports a clean suite forever, which
      # is what nav-regen's dead picker arm did for months.
      - name: journeys house-rules gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/journeys-gate.py --selftest && tools/journeys-gate.py
      # ---- api-contract-gate ---------------------------------------
      # web/dashboard.html's api() answers EVERY failure as a resolved
      # {status:false,error} object - right for its ~60 read callers, and
      # the reason a bare `await api(...)` on a WRITE cannot tell a refusal
      # from an acceptance. So a refused write runs on into its success
      # toast and the user gets a green screen describing a change that
      # never happened. review finding F-18 fixed 22 such sites and wrote the
      # contract down as a COMMENT next to api(): a write goes through
      # mustOk() or reportRefusal(). Nothing held anybody to it, and the
      # measurement is the argument - the sweep that found the class named
      # FIVE of the 22, missing forceJob's second call, cancelFinish and
      # saveInterests. Here rather than in ci-private because the lane that
      # adds the handler is the one lane that can be told. `--selftest`
      # first, and it is the gate: it pins how many api() calls each
      # fixture reached, so a scanner that has quietly stopped matching
      # shows a zero instead of the clean tree it would report forever.
      # A SECOND ARM since 25 Aug 2026 closes that gate's own first stated
      # limit - an indirection one level up, through the setCfg wrapper.
      # setCfg reports its own refusal, so dropping its boolean is fine and
      # 160 of 170 calls do; what it reports is dropping it AND then telling
      # the person it worked. Three such sites were live on main, and the
      # hand measurement that commissioned the arm found two of the three.
      - name: api contract gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/api-contract-gate.py --selftest && tools/api-contract-gate.py
  site-i18n-gates:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: site-i18n-gates-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    # The parfast-page-gate step below imports website/tools/ modules that
    # reach into website/parfast-bench/, and an import writes a .pyc beside
    # its source. This job's own `git diff --exit-code` only sees tracked
    # files so it would not catch one, but the untracked cache file would
    # still sit in the published tree for whatever runs next against this
    # checkout. Same class as web-gates and tool-selftests carry this for.
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ---- manual-gate ---------------------------------------------
      # Structural parity of the 15 translated manuals against
      # docs/MANUAL.html: an 18-tag census whole-file AND per section,
      # identical id sets, byte-identical `<code>`. The sibling of
      # `web/i18n/check.py`, which has been ci-private's `i18n-gate`
      # since TODO 201; this half was left hand-run and drifted on all 15
      # locales at once (see the note at the top of this file).
      # `--selftest` first, and the script's own docstring says why it is
      # the thing to run when the census reads suspiciously quiet: until
      # 22 Aug 2026 this gate compared five tag counts, so an
      # English-only block of <p>/<li>/<div> was invisible to it, and it
      # under-reported three separate shipped drifts without ever going
      # red. `python3` in front rather than the bare path, to stay
      # byte-identical to the line ci-private's `i18n-gate` runs.
      - name: manual parity gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: python3 web/i18n/manual-check.py --selftest && python3 web/i18n/manual-check.py
      # ---- manual-section-number-gate ------------------------------
      # The gate directly above is the CROSS-FILE census and cannot see
      # this: the sixteen manuals cross-reference each other 736 times as
      # `<a href="#performance">§14</a>` - a STABLE anchor and an
      # UNSTABLE number - and a chapter number is not an id, not a tag
      # count and not a `<code>` body, so manual-check is clean whatever
      # the number says. Insert a chapter and every number after it moves
      # in all sixteen files while the anchors stay put. A wrong one is
      # silent in the worst way: `#performance` is a real anchor, so the
      # browser jumps there and the page is not broken - it just says
      # "see §13" and lands the reader on a heading that reads 14.
      # Found 21 Sep 2026 by the lane that added the Security chapter
      # (`877653b93`), which renumbered six chapters across sixteen files
      # with nothing able to check it
      # (research/MANUAL-SECTION-NUMBER-HAS-NO-GATE-2026-09-21.md).
      # `--selftest` first, and here it is load-bearing twice over: the
      # gate resolves a reference by document POSITION so that the five
      # links pointing at a SUB-anchor are checked too, and a matcher
      # that quietly stopped matching would report a clean tree forever.
      - name: manual section number gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/manual-section-number-gate.py --selftest && tools/manual-section-number-gate.py
      # ---- site-gate -----------------------------------------------
      # The third script in web/i18n/ and the last one that had nothing
      # turning it red. Two dimensions: structural parity of the 150
      # localized site pages against their English bases (id sets, a tag
      # census, byte-identical `<code>`, lang attribute, picker and
      # hreflang), and an anonymity grep over the pages that cite a
      # measurement. The second is the reason this job is worth a runner:
      # those pages are published, so what it refuses is a disclosure
      # rather than a typo, and it fires on nothing today - which is
      # indistinguishable from being broken. `--selftest` first, and here
      # that is the whole gate: it drives every ban entry at a sample of
      # its own and pins both word anchors, so an alternation that stops
      # matching is a red job and not a quiet tree. `python3` in front
      # rather than the bare path, to stay byte-identical to the line
      # ci-private's `i18n-gate` runs.
      - name: site parity gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: python3 web/i18n/site-check.py --selftest && python3 web/i18n/site-check.py
      # ---- parfast-page-gate ---------------------------------------
      # The third GENERATED-and-committed subject in this job, added
      # 12 Sep 2026. website/parfast-benchmarks.html is built from the
      # round book (research/page/roundbook.html) by
      # website/tools/build_parfast_page.py, and website/parfast-bench/ is
      # the evidence behind it, written by
      # website/tools/export_parfast_evidence.py through
      # tools/scrub-bench-logs.py. Both are committed, so both can go
      # stale the way the cross-links and the nav could, and staleness
      # here is worse than cosmetic in one direction: the page's lead
      # says every log is published beside it, so a directory that has
      # stopped matching the roster is a page making a false claim.
      #
      # The exporter carries a `--selftest` of its own since 16 Sep 2026,
      # and it runs in front of the real export because the real export
      # is the thing it is guarding: main() used to empty
      # website/parfast-bench/ BEFORE running the scrub, so a scrub that
      # refused deleted 456 committed files while printing "nothing is
      # published". The export is staged and swapped now, and that arm's
      # load-bearing case asserts the published directory is
      # byte-for-byte unchanged across a refusal. It is hermetic, runs
      # against a fixture research/ and costs no measurable time.
      #
      # The scrubber's `--selftest` FIRST, and it is the load-bearing
      # half. That script is what stands between a bench log's `host=`
      # line and the public site, and its one failure mode is the family
      # failure mode here: a rule that has quietly stopped matching
      # publishes the hostname and reports clean. Its arm drives every
      # box in the map, both path families, the anonymity rules and the
      # re-scan against packaging/private-patterns.txt.
      #
      # The page check runs against the COMMITTED round book rather than
      # regenerating it, on purpose: research/extract.py reads ten logs
      # and recomputes medians, and holding a floating-point pipeline
      # byte-identical across two operating systems is a different and
      # much weaker gate than holding a text transform to its input.
      # Re-run the round book by hand (research/stage-roundbook-logs.sh,
      # then extract.py and build_page.py) when a round lands.
      #
      # TWO pages come out of that one round book and both are checked
      # here: the commentary page and the DATA-ONLY twin
      # (website/parfast-benchmarks-data.html, added 12 Sep 2026), which
      # is the artefact whose URL goes to a forum. The twin's builder
      # refuses on any prose block it has not been told is data or
      # argument, so this step is also what stops a later round quietly
      # adding a claim to the page that is supposed to carry none.
      - name: parfast page and evidence staleness gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: |
          python3 tools/scrub-bench-logs.py --selftest
          python3 website/tools/export_parfast_evidence.py --selftest
          python3 website/tools/build_parfast_page.py --check
          python3 website/tools/build_parfast_data_page.py --check
          python3 website/tools/export_parfast_evidence.py
          git diff --exit-code -- website/parfast-bench
      # ---- crosslink-gate ------------------------------------------
      # The first of the two gates here whose subject is GENERATED and
      # committed: site-crosslink.py rewrites the cross-page links on the
      # 150 localized pages so a visitor stays in-language, and nothing
      # verified that what is on disk is still what it would produce.
      # `--check` writes nothing and exits 1 on the first page that
      # differs. The second is the `nav-gate` job directly below, which
      # this comment said was "not a job yet" until 23 Aug 2026 - it was
      # wired a day after this one, once the dead arm that kept it out was
      # revived, and the sentence pointing at that note outlived the note.
      #
      # THE `--selftest` IN FRONT WAS ADDED 23 Aug 2026. This comment used
      # to say there was none, and that the absence was not an omission:
      # the arm is a fixed point test, the script run against its own
      # committed output, so it has no judgement to get wrong. That holds
      # for the OUTPUT and not for the PATTERN. One regex drives both the
      # rewrite and the trailing leak scan, and a regex that matches
      # nothing rewrites nothing - the file equals itself, every page
      # reads current, and no leak is reported because none can be found.
      # Measured that day on origin/main: breaking its `href="` literal
      # left both arms dead and this step green at exit 0, the same shape
      # that kept nav-regen's picker arm inert on 64 pages for months. The
      # tree cannot settle it either way, because a converged site
      # correctly yields zero matches on all 150 pages; the selftest
      # proves the transform is alive against synthetic pages instead.
      - name: cross-link staleness gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: python3 web/i18n/site-crosslink.py --selftest && python3 web/i18n/site-crosslink.py --check
      # ---- nav-gate ------------------------------------------------
      # The second generator in web/i18n/, and the second gate here whose
      # subject is GENERATED and committed: nav-regen.py writes the
      # language picker and the hreflang alternates on the 64 pages of the
      # four core bases, and the switcher on the 16 manual pages. It grew
      # `--check` on the same day as the job above and was left unwired
      # for a day, because measuring it found one of its three arms DEAD -
      # it placed a `<span class="langsw">` while every page has carried a
      # `<select class="langsw">` for some time, so it had been checking
      # no picker at all. Wiring it then would have been the rubber stamp
      # this file keeps growing to refuse. `web_picker` now emits the
      # select, `selected` and all, so all three arms are live and this is
      # a job. No `--selftest`, for the same reason the one above has
      # none: the script is run against its own committed output, a fixed
      # point with no judgement to get wrong.
      - name: nav staleness gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: python3 web/i18n/nav-regen.py --check
      # ---- i18n value-shape gate -----------------------------------
      # The class `web/i18n/check.py` cannot see: a translated value that
      # sits under the WRONG KEY, or one the English has outgrown. Every
      # arm check.py has is a parity proof about the key set or about
      # tokens inside a value, so a catalogue whose values are all filed
      # one place to the left passes it perfectly - which is exactly what
      # `set.look.motion.*` did in all 27 languages for seven weeks
      # (4666dcfd9 to 06422c7f6), shipping a dropdown whose first option
      # was a paragraph of explanation under a hint that just said
      # "Full". Two length arms, one absolute per key and one relative
      # per family; the script's header carries the measurements and the
      # limits. `--selftest` FIRST and not optionally: both arms fire on
      # nothing today, so a matcher that had quietly stopped matching
      # would report a clean tree forever, and the selftest is what
      # separates those two. It drives the shipped rotation as a frozen
      # fixture and pins the four thresholds against the real
      # translations that set them.
      - name: i18n value-shape gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: python3 tools/i18n-value-shape-gate.py --selftest && python3 tools/i18n-value-shape-gate.py
  # The build-free PACKAGING gates, and the first job in this file whose
  # subject is not a python gate over the source tree.
  #
  # WHY THEY ARE HERE. Five of them are `- name:` steps in pr-check.yml
  # and nowhere else, and pr-check.yml is `on: pull_request` with
  # `if: github.repository == 'nzbfast/nzbfast'` - a PUBLIC-repo
  # pull-request gate. This repo pushes straight to main, which is the
  # flow documented throughout CONTRIBUTING.md, so on this repo not one of
  # those five steps has ever run. That is the same blind spot this whole
  # workflow exists for, stated at the head of this file for the gates in
  # ci-private's `check` job, one workflow over: a lane can break a
  # packaging gate, pass every check it is shown, merge, and nothing says
  # so until a release is being cut.
  # It is not hypothetical. `packaging/tests/archive-identity.sh` step 6
  # and `packaging/tests/linux-tarballs.sh` step 2 each reported a WRONG
  # VERDICT from the day they landed, and both are steps in that
  # workflow. They were fixed on 24 Aug 2026 (`8c8658e4e`, `6bd54cdd7`,
  # `7f023886e`, `909050631`) after a human ran them by hand. The lane
  # that fixed them left an open lead behind - why did nobody notice
  # those two test steps were red? - and the trigger is the answer. This
  # job is that answer made structural.
  # The other seven ran in NO workflow at all. `grep -rn packaging/tests/
  # .github/workflows/` finds them only inside COMMENTS, which is a
  # second way to read as covered while being uncovered, and is how
  # `packaging/tests/linux-install.sh` still reads as wired today.
  #
  # WHY NOT SIMPLY WIDEN pr-check.yml's TRIGGER, which is the one-line
  # version of this change. Because it is a 60-minute job whose own
  # header measures 40 of those minutes as two `cargo test` passes, plus
  # a windows-latest leg that bills at 2x on a private repo, and
  # CONTRIBUTING.md's "CI build is CPU-bound" paragraph says the levers on that
  # are spent. Firing all of that on every push to buy eleven seconds of
  # shell gates would be the most expensive possible way to run them, and
  # the private repo already covers the Rust half of pr-check far better,
  # per-push, in ci-private.yml. So the CHEAP half moves here and the
  # workflow's trigger is left exactly as it is: pr-check stays the
  # public contributor gate it was written to be, this covers the flow
  # development actually uses, and they are complements rather than
  # duplicates. Same relationship this file already has with `check`.
  #
  # ONE JOB WITH TWELVE STEPS, which departs from the one-job-per-gate
  # shape spelled out forty times above, and the departure is
  # deliberate. Those gates are one python invocation each; these total
  # about eleven seconds of work, of which one script is six, so twelve
  # separate runners would be almost entirely checkout overhead - and
  # six of these twelve are `#!/bin/zsh`, which is not on the ubuntu
  # image, so each of those runners would also pay its own apt install.
  # Steps still report their own verdict in the UI and a failing step
  # names itself, which is the property the one-job-per-gate rule is
  # really buying, and it is exactly how pr-check.yml already runs the
  # five it has.
  #
  # THE ZSH INSTALL IS NOT CEREMONY. Six of these carry a `#!/bin/zsh`
  # shebang, which on a Mac is invisible and on ubuntu is a missing
  # interpreter. That shebang is itself the smell this job is for: these
  # scripts are macOS-shaped and, until this job, had been run only on
  # developer boxes. `linux-tarballs.sh` is the worked example and its own
  # header tells the story - it hardcoded BSD tar's `--uid/--gid` spelling
  # while `build-linux-tarballs.sh` picks between that and GNU's by
  # sniffing `tar --version`, so it was "green on every developer box and
  # red in CI from the day it was wired in". Green on this Mac is
  # therefore not evidence about a Linux runner, which is the whole
  # reason these are being made to actually run somewhere.
  #
  # WHAT IS DELIBERATELY LEFT OUT, so the next lane does not read this
  # roster as the complete family. Three scripts need a docker daemon or
  # minutes rather than seconds, and each would be a new failure surface
  # verified nowhere:
  #   - `docker-entrypoint-puid.sh` - needs a container to exercise the
  #     root-only uid branch. It SKIPS cleanly with no daemon, so on this
  #     Mac it proves nothing, and on a runner docker IS present, so it
  #     would run for real for the first time here. It wants its own
  #     change and its own verification cycle.
  #   - `linux-install.sh` - installs the .deb and .rpm for real, needs
  #     docker. This is the one that reads as wired because pr-check.yml
  #     names it in a COMMENT.
  #   - `leak-check-paths.sh` - over two minutes, and the last lane to
  #     reach for it recorded that nobody has yet run it to completion.
  # Do NOT add one of those to this job without pricing it first; adding
  # them is a fine change, it is just not a free one.
  packaging-gates:
    # Private repo only, same rule as every job above - and here it is
    # load-bearing rather than copied: `scan-release-assets-patterns.sh`
    # exercises `packaging/scan-release-assets.sh`, which publish-public.sh
    # strips from the public export because the scanner literally contains
    # the private vocabulary it greps for. On the public repo that step
    # would run against a file that is not there.
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: packaging-gates-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      # Steps 1 to 5: the five that today run on public pull requests
      # only. Spelled as the bare script, exactly as pr-check.yml runs
      # them, so the two can never disagree about what passes.
      - name: linux packaging gate
        run: packaging/tests/linux-packages.sh
      - name: linux tarball gate
        run: packaging/tests/linux-tarballs.sh
      - name: archive identity gate
        run: packaging/tests/archive-identity.sh
      - name: qpkg junk gate
        run: packaging/tests/qpkg-junk-gate.sh
      - name: synology postinst gate
        run: packaging/tests/synology-postinst.sh
      # Steps 6 to 11: the ones that ran in no workflow at all.
      # Its CALLER, scan-release-assets-patterns.sh below, drives this arm
      # too, so the scanner's canary was already exercised here - but only
      # inside a case that reports `bad` rather than as a step, so the
      # selftest roster could not see it and neither could a reader. One
      # line, 0.03 s, and it is in this job rather than `shell-selftests`
      # because that one has no zsh and this one installs it.
      - name: release-asset scanner selftest
        run: packaging/scan-release-assets.sh --self-test
      # The scanner's Windows link-mode arm is a hand-written PE import
      # reader, and its silent failure - "I found no imports" - is
      # indistinguishable from a clean binary, so the selftest is the
      # load-bearing half. The scanner's own canary runs it too; as a
      # step it is visible to the selftest roster and to a reader.
      - name: PE import reader selftest
        run: python3 packaging/pe-imports.py --selftest
      - name: script modes gate
        run: packaging/tests/script-modes.sh
      - name: publish destination guard
        run: packaging/tests/publish-dest-guard.sh
      # The PORTABLE half of the publish-export check's wiring. That check runs
      # the REAL export, which needs BSD sed and zsh, so it lives on a macOS
      # runner in publish-export.yml behind a NARROW native path filter - it
      # cannot ride this workflow's filter, a union covering `**/*.rs`,
      # `**/*.py`, `**/*.sh` and `*.md`, because that would spin a macOS runner
      # on very nearly every push. A narrow filter is a LIST, and a list is a
      # gate that cannot see the sixth input. This arm derives the export's
      # input set from publish-public.sh ITSELF and refuses an input no pattern
      # there matches, so a new one reddens on the AUTHOR's push instead of
      # leaving that job quietly un-triggered by the file it now reads.
      # `--selftest` first for the reason every gate here runs its own: a
      # matcher that has stopped matching reads as a clean tree forever.
      - name: publish export trigger roster
        run: |
          packaging/tests/publish-export-completes.sh --selftest
          packaging/tests/publish-export-completes.sh --paths
      - name: release notes gate
        run: packaging/tests/release-notes-gate.sh
      - name: synology compose parity
        run: packaging/tests/synology-compose-parity.sh
      - name: docker entrypoint key gate
        run: packaging/tests/docker-entrypoint-key.sh
      # The Flatpak launcher's attach decision. Both ways of getting it
      # wrong have shipped: a healthy native-TLS daemon read as a
      # stranger and locked the user out (TODO 290 F-17), and the first
      # fix for that trusted ANY listener the moment runtime.json said
      # tls. Needs no Flatpak - the launcher is a bash script driven by
      # XDG_CONFIG_HOME and a port, with `nzbfast` and `xdg-open` stubbed.
      - name: flatpak launcher attach gate
        run: packaging/tests/flatpak-launcher.sh
      - name: offline manual gate
        run: packaging/tests/offline-manual.sh
      # Private-only, and the reason this job carries the repository
      # guard above. Six seconds, the slowest of the twelve.
      - name: release asset pattern scanner
        run: packaging/tests/scan-release-assets-patterns.sh
  # The eleven arms the roster found nothing running. One job with eleven
  # steps rather than eleven jobs, for exactly the reason `packaging-gates`
  # gives at its own site: they total about twenty seconds between them
  # (measured on a loaded dev box; the slowest single arm is six),
  # and a step still reports its own verdict and names itself when it
  # fails, which is the property one-job-per-gate is really buying.
  #
  # ONE OF THE ELEVEN IS WAIVED RATHER THAN WIRED, and it took a CI run
  # to find out. One analysis script loads libSystem at MODULE level, so
  # on ubuntu it dies at IMPORT before a single case runs (run
  # 32909511848). Its selftest checks `rusage_info_v4` field offsets
  # against the live `proc_pid_rusage` syscall, which has no Linux twin,
  # so there is nothing portable for it to assert - it carries the one
  # waiver on the tree, at its own site, and the runner above reports it
  # rather than dropping it silently. The other ten passed on the runner
  # unchanged. Green on a Mac is not green here; watch the run.
  #
  # EVERY ONE WAS MEASURED HERMETIC BEFORE IT WAS WIRED, not assumed.
  # `claims.py` was run with `git` stubbed to fail (it calls `git ls-remote
  # origin` on the claim path, which only WARNS, and its selftest never
  # reaches it - 0.12 s that way). `bench-deploy-check.py` was run with
  # `ssh` stubbed to a loud failure and never invoked it: its selftest
  # drives a fake runner and builds throwaway git repos in a temp dir, so
  # it needs no bench box, no key and no `~/bench-out`. The five
  # five analysis report scripts parse fixture text and touch nothing.
  # None of these tools' OTHER half can run here - a ledger command, an
  # ssh comparison over three machines, and five readers of round logs
  # that only exist on a bench box - and none is asked to. Only the
  # selftest, which is the half that is hermetic by construction. The
  # `ci-verdict` job above is the precedent and says so at its own site.
  tool-selftests:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tool-selftests-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The cross-machine work ledger. CONTRIBUTING.md item 1a: git is the only
      # channel that spans boxes, so this file is the LOCK, and a lane that
      # cannot mint or fold a claim correctly starts work another machine
      # already holds. 132 cases, 70 of them the `--src` guard that landed
      # on 25 Aug 2026 after `stamp()` wrote markdown into a YAML workflow
      # and a hostname into a file that ships. OFFLINE by construction: the
      # selftest stubs `can_reach_origin`, so the five `git ls-remote
      # origin` round trips `cmd_claim` used to make on every run are gone
      # (verified with `git` itself stubbed to exit 127 - zero invocations,
      # still passes), which is what makes the hermetic claim above true
      # for this arm rather than nearly true.
      - name: claims ledger
        run: tools/claims.py --selftest
      # The local pre-push orchestrator: derives its gate roster from THIS
      # workflow (tools/workflow_scan.py), scopes gates to the changed set,
      # parallelises them, and caches green selftests by script hash. Its
      # selftest pins the derivation, the scoping and the cargo-command
      # read-out of ci-private.yml; a derivation that quietly stopped
      # parsing would otherwise read as a very fast clean run forever.
      # It ALSO pins the two commands this file composes that no CI step
      # can be paired against - the nextest sweep filter and, since
      # 17 Sep 2026, the armv7 pointer-width build line - to CLAUDE.md's
      # own copies of them, so this step reds on a CLAUDE.md edit as well
      # as on a preflight one.
      # research/DEV-TOOLCHAIN-REVIEW-2026-08-31.md is the review that
      # commissioned it.
      - name: preflight orchestrator
        run: tools/preflight.py --selftest
      # The live-index regrouper's identity gate
      # (research/LIVE-INDEX-REGROUP-PROTOTYPE-2026-09-01.md). It is a
      # prototype and touches no shipped code, but its selftest is the
      # one thing holding `proto/entropy.py` to
      # `nzbkit::release::{bare_stem,looks_obfuscated}` - a mirror, and
      # mirrors drift. It also pins the defect the shadow score caught:
      # `looks_obfuscated` alone calls a ONE-CHARACTER stem obfuscated,
      # so the regrouper was dropping the poster from the identity key
      # for `)`. Pure python, no database, no network, ~0.1 s.
      - name: live-index regrouper identity gate
        run: proto/regroup.py --selftest
      # The four-way naming benchmark's reporting arithmetic
      # (research/namebench/, research/NAMEBENCH-2026-09-01.md). Four
      # independent indexer versions are about to quote precision, yield
      # and cost out of one instrument, so the arithmetic underneath those
      # numbers is worth a step: the arm pins that a perfect namer reads
      # 100%, an always-wrong one 0%, an abstainer divides by nothing, and
      # that the cost ledger's `suspicious()` cross-check - measured
      # sockets minus declared calls - still subtracts. Pure python, no
      # database, no network, ~0.1 s. Its `freeze.py` sibling is waived at
      # its own site: that arm checks the redaction ALLOWLIST against the
      # LIVE index schema, which no runner here has.
      - name: naming benchmark reporting
        run: research/namebench/run.py --selftest
      # The arm-order audit over the banked jcross rounds
      # (research/JCROSS-ARM-ORDER-AUDIT-2026-09-12.md). Both jcross drivers
      # ordered three arms by REVERSING them until 12 Sep 2026, and reversing
      # three arms does not move the middle one - so the arm under test was
      # never first and never last in any round this repo has banked. This
      # file is how the exposure of ten of them was measured, from the logs
      # alone, and it is the thing a future reader will cite rather than
      # re-derive. Its arm pins the two parser traps that would silently
      # change every number it prints - a LEG line's
      # `stage2_raw='joint scheduler, m=7680, ...'` carries its OWN `m=`, so a
      # last-wins key=value dict files the leg under the wrong RUNG, and an
      # unquoted split starts a new field mid-label - plus the rotation itself
      # against jcross.py's rule, and that every banked round it names is still
      # where it says. That last pin is the one with teeth: failing to FIND a
      # round is failing, and a silently-skipped log would make the audit read
      # clean over a corpus it never opened. Pure python, no network, ~0.1 s.
      - name: jcross arm-order audit
        run: tools/jcross-position-audit.py --selftest
      # The NTT crossover reducer for the 1 MiB NTT_MIN_PRESENT rounds
      # (research/NTT-MIN-PRESENT-1MIB-X86-2026-09-16.md). It is the file a
      # later lane will reduce those legs with, and two of its rules are
      # easy to get silently wrong. `feed+fold+solve` is the ENCLOSING
      # stage on BOTH arms and CONTAINS the syndrome pass on the forced
      # one, so comparing `syn_s` against the fold's `ffs_s` prices a part
      # against a whole and yields a crossover that is wrong rather than
      # absent; and a plan file's extra forced arms (`force-w1024` and
      # friends) share ONE fold arm, so a reader that assumes two arms
      # silently drops them. Its arm pins both by reproducing the stage
      # column PUBLISHED in research/NTT-MIN-WORK-SMALL-SETS-2026-09-14.md
      # - 378k/373k/352k/350k/453k at m=256/320/448/640/1,024 - from that
      # round's committed legs, so a reducer that stops agreeing with a
      # published figure says so here rather than in the next write-up.
      # Pure python over a committed .jsonl, no network, ~0.1 s.
      - name: NTT crossover reducer
        run: research/parfast-ntt-min-present-1mib-2026-09-16/legread.py --selftest
      # Names the POLLUTER in a cross-test pollution failure. NOTE: its
      # "real libtest" pin - that `--exact` takes many filters and that
      # libtest sorts the filtered set by name - needs rustc, and this
      # runner has no toolchain, so that one pin SKIPS here and says so in
      # its output. It is not lost: ci-private's `check` job runs this same
      # selftest with a toolchain present, added in the same commit as this
      # job, which is where a pin on rustc's own behaviour belongs anyway.
      - name: pollution bisect
        run: tools/pollution-bisect.py --selftest
      # The RAR benchmark harness's own selftest, wired 19 Sep 2026 on claim
      # `red-roster-gates-88b1d6d0`. It arrived in 9b11f704e with no `run:`
      # step anywhere invoking it, which is exactly what the selftest roster
      # refuses and what reddened `roster-gates` on main: a selftest nothing
      # runs rots in silence, and the one failure a gate cannot report about
      # itself is that it never ran. The arm pins the member-name spelling
      # the harness passes on Windows (native separators for a one-of-many
      # leg), which is the rule that is easy to get silently wrong and which
      # no non-Windows run can otherwise check. No corpus, no tools, no
      # network, ~0.1 s.
      - name: rar benchmark harness
        run: tools/rarbench.py --selftest
      # `python3` here and bare above, matching each file's mode: this one
      # carries a shebang but no executable bit, so a bare invocation is
      # exit 126 on any box. ci-private spells several of its gates this
      # way for the same reason. Verified by running every step in this
      # job verbatim rather than through an interpreter of this gate's
      # choosing - which is how the 126 was found at all.
      - name: segment codec
        run: python3 tools/segcodec.py --selftest
      # The bimodal-cell rule the A/B drivers share
      # (research/AB-CELL-BIMODALITY-AUDIT-2026-09-17.md). Twenty-eight banked
      # drivers import their threshold from this ONE file - sixteen until the
      # roster gate in the step below found twelve more that print a cell and
      # name no `min/min` - so a change here
      # moves every round's warning at once, and the cases it pins are the
      # ones that are expensive to get wrong: the 0.641 cell that motivated
      # the check MUST fire (a floor of 0.50 misses it, which is why the
      # number is 0.70), the wholly-demoted cell must NOT (that is the
      # documented blind spot, and a "fix" that made it fire would be the
      # gate reporting a box state it cannot see), and all five banked
      # print formats must still parse - the fifth was found only because
      # the first scan missed the corpus's two most extreme cells.
      # BOTH COPIES, and the second is not redundant: website/ is a
      # generated, SCRUBBED mirror, so this arm is what would catch a scrub
      # rule that mangled the code on its way out rather than only the prose.
      - name: bimodal-cell rule, and its published copy
        run: |
          python3 research/harness/cellguard.py --selftest
          python3 website/parfast-bench/harness/cellguard.py --selftest
      # The windowed-ask reducer, which pins a PUBLISHED TABLE rather than a
      # rule: --selftest reproduces the four figures the 16 Sep nibble round
      # published (resident 255, -m2048 387, excess +132, the >193 bound with
      # m = 512 excluded on its slab-shape change) out of the banked logs, with
      # and without --threads, and proves the multi-pool refusal fires by name
      # and EXITS 1 while a valid run exits 0. That exit-code pair is the arm
      # worth having in CI: the defect it replaces was a reducer that fused two
      # thread pools into a crossover belonging to neither and said nothing, so
      # a refusal that exited 0 would be the same silent pass wearing a message.
      # BOTH COPIES, for the scrubbed-mirror reason the cellguard step above
      # gives - and here the mirror carries the LOGS as well as the code, so
      # this arm also catches an export that copied the script without the
      # evidence it reduces.
      - name: windowed-ask reducer, and its published copy
        run: |
          python3 research/rounds/wask-nibble-2026-09-16/waskred.py --selftest
          python3 website/parfast-bench/rounds/wask-nibble-2026-09-16/waskred.py --selftest
      # The KNEE reducer, same shape and the same reason: it pins a PUBLISHED
      # TABLE (the i5 nibble round's fold/force effective-parallelism cells) out
      # of that round's banked log, and asserts the verdict each arm is supposed
      # to carry - the -t12 arm reads as a knee and the no-SMT -t4 control does
      # not. It exists because the knee question is being asked on two parts at
      # once and a second implementation of the arithmetic would end the
      # comparison; this step is what keeps the one copy honest. BOTH COPIES,
      # for the scrubbed-mirror reason the step above gives.
      - name: knee reducer, and its published copy
        run: |
          python3 research/harness/kneeratio.py --selftest
          python3 website/parfast-bench/harness/kneeratio.py --selftest
      # The THIRD-WINDOW reducer, same shape and the same two reasons as the
      # two steps above: it pins published cells out of a banked log, and it
      # is the one copy of that arithmetic. BOTH COPIES, for the
      # scrubbed-mirror reason the windowed-ask step gives.
      #
      # WIRED 18 Sep 2026 because `selftest-roster` refused it - it shipped
      # with a --selftest arm no workflow invoked, which is a gate nothing
      # runs. Note what wiring it costs, because it is not nothing: this
      # reducer IMPORTS `waskred` out of the neighbouring round directory,
      # so under the published copy the import lands a `.pyc` in the tree
      # that ships and `site leak scan` refuses it. That is why w3winred.py
      # sets `sys.dont_write_bytecode` at its import, in the same commit as
      # this step - the two gates pull against each other and only the pair
      # is green. Do not wire a round reducer that imports a sibling
      # without checking that half.
      - name: third-window reducer, and its published copy
        run: |
          python3 research/rounds/w3win-nibble-2026-09-18/w3winred.py --selftest
          python3 website/parfast-bench/rounds/w3win-nibble-2026-09-18/w3winred.py --selftest
      # The COARSE-AGAINST-FINE bias reducer, same shape and the same two
      # reasons again. It pins seven published crpin4m crossovers, the crband
      # m=384 A/A floor the round's own refusal rests on, and the closed-form
      # chord bias against a numeric interpolation - so a change to the shared
      # arithmetic that moved any of them reds here rather than in a later
      # lane's table. BOTH COPIES: it IMPORTS w3winred, which imports waskred,
      # so it is the deepest import chain in this job and the mirror is the
      # only place the scrubbed logs are reduced at all.
      #
      # It resolves the round tree from its OWN directory (`ROUNDS`) rather
      # than from the repo root, which is what lets the second line work: under
      # the mirror a repo-root path would resolve to `website/` and every log
      # would go missing. Do not "tidy" that back to a repo-root constant.
      - name: coarse-against-fine bias reducer, and its published copy
        run: |
          python3 research/rounds/crossover-bias-2026-09-18/crossbias.py --selftest
          python3 website/parfast-bench/rounds/crossover-bias-2026-09-18/crossbias.py --selftest
      # The SHORT-LINE probe (18 Sep 2026): its --selftest is a 40-case
      # model of the guard spellings it follows, and a probe whose guard
      # model rots reports every guarded site as unguarded, which is a
      # census nobody reads. Same catch as the reducers above: a
      # research/ script with a selftest arm is on this job or the roster
      # gate refuses it.
      - name: short-line probe guard model
        run: python3 research/gate-short-line-probe.py --selftest
      # The PINNED-BAND bracket-firmness reducer, wired 18 Sep 2026 for the
      # same reason and with the same catch. It shipped with a --selftest arm
      # no workflow invoked, which took `roster-gates` RED on main
      # (run 35340227199) - and it imports `band-trade` out of the
      # neighbouring crband round, so the published copy wrote
      # `crband-2026-09-18/__pycache__/band-trade.cpython-*.pyc` into the tree
      # that ships the moment it was run. It now sets
      # `sys.dont_write_bytecode` before that import, in the same commit as
      # this step. READ THE w3winred NOTE ABOVE before wiring the next one:
      # this is the second round reducer to hit the identical pair, and the
      # published-bytecode half is invisible until you actually run the
      # mirrored copy.
      - name: pinned-band bracket firmness, and its published copy
        run: |
          python3 research/rounds/crpin4m-2026-09-18/bracket-firmness.py --selftest
          python3 website/parfast-bench/rounds/crpin4m-2026-09-18/bracket-firmness.py --selftest
      # The RANDOM-DROP NULL over the campaign's filtered fits, wired 18 Sep
      # 2026 with the rest. Its selftest is not decoration: it REFUSES unless
      # its re-implementations still reproduce sections 8.17 and 8.21's
      # published slopes, r2 values and crossings out of the banked legs, so
      # it is what stops a null being run over a reduction that is no longer
      # the published one.
      #
      # BOTH COPIES, and getting there cost a design choice worth reading
      # before the next round reducer copies this one. Read the w3winred note
      # above for the pair of gates that bite a round reducer, then note what
      # is DIFFERENT here: this reducer imports no sibling, so the
      # published-bytecode half cannot arm (it sets `sys.dont_write_bytecode`
      # anyway) - but its INPUTS are two round directories under `research/`
      # rather than under `research/rounds/`, which
      # `export_parfast_evidence.py` does not mirror. A mirrored script with
      # no inputs cannot run its own selftest, and `selftest-roster` requires
      # the mirror to be wired too, so "skip when the legs are absent" would
      # have been a green line over nothing. The fix is that the round
      # directory is SELF-CONTAINED: `legs.json` beside the script carries the
      # windows the four reductions consume, the research/ copy asserts it
      # against the real legs leg for leg, and the mirror reduces the bank.
      # Both copies therefore assert sections 8.17 and 8.21's published
      # slopes, r2 values and crossings on every push.
      - name: filtered-fit random-drop null, and its published copy
        run: |
          python3 research/rounds/filtered-fit-null-2026-09-18/fitnull.py --selftest
          python3 website/parfast-bench/rounds/filtered-fit-null-2026-09-18/fitnull.py --selftest
      # The same construction one reducer over: a random-drop null over
      # `rowgate.py`'s A/A FLOOR rather than over a fitted location. This one
      # needs no banked inputs of its own - its legs are
      # research/rounds/rowgate-2026-09-15/ and its reducer is
      # research/harness/rowgate.py, BOTH of which export_parfast_evidence.py
      # already mirrors, and floornull.py resolves them relative to its own
      # file so the mirrored copy reduces the mirrored legs. The selftest
      # re-runs rowgate.py at both the unfiltered and the filtered setting and
      # requires this file's floor and verdict to match every printed row, so
      # a change to either side reds here; it REFUSES rather than skipping if
      # it cannot find its subject or parses zero rows.
      # 8.16.5's 4 MiB ladder has NO committed reducer - 8.16.11 says that
      # round's per-cell reduction "was scratch and is described in 8.16.5
      # rather than committed" - so this one re-derives median-of-four from
      # the section's own prose and pins itself to 8.20.8's independently
      # published finding: four of the seven `ntt syndromes` rows ARE exact
      # medians of the banked legs, three are NOT, and two of those three sit
      # below the cheapest leg at their rung. So a change to 8.16.5's table or
      # to that round's legs reds here. Same bank-beside-the-script shape as
      # fitnull above and for the same cause: its legs live in
      # research/parfast-ntt-block-size-2026-09-17/, which is outside
      # export_parfast_evidence.py's SOURCES, so the mirrored copy reduces the
      # banked legs.json and the research copy checks the bank against the
      # round leg for leg.
      - name: 8.16.5 4 MiB ladder reproduction, and its published copy
        run: |
          python3 research/rounds/table-reproduction-2026-09-18/p4recheck.py --selftest
          python3 website/parfast-bench/rounds/table-reproduction-2026-09-18/p4recheck.py --selftest
      - name: row-gate A/A floor null, and its published copy
        run: |
          python3 research/rounds/rowgate-64k-floor-null-2026-09-18/floornull.py --selftest
          python3 website/parfast-bench/rounds/rowgate-64k-floor-null-2026-09-18/floornull.py --selftest
      # And the ROSTER half: which drivers read that rule at all. The
      # selftest is what holds its renderer honest, and the case that
      # matters is the one pinned against the REAL tree - every file that
      # imports cellguard must also be one the renderer can derive a cell
      # from, so a driver written in a print shape the renderer cannot read
      # REFUSES here rather than quietly narrowing the population it
      # reports clean over. That case caught two defects in the script's
      # first hour. The report half is deliberately NOT run per push: it
      # exits 0 on hits by design (a round driver is banked history), so
      # there is nothing for a job to fail on - it is a suite line.
      - name: cellguard driver roster
        run: python3 tools/cellguard-roster.py --selftest
      # zsh, WHICH THIS RUNNER DOES NOT SHIP, and the step below REFUSES
      # without it rather than passing over the case that needs it. That
      # refusal is correct and is why this install is here instead of a
      # skip: `the_parfast_posix_probe_really_matches_the_extensions`
      # drives the rig probe end to end under every shell the fleet
      # actually answers ssh with, and the Apple rigs answer in ZSH,
      # which does not word-split an unquoted expansion. The first cut of
      # that probe carried its hasher in `H="shasum -a 256"` and reached
      # ZERO files out of nineteen on an Apple rig, silently, while
      # passing under `sh`. A run without zsh is that same silence in CI's
      # clothes, so the fix is to GIVE the runner the shell, never to let
      # the case sit out. ~2 s; main was red on exactly this from
      # a5556ee721 until it was installed.
      - name: zsh, for the rig probe's shell matrix
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      # Judges what is deployed on three bench boxes against the repo at a
      # named commit. Six seconds, the slowest of the eleven.
      - name: bench deploy check
        run: tools/bench-deploy-check.py --selftest
      # The bench harnesses' timed-leg discipline. Two things it pins, both
      # of which cost real time when they were absent: that a tool's SUCCESS
      # exit codes are per tool (MultiPar's par2j returns 16 after a repair
      # that WORKED, so a bare `rc != 0` marks a good leg failed), and that
      # the shell reader in `bench/lib/legrc.sh` and the Python reader in
      # `bench/component/scen-summarise.py` agree on every (tool, rc) pair -
      # they read ONE table, `bench/rc-ok.tsv`, and a second copy smuggled
      # into either side fails this arm. It also pins that a MISSING table
      # errors rather than defaulting, because defaulting is the silent
      # version of the same bug. Bash + python3, no build, ~0.3 s.
      - name: bench timed-leg rc discipline
        run: bash bench/lib/legrc.sh --selftest
      # The PAR2 algorithm-seam registry's parser. seam-sweep.py is a
      # REPORT and not a gate - it reddens nothing, by its own design -
      # but its `--stale` arm is the only thing that ASKS whether a
      # crossover threshold has drifted from the code it was measured
      # against, and it answers by parsing the seam census out of the
      # tree. A census that quietly stopped parsing would report zero
      # stale seams for ever, which reads exactly like a converged
      # stack: the same failure shape the bench drift cron below is
      # wired here for. Pure python, no build, ~0.2 s.
      - name: par2 seam registry
        run: tools/seam-sweep.py --selftest
      # The scheduled half of the same question. `bench-deploy-check.py`
      # answers "is a box behind"; nothing made anybody ASK, and the fleet
      # drifted unreported three times (22, 25, 31 Aug 2026). This is the
      # daily runner and the SessionStart cache reader that carries its
      # answer. Neither opens a socket under `--selftest`: the cron's
      # cases drive fixtures and injected posters, and the hook's whole
      # design is that it reads a file. The cron's parser is the sharp
      # one - it reads bench-deploy-check's own output, so a regex that
      # has quietly stopped matching reads as a converged fleet forever.
      - name: bench drift cron
        run: tools/bench-drift-cron.py --selftest
      - name: bench drift hook
        run: .claude/tools/bench-drift-hook.py --selftest
      # The ONLY write path to the memory index, and the only undo that
      # directory has - it is not a git repo, so a lost line is lost. 55
      # checks.
      - name: memory write path
        run: .claude/tools/memory-write.py --selftest
      - name: bench accounts parse
        run: .claude/tools/bench-accounts-parse.py --selftest
      # The parfast RIG reader's half of the same pair, added 16 Sep 2026.
      # Its selftest is the deliverable for the same reason the box gate's
      # is: it is safety-ASYMMETRIC code, where a false HELD costs a lane a
      # second look and a false FREE puts a 16-thread build on a box
      # somebody is measuring on - which happened three times in one
      # afternoon before this existed. The refusal cases are the point (an
      # unreachable box, a signal that reached zero lines, a lock whose
      # bytes and whose readability disagree), and so is the pid check's
      # SECOND half: a live pid younger than the lock it names is a
      # recycled number, which parses fine and looks fixed. It imports
      # bench-accounts-parse.py's marker vocabulary rather than spelling a
      # second copy, so a reclassification there reddens here too. No
      # network, no box, ~0.3 s.
      - name: parfast rig status parse
        run: .claude/tools/parfast-rigs-parse.py --selftest
      # The fleet's one box gate, and the reason its selftest is the
      # deliverable rather than a courtesy: it is subject-locating code, and
      # the three failures it reproduces are all a gate that could not see its
      # subject. A lane that posted QUEUED and never ran blocked the lane
      # behind it for 213 minutes through a free box; a `pgrep` for the bare
      # string `repairteam` matched two idle `tail -F` watchers and left a
      # 32-core box idle for five hours; and read-then-append let two lanes
      # claim 20 seconds apart and both time on a contended box. All three are
      # fixtures here - case (b) spawns a REAL `tail`, because the defect is in
      # how a command line is read and a string cannot test that half. The
      # cases that pin the marker vocabulary reach into
      # `.claude/tools/bench-accounts-parse.py`'s roster on purpose: this gate
      # imports that roster rather than spelling a second copy, so a
      # reclassification of QUEUED there reddens here. No network, no box, no
      # round; ~2 s.
      - name: bench box gate
        run: tools/bench-box-gate.py --selftest
      # The leak scan over the bytes tools/publish-site.sh pushes to
      # gh-pages, split into raw container bytes and the content they
      # carry. It runs at the WORST moment in a release - after the
      # GitHub Release is live, while every download button on the site
      # is still 404 - so a false refusal there is a person under
      # pressure to loosen a leak gate. 36 cases, both directions, plus a
      # real-tree case over all 646 published files, which makes this
      # step a gate over website/ as well as over the scanner: a private
      # name committed to a page reddens the AUTHOR's push instead of the
      # next release. Build-free.
      #
      # 173 of those files until 16 Sep 2026, when the real-tree arm
      # stopped carrying its own guess at the publish set and started
      # DERIVING it from publish-site.sh's step 4. The guess had drifted
      # three ways: website/parfast-bench/ (468 files, 7.3 MB of bench
      # evidence, an $EXTRA_ROOT_DIRS entry) was reached by no per-push
      # check at all, website/nzbfast-synology.yml ($EXTRA_ROOT_FILES)
      # likewise because the list took *.html only, and assets/ was
      # listed flat though publish copies it with `cp -R`. The step was
      # ~2.8 s here at 173 files and the walk adds about 3 s measured on
      # the dev Mac, so expect single-digit seconds rather than the old
      # figure. Each $EXTRA_ROOT_DIRS entry carries a FLOOR in the
      # selftest, because 173 files clear the whole-list floor with
      # parfast-bench contributing nothing at all.
      - name: site leak scan
        run: tools/site-leak-scan.py --selftest
      # The reader that turns a run's flake annotations back into a per-test
      # RATE. Its `--ci` mode is deliberately NOT a job: it costs one API
      # call to list runs, one per run and one per suite job - 61 for a
      # 40-run window, measured 31 Aug 2026 - against the 1,000/h REST
      # budget `${{ github.token }}` shares across the WHOLE repository, and
      # a rate over a window is not a per-push question anyway, so running
      # it every push would re-answer the same question about forty times
      # per window. So the SELFTEST is what CI runs, which is the shape
      # CONTRIBUTING.md's FORTIETH gate asks for and the same one `claims ledger`
      # and `bench deploy check` above already take. 39 cases, hermetic: the
      # API is stubbed, `--junit` reads temp files, and the only thing it
      # touches outside its own fixtures is .github/workflows, from which it
      # DERIVES which jobs run a nextest suite.
      - name: flake rate reader
        run: tools/flake-rate.py --selftest
      # The five analysis report selftests, through a RUNNER in tools/
      # rather than as five steps naming their own directory. That is not
      # tidiness: this file is in packaging/PUBLIC_MANIFEST and ships
      # verbatim to the anonymous public repo, and the directory those
      # scripts live in is private vocabulary that packaging/leak-check.sh
      # refuses there - measured, the five-step version was refused by the
      # pre-commit check before it could be committed. CONTRIBUTING.md's TENTH
      # gate reached for exactly this answer for exactly this reason, and
      # says so at its own site. The runner holds its list to what is
      # actually in that directory in BOTH directions, so it cannot go
      # stale silently, and tools/selftest-roster.py follows the relation
      # one hop so the five report as covered through it. Together they
      # are under a second.
      - name: analysis report selftests
        run: tools/bench-report-selftests.py --selftest && tools/bench-report-selftests.py
      # The capability-corpus grader. Its arms are the ones the wave-4
      # adversarial review made a PREREQUISITE for any of those rows
      # becoming corpus legs: closed-world output, path multiplicity,
      # the probed destination filesystem, lstat/realpath containment,
      # spend budgets, arrival-order control and an honest-failure
      # oracle. None of that can be exercised by the corpus itself here
      # - a real leg needs par2, a built nzbserve, a built client and a
      # loopback NNTP server - so what runs is the grader against
      # fixtures built to bite: a leftover hash, an NFC/NFD collapse,
      # one file offered to two expectations, a symlink pointing out of
      # the job, a FIFO, a spend overrun, a budget metric nothing can
      # measure. `python3` and not a bare path: every script in that
      # directory is committed 100644, so a bare invocation is exit 126
      # on a fresh checkout. Under a second, no build.
      - name: capability corpus grader
        run: python3 bench/capability-corpus/roundtrip.py --selftest
      # The COMPETITOR re-grader, added by the 31 Aug 2026 final
      # capability round. It exists because the round's own grader
      # (`classify.py --names-strict`) needs an exact BASENAME from
      # manifest.json, while the no-RAR corpus deliberately carries the
      # sentinel name `(anywhere)` for payloads whose landed name is
      # free - no client can produce that string, so those legs capped
      # EVERY arm at manual-intervention and the round could not tell two
      # clients apart on them. This re-grades the PRESERVED output trees
      # against deobf.json instead, so it needs no re-run.
      # The verdict itself comes from roundtrip.py's `match_expected` and
      # `containment_problems`, which the step above already covers; what
      # this selftest holds is the GLUE, and the glue is where the
      # dangerous failure lives, because every mistake in it reads as a
      # clean run rather than an error. It has already earned its keep -
      # it caught a not-run leg being scored as a client failure would
      # have been, and a leg with no deobf.json RAISING instead of
      # skipping (`load_deobf` falls back to manifest.json, then throws).
      # Fixtures only, under a second, no build.
      - name: capability corpus re-grader
        run: python3 bench/capability-corpus/regrade-round.py --selftest
      # Three bench/lane scripts that used to take an unknown flag as a
      # real argument with zero validation - `sample.py OUT.csv [DEVICE]`
      # would WRITE into whatever string followed argv[0], so a typo'd
      # `--zzz-not-a-flag` was accepted as an output path and the script
      # sampled until it was killed.
      # analyse.py and report.py read the same way but only for a
      # directory glob, so a typo read as zero results at exit 0 rather
      # than a refusal. Each selftest here only exercises the argv guard
      # (a pure function, no I/O), never the tool's real body.
      - name: bench lane sample argv guard
        run: python3 tools/bench/lane/sample.py --selftest
      - name: bench lane analyse argv guard
        run: python3 tools/bench/lane/analyse.py --selftest
      - name: bench lane report argv guard
        run: python3 tools/bench/lane/report.py --selftest
      # bench2j-gate.py took no flags at all before 31 Aug 2026, so any
      # argument (a typo'd `--selftets`, say) was silently ignored and the
      # ordinary check ran anyway. Its own CI job below and CONTRIBUTING.md's
      # documented line both stay `tools/bench2j-gate.py` bare (paired by
      # tools/claude-clippy-gate.py) - this is a SEPARATE step so adding
      # --selftest here does not touch that pair.
      - name: bench2j gate argv guard
        run: tools/bench2j-gate.py --selftest
      # A conformance row whose command SELECTED NOTHING, and compared
      # equal for that reason. Member 1.1 of the class written up in
      # research/CONFORMANCE-GREEN-MEANS-NOTHING-CLASS-2026-09-21.md: a
      # mask spelled with forward slashes matches no member on windows,
      # where the reference renders names backslash-separated, so both
      # sides do the same nothing and the row goes green over a refusal
      # it never reached. The divergence count is structurally blind to
      # it - reference and candidate AGREE - so something outside the
      # comparison has to look, and this is it.
      # A REPORT, not a gate: it exits 0 on hits and 2 only when it
      # REFUSES. Whether a hit should go red is an open question for the
      # maintainer, the same way it is for `refusing-read-report`, and
      # the script's header says why (the class file is explicit that
      # nobody has swept for the legitimate case, so red would be a
      # verdict from a population of one averted incident).
      # What needs a runner is the SELFTEST - the answer on the tip is
      # ZERO hits, so a matcher that had quietly stopped matching would
      # print output byte-identical to a healthy run - and the bare run,
      # whose refusal arm has teeth: no tables reached, or a committed
      # table this cannot parse, reds on the author's own push. 0.14 s
      # for all nine tables, no reference binary, no build.
      - name: conformance selected-nothing report
        run: |
          tools/conformance-selected-nothing-report.py --selftest
          tools/conformance-selected-nothing-report.py
  claims-drop-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: claims-drop-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      # THE ONLY JOB IN THIS FILE THAT NEEDS HISTORY, and it needs it
      # because its subject IS history: a commit that destroys a record in
      # `research/CLAIMS.jsonl`, the cross-machine LOCK. Every sibling here
      # reads the tree at one commit and is right to take the default
      # shallow checkout; this one compares each pushed commit against its
      # PARENTS, so a depth-1 clone has nothing to compare with.
      #
      # `filter: blob:none` is what makes that affordable. `fetch-depth: 0`
      # alone would fetch every blob of a 13,000-commit history; with the
      # partial-clone filter the checkout takes commits and trees only and
      # the gate lazily fetches the handful of ledger blobs its window
      # actually needs. The .git of this repo is 291 MB unfiltered.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # `research/CLAIMS.jsonl` is append-only BY CONVENTION ONLY:
      # `tools/claims.py` writes append-only under flock and never removes
      # a prior record, but every lane hand-resolves the append-append
      # conflict a main taking a push every ~90 seconds guarantees - 177 of
      # them on one box in six hours. Nothing had ever checked that those
      # resolutions preserved what they merged.
      #
      # Measured 31 Aug 2026 per-commit-against-parents over all 13,285
      # commits reachable from origin/main, by two independently written
      # scanners: SIX commits destroyed a record, FORTY-ONE records were
      # destroyed, and FOUR are still absent today. Thirty-seven of the
      # forty-one came back because somebody later merged a stale branch
      # over the damage - nobody saw the loss and nobody saw the
      # restoration. The ledger's integrity has not been holding because
      # lanes resolve carefully; it has been holding because the fleet
      # carries enough divergent copies that most damage is undone by
      # accident, and that property decays as the fleet converges.
      #
      # ONE ORDINARY COMMIT DROPPED THIRTY-SIX RECORDS (13128a5e9, a lane
      # closing one claim). That is why the gate fires on the DROP EVENT
      # per commit against its parents and never on tip state: a tip-state
      # check calls that commit clean, and it is the worst thing in this
      # history. It is also why the check is not merge-only, which is what
      # the claim behind it was minted for - three of the six are ordinary
      # commits.
      #
      # A destroyed record is not a cosmetic loss: it is an item another
      # BOX may now start a second time, which CONTRIBUTING.md item 1a calls
      # this repo's most repeated defect.
      #
      # The `--selftest` runs first and is the gate rather than the house
      # habit. 39 cases on real throwaway git repositories, including the
      # SYNTHETIC NEGATIVE the brief made mandatory - a merge that drops
      # one record of the other branch's id - because there has never been
      # an unrestored drop of somebody else's record in a shape the corpus
      # can replay, and "it catches a drop by construction" is exactly what
      # the discriminator this gate replaces could have said about itself.
      # Eight mutations of the arms were each verified to redden it against
      # two controls that correctly do not, and four were driven against
      # the REAL repository: the historical merge 459df2194's own bad
      # resolution replayed (refused, naming pool-ack-raii), the CORRECT
      # union of that same merge (green), a real record dropped from
      # origin/main's ledger (refused), and the same commit carrying the
      # waiver trailer (green).
      - name: claims ledger drop gate (selftest)
        run: tools/claims-drop-gate.py --selftest
      # The incremental arm, over exactly the commits this push adds.
      # `--push-range` handles the all-zeroes base of a branch's first
      # push and an unreachable base after a force-push by falling back to
      # the tip commit, and SAYS SO in its output rather than silently
      # narrowing the window.
      - name: claims ledger drop gate (this push)
        run: tools/claims-drop-gate.py --push-range "${{ github.event.before }}" "${{ github.sha }}"
