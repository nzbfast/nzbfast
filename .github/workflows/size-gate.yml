      # exactly 4 GiB narrows to ZERO and the caller takes nothing: no
      # progress at all in a decrementing loop, and Ok(0) in a reader,
      # which every consumer in this tree reads as a clean end of file.
      # Not an alignment coincidence - the last short read takes
      # `remaining % 2^32` and lands the cursor exactly on the multiple,
      # so the trigger is any span of 4 GiB or more, every time.
      # Here rather than only in ci-private for the reason no test job can
      # cover it: on a 64-bit host the hazardous spelling is BIT-IDENTICAL
      # to the safe one, so nothing this fleet runs can see the class, and
      # the push that introduces it is the only moment anyone will look.
      # `adb3681e9` converted nineteen sites; this holds the twentieth.
      # `--selftest` first, and it is the gate: the arms are a hand-written
      # left-walk over 777 casts, and one that quietly stops matching
      # reports a clean tree forever, which is what nav-regen's dead picker
      # arm did for months. It needs no new `paths:` entry - `**/*.rs` and
      # `**/*.py` above already reach every file it reads.
      - name: chunk narrow gate
        run: tools/chunk-narrow-gate.py --selftest && tools/chunk-narrow-gate.py
