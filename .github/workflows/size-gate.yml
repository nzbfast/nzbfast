# Twenty-seven is `tools/screens-derived-gate.py`, added 24 Aug 2026, and
# it is the sibling of Twenty-six one step downstream. Those same two
# captures are ALSO the source of `web/screens/dash-wide.jpg` and
# `web/screens/dash-narrow.jpg`, which packaging/icon/make-screenshots.sh
# downscales with `sips`, which are committed, `include_bytes!`-embedded
