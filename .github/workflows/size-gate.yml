      # that introduces it is the only moment anyone will look. A grep for
      # `drop(st)` would never have found it either - the incident's
      # release is the guard MOVED into a helper that hands a fresh one
      # back. `--selftest` first, and it is the gate: the arms are
      # regexes over a five-loop population, and one that quietly stops
      # matching reports a clean tree forever, which is what nav-regen's
      # dead picker arm did for months.
