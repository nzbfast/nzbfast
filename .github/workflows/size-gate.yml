# Twenty-eight is `tools/icons-derived-gate.py`, added 24 Aug 2026, and it
# is the third in this family in one day and the one whose subject is the
# most-seen artwork the product has. Every raster mark it draws anywhere is
# GENERATED off the three SVG masters in packaging/icon/: the seven PNGs
# under web/icons/, plus icon-1024.png and nzbfast.ico beside those
# masters, through make-favicons.sh, make-icon.sh and make-ico.py. They are
# committed, seven of them are include_bytes!-embedded, four are the
# `icons` array in web/site.webmanifest, three are `<link rel="icon">` on
# the dashboard and the wall, and the .ico is what the Windows installer
# welds onto the executable. Nothing verified the committed copies were
# still what the generators would produce - a grep of .github/ and tools/
# for "make-icons" or "web/icons" returned zero hits, and `web/icons/**`
# was not even a trigger for this workflow. Same two failure modes as
# Twenty-seven and both are worse here. A stale icon is the hardest thing
# in the product to notice going wrong, because a mark you have looked at a
# thousand times is what your eye stops reading: make-favicons.sh's own
# header records that the previous icon defect shipped TWICE and was found
# both times by a person looking at it. And the silent half has THREE
# declaration sites for one file rather than one - the manifest and a
# `sizes=` attribute on both pages - plus `purpose`, where a swap between
# the plain and the maskable pair renders correctly everywhere except an
# Android launcher, which insets the tile, which is the exact report that
# pair was added to fix. qlmanage and sips are macOS-only and these runners
# are ubuntu, so this is the recorded-digest half - the sha256 each master
# had when its rasters were made, in packaging/icon/ICONS-DERIVED.manifest,
# written by the generators through packaging/icon/derivations.py - plus
# every dimension, declaration and roster arm, none of which needs image
# tooling: the .ico's own ICONDIR is read back so a container that quietly
# lost its 24 px entry is a red line rather than a downscale of the wrong
# art in the taskbar. The regenerate-and-compare half is `--check` on each
# of the three generators, on a mac, before a release; both halves were
# measured biting on the real tree the day they landed. Its roster comes
# from the generators' own DERIVATIONS tables, and a fourth `make-*` script
# in that directory that this gate has never heard of is itself a refusal.
# Each gate is its own job with its own concurrency group, so one cannot
# starve or cancel another, and each verdict shows up under its own name
# on the commit.
#
# Twenty-nine is `tools/icon-downstream-gate.py`, added 24 Aug 2026, the
# direct follow-on to Twenty-eight and the one that covers the step that
# gate deliberately did not take. packaging/icon/icon-1024.png is not only
# an output, it is a SOURCE: packaging/flatpak/make-icon.sh downscales it
# into the icon Flathub shows, and packaging/qnap/make-icons.sh into the
# three QTS App Center icons - and nothing of any kind checked those four
# were still what their generators produce. A grep of .github/ and tools/
# for "qnap/icons", "io.github.nzbfast.nzbfast.png" or "make-icons.sh"
# returned zero hits outside packaging/icon/, and `packaging/qnap/**` was
# not even a trigger for this workflow. That sibling names these four as
# out of scope on the reasoning that they are protected one link up - their
# master IS icon-1024.png, which it holds to icon.svg - and that reasoning
# is sound and exactly half the problem: it catches an EDITED master, and
# leaves the FORGOTTEN DOWNSCALE, where icon.svg moves, icon-1024.png is
# regenerated and committed, that gate goes green having reported the
# truth, and these four still carry the previous mark on a store page and
# on every App Center tile. Same both-halves design for the same reason -
# sips is macOS-only, so this is the recorded-digest half, in
# packaging/icon/ICONS-DOWNSTREAM.manifest, and `--check` on each generator
# is the mac half. Its own arms are the ones no digest can reach: a hicolor
# install directory named for a size nothing held to the file, a qbuild
# copy list that must name every row and no other, and the GREY icon's
# PIXELS - because `sips -M` writes NO OUTPUT for an image with an alpha
# channel and fails silently, so the documented failure of that transform
# is a file of the right size, the right format and the wrong colour, which
# a 64x64 measurement cannot see. Its roster is a SCAN of packaging/ and
# macapp/ rather than a list, precisely because the sibling's is scoped to
# packaging/icon/ and would not have seen either of the two scripts this
# gate exists for; macapp/make-app.sh is the one waiver and says at its own
# site that its iconset is built into a temp directory and committed
# nowhere. All four files were measured reproducing byte-identically before
# the design was settled, the hand-greyscaled one included, so no arm had
# to be weakened and there was nothing stale to fix.
#
# The `paths:` filter is the union of what the thirty-two scripts actually
# read, worked out from the scripts rather than guessed, because a push
# the filter skips is a push the gates silently miss:
#
#   - `crates/**`: the size, lock, doc and ref gates all walk it.
#   - `vendor/**`: the ref gate indexes it (INDEX_ROOTS) so that a
#     comment in crates/ may point at a symbol in the rars fork.
#   - `**/*.rs`: the ref gate's path arm walks the WHOLE tree for `.rs`
#     basenames, and bench/ and research/ hold some outside crates/ and
#     vendor/.
#   - `website/**`, `docs/MANUAL.html`, `docs/i18n/MANUAL.*.html`,
#     `web/dashboard.html`, `web/wall.html`: the overflow gate's three
#     targets (TARGETS in the script), plus the stylesheets they link,
#     which all live under website/assets/. Three of these entries carry a
#     second gate each. `docs/MANUAL.html` and `docs/i18n/MANUAL.*.html`
#     are the manual parity gate's ENTIRE subject - the English manual and
#     the 15 translations of it, and they are ALSO the nav staleness
#     gate's manual-switcher arm - and `website/**` is the site parity
#     gate's, all 150 localized pages and the ten English bases they are
#     held to - and `website/**` carries the cross-link staleness gate on
#     top of that, whose subject is 60 of those same pages, and the nav
#     staleness gate's other two arms, whose subject is those 60 plus
#     their four English bases. None of the four gates needed anything
#     added here beyond its own script, and neither did the fifth: the
#     screenshot version gate reads `website/assets/` and
#     `website/SCREENSHOTS.manifest`, both under `website/**`, and
#     `crates/nzbfast/Cargo.toml`, already covered by `crates/**` at the
#     top of this list. Do not narrow any of these entries
#     on the overflow gate's behalf without re-reading this line:
#     `website/**` alone now carries FIVE, and narrowing it would leave
#     the anonymity arm wired to a trigger a leaked city name cannot
#     fire, and the screenshot roster wired to one a new capture cannot.
#   - `**/bench2*.sh`, `**/mkbench2*.py`: the bench2j gate's subject is a
#     generated bench driver, its parent, and the generator between
#     them. Nothing else in the filter reaches those - a bench driver is
#     neither `.rs` nor under crates/ - so without these entries the
#     gate would be wired to a trigger its own subject can never fire.
#     Globbed rather than spelled out because the tree they live in is
#     private vocabulary and this file ships to the public repo
#     verbatim; tools/bench2j-gate.py carries the same note.
#   - `**/*.py`: the leg-warn gate reads every python file in the bench
#     tree, and a seventh LEG-line reader is exactly the thing it exists
#     to catch, so the filter cannot name the files it has today. Globbed
#     wider than its subject for the same reason as the two entries above
#     - that tree is private vocabulary and this file ships to the public
#     repo verbatim - and it is affordable because the job is a
#     measured 0.07 s.
#   - `*.md`: the provenance gate reads the lab notebook at the repo
#     root. Globbed to root markdown rather than named for the third time
#     for the same reason as the three entries above - that filename is
#     private vocabulary and this file ships to the public repo verbatim
#     - and it is affordable because the job is a measured 0.05 s.
#   - `**/*.sh`, `**/*.zsh`: the iface threshold gate reads every shell
#     file in the bench tree, because its whole point is to see a driver
#     that does not exist yet - a list of the four it has today is a gate
#     that cannot see the fifth. Globbed wider than its subject for the
#     fourth time and for the same reason as the three entries above, and
#     affordable for the same reason: a measured 0.06 s. `**/bench2*.sh`
#     above is now subsumed by it and kept anyway, so that removing one
#     gate can never silently unwire another.
#   - `packaging/flatpak/**`: the flatpak pin gate reads four files in
#     that directory (the yaml, the metainfo, the README and
#     cargo-sources.json) and holds them to one version. Spelled out
#     rather than globbed, unlike the four entries above: `packaging/` is
#     in PUBLIC_MANIFEST wholesale, so the path is not private vocabulary
#     and there is nothing to hide from the public copy of this file. The
#     directory rather than the four names, because a fifth packaging
#     file that carries the version is exactly what the gate will be
#     taught next. Its FIFTH read, `crates/nzbfast/Cargo.toml`, is
#     already covered by `crates/**` at the top of this list. There is
#     deliberately no `Cargo.lock` entry: the gate reads a Cargo.lock
#     only from INSIDE the fetched tag tarball, in the `--live` mode that
#     CI never runs, so a lockfile bump can never change this verdict and
#     naming it here would be a trigger worked out by guessing rather
#     than from the script.
#   - `.github/workflows/ci-private.yml`: the clippy-doc gate's other
#     half. Nothing else in this filter reaches a workflow file, so
#     without this entry a lane could move a clippy step and the gate
#     that exists to notice would never run. Its FIRST half is the repo's
#     root markdown, already covered by `*.md` above and left to it for
#     the same reason the provenance gate's subject is: that filename is
#     agent vocabulary and this file ships to the public repo verbatim.
#   - `.claude/tools/memory-gate.py`, `.claude/tools/hooks-gate.py`: the
#     memory and hooks gates' own subjects, named explicitly rather than
#     left to `**/*.py` to reach - that pattern's coverage of a
#     dot-directory was never established here, and even where a glob
#     above provably reaches its subject the file still names it
#     separately (see the harness/i18n case just below), so a dot-prefixed
#     path gets no less.
#   - the thirty-two gate scripts and this file. `crates/**` and `**/*.rs`
#     already carry the harness gate's whole subject, so it adds only its
#     own script to the list, and `**/*.py` already reaches
#     all four of `web/i18n/manual-check.py`, `web/i18n/site-check.py`,
#     `web/i18n/site-crosslink.py` and `web/i18n/nav-regen.py` - all four
#     named anyway, for the same reason `**/bench2*.sh` is kept below a
#     filter that subsumes it: removing one gate must never silently
#     unwire another.
#
# The doc, ref, overflow, bench2j, leg-warn, par2, provenance, iface,
# waiver, windows-portability, flatpak pin and harness gates are PRIVATE:
# `packaging/PUBLIC_MANIFEST` ships only lock-gate.py and size-gate.py of
# tools/. This file ships verbatim to the public repo with the rest of
# .github, and every job here is behind `if: github.repository !=
# 'nzbfast/nzbfast'`, so on the public repo the jobs are skipped rather
# than failing on a script that is not there - the same arrangement
# ci-private.yml relies on for the same twelve scripts: eleven of them in
# `check`, and the flatpak pin in its own job for the same reason it is
# its own job here. The FOUR i18n gates are the exceptions that change
# nothing. All four live in web/, and PUBLIC_MANIFEST ships `web` and
# `docs` wholesale, so their scripts are present publicly; the manual
# gate's subject ships too, and the two website gates' does NOT -
# `website/` is not in PUBLIC_MANIFEST, so on the public repo those
# scripts would have no pages to read. The nav staleness gate is both at
# once: its manual-switcher arm reads files that ship and its picker and
# hreflang arms read files that do not. No such case is reached, because
# all of them are behind the same `if:` as everything else here. The split this file and pr-check.yml keep is
# about which repo pays for a run, not about which scripts exist.
#
# The memory and hooks gates below are PRIVATE the same way, one level
# further out: `.claude/` is not a PUBLIC_MANIFEST entry AT ALL (the
# manifest names it only in a comment, to say why - "internal agent
# skills, name private hosts"), so on the public repo `.claude/tools/`
# does not exist, full stop, the same as most of tools/ above. The same
# `if:` skips both jobs there before either script is ever asked for.
# Checked, not assumed: `./packaging/leak-check.sh
# .github/workflows/size-gate.yml` is clean on this file with both paths
# in it, because a PATH is not the private vocabulary the scan looks for
# and the scripts' actual contents - which is where that vocabulary would
# live - never ship either way. Unlike every entry above, neither has a
# ci-private.yml counterpart: nothing has ever run these two selftests
# anywhere (`grep -rn "claude/tools" .github/workflows/` has exactly one
# hit, prose in leak-check.yml, not a step), so there is no existing
# `check` step to leave in place for redundancy - this file is the first
# and only place either one runs.
name: size-gate
on:
  push:
    paths:
      - 'crates/**'
      - 'vendor/**'
      - '**/*.rs'
      - 'website/**'
      - 'docs/MANUAL.html'
      - 'docs/i18n/MANUAL.*.html'
      - 'web/dashboard.html'
      - 'web/wall.html'
      - 'tools/size-gate.py'
      - 'tools/lock-gate.py'
      - 'tools/waiver-gate.py'
      - 'tools/doc-gate.py'
      - 'tools/ref-gate.py'
      - 'tools/overflow-gate.py'
      - '**/bench2*.sh'
      - '**/mkbench2*.py'
      - 'tools/bench2j-gate.py'
      - 'tools/par2-gate.py'
      - '**/*.py'
      - '*.md'
      - '**/*.sh'
      - '**/*.zsh'
      - 'tools/iface-excess-gate.py'
      - 'tools/win-portability-gate.py'
      - 'packaging/flatpak/**'
      - 'tools/flatpak-pin-gate.py'
      - 'tools/harness-gate.py'
      - 'tools/index-lock-gate.py'
      - 'tools/rate-format-gate.py'
      - 'macapp/**'
      - 'tools/payload-id-gate.py'
      - 'tools/bg-token-gate.py'
      - 'tools/test-global-gate.py'
      - 'tools/claude-clippy-gate.py'
      - 'tools/wco-drag-gate.py'
      - 'tools/shot-version-gate.py'
      - 'tools/screens-derived-gate.py'
      - 'web/screens/**'
      - 'tools/icons-derived-gate.py'
      - 'web/icons/**'
      - 'packaging/icon/**'
      - 'tools/icon-downstream-gate.py'
      - 'packaging/qnap/**'
      - '.github/workflows/ci-private.yml'
      - 'web/ui-tokens.html'
      - 'web/site.webmanifest'
      - 'web/i18n/manual-check.py'
      - 'web/i18n/site-check.py'
      - 'web/i18n/site-crosslink.py'
      - 'web/i18n/nav-regen.py'
      - '.claude/tools/memory-gate.py'
      - '.claude/tools/hooks-gate.py'
      - '.github/workflows/size-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
# Every job below is the same shape, deliberately spelled out thirty-two
# times rather than as a matrix, so each step's `run:` line is the bare
# script exactly as ci-private runs it and the two can never disagree
# about what passes - true of twenty-four of the thirty-two. The memory
# and hooks gates have no ci-private line to match, see "Eighteen" above,
# and neither does the clippy-doc gate, which is wired here alone - this
# file runs on main's pushes too, so nothing is lost by that. The
# wco-drag gate is the fourth, wired here alone for the same reason and
# left out of this sentence when it landed. The
# ci-verdict roster job is the fifth and the only one that DELIBERATELY
# differs: ci-private runs `--selftest && <the gate>`, this runs the
# selftest ALONE, because the gate half is a statement about main's state
# and would red the next lane. See "Twenty-three" above - that asymmetry
# is the design, not drift, so do not "fix" it by appending the gate.
# The wco-drag gate is the fifth, wired here alone at landing for the same
# reason as the clippy-doc one; the arithmetic above counts it. The
# screens-derived gate is the sixth, wired here alone for the same reason
# again - this file runs on main's pushes too, so nothing is lost by it,
# and its subject is a picture a lane can only fix while it still has the
# mac in front of it. The icons-derived gate is the seventh and last, wired
# here alone for that same reason one more time: its regenerate-and-compare
# half needs qlmanage, so the lane holding the mac is the only lane that
# can act on a hit at all. The downstream icon gate is the eighth, wired
# here alone for exactly that reason again - its own mac half is `--check`
# on two generators that need sips.
#
# Concurrency is on the JOB, not the workflow, which is ci-private.yml's
# hard-won lesson written down: a workflow-level group cancels every job
# in the run, so one slow leg kills the fast one. With thirty-two jobs that
# is no longer hypothetical - a per-job group means the overflow gate's
# selftest can never take the lock gate's verdict down with it.
#
# Same rule as `check` otherwise: superseding is what you want on a
# topic branch, and main must always reach a verdict rather than be
# cancelled by the next push.
jobs:
  size-gate:
    # Private repo only. The public repo has pr-check.yml; the cost
    # rationale for that split lives there.
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: size-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `--selftest` first, same reason as the lock gate below: this
      # gate's `#[cfg(test)]` scope resolver ended a BRACE-LESS item only
      # on braces, so it ran on to the next `{` and scored the production
      # function after it as test code - exempt from the ceiling. That hid
      # `Daemon::enqueue` at 575 lines. The selftest pins the brace-less
      # shape so nobody simplifies the resolver back.
      - name: size gate
        run: tools/size-gate.py --selftest && tools/size-gate.py
  lock-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: lock-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lock gate
        run: tools/lock-gate.py --selftest && tools/lock-gate.py
  waiver-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: waiver-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `--selftest` first: this gate exempts two shapes (`cfg_attr(..,
      # allow(..))` and `#[expect]`) by NOT matching them, so a slipped
      # anchor turns it into a gate that passes everything quietly. The
      # selftest asserts the exempt fixtures really are exempt and the
      # noted ones really are seen and judged justified.
      - name: lint waiver gate
        run: tools/waiver-gate.py --selftest && tools/waiver-gate.py
  doc-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: doc-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: doc gate
        run: tools/doc-gate.py --selftest && tools/doc-gate.py
  ref-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ref-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ref gate
        run: tools/ref-gate.py --selftest && tools/ref-gate.py
  overflow-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: overflow-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: overflow gate
        run: tools/overflow-gate.py --selftest && tools/overflow-gate.py
  bench2j-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: bench2j-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bench driver generator gate
        run: tools/bench2j-gate.py
  leg-warn-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: leg-warn-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: LEG-line WARN gate
        run: tools/leg-warn-gate.py --selftest && tools/leg-warn-gate.py
  par2-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: par2-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: par2 guard gate
        run: tools/par2-gate.py --selftest && tools/par2-gate.py
  provenance-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: provenance-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: driver provenance gate
        run: tools/provenance-gate.py --selftest && tools/provenance-gate.py
  iface-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: iface-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: iface threshold gate
        run: tools/iface-excess-gate.py --selftest && tools/iface-excess-gate.py
  win-portability-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: win-portability-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The one gate here whose subject is a platform nobody in this fleet
      # builds on: unix-only symbols in code Windows also compiles. Four
      # fix commits over two days of red windows-build / windows-clippy,
      # 21-23 Aug 2026. `--selftest` first, same reason as the gates above
      # - the exemption logic is the whole gate, and a refactor that
      # over-exempts still prints a green line.
      - name: windows portability gate
        run: tools/win-portability-gate.py --selftest && tools/win-portability-gate.py
  flatpak-pin-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: flatpak-pin-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The offline half of the Flatpak release pin: the yaml's
      # `url`+`sha256`, the metainfo's newest <release> and the README
      # install example are one version, and it is not ahead of
      # Cargo.toml. A pin BEHIND Cargo.toml passes on purpose - that is
      # the normal state between the bump commit and publish-release step
      # 4d, whose `--live` mode is the other half and is not a CI job.
      # `python3` in front, unlike the twelve bare paths above, because
      # the line is byte-identical to ci-private's - the rule at the top
      # of this file is that the two can never disagree about what
      # passes, and an invocation this file spells its own way is the
      # first way they start to.
      - name: flatpak pin gate
