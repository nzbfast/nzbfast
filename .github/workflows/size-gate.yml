# Cargo.toml is a human's assertion, in website/SCREENSHOTS.manifest,
# that an image was shot at a version, so a record bumped without
# re-shooting defeats it and no arm can tell. That still converts "nobody
# ever looks" into "a release bump asks the question", which is the step
# that was missing for two releases. Here rather than on main alone for
# the reason every entry above gives, with a twist: the lane that bumps
# the version is the one lane that can still choose to re-shoot before
# the release goes out. MOST OF ITS ROSTER IS WAIVED, which makes the
# waiver mechanism load-bearing rather than decorative - four indexer-fed
# captures are deliberately stale under a standing rule dated 18 Aug
# 2026, because populating the index the obvious way fills them with real
