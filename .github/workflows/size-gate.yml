# source digest and a regenerate-and-compare, and the lane shipped BOTH
# rather than choosing: this job holds the sha256 the generator recorded
# for each source in website/SCREENS-DERIVED.manifest, plus every
# dimension, ratio and declaration arm, none of which needs image tooling
# at all, while `make-screenshots.sh --check` proves the actual bytes on a
# mac as a pre-release step. Neither alone would do - CONTRIBUTING.md's bench2j
# entry is the precedent for what happens to a check that lives on one box
# alone, and its subject rotted twice. Here rather than on main alone for
# the reason every entry above gives, with the same twist as Twenty-six:
# the lane that re-shoots a capture is the one lane still holding the mac
# that can regenerate the derivative. Its roster comes from the
# generator's own DERIVATIONS table rather than from a list of today's two
# files, because a list is a gate that cannot see the third. `--selftest`
# first and it is the gate: 33 cases, each pinned by a message it must
# name, and the run prints how many files, records and declarations it
# REACHED so an inert scanner shows a zero rather than a green.
# Twenty-eight is `tools/icons-derived-gate.py`, added 24 Aug 2026, and it
# is the third in this family in one day and the one whose subject is the
# most-seen artwork the product has. Every raster mark it draws anywhere is
# GENERATED off the three SVG masters in packaging/icon/: the seven PNGs
# under web/icons/, plus icon-1024.png and nzbfast.ico beside those
# masters, through make-favicons.sh, make-icon.sh and make-ico.py. They are
# committed, seven of them are include_bytes!-embedded, four are the
# `icons` array in web/site.webmanifest, three are `<link rel="icon">` on
# the dashboard and the wall, and the .ico is what the Windows installer
# welds onto the executable. Nothing verified the committed copies were
# still what the generators would produce - a grep of .github/ and tools/
# for "make-icons" or "web/icons" returned zero hits, and `web/icons/**`
# was not even a trigger for this workflow. Same two failure modes as
# Twenty-seven and both are worse here. A stale icon is the hardest thing
# in the product to notice going wrong, because a mark you have looked at a
# thousand times is what your eye stops reading: make-favicons.sh's own
# header records that the previous icon defect shipped TWICE and was found
# both times by a person looking at it. And the silent half has THREE
# declaration sites for one file rather than one - the manifest and a
# `sizes=` attribute on both pages - plus `purpose`, where a swap between
# the plain and the maskable pair renders correctly everywhere except an
# Android launcher, which insets the tile, which is the exact report that
# pair was added to fix. qlmanage and sips are macOS-only and these runners
# are ubuntu, so this is the recorded-digest half - the sha256 each master
# had when its rasters were made, in packaging/icon/ICONS-DERIVED.manifest,
# written by the generators through packaging/icon/derivations.py - plus
# every dimension, declaration and roster arm, none of which needs image
# tooling: the .ico's own ICONDIR is read back so a container that quietly
# lost its 24 px entry is a red line rather than a downscale of the wrong
# art in the taskbar. The regenerate-and-compare half is `--check` on each
# of the three generators, on a mac, before a release; both halves were
# measured biting on the real tree the day they landed. Its roster comes
# from the generators' own DERIVATIONS tables, and a fourth `make-*` script
# in that directory that this gate has never heard of is itself a refusal.
# Each gate is its own job with its own concurrency group, so one cannot
# starve or cancel another, and each verdict shows up under its own name
# on the commit.
#
# Twenty-nine is `tools/icon-downstream-gate.py`, added 24 Aug 2026, the
# direct follow-on to Twenty-eight and the one that covers the step that
# gate deliberately did not take. packaging/icon/icon-1024.png is not only
# an output, it is a SOURCE: packaging/flatpak/make-icon.sh downscales it
# into the icon Flathub shows, and packaging/qnap/make-icons.sh into the
# three QTS App Center icons - and nothing of any kind checked those four
# were still what their generators produce. A grep of .github/ and tools/
# for "qnap/icons", "io.github.nzbfast.nzbfast.png" or "make-icons.sh"
# returned zero hits outside packaging/icon/, and `packaging/qnap/**` was
# not even a trigger for this workflow. That sibling names these four as
# out of scope on the reasoning that they are protected one link up - their
# master IS icon-1024.png, which it holds to icon.svg - and that reasoning
# is sound and exactly half the problem: it catches an EDITED master, and
# leaves the FORGOTTEN DOWNSCALE, where icon.svg moves, icon-1024.png is
# regenerated and committed, that gate goes green having reported the
# truth, and these four still carry the previous mark on a store page and
# on every App Center tile. Same both-halves design for the same reason -
# sips is macOS-only, so this is the recorded-digest half, in
# packaging/icon/ICONS-DOWNSTREAM.manifest, and `--check` on each generator
# is the mac half. Its own arms are the ones no digest can reach: a hicolor
# install directory named for a size nothing held to the file, a qbuild
# copy list that must name every row and no other, and the GREY icon's
# PIXELS - because `sips -M` writes NO OUTPUT for an image with an alpha
# channel and fails silently, so the documented failure of that transform
# is a file of the right size, the right format and the wrong colour, which
# a 64x64 measurement cannot see. Its roster is a SCAN of packaging/ and
# macapp/ rather than a list, precisely because the sibling's is scoped to
# packaging/icon/ and would not have seen either of the two scripts this
# gate exists for; macapp/make-app.sh is the one waiver and says at its own
# site that its iconset is built into a temp directory and committed
# nowhere. All four files were measured reproducing byte-identically before
# the design was settled, the hand-greyscaled one included, so no arm had
# to be weakened and there was nothing stale to fix.
#
# The `paths:` filter is the union of what the fifty scripts actually
# read, worked out from the scripts rather than guessed, because a push
# the filter skips is a push the gates silently miss:
#
#   - `crates/**`: the size, lock, doc and ref gates all walk it.
#   - `vendor/**`: the ref gate indexes it (INDEX_ROOTS) so that a
#     comment in crates/ may point at a symbol in the rars fork.
#   - `**/*.rs`: the ref gate's path arm walks the WHOLE tree for `.rs`
#     basenames, and bench/ and research/ hold some outside crates/ and
#     vendor/.
#   - `website/**`, `docs/MANUAL.html`, `docs/i18n/MANUAL.*.html`,
#     `web/dashboard.html`, `web/wall.html`: the overflow gate's three
#     targets (TARGETS in the script), plus the stylesheets they link,
#     which all live under website/assets/. Three of these entries carry a
#     second gate each. `docs/MANUAL.html` and `docs/i18n/MANUAL.*.html`
#     are the manual parity gate's ENTIRE subject - the English manual and
#     the 15 translations of it, and they are ALSO the nav staleness
#     gate's manual-switcher arm - and `website/**` is the site parity
#     gate's, all 150 localized pages and the ten English bases they are
#     held to - and `website/**` carries the cross-link staleness gate on
#     top of that, whose subject is 60 of those same pages, and the nav
#     staleness gate's other two arms, whose subject is those 60 plus
#     their four English bases. None of the four gates needed anything
#     added here beyond its own script, and neither did the fifth: the
#     screenshot version gate reads `website/assets/` and
#     `website/SCREENSHOTS.manifest`, both under `website/**`. It read
#     `crates/nzbfast/Cargo.toml` too until 1 Sep 2026 and no longer reads
#     any crate file. Do not narrow any of these entries
#     on the overflow gate's behalf without re-reading this line:
#     `website/**` alone now carries FIVE, and narrowing it would leave
#     the anonymity arm wired to a trigger a leaked city name cannot
#     fire, and the screenshot roster wired to one a new capture cannot.
#   - `**/bench2*.sh`, `**/mkbench2*.py`: the bench2j gate's subject is a
#     generated bench driver, its parent, and the generator between
#     them. Nothing else in the filter reaches those - a bench driver is
#     neither `.rs` nor under crates/ - so without these entries the
#     gate would be wired to a trigger its own subject can never fire.
#     Globbed rather than spelled out because the tree they live in is
#     private vocabulary and this file ships to the public repo
#     verbatim; tools/bench2j-gate.py carries the same note.
#   - `**/*.py`: the leg-warn gate reads every python file in the bench
#     tree, and a seventh LEG-line reader is exactly the thing it exists
#     to catch, so the filter cannot name the files it has today. Globbed
#     wider than its subject for the same reason as the two entries above
#     - that tree is private vocabulary and this file ships to the public
#     repo verbatim - and it is affordable because the job is a
#     measured 0.07 s.
#   - `*.md`: the provenance gate reads the lab notebook at the repo
#     root. Globbed to root markdown rather than named for the third time
#     for the same reason as the three entries above - that filename is
#     private vocabulary and this file ships to the public repo verbatim
#     - and it is affordable because the job is a measured 0.05 s.
#   - `**/*.sh`, `**/*.zsh`: the iface threshold gate reads every shell
#     file in the bench tree, because its whole point is to see a driver
#     that does not exist yet - a list of the four it has today is a gate
#     that cannot see the fifth. Globbed wider than its subject for the
#     fourth time and for the same reason as the three entries above, and
#     affordable for the same reason: a measured 0.06 s. `**/bench2*.sh`
#     above is now subsumed by it and kept anyway, so that removing one
#     gate can never silently unwire another.
#   - `packaging/flatpak/**`: the flatpak pin gate reads four files in
#     that directory (the yaml, the metainfo, the README and
#     cargo-sources.json) and holds them to one version. Spelled out
#     rather than globbed, unlike the four entries above: `packaging/` is
#     in PUBLIC_MANIFEST wholesale, so the path is not private vocabulary
#     and there is nothing to hide from the public copy of this file. The
#     directory rather than the four names, because a fifth packaging
#     file that carries the version is exactly what the gate will be
#     taught next. Its FIFTH read, `crates/nzbfast/Cargo.toml`, is
#     already covered by `crates/**` at the top of this list. There is
#     deliberately no `Cargo.lock` entry: the gate reads a Cargo.lock
#     only from INSIDE the fetched tag tarball, in the `--live` mode that
#     CI never runs, so a lockfile bump can never change this verdict and
#     naming it here would be a trigger worked out by guessing rather
#     than from the script.
#   - `.github/workflows/ci-private.yml`: the clippy-doc gate's other
#     half. Nothing else in this filter reaches a workflow file, so
#     without this entry a lane could move a clippy step and the gate
#     that exists to notice would never run. Its FIRST half is the repo's
#     root markdown, already covered by `*.md` above and left to it for
#     the same reason the provenance gate's subject is: that filename is
#     agent vocabulary and this file ships to the public repo verbatim.
#   - `.claude/tools/memory-gate.py`, `.claude/tools/hooks-gate.py`: the
#     memory and hooks gates' own subjects, named explicitly rather than
#     left to `**/*.py` to reach - that pattern's coverage of a
#     dot-directory was never established here, and even where a glob
#     above provably reaches its subject the file still names it
#     separately (see the harness/i18n case just below), so a dot-prefixed
#     path gets no less.
#   - the fifty gate scripts and this file. `crates/**` and `**/*.rs`
#     already carry the harness gate's whole subject, so it adds only its
#     own script to the list, and `**/*.py` already reaches
#     all four of `web/i18n/manual-check.py`, `web/i18n/site-check.py`,
#     `web/i18n/site-crosslink.py` and `web/i18n/nav-regen.py` - all four
#     named anyway, for the same reason `**/bench2*.sh` is kept below a
#     filter that subsumes it: removing one gate must never silently
#     unwire another.
#
# The doc, ref, overflow, bench2j, leg-warn, par2, provenance, iface,
# waiver, windows-portability, flatpak pin and harness gates are PRIVATE:
# `packaging/PUBLIC_MANIFEST` ships only lock-gate.py and size-gate.py of
# tools/. This file ships verbatim to the public repo with the rest of
# .github, and every job here is behind `if: github.repository !=
# 'nzbfast/nzbfast'`, so on the public repo the jobs are skipped rather
# than failing on a script that is not there - the same arrangement
# ci-private.yml relies on for the same twelve scripts: eleven of them in
# `check`, and the flatpak pin in its own job for the same reason it is
# its own job here. The FOUR i18n gates are the exceptions that change
# nothing. All four live in web/, and PUBLIC_MANIFEST ships `web` and
# `docs` wholesale, so their scripts are present publicly; the manual
# gate's subject ships too, and the two website gates' does NOT -
# `website/` is not in PUBLIC_MANIFEST, so on the public repo those
# scripts would have no pages to read. The nav staleness gate is both at
# once: its manual-switcher arm reads files that ship and its picker and
# hreflang arms read files that do not. No such case is reached, because
# all of them are behind the same `if:` as everything else here. The split this file and pr-check.yml keep is
# about which repo pays for a run, not about which scripts exist.
#
# The memory and hooks gates below are PRIVATE the same way, one level
# further out: `.claude/` is not a PUBLIC_MANIFEST entry AT ALL (the
# manifest names it only in a comment, to say why - "internal agent
# skills, name private hosts"), so on the public repo `.claude/tools/`
# does not exist, full stop, the same as most of tools/ above. The same
# `if:` skips both jobs there before either script is ever asked for.
# Checked, not assumed: `./packaging/leak-check.sh
# .github/workflows/size-gate.yml` is clean on this file with both paths
# in it, because a PATH is not the private vocabulary the scan looks for
# and the scripts' actual contents - which is where that vocabulary would
# live - never ship either way. Unlike every entry above, neither has a
# ci-private.yml counterpart: nothing has ever run these two selftests
# anywhere (`grep -rn "claude/tools" .github/workflows/` has exactly one
# hit, prose in leak-check.yml, not a step), so there is no existing
# `check` step to leave in place for redundancy - this file is the first
# and only place either one runs.
name: size-gate
on:
  push:
    paths:
      - 'crates/**'
      - 'vendor/**'
      # test-target-gate reads the root manifest's default-members list;
      # nothing else in this filter reaches the repo root.
      - 'Cargo.toml'
      - '**/*.rs'
      - 'website/**'
      - 'docs/MANUAL.html'
      - 'docs/i18n/MANUAL.*.html'
      - 'web/dashboard.html'
      - 'web/wall.html'
      - 'web/**'
      - 'tools/size-gate.py'
      - 'tools/lock-gate.py'
      - 'tools/waiver-gate.py'
      - 'tools/doc-gate.py'
      - 'tools/ref-gate.py'
      - 'tools/overflow-gate.py'
      - '**/bench2*.sh'
      - '**/mkbench2*.py'
      - 'tools/bench2j-gate.py'
      - 'tools/par2-gate.py'
      - '**/*.py'
      - '*.md'
      - '**/*.sh'
      - '**/*.zsh'
      # For `ps1-parse-gate`, and this one is LOAD-BEARING in the same way
      # `research/CLAIMS.jsonl` above is: until 16 Sep 2026 this filter
      # named no PowerShell file AT ALL - not `.ps1`, and the directories
      # the drivers live in are not `crates/`, `web/`, `website/` or
      # `packaging/` - so a push that touched ONLY a Windows measurement
      # driver ran not one gate in this workflow. That is how a
      # merge-resolved driver that does not parse reached main and stayed
      # there. Check the TRIGGER, not the job.
      - '**/*.ps1'
      - 'tools/ps1-parse-gate.py'
      - 'tools/iface-excess-gate.py'
      - 'tools/stall-mark-gate.py'
      - 'tools/rig-selftest-gate.py'
      # For `rig-selftest-paths`, which holds rig-selftest.yml's own
      # `paths:` filter to the files that selftest reads. The other two
      # inputs of that arm are already covered - the selftest itself by
      # `**/*.zsh` and the wrapper by `**/*.py` - but a .yml matches no
      # other pattern in this list, so without this line an edit that
      # narrowed the trigger would go unreported.
      - '.github/workflows/rig-selftest.yml'
      - 'tools/win-portability-gate.py'
      - 'packaging/flatpak/**'
      # For the `packaging-gates` job at the foot of this file. `**/*.sh`
      # above already catches most of what those twelve scripts read, but
      # not all of it: synology-compose-parity holds
      # `packaging/synology/docker-compose.yml` against its website twin,
      # and a .yml matches no pattern in this list.
      - 'packaging/**'
      - 'tools/flatpak-pin-gate.py'
      - 'tools/harness-gate.py'
      - 'tools/index-lock-gate.py'
      - 'tools/rate-format-gate.py'
      - 'tools/nav-destinations-gate.py'
      - 'tools/manual-section-number-gate.py'
      - 'web/ui-manualnav.html'
      - 'macapp/**'
      - 'tools/payload-id-gate.py'
      - 'tools/bg-token-gate.py'
      - 'tools/test-global-gate.py'
      - 'tools/wait-recheck-gate.py'
      - 'tools/wedge-gate.py'
      # For `wedge-gate`. Nothing else in this list matches it -
      # it is not .rs, .py, .sh or .md - so without this line the
      # gate would not fire on the one file it exists to hold.
      - '.config/nextest.toml'
      - 'tools/claude-clippy-gate.py'
      - 'tools/wco-drag-gate.py'
      - 'tools/event-arm-gate.py'
      - 'tools/host-config-gate.py'
      - 'tools/js-scope-gate.py'
      - 'tools/api-contract-gate.py'
      - 'tools/checkjs-gate.py'
      - 'tools/checkjs-prelude.d.ts'
      # For `checkjs-gate`, which resolves its compiler by path out of
      # node_modules and REFUSES a version other than the one pinned here.
      # Neither file matches any other pattern in this list, so without
      # these two lines a bump of the pin - the one edit that can change
      # every verdict the gate has ever given - would not fire it.
      - 'package.json'
      - 'package-lock.json'
      - 'tools/selftest-roster.py'
      # For `claims-drop-gate`, and this pair is LOAD-BEARING rather than
      # tidy. `research/CLAIMS.jsonl` matches NOTHING else in this list -
      # it is not .rs, .py, .sh, .zsh or a root-level .md, and
      # `research/**` is not here - so without it the gate would not fire
      # on the one file it exists to hold. Measured 31 Aug 2026 against
      # this filter: 2,379 of the 2,993 commits that have ever touched
      # the ledger (79%) match no pattern above, and FIVE of the SIX real
      # drop events in its history are among them. That is the
      # `nzbfast-ci-gate-never-runs` memory topic exactly - check the
      # TRIGGER, not the job.
      - 'research/CLAIMS.jsonl'
      # For `conformance table freshness`. The tables it reads are
      # `tools/conformance/expected/*.json` and the inventories are
      # `.txt`, and NEITHER matches another pattern in this list - so
      # without this line a push that hand-edited a committed table, or
      # deleted one, ran not one gate in this workflow. The row source
      # itself (`run.py`) is already caught by `**/*.py`, which is the
      # half the 21 Sep 2026 incident moved.
      - 'tools/conformance/**'
      - 'tools/conformance-table-freshness-gate.py'
      - 'tools/claims-drop-gate.py'
      - 'tools/workflow_scan.py'
      - 'tools/bench-report-selftests.py'
      - 'tools/shot-version-gate.py'
      - 'tools/screens-derived-gate.py'
      - 'web/screens/**'
      - 'tools/icons-derived-gate.py'
      - 'tools/cfg-safety-gate.py'
      - 'tools/cfg-symbol-gate.py'
      - 'tools/cpu-workers-gate.py'
      - 'tools/env-default-gate.py'
      - 'tools/env-inventory-gate.py'
      # For `ureq-unversioned-gate`, and the lock is the point: its subject
      # is the ureq version in `Cargo.lock`, which matches nothing else in
      # this list (it is not .rs, .py, .sh or a manifest), so a dependabot
      # bump that touches ONLY the lock - the exact commit the gate exists
      # to stop - would otherwise run not one gate in this workflow. It
      # also means a lock-only push now runs every job here; they are
      # seconds each, which is the argument this file already makes for
      # running on every branch.
      - 'Cargo.lock'
      - 'tools/ureq-unversioned-gate.py'
      # For `env-default-gate`, whose second subject is the Default column
      # of docs/ENVIRONMENT.md. `crates/**` and `**/*.rs` above cover the
      # code side; nothing in this list matches that one .md file, so
      # without this line a doc row edited on its own - which is exactly
      # how the 17 Sep 2026 drift would have been re-introduced - is a
      # change the gate never fires on.
      - 'docs/ENVIRONMENT.md'
      - 'tools/journeys-gate.py'
      # For `journeys-gate`, whose subject is the journeys/ suite's own
      # `.ts` files and playwright.config.ts - none of them .rs, .py, .sh
      # or root-level .md, so nothing else in this list matches them.
      - 'journeys/**'
      # For `cfg-safety-gate`, whose roster is DERIVED from the crate
      # manifests: which packages opt into `[workspace.lints]`, and which
      # carry its waiver. Nothing else in this list matches a Cargo.toml,
      # so without these two lines a deleted waiver or a crate leaving the
      # lint table is a change the gate never fires on.
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'vendor/**/Cargo.toml'
      - 'tools/detached-lock-gate.py'
      # For `detached-lock-gate`, whose subject is a tree the root
      # workspace does not name: `apps/parfast/` is a DETACHED cargo
      # workspace (decision D2a) with its own committed Cargo.lock, and
      # NOTHING in the list above matches any file in it - not its
      # manifests (the two Cargo.toml lines are anchored at `crates/`
      # and `vendor/`), not its lock (no pattern here matches a
      # Cargo.lock at all), not its `.rs` files. Without this line the
      # one gate that can see that tree would not fire on an edit made
      # INSIDE it. The three Cargo.toml lines above are what fires it on
      # the commit shape that actually caused the 12 Sep 2026 red - a
      # dependency added to `crates/parfast`, a crate this workspace
      # reaches by path.
      - 'apps/**'
      - 'web/icons/**'
      - 'packaging/icon/**'
      - 'tools/icon-downstream-gate.py'
      - 'packaging/qnap/**'
      - '.github/workflows/ci-private.yml'
      - 'web/ui-tokens.html'
      - 'web/site.webmanifest'
      - 'tools/i18n-value-shape-gate.py'
      - 'web/i18n/manual-check.py'
      - 'web/i18n/site-check.py'
      - 'web/i18n/site-crosslink.py'
      - 'web/i18n/nav-regen.py'
      - '.claude/tools/memory-gate.py'
      - '.claude/tools/hooks-gate.py'
      - '.claude/tools/checkout-drift-hook.py'
      - '.claude/tools/box-load-hook.py'
      - '.github/workflows/size-gate.yml'
      # For `selftest-exit-code-gate` below, whose subject is every gate
      # script in these two directories rather than any one of them: a
      # gate added or edited anywhere here changes that job's answer, and
      # the per-script list above cannot express that.
      - 'tools/**'
      - '.claude/tools/**'
      # For the `packaging-tests-roster` job below, whose subject is
      # every workflow in this directory: deleting a `run:` step from
      # any of them can leave a packaging gate wired to nothing, and
      # only the two named above fired this workflow before.
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
# CONSOLIDATED 31 Aug 2026 (research/DEV-TOOLCHAIN-REVIEW-2026-08-31.md):
# the gates below ran as ONE JOB EACH - 64 jobs by the end - which cost
# ~20-30 s of runner setup per job to run a one-second script, roughly
# thirty runner-minutes of pure setup on every push, at ~300 pushes a
# day. They are now grouped by family (rust, web, site-i18n, bench,
# roster), the shape `packaging-gates` and `tool-selftests` had already
# proven: a STEP still reports its own verdict and names itself when it
# fails, which is the property one-job-per-gate was really buying, and
# every step's `run:` line is still the bare script exactly as
# ci-private runs it, so the roster gates (selftest-roster,
# packaging-tests-roster, claude-clippy-gate) read the wiring unchanged
# and `tools/preflight.py` still derives its local roster from this
# file. Each old job's comment block rides above its step, unchanged.
#
# WHAT A GROUP MUST NOT DO is share state between steps: every step here
# is a read-only scan of the checkout, so ordering inside a group is
# free. Every grouped step carries `if: !cancelled()` so a red gate does
# NOT mask the verdicts of the gates grouped after it - a persistent red
# (a stale screenshot waiting on the mac rig, say) would otherwise
# silence half a family for days - while the job still reds if any step
# did. A gate that needs a DIFFERENT checkout keeps its own job:
# `claims-drop-gate` is the one such (fetch-depth 0 + blob:none, because
# its subject is commit-vs-parent history a depth-1 clone cannot see).
# A new gate joins the family group its subject belongs to, or earns its
# own job by needing something the group's checkout cannot give it.
#
# The ci-verdict roster step DELIBERATELY differs from ci-private:
# ci-private runs `--selftest && <the gate>`, this file runs the
# selftest ALONE, because the gate half is a statement about main's
# state and would red the next lane. That asymmetry is the design, not
# drift - do not "fix" it by appending the gate.
#
# Concurrency is on the JOB, not the workflow, which is ci-private.yml's
# hard-won lesson written down: a workflow-level group cancels every job
# in the run, so one slow leg kills the fast one. Same rule as `check`
# otherwise: superseding is what you want on a topic branch, and main
# must always reach a verdict rather than be cancelled by the next push.
jobs:
  rust-gates:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: rust-gates-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ---- size-gate -----------------------------------------------
      # Private repo only. The public repo has pr-check.yml; the cost
      # rationale for that split lives there.
      # `--selftest` first, same reason as the lock gate below: this
      # gate's `#[cfg(test)]` scope resolver ended a BRACE-LESS item only
      # on braces, so it ran on to the next `{` and scored the production
      # function after it as test code - exempt from the ceiling. That hid
      # `Daemon::enqueue` at 575 lines. The selftest pins the brace-less
      # shape so nobody simplifies the resolver back.
      - name: size gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/size-gate.py --selftest && tools/size-gate.py
      # ---- lock-gate -----------------------------------------------
      - name: lock gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/lock-gate.py --selftest && tools/lock-gate.py
      # ---- waiver-gate ---------------------------------------------
      # `--selftest` first: this gate exempts two shapes (`cfg_attr(..,
      # allow(..))` and `#[expect]`) by NOT matching them, so a slipped
      # anchor turns it into a gate that passes everything quietly. The
      # selftest asserts the exempt fixtures really are exempt and the
      # noted ones really are seen and judged justified.
      - name: lint waiver gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/waiver-gate.py --selftest && tools/waiver-gate.py
      # ---- doc-gate ------------------------------------------------
      - name: doc gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/doc-gate.py --selftest && tools/doc-gate.py
      # ---- ref-gate ------------------------------------------------
      - name: ref gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/ref-gate.py --selftest && tools/ref-gate.py
      # ---- overflow-gate -------------------------------------------
      - name: overflow gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/overflow-gate.py --selftest && tools/overflow-gate.py
      # ---- par2-gate -----------------------------------------------
      - name: par2 guard gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/par2-gate.py --selftest && tools/par2-gate.py
      # ---- win-portability-gate ------------------------------------
      # The one gate here whose subject is a platform nobody in this fleet
      # builds on: unix-only symbols in code Windows also compiles. Four
      # fix commits over two days of red windows-build / windows-clippy,
      # 21-23 Aug 2026. Since 16 Sep 2026 it also carries the RUNTIME half
      # of that subject - a `Command::new("<tool>")` naming a program
      # Windows does not have, reached through a cfg like
      # `not(target_os = "linux")` that silently means "and Windows too".
      # That arm's incident is the opposite shape and worse for it: the
      # code COMPILES on every target, both Windows CI jobs were green,
      # and the only thing red was a NIGHTLY test job (364d5b746).
      # `--selftest` first, same reason as the gates above - the exemption
      # logic is the whole gate, and a refactor that over-exempts still
      # prints a green line.
      - name: windows portability gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/win-portability-gate.py --selftest && tools/win-portability-gate.py
      # ---- harness-gate --------------------------------------------
      # `--selftest` first, and here it is the whole gate: the three needle
      # shapes are what separate this from a bare word grep that passes
      # everything (`.text(` has 2 hits in that tree where the word `text`
      # has 62). The selftest pins that a bare-word needle DOES match a
      # fixture the call-shaped one does not, so nobody widens it back.
      - name: harness dead-item gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/harness-gate.py --selftest && tools/harness-gate.py
      # ---- index-lock-gate -----------------------------------------
      # TODO 166: no HTTP worker may park unbounded on the index write
      # mutex. Here rather than only in ci-private because this one fires
      # on ordinary handler work - the sixteenth site was a Clear button -
      # and a new site should be red on the AUTHOR's push, not on the next
      # lane's. `--selftest` first: the gate's whole value is firing on a
      # NEW site, and a scanner that quietly stops matching reports a clean
      # tree forever, which is what nav-regen's dead picker arm did for
      # months.
      - name: index lock gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/index-lock-gate.py --selftest && tools/index-lock-gate.py
      # ---- payload-id-gate -----------------------------------------
      # `payload.contains(&nzo_id)` over a SAB response is not "is this job
      # in the queue": mode=queue's whyslow block names the LAST job's own
      # nzo_id, so it reads TRUE against an empty queue, and the ids are
      # minted off a counter so ...nzbfast1 is a strict prefix of
      # ...nzbfast10. 03e328222 swept all 54 sites BY HAND after a flake and
      # nothing checked the 55th. Here rather than only in ci-private
      # because these suites are hand-copied descendants of each other, so
      # the next one is a copy of whatever is next door - a new site should
      # be red on the AUTHOR's push. `--selftest` first: what this gate
      # protects against is a regex that has quietly stopped matching, and
      # that reads as a clean tree forever.
      - name: payload id gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/payload-id-gate.py --selftest && tools/payload-id-gate.py
      # ---- test-global-gate ----------------------------------------
      # A `#[test]` that writes a process-global and asserts on what it says
      # is reading its neighbours' writes whenever they land on different
      # threads of ONE process - and nextest cannot see that, because it
      # gives every test its own process. a676367fb measured 73 failures in
      # 200 runs on three tests that had been latent since they were
      # written. Here rather than only in ci-private because the modules
      # this covers serialize by CONVENTION: a new test copies the one above
      # it, and one that copies without the guard must be red on the
      # AUTHOR's push, not on whoever next runs the unit binary by hand.
      # `--selftest` first - what this protects against is an arm that has
      # quietly stopped matching, which reads as a clean tree forever.
      - name: test global gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/test-global-gate.py --selftest && tools/test-global-gate.py
      # ---- wait-recheck-gate ---------------------------------------
      # A state guard released inside a wait loop that then falls through
      # to an unbounded `Condvar::wait` without re-checking what ends the
      # wait: the abort lands in the released window, notifies an empty
      # condvar, and the reader parks forever. Measured 23 Aug 2026 as a
      # 4,666-second wedge of the zip nested-budget test - which nextest
      # RETRIED and reported as "6101 passed (1 flaky)", exit 0. Here
      # rather than only in ci-private for exactly that reason: this class
      # cannot be relied on to show up as a red test at all, so the push
      # that introduces it is the only moment anyone will look. A grep for
      # `drop(st)` would never have found it either - the incident's
      # release is the guard MOVED into a helper that hands a fresh one
      # back. `--selftest` first, and it is the gate: the arms are
      # regexes over a five-loop population, and one that quietly stops
      # matching reports a clean tree forever, which is what nav-regen's
      # dead picker arm did for months.
      - name: wait recheck gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/wait-recheck-gate.py --selftest && tools/wait-recheck-gate.py
      # ---- chunk-narrow-gate ---------------------------------------
      # A u64 byte span narrowed to `usize` BEFORE it is bounded by a
      # buffer - `(remaining as usize).min(buf.len())`. `usize` is 32 bits
      # on the shipped armv7-unknown-linux-musleabihf target, so a span of
      # exactly 4 GiB narrows to ZERO and the caller takes nothing: no
      # progress at all in a decrementing loop, and Ok(0) in a reader,
      # which every consumer in this tree reads as a clean end of file.
      # Not an alignment coincidence - the last short read takes
      # `remaining % 2^32` and lands the cursor exactly on the multiple,
      # so the trigger is any span of 4 GiB or more, every time.
      # Here rather than only in ci-private for the reason no test job can
      # cover it: on a 64-bit host the hazardous spelling is BIT-IDENTICAL
      # to the safe one, so nothing this fleet runs can see the class, and
      # the push that introduces it is the only moment anyone will look.
      # `adb3681e9` converted nineteen sites; this holds the twentieth.
      # `--selftest` first, and it is the gate: the arms are a hand-written
      # left-walk over 777 casts, and one that quietly stops matching
      # reports a clean tree forever, which is what nav-regen's dead picker
      # arm did for months. It needs no new `paths:` entry - `**/*.rs` and
      # `**/*.py` above already reach every file it reads.
      - name: chunk narrow gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/chunk-narrow-gate.py --selftest && tools/chunk-narrow-gate.py
      # ---- metrics-roster-gate -------------------------------------
      # Holds `crates/nzbfast-api/src/metrics.rs` (the `/metrics`
      # Prometheus renderer) to `crates/nzbfast/tests/daemon_metrics/
      # mod.rs` (the test that pins every family by name and TYPE):
      # a family declared but never pinned, a pin left behind by a
      # rename, or a gauge/counter flip on either side, are each a
      # REFUSAL. A metric name is a published contract - someone's
      # Grafana panel is written against the string - and none of that
      # has a symptom anywhere else in this repo: no compile error, no
      # clippy lint, the daemon still starts.
      # Here rather than relying on the test alone for the reason no
      # other job covers it: `daemon_metrics` is a module of the `daemon`
      # integration binary, one of the eight heavy-tests targets this
      # repo's own CI sweep line excludes by name
      # (`not binary(daemon)`), gated behind the `heavy-tests` feature so
      # an ordinary `cargo test` never compiles it. A rename would sit
      # unnoticed until someone runs that suite by hand or nightly's
      # `long-suites` gets to it. This is build-free and runs on every
      # branch push, so the same rename is caught on the author's own
      # push instead.
      # `--selftest` first, and it is the gate rather than the house
      # habit: 20 cases, each pinned by the message it must name, plus
      # three mutations driven against the REAL files (a renamed family,
      # a type flip, a deleted pin) that all redden. It needs no new
      # `paths:` entry - `**/*.rs` and `**/*.py` above already reach
      # every file it reads.
      - name: metrics roster gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/metrics-roster-gate.py --selftest && tools/metrics-roster-gate.py
      # ---- cpu-workers-gate ----------------------------------------
      # A CPU worker pool sized from `available_parallelism` rather than
      # from `nzbkit::mem::cpu_workers`, which is the one place an outside
      # caller can cap one (`NZBFAST_CPU_WORKERS`, TODO 281 AN4).
      # Here rather than only in ci-private for the reason no test job can
      # cover it: the uncapped spelling is CORRECT on every box this fleet
      # owns, and the only symptom is a phone running hot on one pool out
      # of sixteen - and nothing here compiles for a phone, let alone
      # measures one. These pools are hand-copied siblings, so the next one
      # is a copy of one of them: fine if it copies the helper, silently
      # wrong if it copies the standard library call.
      # `--selftest` first, and it is the gate rather than the house habit:
      # a scanner that has quietly stopped matching reports a clean tree
      # forever, which is what nav-regen's dead picker arm did for months.
      # It needs no new `paths:` entry beyond its own file - `**/*.rs`
      # above already reaches every source it reads.
      - name: cpu workers gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/cpu-workers-gate.py --selftest && tools/cpu-workers-gate.py
      # ---- env-default-gate ----------------------------------------
      # docs/ENVIRONMENT.md's Default column against the default the
      # code actually uses, for the 49 rows where that column states a
      # number. It ships publicly, so a wrong row is a wrong promise to
      # an operator, and the one it found on the day it landed
      # (NZBFAST_INDEX_GATE_WAIT_SECS, 60 documented against a shipped
      # 5) had been live for a month with every gate green. Booleans
      # and the inventory gap are out of scope on purpose - the
      # script's header says why, at length, and both decisions were
      # measured rather than assumed.
      - name: env default gate
        if: ${{ !cancelled() }}
        run: tools/env-default-gate.py --selftest && tools/env-default-gate.py
      # ---- env-inventory-gate --------------------------------------
      # The same file's ROSTER against the code's, which is the other
      # half of what docs/ENVIRONMENT.md promises: its header says it
      # lists every `NZBFAST_*` name read under `crates/*/src`, and on
      # 17 Sep 2026 it was missing 57 of them - including a user-facing
      # kill switch for the link probe. A separate step and a separate
      # refusal on purpose: the fix is to write a row, not to re-tense a
      # number, and a gate whose red means two things is one people stop
      # reading. Its two arms read DIFFERENT populations, and the
      # script's header says why at length.
      - name: env inventory gate
        if: ${{ !cancelled() }}
        run: tools/env-inventory-gate.py --selftest && tools/env-inventory-gate.py
      # ---- ureq-unversioned-gate -----------------------------------
      # Two places restate ureq's private rustls transport and four SSRF
      # resolvers ride `ureq::unversioned::resolver`, a module ureq
      # explicitly does not hold to semver. A bump that still compiles can
      # leave that code out of step with the library it was copied from
      # with every other job green. This refuses a `Cargo.lock` ureq that
      # is not the version the code was last re-read against, and a new
      # file that starts using `unversioned::` without being listed. The
      # fix rule is in the script's header - never bump the pin without
      # the re-read. Build-free, well under a second.
      - name: ureq unversioned gate
        if: ${{ !cancelled() }}
        run: tools/ureq-unversioned-gate.py --selftest && tools/ureq-unversioned-gate.py
      # ---- host-config-gate ----------------------------------------
      # A test that hands the daemon a config path it never wrote.
      # `Config::load` answers a MISSING file by finding a SABnzbd
      # install's ini under `$HOME`, this fleet has SABnzbd from the
      # competitive benchmarking and a runner does not, so the same test
      # gives opposite answers decided by the box. It went red on main
      # twice in two days on two different doors (f63b6a3af, e0f94fc60),
      # the second time taking linux-tests, unit-one-process and
      # windows-unit down for ninety minutes, and it is INVISIBLE on every
      # machine here - which is why this belongs on the author's own push
      # rather than only in ci-private. `--selftest` first and it is the
      # gate rather than the habit: the arms are a hand-written lexer over
      # a 3,100-function test tree, and one that quietly stops matching
      # reports a clean tree forever - nav-regen's picker arm did exactly
      # that for months. It prints how many test functions, doors and
      # consumers it REACHED, so an inert scan shows a zero, not a green.
      - name: host config gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/host-config-gate.py --selftest && tools/host-config-gate.py
      # ---- cfg-safety-gate -----------------------------------------
      # An `unsafe` block whose only SAFETY note sits above a
      # cfg-EXCLUSIVE sibling arm. On the platform that arm is gated for,
      # the sibling AND its comment are both gone and
      # `undocumented_unsafe_blocks` fires on the block below - and every
      # clippy run on this fleet is host-native, where the LINUX arm is
      # the one that vanishes. `cargo clippy --target
      # x86_64-unknown-linux-gnu` does not work from the dev Mac at all
      # (md5-asm and libsqlite3-sys want a C cross-toolchain and no
      # `brew install` supplies one), so unlike the Windows case in
      # CONTRIBUTING.md's SIXTEENTH entry there is no local run that sees it.
      # Measured: main went red on this FIVE times in eighty-four minutes
      # on 26 Aug 2026, the middle three being the SAME defect fixed by
      # three lanes independently inside ten minutes - because a red on
      # main is a broadcast, so every lane that looks races every other
      # lane that looks. Belongs on the author's own push for exactly
      # that reason. `--selftest` first and it is the gate rather than the
      # habit: the arms are a hand-written Rust lexer plus a two-level
      # walk-back, and one that quietly stops matching reports a clean
      # tree forever - nav-regen's picker arm did that for months. It
      # prints how many files, unsafe sites, cfg attributes and statement
      # lifts it REACHED, so an inert scan shows a zero, not a green. It
      # reads the crate MANIFESTS as well as the sources, to derive its
      # roster and to see a waiver, and `**/*.rs` does not reach those -
      # hence the two `Cargo.toml` lines in the filter above. Without
      # them a deleted waiver, or a crate dropping out of the lint table,
      # is a change this job never runs on.
      - name: cfg safety gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/cfg-safety-gate.py --selftest && tools/cfg-safety-gate.py
      # ---- cfg-symbol-gate -----------------------------------------
      # A reference to an item defined under one `#[cfg(target_os = ..)]`
      # from a site that does not share it. It compiles perfectly on the
      # box it was written on and is `E0425` on every other target, so
      # every host-native gate on this fleet is green on a tree that
      # reddens four CI jobs. That is what `d49f5ab32` did on 28 Aug 2026
      # with `4 * super::TRASH_DEADLINE` inside a `#[cfg(test)]` fn -
      # `cfg(test)` compiles on every target, which is why it is not an
      # exemption here. Neither neighbour covers it: `cfg-safety-gate` is
      # about the SAFETY comment above a cfg arm, and
      # `win-portability-gate` only scans `libc::`, `std::os::unix` and
      # spawned program names - none of which is a cfg-exclusive item
      # reference - so it was green on the tree that was red.
      # Belongs on the AUTHOR's own push rather than on main, and the
      # reason is coordination rather than compile time: that one defect
      # minted FIVE separate red claims across lanes and two were still
      # open hours later, because a red on main is a broadcast and every
      # lane that looks races every other lane that looks.
      # `--selftest` first and it is the gate rather than the habit - the
      # arms are a hand-written Rust lexer, a per-target three-valued cfg
      # evaluator and a four-arm name resolver, and one that quietly
      # stops matching reports a clean tree forever. It prints how many
      # files, item definitions, cfg-exclusive definitions, candidate
      # references and RESOLVED references it reached and REFUSES below a
      # floor on each, so an inert scan shows a zero and not a green.
      - name: cfg symbol gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/cfg-symbol-gate.py --selftest && tools/cfg-symbol-gate.py
      # ---- ffi-cutout-gate -----------------------------------------
      # `default-features = false` on the `nzbfast` dependency in
      # crates/nzbfast-ffi/Cargo.toml is the WHOLE mechanism that keeps
      # the iOS store staticlib's ~10.5 MB of dashboard pages out (TODO
      # 281 IO3b). Cargo resolves features PER INVOCATION, so it holds
      # only while that crate is built ALONE - a `--workspace` build, or
      # one naming `-p nzbfast` beside it, unifies with the bin crate's
      # `default` and hands the pages back with nothing to say so.
      # packaging/ios/build-ffi.sh's cargo line is the other half of the
      # mechanism, `-p nzbfast-ffi` alone. Both were guarded by nothing
      # but a comment. Two arms: the manifest (either TOML shape for the
      # dependency, refusing `true` or an omitted key), and every cargo
      # line in the build script naming nzbfast-ffi (refusing
      # `--workspace` or a second `-p`, checked through a simple literal
      # shell variable too). `--features nzbfast/dashboard` in
      # build-harness.sh and build-apk.sh's WebView kit are out of scope
      # on purpose - neither is a release path, and this gate never
      # opens either file. Build-free, well under a second, no new
      # `paths:` entry - `crates/**/Cargo.toml` and `packaging/**` above
      # are already triggers.
      - name: ios ffi dashboard compile-out gate
        # Run even when an earlier gate in this group failed - a
        # persistent red in one gate must not mask the verdicts of
        # the gates grouped after it. The job still reds if ANY
        # step did.
        if: ${{ !cancelled() }}
        run: tools/ffi-cutout-gate.py --selftest && tools/ffi-cutout-gate.py
      # ---- ceiling-claim-gate --------------------------------------
      # A comment that says a function or file IS at a size-gate ceiling,
      # about one that is not. A §106 split leaves the note behind: a
      # hoisted helper explains why it is a free function rather than
      # inline, and the reason is nearly always "its caller is at the size
      # gate's ceiling, so there is nowhere to put another line". That
      # sentence is PRESENT TENSE and is false the moment the caller is
      # split, which is the one event guaranteed to follow it - the commit
      # that writes it is usually the commit that falsifies it. SIX were
      # written by one split commit on 31 Aug 2026 and already false when
      # it landed (`try_mapped_repair` 469 -> 316, `run_set_repair`
      # 464 -> 335, `fetch_and_repair` 475 -> 379), and two more were
      # fixed by hand inside `a2529f9ee`. Nothing checked any of them.
      # THE COST is not a typo. The note is the input to a decision: a
      # lane reading "this function is at the ceiling" prices a hoist it
      # may not need. And the opposite failure is worse - a lane checks,
      # finds the claim false, and DELETES the comment, taking the
      # recorded reason for the factoring with it. So FIX A HIT BY
      # CORRECTING THE TENSE AND THE NUMBER, never by deleting the note.
      # TENSE IS THE WHOLE DESIGN. A PAST-tense claim is HISTORY, was true
      # when written, and must stay green forever; a gate that reddened on
      # those would demand the deletion of the very notes it defends. Only
      # present-tense claims are judged - 17 of 59 on the swept tree.
      # THE BAR IS 5% OF THE TARGET'S OWN LIMIT (`file_limit`/`fn_limit`,
      # so a BASELINED target is judged against its baseline), derived from
      # the tree rather than picked: it reproduces both hand-made verdicts
      # in the handoff that commissioned this (`settle_with_set` at 472 of
      # 500 is 28 free, over a 25-line bar), every numeric present claim
      # that reads as true sits between 0.5% and 4.6% of its limit, and
      # every phrasing lanes HEDGE sits at 4.8% or worse.
      # THE MEASUREMENT IS SIZE-GATE'S OWN - `strip_noise` and `functions`
