      #   root and the nzbfast lib root stop being COMPILED here; both
      #   are now compiled and `-D warnings` linted by the clippy step
      #   above, which gained `-p nzbfast-ffi` in the same commit and is
      #   strictly stricter than this step ever was (that step's comment
      #   has the probe). The two ffi integration tests (`cycle`,
      #   `reclaim`, 24.4 s and 32.5 s - the two slowest tests in the
      #   whole non-heavy set, and by a distance now that the rars
      #   override has taken the nzbkit fixtures down) move to
      #   nightly.yml's `long-suites`,
      #   beside the seven heavy targets, for the same reason those are
      #   there. nightly's armv7-cross job still runs them under qemu.
      #
      #   No `--features heavy-tests`, so cargo never BUILDS the seven
      #   heavy targets (TODO 116b) and they never enter the archive.
      #   Verified by listing the archive's binaries: none of the seven
      #   is present. Auto-enrolment survives - a target added tomorrow
