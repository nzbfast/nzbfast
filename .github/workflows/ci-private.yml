      # readers carry it as a comment on the line where they build their
      # dict (8550b934). Nothing enforced it for a SEVENTH, and these
      # scripts are standalone copy-paste descendants of each other with
      # three different regex spellings of the same construct, so the next
      # one will be a copy of one of the six: fine if it copies the
      # comment, silently wrong if it does not, and the field it drops is
      # the one that exists to stop a shaped gbytes being published.
