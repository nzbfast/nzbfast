      #
      # DEFAULT MEMBERS, no exclusions and no `--features`, and every
      # part of that is deliberate:
      #
      #   NO PACKAGE SELECTION AT ALL is the direction that matters - a
      #   test target added tomorrow is archived and run automatically,
      #   and the only names anyone maintains are the few that must NOT
      #   be. It replaced three steps naming `-p nzbkit --lib`, `-p
      #   nzbfast --bin nzbfast` and two integration targets; everything
      #   else was reachable only through pr-check.yml, which triggers on
      #   `pull_request` while this repo pushes straight to main. 27
      #   integration targets plus vendor/rars (728 tests, the RAR
      #   engine, under active work), vendor/tiny_http and nzbtray were
      #   covered by a workflow nobody fires. That is how a conn_tuner
