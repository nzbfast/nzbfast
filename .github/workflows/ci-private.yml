      #   this step was written until 23 Aug 2026. `--workspace`
      #   OVERRIDES the `default-members` line in the root Cargo.toml,
      #   and that line exists for one reason, which its own comment
      #   states: it holds crates/nzbfast-ffi out, because that crate
      #   turns nzbfast's `ffi` feature on and feature unification then
      #   compiles the whole nzbfast module tree a SECOND time, as the
      #   lib target. So the manifest documented a protection this step
      #   was quietly cancelling. Auto-enrolment is untouched by the fix:
      #   the only package default-members drops is the one the manifest
      #   already names, and a crate added tomorrow is a default member
      #   unless somebody edits that line.
      #
      #   What the duplicate bought, measured 23 Aug 2026 on this tree:
      #   NOTHING on the test side. `feature = "ffi"` has exactly one
      #   site in the workspace (`crates/nzbfast/src/lib.rs:21`), so the
      #   lib root and the bin root compile byte-identical module files
      #   under a byte-identical feature set for every dependency -
      #   confirmed by adding `--workspace` to a warm default-members
      #   target, which recompiles nzbfast and nzbfast-ffi and NOTHING
      #   else. The lib suite's 1,774 tests were a strict SUBSET of the
      #   bin suite's 1,776 (the two extra are the CLI-arg tests a lib
      #   root has no CLI for), 1,774 of 1,774 shared, zero unique.
      #
      #   What it cost, same measurement, cold, 18-core M-series box,
      #   re-taken on the tree this commit lands on (so it is after the
      #   rars opt-level override in Cargo.toml, which moves the test
      #   legs a long way but not the flag's delta):
      #
      #     archive build     50.9 s -> 64.7 s wall, 381 s -> 455 s CPU
      #     archive artifact   159 MB -> 244 MB   (x5 downloads a push)
      #     cached target/    3.30 GB -> 5.53 GB
      #     full nextest run   4,701 -> 6,464 tests, 75.8 s -> 90.9 s
      #
