        # whose Cargo.lock was never staged, so the gate goes green
        # against a dependency graph that exists on nobody else's disk.
        # Worse here than elsewhere, because the cache key above hashes
        # the COMMITTED Cargo.lock (tools/dep-cache-key.py) - artifacts
        # built from the re-resolution would be banked under the stale
        # lock's key and handed to every later run. release.yml,
        # nightly.yml, pr-check.yml, coverage.yml, fuzz-smoke.yml and
        # provenance-release.yml all pass it already; this file was the
        # hole, which is how a lock mismatch reached the release
        # workflow instead of the push that created it.
