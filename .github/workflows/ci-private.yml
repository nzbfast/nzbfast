  i18n-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-i18n-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      # `fetch-depth` stays at the default: the gate's first half is a
      # `git diff` of the working tree against HEAD, which needs the
      # checkout to be a git repository but never needs its history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TODO 201 (Codex review finding L11). `web/i18n/check.py` was a
      # hand-run script and nothing turned red when it regressed, which
      # is exactly how it regressed: v1.2.1 SHIPPED with all 27
      # catalogues each missing 39-51 keys (the diag.*, rep.*,
      # hist.divnudge.*, queue.act.* and set.srv.samebb.* families), so
      # every non-English dashboard rendered those sentences in English.
      # A read-only review found it weeks after the keys landed.
      #
      # Two halves, because the debt arrives two ways. extract.js
      # regenerates the English reference from dashboard.html/wall.html:
      # if it MOVES, somebody added a UI string without re-running it and
      # the reference has been quietly stale ever since - the keys are
      # not "missing" from any catalogue because nothing knows they
      # exist. check.py then holds the 27 catalogues to that reference:
      # key parity, per-locale plural categories, placeholder and markup
      # parity, and the house copy bans. Both halves are the standing
      # rule already written in web/i18n/README.md; this is the rule
      # enforced instead of remembered. Cheap: no build, no toolchain,
      # about a second. Since 22 Aug 2026 check.py also holds KEY ORDER
      # (localeCompare for the catalogues, code-point for the reference,
      # reproduced in python - see the comment at the top of check.py):
      # db463185d appended keys unsorted to all 27 files and stayed green
      # for a day, until the next proper re-serialisation moved them and
      # dumped 54 lines of churn into an unrelated diff. And since 23
      # Aug 2026 it holds PARSED-INPUT PLACEHOLDERS: a placeholder on an
      # input the daemon parses is a worked example of a grammar, and 20
      # of the 27 catalogues had localized `sched.days.ph` into day
      # tokens `parse_days` rejects, so on those locales the scheduler's
      # days box could not be filled in from the hint the UI gives (TODO
      # 259). Two halves there too: MUST_STAY_ENGLISH pins keys by hand,
      # and a shape scan finds the ones nobody thought to pin - it reads
      # dashboard.html/wall.html to learn which keys are bound to a
      # placeholder, so this step must keep running from the repo root.
      # `--selftest` first, the convention every other gate follows.
      - name: i18n catalogue gate
        run: |
          node web/i18n/extract.js
          git diff --exit-code web/i18n/en.reference.json || {
            echo "::error::en.reference.json is stale: a UI string landed without 'node web/i18n/extract.js'. Regenerate it and translate the new keys into all 27 catalogues."
            exit 1
          }
          python3 web/i18n/check.py --selftest && python3 web/i18n/check.py
      # The other half of the same debt, and the same argument one file
      # over. check.py above holds the 27 dashboard catalogues; this holds
      # the 15 translated MANUALS to docs/MANUAL.html - an 18-tag census
      # whole-file and per section, identical id sets, byte-identical
      # `<code>`. TODO 201 wired check.py here on the reasoning that a
      # hand-run script is one nobody runs, and then left its sibling
      # hand-run: no CI job has ever executed manual-check.py. It went the
      # predicted way. On 23 Aug 2026 it was red on ALL 15 locales with
      # one identical drift - docs/MANUAL.html's lifecycle-events
      # sentence had gained four `<code>` refs (job.retried,
      # job.delete_kept, watch.picked, watchlist.upgraded) and no
      # translation followed - and nothing turned red when that landed;
      # somebody ran the script by hand and found it (fixed in
      # cf138f226). A SEPARATE step rather than another line appended to
      # the one above, so a manual drift and a catalogue drift are told
      # apart in the log without reading it - the reader needs to know
      # which of docs/ and web/ to go and translate. Same job, because
      # both are the same second of runner time and the same failure to
      # look. Also its own job in size-gate.yml, which is where the
      # verdict actually reaches the author who caused it: this file
      # triggers on push to main alone.
      - name: manual parity gate
        run: python3 web/i18n/manual-check.py --selftest && python3 web/i18n/manual-check.py
      # The third of the three, and the one with the most riding on it.
      # check.py holds the 27 dashboard catalogues, manual-check.py holds
      # the 15 translated manuals, and this holds the 150 localized SITE
      # pages to their English bases - id sets, a tag census,
      # byte-identical `<code>`, lang attribute, picker and hreflang. Same
      # story as the step above: it was the last script in web/i18n/ that
      # no CI job ran, `grep -rn site-check .github/workflows/` had no
      # hits, and the argument TODO 201 made for check.py had never been
      # carried across to it either.
      #
      # What makes this one different from its two siblings is its second
      # dimension. Those pages are PUBLISHED, and this script also greps
      # the ones that cite a measurement for names that must not appear in
      # them, so a hit here is a disclosure rather than a typo - and a
      # disclosure that reverting the commit does not take back. That arm
      # fires on nothing today, which is exactly what a broken one looks
      # like, so `--selftest` is doing real work in the line below rather
      # than following the house convention: it drives every ban entry at
      # a sample of its own and pins both word anchors. A third SEPARATE
      # step for the same reason the second one is separate - three kinds
      # of drift, told apart in the log without reading it, because the
      # reader needs to know whether to go and translate web/, docs/ or
      # website/. Also its own job in size-gate.yml, which is where the
      # verdict reaches the author who caused it: this file triggers on
      # push to main alone.
      - name: site parity gate
        run: python3 web/i18n/site-check.py --selftest && python3 web/i18n/site-check.py
      # A fourth step, and a different question from the three above.
      # Those three ask whether translated content matches its English
      # source. This one asks whether GENERATED content matches its
      # generator: site-crosslink.py rewrites the cross-page links on the
      # 150 localized pages so a visitor stays in-language, its output
      # is committed, and nothing verified the two still agree. That is
      # the bench2j gate's story - a generated file whose parent moved -
      # and that gate exists because its subject rotted twice, once in a
      # direction that made the documented remedy destructive. Here the
      # miniature version is a hand-patched href: the next regeneration
      # undoes it and says nothing. `--check` writes nothing and exits 1
      # on the first page that differs.
      #
      # THE `--selftest` IN FRONT WAS ADDED 23 Aug 2026, and this comment
      # used to argue at length that it was deliberately absent: the
      # script is run against its own committed output, a fixed point
      # with no judgement to get wrong. That is true of the OUTPUT and
      # incomplete about the PATTERN. A regex that matches nothing
      # rewrites nothing, so the file equals itself, `--check` reports
      # every page current, and the trailing leak scan - which shares one
      # pattern with the rewrite - finds nothing to report either.
      # Measured that day: breaking that pattern's `href="` literal left
      # BOTH arms dead and this step still green at exit 0. The healthy
      # state here is genuinely zero matches, on all 150 pages, so
      # nothing about the real tree can tell a converged site from a dead
      # pattern; the selftest settles it from the other end, driving the
      # transform and the leak scan over synthetic pages with known
      # English hrefs. Its sibling generator web/i18n/nav-regen.py has
      # the same exposure and a different fix - every arm there replaces
      # a block that is always present, so it counts substitutions - and
      # is gated in the step below.
      - name: cross-link staleness gate
        run: python3 web/i18n/site-crosslink.py --selftest && python3 web/i18n/site-crosslink.py --check
      # A fifth step, and the OTHER half of the question the fourth asks.
      # web/i18n/ holds two generators beside its three parity checkers,
      # and this is the second one: nav-regen.py writes the language
      # picker and the hreflang alternates on the 64 pages of the four
      # core bases, and the switcher on the 16 manual pages. It grew
      # `--check` on the same day as the step above and was deliberately
      # left unwired for a day, because measuring it found the rot it was
      # meant to catch. One of its three arms was DEAD: `web_picker` wrote
      # a `<span class="langsw">` of uppercase locale codes and the regex
      # that placed it looked for one, while every website page has
      # carried a `<select class="langsw">` of native language names with
      # a `selected` option for some time. It had matched nothing, on all
      # 64 pages, for however long the markup has been a select, so wiring
      # it then would have reported every picker current while checking no
      # picker at all - the rubber stamp this gate family keeps growing to
      # refuse. `web_picker(base, lang)` now emits the select, `selected`
      # and all, byte-identical to what those pages carry, and a census of
      # all 160 pickers on the site found that no page had actually
      # drifted while the arm was inert - luck, not a reason, since
      # nothing had checked. A SEPARATE step for the same reason the three
      # above are separate: a picker drift, a cross-link drift and a
      # translation drift send the reader to different files. No
      # `--selftest` in front, deliberately and for the same reason as the
      # step above - the script is run against its own committed output, a
      # fixed point with no judgement to get wrong. Also its own job in
      # size-gate.yml, which is where the verdict reaches the author who
      # caused it: this file triggers on push to main alone.
      - name: nav staleness gate
        run: python3 web/i18n/nav-regen.py --check
  deny:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-deny-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-deny shells out to `cargo metadata`, so this job needs a
      # toolchain even though it compiles nothing.
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Advisory / license / source gate against deny.toml. Prebuilt
      # binary pinned by tag and checked by SHA256 rather than trusted
      # (same pattern as the par2 fetch in pr-check.yml); a cargo
      # install would cost minutes of compile per push. nightly.yml runs
      # the same check on a schedule to catch advisories published
      # against an unchanged tree.
      - name: install cargo-deny
        run: |
          ver="0.20.2"
          # Same retry rationale as `check`'s cargo-nextest install;
          # this is the step that lost run 31619042403 to `curl: (56) Connection
          # died`.
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 -o cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${ver}/cargo-deny-${ver}-x86_64-unknown-linux-musl.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz
          sudo mv "cargo-deny-${ver}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/
          rm -rf cargo-deny.tar.gz "cargo-deny-${ver}-x86_64-unknown-linux-musl"
      - name: cargo deny
        # The gate this job lost for four days in the 7-10 Aug outage,
        # for being last in `check`. It has its own job now because
        # that is the same failure wearing different clothes: a gate at
        # the end of a job that does not finish is also no verdict.
        #
        # --locked, same reason as clippy and the archive over in
        # `check`: an advisory
        # and license verdict against a graph cargo re-resolved on the
        # fly does not describe what we ship. Note the POSITION - it
        # goes before the subcommand. cargo-deny puts its manifest flags
        # on the top-level parser and does not mark them global, so
        # `cargo deny check --locked` is an unknown-argument error and
        # would redden this step outright. Verified against the 0.20.2
        # tag pinned in the install step above.
        run: cargo deny --locked check
  # -------------------------------------------------------------------
  # THE LAST KNOWN VERDICT, PER JOB. Not a gate on this commit - a gate
  # on the branch, recomputed on every push.
  #
  # Everything above `env:` says the cancellation regime on main is
  # arithmetic and is staying. Re-measured 23 Aug 2026 over 60
  # consecutive runs on main (16:52-19:40Z): windows-build reached a
  # verdict 10 times, ~17% of commits, and all 10 were green on all four
  # windows-unit shards. A verdict landed every 13-20 min, median ~15,
  # which is exactly the leg's own duration - the queue is at its
  # theoretical ceiling and there is nothing to tune.
  #
  # What that regime costs is not coverage, it is VISIBILITY. A red run
  # is buried under about ten cancelled runs inside fifteen minutes, and
  # a cancelled run does not read as a red run - it reads as nothing at
  # all, so main's tip shows grey rather than red. Three times now that
  # has cost real work: on 21 Aug windows-build was red on main long
  # enough for a fresh lane to branch off the red (1af79f81b); on 23 Aug
  # windows-clippy and windows-arm64 were red for about an hour
  # (ca523cf0e 18:28Z to the fix 804be72b9 at ~19:25Z), found only
  # because a human went looking; and on 24 Aug the Linux `check` job
  # was red on the SAME two private_interfaces errors as windows-clippy,
  # minutes EARLIER, and was never reported at all.
  #
  # THAT THIRD ONE IS WHY THIS JOB IS NOT WINDOWS-ONLY, which it was
  # until 24 Aug 2026. Both clippy steps in this file pass
  # `-p nzbfast-ffi`, and that package is what makes the lint reachable
  # at all, so both jobs failed - runs 32762315942 (check) and
  # 32763803428 (windows-clippy). Only the second was ever reported,
  # because only the second had a verdict tool, so a target-independent
  # lint was written up as a Windows problem and chased through a
  # Windows-only local recipe. Nothing in the argument above is
  # Windows-specific; the roster was only ever where the tool started.
  #
  # `suites-ran` at the bottom of this file cannot report any of them.
  # It fires only on parent `failure` AND child `skipped`, deliberately,
  # because `cancelled -> skipped` was 328 of 400 job rows and firing on
  # it would red every superseded push. It does not look at
  # windows-clippy or windows-arm64 at all: those two are LEAF jobs, no
  # `needs:` anywhere names them, so nothing aggregates them. And what it
  # does say about `check` is per-RUN rather than sticky - the next push
  # clears it whatever the code did - so it never puts a red on the tip,
  # which is the thing a lane about to branch is reading.
  #
  # So this job asks a different question. For every job in the script's
  # roster - the four Windows ones, plus `check`, its matrix, and the
  # Linux gate jobs - it walks main's runs newest-first and reports the
  # first REAL conclusion it finds, stepping over `cancelled` and
  # `skipped` because those carry no verdict about the code, and it is
  # red while any of those answers is a failure. The roster is held to
  # this file rather than to memory: a job here that the script neither
  # judges nor excuses is a refusal naming it, which is what stops the
  # Linux half going unwatched a second time.
  #
  # THE PROPERTY THAT MAKES IT WORK IS STICKINESS. The answer is about
  # main, not about the run computing it, so while Windows is red EVERY
  # later push is red too, and the red is on the tip rather than ten
  # pushes back. It also clears itself: the first push after Windows
  # goes green reports green, with no human action and nothing to reset.
  #
  # WHERE THE RED ACTUALLY SHOWS, and it is not where you would guess.
  # The COMMIT STATUS ROLLUP on main's tip goes FAILURE - that is the
  # icon on the repo home, on the commits list and beside the sha, and
  # it is what a lane about to branch is looking at. The WORKFLOW RUN
  # ROW in the Actions list does NOT: GitHub gives `cancelled`
  # precedence over `failure` at run level, so a run holding a red
  # ci-verdict and any cancelled job at all still reports
  # `cancelled`, and on this main there is nearly always a cancelled
  # job. Verified 23 Aug 2026 on run 32655056916 (4abf45ec): jobs
  # 13 success / 1 failure / 2 cancelled / 4 skipped, run conclusion
  # `cancelled`, commit rollup FAILURE. The corollary is a trap worth
  # knowing: filtering the Actions list to failed runs HIDES these.
  # Read the commit status, or read the job row inside the run.
  #
  # IT DOES NOT WEAKEN `suites-ran` AND IT NEVER FIRES ON `cancelled`.
  # Those were the two ways to get this wrong and both are pinned by
  # `--selftest` cases 1 and 2.
  #
  # WHY HERE AND NOT size-gate.yml. That file exists to give BRANCH
  # pushes a verdict, and the 21 Aug incident was a lane branching off a
  # red main, so it is a real candidate. Against it: the subject of this
  # check is main's state, which is this file's subject and nobody
  # else's, and a red here turns main's TIP red, which is what the two
  # incidents above actually needed. Putting it on every branch push
  # would instead red the run of whichever lane pushed next, for
  # something they did not cause and usually cannot fix, which is how a
  # gate gets muted. The branching lane is served by running
  # `tools/ci-verdict.py` by hand, which is the same script this step
  # runs and needs no checkout of anything else.
  #
  # COST: one API call for the run list plus one per run walked, six
  # wide, stopping as soon as every rostered job has an answer. A run of
  # docs-only pushes skips the build jobs, so the walk goes deeper then;
  # it is still bounded by --limit. Measured on
  # the runner in the first run that had it (32665973254, b1532aa66,
  # 23 Aug 2026): 6 s for the step, selftest included, and 10 s for the
  # whole job. That is in the same band as `i18n-gate` above and well
  # inside the ~2.5 min push cadence this section names as the budget,
  # so it reaches a verdict on essentially every push - which is what
  # stickiness needs to be worth anything.
  # -------------------------------------------------------------------
  ci-verdict:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job in this file that reads the Actions API. `contents:
    # read` at the workflow level does not cover it, and a job-level
    # block REPLACES the workflow one rather than adding to it, so
    # `contents: read` is repeated here on purpose.
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ci-verdict-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `--selftest` first, the house convention, and here it is the
      # whole gate rather than decoration. This script's entire value is
      # one judgement - which rows carry a verdict and which are weather
      # - and BOTH ways of getting it wrong are invisible. Count
      # `cancelled` as a verdict and it reports a red main permanently;
      # stop at the first row it sees and it reports a green one forever.
      # Neither looks like a broken script, and neither is a roster that
      # has quietly stopped covering a job - that one reports the job it
      # forgot as green forever. The thirty frozen-JSON cases drive every
      # direction, plus both matrix folds, plus the roster held against
      # this file, plus the failing-STEP extraction - including the trap
      # that a GREEN job can carry a `failure` step, because
      # windows-build, windows-clippy and windows-arm64 each open with a
      # `continue-on-error` Defender-exclusion step - plus the tip-skew
      # and queue-stall arms added 26 Aug 2026 (written up in
      # CI-VERDICT-STALE-QUEUE-2026-08-26.md, in the private notes tree -
      # cited without its directory on purpose: this file SHIPS, and
      # publish-public.sh refuses an export naming that tree): a verdict
      # off a sha behind the tip, or a tip nothing has run for yet, reads
      # as UNKNOWN rather than as the OK this script used to print for
      # it, without ever turning the exit code red on a stalled queue.
      - name: ci verdict
        env:
          # The script resolves the repo from GITHUB_REPOSITORY, which
          # Actions sets, so the private repo's name is never written
          # into a file that ships to the public tree.
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci-verdict.py --selftest && python3 tools/ci-verdict.py

  # ===================================================================
  # LINUX: the build-free gates + clippy + the one build, then four
  # shards. The gates that do NOT need this job's toolchain or its
  # cache left on 22 Aug 2026 - see the section at the top of `jobs:`.
  # ===================================================================
  # ===================================================================
  # DOES THIS PUSH TOUCH ANYTHING THE COMPILER CAN SEE?
  #
  # Added 23 Aug 2026. The long note above `env:` costs three cadence
  # options and declines all three, and it is right about each - but it
  # is answering "how do we get more runner slots", and there is a
  # cheaper question it never asks: how many of these pushes needed a
  # build at all.
  #
  # Measured over the last 40 non-merge commits on main: 22 of them
  # touch nothing outside docs/, website/ and the
  # root *.md files. TODO.md alone is 18 of the last 60. Every one of
  # those started `check` (~11 min) and `windows-build` (~15 min, at 2x
  # private-repo billing) to prove that a markdown file does not break
  # a Rust build. Verified rather than assumed: 5ddb0bbae touched two
  # root markdown notes and one research script, nothing else, and ran a
  # full 12-step windows-build and 27-step check.
  #
  # THAT IS ALSO THE CADENCE FIX THE NOTE ABOVE COULD NOT FIND. Its
  # arithmetic is that a gate reaches a verdict only if the JOB is
  # shorter than the PUSH CADENCE, and it measured `check` at 3/20 and
  # windows-build at 2/20 because main takes a push every ~2.5 min. But
  # the cadence that matters to a build job is the cadence of pushes
  # that START one. Take slightly over half of them out and the
  # effective cadence for the build legs roughly doubles, with no
  # runner bought and nothing cancelled that was going to say anything.
  # It also gives back the queue wait the note measured on the critical
  # path (median 4.4 min before windows-build even starts), which is
  # time a release push spends behind somebody's TODO edit.
  #
  # FAIL-SAFE BY CONSTRUCTION, and this is the half to preserve. The
  # allowlist is of paths proven inert, and ANY other path - plus any
  # error, any missing before-sha, a force push, or a compare the API
  # truncates - votes BUILD. A wrong answer costs a build we did not
  # need; it can never cost a build we did.
  #
  # WHY EACH ENTRY IS INERT, checked rather than assumed:
  #   - nothing under docs/ or website/ is reachable from
  #     any `include_str!`/`include_bytes!` in crates/ or vendor/ (web/
  #     IS, via `concat!(env!("CARGO_MANIFEST_DIR"), "/../../web/...")`,
  #     which is why web/** is NOT here and forces a build);
  #   - the only runtime path joins in the whole test tree are
  #     crates/nzbfast/tests/leak-soak-baseline.json. The first is why
  #     are under paths that already force a build;
  #   - only ROOT *.md is inert. A nested one could be include_str!'d.
  #
  # AND NO GATE IS LOST, which is the other thing that had to be true
  # before this was safe. `check` still runs 13 build-free gates as
  # steps, but every one of them is ALSO a job in size-gate.yml, which
  # triggers on its own paths - `*.md`, `**/*.py`, `**/*.sh`, `**/*.zsh`,
  # `website/**`, `docs/MANUAL.html` among them - on every branch push,
  # not just main. So a docs-only or bench-script-only push still gets
  # size, lock, doc, ref, overflow, bench2j, leg-warn, par2, provenance,
  # iface, win-portability, waiver and harness. What it stops paying for
  # is clippy and the test archive, which are Rust and nothing else.
  #
  # The dependent shards need no change: linux-tests and windows-unit
  # already gate on `needs.<build job>.outputs.archive == 'success'`,
  # and a skipped job has empty outputs, so they skip with it.
  # `suites-ran` stays green too - it errors only on parent `failure`
  # AND child `skipped`, never on a skip of both. `ci-verdict` walks
  # back through runs for the last REAL conclusion per job and treats
  # skipped as no-verdict, which is exactly right here; at worst it
  # emits a warning, which is not fatal.
  # ===================================================================
  changes:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      # No checkout: the compare API answers this in one request, where
      # a `git diff` would need the history both shas are on, i.e. a
      # full-depth clone of this repo on every push to save a build on
      # half of them.
      - name: classify the changed paths
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          say() { echo "build=$1" >> "$GITHUB_OUTPUT"; echo "verdict: build=$1 ($2)"; }
          case "${BEFORE:-}" in
            ""|0000000000000000000000000000000000000000)
              say true "no usable before-sha (first push, or forced)"; exit 0 ;;
          esac
          files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${AFTER}" --jq '.files[].filename') || {
            say true "compare API failed"; exit 0; }
          if [ -z "$files" ]; then say true "compare returned no files"; exit 0; fi
          n=$(printf '%s\n' "$files" | grep -c '' | tr -d ' ')
          # The compare endpoint caps its file list at 300. At the cap we
          # cannot know what is not listed, so we build.
          if [ "$n" -ge 300 ]; then say true "compare truncates at 300 files (saw $n)"; exit 0; fi
          echo "changed files ($n):"
          printf '%s\n' "$files" | while IFS= read -r x; do echo "  $x"; done
          # `printf '%s\n'`, NOT `printf '%s'`, on all three lines above
          # and below. Without the trailing newline `while read` never
          # executes its body for the LAST line, so a single-file push
          # classified as inert no matter what it touched - and this gate
          # fails in the UNSAFE direction when that happens, skipping a
          # build that was needed. Caught by a table of ten path shapes
          # run against this exact loop before it landed; every one
          # answered `false`.
          verdict=skip
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|website/*) ;;
              */*)   echo "FORCE $f"; verdict=build; break ;;
              *.md)  ;;
              *)     echo "FORCE $f"; verdict=build; break ;;
            esac
          done < <(printf '%s\n' "$files")
          if [ "$verdict" = build ]; then
            say true "a changed path is visible to the compiler"
          else
            say false "every changed path is inert for the compiler"
          fi

  check:
    needs: changes
    if: ${{ github.repository != 'nzbfast/nzbfast' && needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # WAS 22 minutes on the release commit (run 31980160964: 25m14s
    # cold, 22m28s warm), of which the unit-test step alone was 18-20.
    # The tests are gone from this job - they run in `linux-tests`
    # below, four ways, off the archive this job produces - so what is
    # left is the build-free gates, clippy and one build. cargo deny
    # and fmt left with the cheap-gate split; they cost this job
    # nothing they were not already paying elsewhere.
    #
    # The cap stays at 30. TODO 116 is explicit that raising it only
    # hides the growth (2556 -> 3224 tests inside one hour of main
    # activity on 5 Aug); the levers are the debuginfo env above and the
    # shard count below.
    #
    # cancel-in-progress stays on for anything that is not main, because
    # `workflow_dispatch` on a topic branch is how a session gets a real
    # verdict without waiting in main's queue, and there superseding is
    # what you want.
    concurrency:
      group: ci-check-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    outputs:
      # The REAL precondition for the shard jobs, and it is not the job's
      # own conclusion. This job also runs clippy and six build-free
      # gates; if any of those is red the job is red, but the archive is
      # still built and still valid, and the suites must still report.
      # `needs: check` alone would let a one-line clippy error skip 5,175
      # tests - which is precisely the masking TODO 116.4 spent three
      # multi-day incidents learning to refuse, one level up from the
      # steps it fixed. Gate on the archive, which is the only thing a
      # shard actually needs.
      archive: ${{ steps.archive.outcome }}
      # The path the archive's binaries were built at. The shards
      # compare it to their own - see the guard in those jobs.
      workspace: ${{ github.workspace }}
    steps:
      # ac3f4a04 widened this job from four named test targets to the
      # whole workspace, which is the right call (see the long note on
      # the archive step) but it is what put the runner over. It is 37
      # integration targets plus the lib and bin suites, and on Linux
      # the linker copies DWARF INTO each executable rather than leaving
      # it in the object files the way macOS does, so a local `ls -la`
      # on a Mac reads 8-15 MB per test binary and badly understates
      # what ubuntu writes. Fifty-odd of those, each statically linking
      # the full crate graph, is several GB before `deps` is counted.
      #
      # A GitHub-hosted ubuntu runner ships ~14 GB free on `/`, most of
      # it spent on toolchains this job has no use for. Reclaiming them
      # is the standard workaround and it buys more than the whole
      # deficit. Inline `rm` rather than a marketplace action on
      # purpose: every third-party step in this repo is pinned by SHA
      # and audited, and none of this is worth a new supply-chain edge.
      #
      # `hostedtoolcache/CodeQL` only, never the whole hostedtoolcache -
      # python3 lives under it on some images and the gate scripts below
      # are `#!/usr/bin/env python3`.
      - name: reclaim disk
        run: |
          df -h / | tail -1
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell
          df -h / | tail -1
      # `id:` on both setup steps because the gate guards below name
      # them - see the long note above `fmt`. Nothing else reads them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
      - name: toolchain
        id: toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      # ---------------------------------------------------------------
      # THE CACHE KEY. Read this before touching it; it has bitten twice.
      #
      # The key used to be `hashFiles('Cargo.lock')`. Every release runs
      # packaging/bump-version.sh, which rewrites Cargo.lock, so EVERY
      # RELEASE started cold on both legs - and the release is the one
      # push nobody can afford to wait on. That is not a hypothetical:
      # the v1.1.4 bump (d7c08c8d, run 31980160964) missed on both jobs
      # and spent 21m16s rebuilding Windows from scratch.
      #
      # What the bump actually changes is two lines. Diffed: `nzbfast`
      # and `nzbtray` version = "1.1.3" -> "1.1.4", and nothing else in
      # a 1,700-package lockfile. The old key threw away ~600 compiled
      # crates in order to rebuild 3.
      #
      # So the key is now a hash of Cargo.lock with the WORKSPACE
      # MEMBERS' own version lines normalised out. tools/dep-cache-key.py
      # carries the derivation and a --selftest that asserts both
      # directions: a release bump does not move the key, while a
      # third-party version change, a checksum change, a crate added or
      # removed, and a workspace member gaining a dependency all do.
      # Positive control on real data - the v1.1.3 and v1.1.4 lockfiles
      # hash the same normalised and differently raw.
      #
      # WHY NOT Swatinem/rust-cache, which does this and prunes workspace
      # artifacts too: it would be a new third-party action in the most
      # load-bearing gate in the repo, and the reclaim-disk note above
      # states the standing position on that. Every action used here is
      # already pinned by SHA and already in use in this repo. The
      # normalisation is thirty lines with a selftest, and it is
      # auditable in a way a vendored action is not.
      #
      # WHY NOT `${{ github.run_id }}` + restore-keys, which is the
      # standard escape from the staleness trap: that trap does not
      # apply to a key that is a pure function of the DEPENDENCIES.
      # actions/cache saves only on an exact-key miss and never
      # refreshes a key it hit - which is a bug when the key is a proxy
      # for "the tree", because the archive then freezes at whatever the
      # day's first build left. Here the key changes exactly when the
      # dependency graph changes, and on that push the archive is
      # rewritten. The workspace crates' own artifacts are stale in it
      # by construction and always were; they are rebuilt every push
      # regardless. Meanwhile a run-unique key writes a NEW multi-GB
      # archive every single run, and this repo is already at 11.85 GB
      # against GitHub's 10 GB per-repo limit with LRU eviction active -
      # it would evict the nightly caches within the hour and then
      # itself. Deterministic key, one archive per leg per dependency
      # graph.
      # ---------------------------------------------------------------
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
          $py tools/dep-cache-key.py --selftest
      # restore + save as SEPARATE steps, not the combined `actions/cache`.
      # This is the fix for the failure mode that kept the cache coldest
      # exactly when someone was iterating on a fix:
      #
      #   actions/cache's post step DOES NOT SAVE IF THE JOB FAILED.
      #   Observed directly - run 31980160964's windows-unit failed and
      #   its `Post Run actions/cache` reads `skipped`, so the NEXT run
      #   on the same lockfile (31986322369) missed too and paid another
      #   full cold build. A red gate made the next attempt slower, and
      #   the one after that, until something went green.
      #
      # The save below is `if: always()` and sits immediately after the
      # build, so the dependency artifacts are banked whatever the tests
      # then do. Guarded on cache-hit != true only because saving over a
      # key that already exists is a warning and a wasted upload, never
      # a refresh.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: ci-private-v4-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # CARGO_INCREMENTAL above stops us WRITING incremental state; this
      # evicts what a cache written before that flag existed hands us.
      # Deleting them costs nothing - nothing downstream reads them -
      # and it is self-healing, because the next archive saved has none
      # left to put in it.
      - name: drop restored incremental state
        run: |
          du -sh target/*/incremental 2>/dev/null || true
          rm -rf target/*/incremental
      # EVERY gate step from here down carries an `if:`, and that is the
      # point: a red gate must not skip the gates after it. The form is
      # nightly.yml's, which got it in e7df7bf3 (TODO 143) - `!cancelled()`
      # plus a REAL precondition per step.
      #
      # Until TODO 116.4 these gate steps carried zero `if:` between
      # them, so a red `fmt` skipped the lock gate, the size gate, the
      # overflow gate, clippy, the whole unit suite AND cargo deny (fmt
      # and deny are jobs of their own since 22 Aug 2026, so that exact
      # chain cannot re-form here - the incident is what the rule is
      # for, not the step list): one
      # line of output standing in for six unknown verdicts, which reads
      # exactly like "one small thing is broken". That shape has now cost
      # three separate multi-day incidents - the 7-10 Aug outage here (an
      # early size gate hid clippy, deny and the unit tests for four
      # days), four nights of nightly red hiding http_wedge,
      # index_size_cap and queue_soak (TODO 143), and TODO 116.2's four
      # Windows failures surviving two commits.
      #
      # `!cancelled()` rather than `always()`, for the reason nightly
      # gives: a genuinely cancelled run - superseded by the concurrency
      # group above - should stop, not grind through every gate.
      #
      # NOT a blanket guard, and that is the half that takes the thought.
      # A step whose PRECONDITION failed must still skip, or a failed
      # checkout reports six identical reds instead of one honest one.
      # Here the python gates need only the tree (`checkout`) and the
      # cargo gates need a compiler (`toolchain`). The dependency chains
      # without being restated: `toolchain` is unguarded, so a failed
      # checkout skips it, and everything gated on it skips in turn.
      #
      # This does not soften the verdict. `if:` decides whether a step
      # RUNS, never whether its failure counts, and nothing here carries
      # continue-on-error - so any red gate still fails the job.
      #
      # One thing the job split BUYS here, for free: clippy, the tests
      # and the ARM64 check are separate JOBS now, and a job cannot skip
      # a job. The guards below still matter within this job, but the
      # cross-job half of that failure mode is gone by construction.
      # TODO 102b. Two manual sweeps failed to keep new code off
      # `.lock().unwrap()`, so this is a gate rather than a third sweep.
      # CI-only on purpose: it walks the working tree, and several Claude
      # sessions share one checkout, so running it as a pre-commit hook would
      # refuse your commit for another session's in-flight line.
      # `--selftest` first, same reason as the doc and overflow gates
      # below, and earned here: this gate matched one line at a time
      # until 22 Aug 2026, so every rustfmt-wrapped chain was invisible
      # to it and it reported a green 0 over 81 production sites for
      # nineteen days. The selftest pins the wrapped shape so a future
      # tidy-up cannot narrow the pattern back without going red.
      - name: lock gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: tools/lock-gate.py --selftest && tools/lock-gate.py
      # The same family and the same reason: a convention that only lived
      # in a commit message. 012549847 held all 87 `#[allow(...)]` in the
      # two src trees to "does this lint actually fire here?" - 59 became
      # `#[expect(...)]`, which rustc reports as unfulfilled the day it
      # stops being true, 10 were DELETED as dead, and 18 stayed `#[allow]`
      # because the lint fires only in some configuration this box is not
      # (a platform, the ffi crate root, cfg(test)), each carrying a
      # `// Not #[expect]: ...` note naming it. Within HOURS three new bare
      # `#[allow]`s landed from other lanes with no note and no evidence the
      # lint fires. All three turned out to be real, so nothing was lost -
      # but nothing had checked, which is the whole argument for a gate.
      # Baselined by the NOTE, not by a line list: main takes a push every
      # ~90 seconds and these files move, so a frozen file:line list would
      # be wrong within the hour. `#[cfg_attr(<cfg>, allow(..))]` is out of
      # scope on purpose - the cfg predicate IS the justification.
      # clippy's own `allow_attributes` was measured and rejected; the
      # script's docstring has the numbers.
      # `--selftest` first, same reason as the doc, ref and overflow gates:
      # this one exempts two shapes by NOT matching them, so a slipped
      # anchor turns it into a gate that passes everything. The selftest
      # asserts the exempt fixtures are exempt and the noted ones are
      # actually seen and judged, which fail in opposite directions.
      - name: lint waiver gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: tools/waiver-gate.py --selftest && tools/waiver-gate.py
      # The size gate below hoists items between files and orders to hold
      # its ceilings, and a hoist leaves the doc comment behind - above
      # whatever now follows it. Rust never notices (`///` is `#[doc]`, and
      # attribute order is free), so the block reads as documentation of a
      # function it does not describe. Four were live on 22 Aug 2026, one
      # stranded since daemon.rs was split on 8 Aug, and 6538d2693 had just
      # unscrambled three more by hand above `maintenance_slice`. This is
      # the mechanical half of that review. `--selftest` first, same reason
      # as the overflow gate below: the fingerprint is narrow enough that a
      # refactor could quietly turn it into a no-op that passes everything.
      # A second arm landed 22 Aug for the commoner shape the attribute
      # fingerprint cannot see - two doc blocks that simply ABUT. It has no
      # exact fingerprint, so it is BASELINED against a swept tree and fires
      # only on new hits; the selftest covers both the scanner and the
      # baseline, because they fail in opposite directions.
      - name: doc gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: tools/doc-gate.py --selftest && tools/doc-gate.py
      # The same family, and the same rule about not deleting the comment:
      # a comment that promises the reader a symbol ("see `foo`", "`foo`
      # below") and names one that does not exist. Usually a rename that
      # moved the code and left the pointer; sometimes, as in the case that
      # motivated this, a name copied out of a design note that only ever
      # proposed it. settle.rs carried "see `set_proven_on_disk` below" for
      # weeks and no such symbol has ever existed in this tree - the only
      # other hit for the name in the whole repo is the 31 Jul handoff the
      # phantom came from. Fixed by hand in 51ba5fd45. A second arm catches
      # the same defect wearing a path: `serve.rs` was still being cited a
      # year after serve.rs became serve/. `--selftest` first, same reason
      # as the doc and overflow gates: the fingerprint is narrow on purpose,
      # so a refactor could quietly make it match nothing.
      #
      # Private repo only, like the doc gate above and the overflow gate
      # below: `packaging/PUBLIC_MANIFEST` ships exactly two of tools/
      # (lock-gate, size-gate) and pr-check.yml runs those two. Nothing
      # here needs the public repo to have it. Since 22 Aug 2026 every
      # build-free gate also runs on every branch push in size-gate.yml,
      # behind the same repository guard - see that file for why.
      - name: ref gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: tools/ref-gate.py --selftest && tools/ref-gate.py
      # TODO 106. serve() regrew 1,819 -> 2,234 within days of TODO 43
      # splitting it, so the splits get a ratchet before they get redone.
      # Baselines live in the script; each entry is deleted as its target
      # is split, and the gate refuses stale entries so the list only
      # shrinks.
      # `--selftest` first, same reason as the doc, ref and overflow
      # gates. This gate carried the SAME brace-less `#[cfg(test)]` hole
      # the lock gate did: an item that opens no block ran on to the next
      # `{` and masked the production function after it as test code,
      # which exempts it from the ceiling outright. 58 files scored a
      # wrong mask and `Daemon::enqueue` sat at 575 lines behind it.
      - name: size gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: tools/size-gate.py --selftest && tools/size-gate.py
      # TODO 88. Horizontal overflow on the site bit three times in two days
      # (8058b393, 6b2274a6, 3195f9da) and every one was found by hand, days
      # later. Static on purpose - a headless browser would gate ubuntu's font
      # metrics, and the header bug was ~792px in English and ~900px in French
      # on macOS alone. `--selftest` first: it reconstructs all three incidents
      # and asserts the gate still refuses them, so a refactor cannot quietly
      # turn the gate into a no-op that passes everything.
      - name: overflow gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: tools/overflow-gate.py --selftest && tools/overflow-gate.py
      # One of the bench drivers is a GENERATED fork of another, and
      # nothing checked it was current - the file's own header said so.
      # It rotted twice, both times found by hand. Before 21 Aug 2026 the
      # deployed fork was two whole guards behind its parent: no
      # connection-census guard, so the two tokens saying how many
      # sockets a leg actually held were absent from every leg of the
      # three round classes due to run next (359 of 360 looked exactly
      # like 360), plus a byte-unit bug that put the client-bytes column
      # 4.86% high in those same rounds. On 22 Aug it went stale the
      # OTHER way: a device-selection hook was hand-added to the fork for
      # a round whose output sat on a dedicated sparse image, the
      # generator did not know it, and so the remedy the file prints -
      # regenerate - would have DELETED the live hook (b77636cf). The
      # only thing that ever looked was the rig library's selftest, run
      # on the bench box after a rig deploy: long after the push.
      #
      # The generator's own `--check` and nothing else, and not on cost
      # grounds: that selftest is zsh and evals the parent driver's
      # report(), which reaches for `du -g`, `iostat -Id` and a macOS
      # data volume, with `stat -f %z` and `md5 -q` elsewhere in the rig
      # library. BSD and macOS all the way down - there is nothing on a
      # linux runner for it to test. This half is stdlib python over two
      # text files: no build, no zsh, no toolchain, 0.03 s measured, the
      # same shape as the gates above. It is a wrapper rather than the
      # generator's own path because that path is private vocabulary and
      # this file ships to the public repo verbatim; the script says so
      # at length, and inlining it re-breaks the leak check.
