# CI for the PRIVATE repo, where development actually happens. Every
# other workflow is gated to the public repo (cost rationale lives in
# pr-check.yml); before this file existed nothing built or tested the
# private tree between merge and release. Kept lean on purpose: format
# + lint gates and the fast unit suites, on Linux and on Windows. The
# long daemon/e2e suites stay nightly (nightly.yml) plus a local
# pre-push discipline.
#
# ---------------------------------------------------------------------
# SHAPE (rewritten 17 Aug 2026 - "the slow path IS the release path")
#
# This file used to be two big serial jobs. On a RELEASE commit that was
# ~49 min of Windows and 22 min of Linux, and a release is exactly when
# nobody can afford to wait: `packaging/bump-version.sh` rewrites
# Cargo.lock, both caches keyed on `hashFiles('Cargo.lock')`, so every
# release started both jobs cold. Measured on run 31980160964 (the
# v1.1.4 bump) and 31986322369 (the push after it).
#
# The measurement that decided the shape - taken from those two runs'
# logs, step start to nextest's `Starting N tests` line versus its
# `Summary [Ns]` line:
#
#            windows-unit (cold)          check (warm)
#   build    21m16s  (53%)                 5m11s  (28%)
#   execute  19m13s  (47%)                13m11s  (72%)
#
# So this was NOT compile-bound, which is what everyone assumed from the
# 68-second local suite. Caching alone could never have hit the targets:
# even with a perfect cache, Windows still owed 19 minutes of test
# execution in one serial lump. Both halves had to be attacked:
#
#   BUILD ONCE, TEST SHARDED. `cargo nextest archive` builds every test
#   binary once; N shard jobs run `--partition count:i/N` against the
#   archive. Note this is NOT the matrix that TODO 116c priced NO in
#   August - that one duplicated the BUILD across shards, which is the
#   dominant cost. A shard here compiles nothing: `cargo-nextest` runs
#   the archived binaries with no cargo, no rustup and no target/ at
#   all (verified - the archive carries the standard library), so a
#   shard is a checkout, a 3 MB binary and a download.
#
#   DEPENDENCY CACHE, NOT LOCKFILE CACHE. The key is now the hash of
#   Cargo.lock with the workspace members' own version lines normalised
#   out (tools/dep-cache-key.py), so a version bump cannot cost us ~600
#   compiled crates in order to rebuild 3.
#
#   PARALLEL, NOT SERIAL. windows-unit's three steps - suite, clippy,
#   ARM64 cross-check - were mutually independent and ran back to back
#   for ~8.5 min of pure serialisation. They are separate jobs now.
#
# Read verdicts PER JOB, not per run: a run whose Windows job was
# superseded while queued is `cancelled` at run level even when its
# Linux job passed, so
#   gh api repos/:owner/:repo/actions/runs/<id>/jobs \
#     -q '.jobs[] | "\(.name) \(.conclusion)"'
# is the honest query, and `gh run list` alone is not. There are more
# job names now, and the sharded ones carry a matrix suffix -
# `windows-unit (1)` through `windows-unit (6)`.
#
# That query is necessary and it is not sufficient, which is the half
# this file got wrong for three weeks. Reading per job tells you the
# truth; on 22 Aug 2026 the truth was that `check` reached a verdict on
# main 3 times in 20. The note below `permissions:` has the measurement
# and what was done about it. Add `\(.steps|length)` to that query when
# you are asking WHY a job is cancelled: a job with zero step
# conclusions never started, and no amount of reading it per job will
# make it a verdict.
name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# There is deliberately NO workflow-level `concurrency` block here. It
# used to be `group: ci-${{ github.ref }}` with `cancel-in-progress:
# true`, and the note that replaced it predicted only that Windows
# coverage would "arrive when the pushes pause". Measured on 2 Aug 2026,
# it was worse than that: 39 of the last 40 runs on main ended
# `cancelled` and the 40th was still going, so across 12:05-13:10 not
# one run reached a verdict, and `windows-unit` had never completed once
# since it landed that morning. A gate that never finishes is
# indistinguishable from a gate that passes, which is the worse of the
# two failure modes.
#
# The cause is arithmetic, not a bug. Sessions fast-forward main
# directly rather than opening PRs (repo convention, and it is not
# changing), so with a dozen of them merging origin/main the push rate
# is roughly one every 90 seconds. A workflow-level group cancels EVERY
# job on the run, so the ~8 minute Linux leg and the ~30 minute Windows
# leg were both being killed long before either could finish, and the
# fast leg was dying for the slow leg's sake.
#
# So the group moves down to the jobs, which is exactly the escape hatch
# the old note named. Each leg now queues on its own and neither starves
# the other.
#
# ONE RULE FOR THE MATRIX JOBS, and it is easy to get wrong: a matrix
# leg evaluates its `concurrency` group per leg, so if the group string
# does not mention `matrix.shard` every shard of a run lands in ONE
# group and they SERIALISE - which would undo this whole file. The
# shard groups below all carry the shard number.
#
# ---------------------------------------------------------------------
# WHAT THE 2 AUG CHANGE DID NOT FIX (measured 22 Aug 2026)
#
# Everything above is still true and the block is still deliberately
# absent. It was also not enough, and the note as it stood said the
# residual fix was to "read verdicts per job", full stop. Measured per
# job, on this config, over the last 20 COMPLETED runs on main:
#
#   check          success  3 / 20     ~10.1 min
#   windows-build  success  2 / 20     ~14.4 min
#   windows-clippy success  5 / 20     ~6.0 min
#   windows-arm64  success  6 / 20     ~5.7 min
#   slim-check     success  6 / 11     ~2.4 min
#
# Every one of the 17 cancelled `check` jobs has ZERO step conclusions.
# They were not killed part-way through: they never started.
#
# THE MECHANISM IS NOT cancel-in-progress. `false` is doing exactly what
# it says - no RUNNING job is ever killed on main. What it does not do
# is buy a queue. GitHub Actions holds at most ONE pending entry per
# concurrency group, so with a job already running, the next push pends
# and the push after that CANCELS THE PENDING ONE to take its place.
# main takes a push every ~2.5 min here and `check` runs ~10 min, so
# roughly three commits are cancelled while pending for every one that
# gets a slot. The three that succeeded ran back to back with no gap
# (17:38:25-17:49:22, 17:49:25-17:59:21, 17:59:23-18:09:39): the runner
# was never idle, so this is not capacity and no amount of waiting
# improves it.
#
# Read the table again as a law rather than a list. The verdict rate is
# about the push cadence over the job's duration, capped at 1 - it has
# nothing to do with what the job checks or which group it is in. Which
# means the only lever that works for a given gate is to make the JOB
# SHORTER THAN THE CADENCE, and the control for that was already in the
# repo: over the same 20 pushes, every job in size-gate.yml - same main,
# same hour, same per-job concurrency, 7-20 seconds each - reached a
# verdict 20 times out of 20.
#
# So the four cheap ones were carved out into jobs of their own (see
# the section at the top of `jobs:`): fmt, the download page version
# gate, the i18n catalogue gate and cargo deny. Those four plus clippy
# were the whole set with no other verdict path anywhere in the repo -
# the build-free gates that stay in `check` are already covered on
# every branch by size-gate.yml, which is why they were left alone.
#
# WHAT IS STILL UNFIXED, deliberately. clippy stays in `check` and so
# still carries that job's rate, and windows-build/clippy/arm64 keep
# theirs. Those are build-bound: there is no version of them that fits
# in 2.5 minutes, so splitting them further just spreads the same
# cancellation over more job names. clippy in particular must stay in
# `check` - it compiles the dependency graph to rlib/rmeta exactly as
# the archive build then needs it, and moving it out makes something
# pay for that twice.
#
# ---------------------------------------------------------------------
# WHAT THAT RESIDUAL ACTUALLY COSTS (measured 22 Aug 2026, same day,
# with tools/ci-verdict-rate.py --tips --cost)
#
# The note above ended by naming "a merge queue or a debounced or
# scheduled build on main" as the shape that fixes this. Before costing
# either, the residual was re-measured over the 36 completed runs on
# main between 16:30 and 21:05 UTC, mean push cadence 3.8 min. The
# per-commit rates had barely moved:
#
#   check           12 / 36    ~9.8 min    linux-tests   same 12 / 36
#   windows-build    8 / 36   ~14.9 min    windows-unit  same  8 / 36
#   windows-clippy  18 / 36    ~6.5 min
#   windows-arm64   19 / 36    ~5.6 min
#   slim-check      31 / 36    ~2.4 min
#   the four carved-out gates    34-36 / 36, all under a minute
#
# What HAD been missed is what the one pending entry contains. It is
# always the NEWEST push, because each new push replaces it, so when a
# slot frees the job that starts is main's tip and not some arbitrary
# older commit. Measured against the push ordinal at each job's start:
# 223 of 227 entry-point job runs started on what was the tip at that
# instant, the four exceptions one push behind by seconds. (The jobs
# behind a `needs:` read further behind, because they start after their
# parent finishes - they are testing that parent's archive and inherit
# its anchoring, not a staler commit.)
#
# That changes what a cancelled job costs. main is fast-forward only,
# so a tip contains every commit pushed before it and a green on the
# tip is a green on all of their content. The cancelled ones do not
# cost COVERAGE, they cost ATTRIBUTION: the blame window on a RED one,
# which is whatever landed since the last verdict. So the honest metric
# is not the per-commit rate at all, it is the interval between
# consecutive verdicts, i.e. how stale the newest verified tip gets:
#
#                     median    p90    max     blame window
#   check               9.8    10.7   15.7     ~3 commits
#   windows-build      15.1    15.5   16.8     ~4 commits
#   windows-clippy      6.8    13.2   16.1
#   windows-arm64       5.8    11.9   16.4
#
# Each of those is about one job duration, which is the floor: one
# runner slot cannot verify a tip faster than the job takes to run, and
# the successful runs sit back to back with no idle gap. The per-commit
# rate is the same fact divided by the cadence.
#
# ---------------------------------------------------------------------
# THE THREE CADENCE OPTIONS, COSTED 22 Aug 2026, ALL DECLINED
#
# 1. MERGE QUEUE (`merge_group`). Not compatible with this repo as it
#    works, before cost enters into it. A merge queue only ever
#    processes PULL REQUESTS, and requiring one means requiring those;
#    sessions fast-forward main directly and the note above says that
#    is not changing. Keep the convention and a direct push does not
#    enter the queue at all, so `push` fires exactly as it does now and
#    nothing moves. Drop the convention and what the queue buys is
#    batching - its "minimum pull requests to merge" plus wait timeout
#    IS a debouncer, and a good one - but the information a batch green
#    carries is the information a tip-anchored green already carries,
#    and the price is that every session waits a full windows-build
#    behind its queue position before its work is on main for the next
#    session to merge. Wrong trade for a dozen sessions merging
#    origin/main continuously.
#
# 2. DEBOUNCED OR SCHEDULED BUILD. This config already IS the debounce,
#    and a better one than `schedule:` can be. Cron quantises to five
#    minutes at best, is documented as delayed or dropped under load,
#    and fires whether or not the tip moved; the pending slot starts
#    the instant a runner frees (median wait before start, measured:
#    check 2.8 min, windows-build 4.4 min) and only ever on a tip that
#    HAS moved. Same cost, same rate, worse latency, and it would need
#    a "has the tip changed" guard that the pending slot gives free.
#    The nearby variant - keep `push` but check out `origin/main`
#    instead of the trigger sha - was rejected for a different reason:
#    the commit status still lands on the trigger sha, so it would put
#    a green tick on a commit that was never built. That is the exact
#    family of defect the rest of this note exists to prevent.
#
# 3. BUY SLOTS (drop the per-job `concurrency` on the build-bound legs
#    so nothing is ever cancelled). The only option that does raise the
#    per-commit rate, and it is the one with a price rather than an
#    objection. Cancelled-while-pending jobs cost ZERO runner minutes,
#    so today's bill is only what actually ran: 1,125 billed minutes
#    over that 150-minute window. Every leg on every push, with the
#    shards behind them, is ~3,200 - 2.8x, and the increment is mostly
#    Windows at the 2x rate. Over that day's 206 pushes it is roughly
#    150 US dollars a day of extra list-price runner time, to buy
#    attribution that the blame windows above already hold to 3-4
#    commits. Declined on price, not on principle. If a blame window
#    ever costs real debugging time this is the lever, and the cheap
#    partial version is to drop the group on `check` alone - though
#    "cheap" is relative, because linux-tests rides behind it: check
#    124 -> 360 min over that window and linux-tests 226 -> 720.
#
# So: unchanged. What changed is the metric - watch the VERDICT
# INTERVAL, not the per-commit rate. Re-measure both rather than
# believing this paragraph:
#
#   tools/ci-verdict-rate.py --limit 40 --tips --cost
# ---------------------------------------------------------------------
env:
  # Both legs, one value, and that is deliberate. CLAUDE.md's disk note
  # is explicit that a per-directory setting must be UNIFORM or the
  # directory carries two complete artifact sets; the same is true of a
  # cache archive shared by the build job and the lint jobs.
  #
  # CARGO_INCREMENTAL: the `check` job died four times on 5 Aug 2026
  # (77e0b1c0, 7ea59bf4, 520248ac, febb6a26) with `No space left on
  # device (os error 28)`, one of them naming
  # `target/debug/incremental/.../query-cache.bin` outright. Measured on
  # the dev checkout, `target/debug/incremental` is 94 GB against 95 GB
  # of `deps` - about a byte of incremental state per byte of artifact -
  # and CI never spends it, because no cached target/ is ever resumed
  # from mid-edit.
  CARGO_INCREMENTAL: "0"
  # `line-tables-only` keeps file:line in panic backtraces - the whole
  # diagnostic value of debuginfo in a test job - and drops the variable
  # and type DWARF that is the bulk of the bytes and of the LINK time.
  #
  # NEW ON WINDOWS as of this commit, and it is the single biggest lever
  # on that leg's build. Timestamps from run 31986322369's `workspace
  # suite` log: the last `Compiling` line lands at +643s and nextest's
  # `Starting 5116 tests` at +1276s, so 633s - ten and a half minutes,
  # half the entire build phase - is pure LINKING of 54 statically
  # linked test executables with full debuginfo. No dependency cache can
  # touch that; only making the linker write less can. Linux has carried
  # this since TODO 116 and warm-builds the same 54 binaries in 5m11s.
  #
  # The old note here said adopting it on Windows was the "wrong trade
  # today" because it costs one cold rebuild on a 2x-billed runner and
  # there was no timeout pressure. It then named the reopen trigger:
  # "if this leg starts crowding 60 the lever is the same one, and so is
  # the rule". At 49 minutes against a 75-minute cap, crowding is what
  # happened.
  #
  # THE RULE, which is the load-bearing half: this flag moves every
  # fingerprint in the cached archive, so the cache-key suffix bump to
  # `-v4` below rides in the SAME COMMIT. Land one without the other and
  # CI restores an archive built under the old flag, rebuilds cold under
  # the new one, and never replaces it - cold forever, silently, behind
  # a green cache-hit line. Bump the suffix again for any future change
  # that moves rustc's fingerprint inputs (profile flags, RUSTFLAGS,
  # toolchain pin) without moving Cargo.lock.
  #
  # `-v3` became `-v4` on 23 Aug 2026 for the `[profile.dev.package.rars]`
  # / `[profile.test.package.rars]` opt-level override added to the
  # workspace Cargo.toml, whose measurements are in the long note there.
  # That override moves a fingerprint without moving Cargo.lock, so the
  # rule above applies verbatim and the bump rides with it.
  #
  # WHY THIS ONE IS CHEAPER THAN THE `-v3` BUMP WAS, which is worth
  # knowing before the next reader assumes symmetry. `-v3` moved
  # `profile.test.debug`, i.e. every one of the ~54 test executables in
  # the archive. This one moves ONE crate's rlib - rars - plus the
  # workspace crates that link it, and those recompile on every run
  # anyway: git checkout stamps their sources newer than any cached
  # artifact, which is why a WARM windows-build still logs six
  # `Compiling` lines. So the cost of an unbumped key here would have
  # been ~3.4s per run, not a cold archive - the bump is rule
  # compliance, not rescue.
  #
  # AND WHY THE OTHER FIVE CACHED WORKFLOWS ARE DELIBERATELY NOT BUMPED
  # (nightly `-v2`, nightly-soak, nightly-armv7, coverage `-v2`,
  # fuzz-smoke `-v2`, pr-check `-v2`). Same reasoning, opposite verdict
  # on price: each of them would pay one full cold dependency build to
  # reclaim that same ~3.4s per run, and none of them is on the release
  # critical path. The staleness is bounded and self-correcting - cargo
  # fingerprinting is what decides a rebuild, so a stale key here is a
  # performance question and never a correctness one. If one of those
  # workflows ever starts caring, bump it then.
  #
  # Workflow-level, not job-level, and that is load-bearing too: clippy
  # `--all-targets` builds the test targets as well, so a job that
  # differed here would give clippy and nextest different fingerprints
  # for the same units and each would rebuild what the other just built.
  # This applies to `profile.test`, so dependencies (built with `dev`)
  # keep full debuginfo - the intended half, since the test executables
  # are what there are fifty-four of.
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # The seven build-gated heavy targets (TODO 116b) are excluded by
  # `required-features` at BUILD time, so they never enter the archive -
  # verified by listing the archive's binaries. This expression is the
  # run-stage belt if they are ever built here again, and it is where a
  # reader learns the seven names. nextest accepts binary() predicates
  # that match nothing.
  NT_EXCLUDE: >-
    not binary(conn_tuner) and not binary(index_size_cap) and
    not binary(http_wedge) and not binary(queue_soak) and
    not binary(daemon) and not binary(e2e) and not binary(leak_soak)
  # CLAUDE.md invariant 5. The bin suite runs product code that consults
  # this at the network boundary (identity.rs `may_call_out`), so
  # without it a push can put live xREL / TMDB requests on the wire from
  # a CI runner.
  NZBFAST_NO_ENRICH: "1"
  # Pinned once, consumed by six jobs. Both the version and the two
  # SHA256s move together.
  NT_VERSION: "0.9.140"
  NT_SHA_LINUX: "4ee9aaa0d0171a985a5d0eb735b87355894c1c455972e9674fb9fdbd1387c9a3"
  NT_SHA_WINDOWS: "ec39698dfe5bcfffb7d5da037f226bc1670584ba247123f4e684a0f224fe828d"

jobs:
  # ===================================================================
  # THE CHEAP GATES, one job each.
  #
  # Carved out of `check` on 22 Aug 2026. Nothing here is new: every
  # `run:` line below ran as a step of `check` and is byte-identical to
  # what it ran there. What changed is only what it waits behind. A
  # two-second answer was queued behind a toolchain install, a
  # dependency cache restore, clippy and a workspace build, so on this
  # main it was usually never delivered at all - the arithmetic and the
  # measurement are in the long note above `env:`.
  #
  # MOVED, not copied, and that is the one place this departs from
  # size-gate.yml. That file deliberately keeps a second copy of the
  # build-free gates, because the duplicate buys something `check`
  # cannot: a verdict on every BRANCH push, where ci-private triggers on
  # main alone. Here the trigger is the same file's own trigger, so a
  # second copy would buy nothing and cost a second place for the two to
  # disagree about what passes.
  #
  # The guards are gone with the move, and that is not a softening. In
  # `check` every gate step carries `!cancelled()` plus a precondition
  # so that a red gate cannot skip the gates after it (the note above
  # the lock gate has the three incidents that rule came from). A job
  # holding ONE gate has nothing after it to skip, and a job cannot skip
  # a job - which is the same sentence that note already ends on, now
  # doing the work structurally instead of by convention.
  #
  # THE BUDGET FOR ANYTHING ADDED HERE IS THE PUSH CADENCE, ~2.5 min
  # measured. Past that a job starts losing verdicts exactly the way
  # `check` does, and this is not theory: `slim-check` below is 2.4 min
  # and already reaches a verdict only 6 times in 11.
  #
  # What these four actually cost, wall clock on the runner, from the
  # first run that had them (32590969278, 91a4b31a, 22 Aug 2026):
  #
  #   site-version-gate   9 s
  #   i18n-gate          12 s
  #   fmt                39 s   (10 s of it the toolchain install)
  #   deny               39 s   (26 s of it `cargo deny` itself)
  #
  # On that same commit `check` and `windows-build` were still sitting
  # pending with zero steps, which is the whole point of the split.
  # `deny` is the one to watch as it grows: it fetches the advisory
  # database on every run, and that is deliberately not cached, because
  # a cached advisory database is a security gate that cannot see
  # today's advisory.
  # ===================================================================
  fmt:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-fmt-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `--profile minimal` plus the one component, rather than `check`'s
      # rustfmt,clippy pair: this job never lints.
      - name: toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - name: fmt
        run: cargo fmt -p nzbkit -p nzbfast -p nzbtray --check
  site-version-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-site-version-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The download page is version-pinned: every button is
      # `releases/latest/download/nzbfast-<VERSION>-*`, so the instant a new
      # release becomes `latest` every filename from the old one 404s - all
      # six buttons, all sixteen locales, at once, with no grace period.
      # bump-version.sh rewrites those pages, but for v1.1.3 they were left
      # unstaged while Cargo.toml was committed, and the site went live
      # naming 1.1.2. This is what makes that state red at the commit that
      # creates it rather than on release day. `--selftest` first, same
      # reason as the overflow gate, which is still in `check`.
      - name: download page version gate
        run: tools/check-site-version.sh --selftest && tools/check-site-version.sh --tree
  shot-version-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-shot-version-gate-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The sibling of the job above, one medium over. Every dashboard
      # capture in website/assets/ renders the running version in its
      # header pill, and nothing held those images to the crate version:
      # all four versioned shots went two releases stale AT ONCE, reading
      # `v1.1.4 beta 4` against a crate at 1.2.2, and it was caught only
      # because a person looked at an image and read the number. Worse
      # than the download page in one way - a stale button 404s loudly,
      # while a stale capture quietly shows an old product to every
      # visitor and to everyone installing the PWA, since two of these
      # images are downscaled into web/screens/ and declared in
      # web/site.webmanifest. No other gate could ever have seen it:
      # website/ is not in PUBLIC_MANIFEST, so leak-check prints `0 public
      # file(s) clean` without scanning it, and nothing here can read a
      # PNG. `--selftest` first, same reason as every gate above it.
      - name: screenshot version gate
        run: tools/shot-version-gate.py --selftest && tools/shot-version-gate.py
  one-process-roster:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-one-process-roster-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The `unit-one-process` job below carries no list of binaries - it
      # inventories the archive and runs every first-party lib/bin unit
      # target out of it. nightly's `one-process-loaded`, the only job in
      # the repo that runs that shape under LOAD, named ONE of the four by
      # hand, which is how a timer-paced flake in the nzbkit LIB root went
      # red twice in 400 main runs while the loaded job campaigned over the
      # nzbfast BIN root (2e4614940). This holds that matrix to the
      # workspace manifests. Also a job in size-gate.yml, which runs on
      # every branch push. Private repo only, like the gates above.
      - name: one process roster
        run: |
          tools/one-process-roster.py --selftest
          tools/one-process-roster.py
  wedge-gate:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-wedge-gate-${{ github.ref }}
