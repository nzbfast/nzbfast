        # predates a manifest edit now fails where it used to pass. That
        # is the flag doing its job, not a regression.
        run: cargo clippy -p nzbkit -p nzbfast -p nzbtray -p nzbfast-ffi --locked --all-targets --no-deps --features nzbkit/heavy-tests,nzbfast/heavy-tests -- -D warnings
