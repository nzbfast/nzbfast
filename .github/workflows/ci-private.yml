      #
      # Cost, measured on an M-series box with `--retries 0`: 5175 tests
      # in 68s once built. Both sessions that costed this first estimated
      # 5-8 MINUTES, from serialised `cargo test` timings - `cargo test`
      # runs test BINARIES sequentially while nextest schedules across
      # them. Never cost a nextest job from cargo-test numbers.
      #
      # --locked for the reason spelled out at the clippy step: this is
      # the archive all four shards then run, so if cargo re-resolved an
      # unstaged manifest edit here the entire Linux suite would pass
      # against a graph that is not in the repo - and the cache key that
      # banks it is derived from the committed lock.
      - name: build test archive
        id: archive
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.nextest.outcome == 'success' }}
        run: cargo nextest archive --locked --archive-file nextest-archive.tar.zst
      # `always()`, and immediately after the build - see the restore
      # note above. A failed suite must not cost the next run its
      # dependency artifacts.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' && steps.archive.outcome != 'skipped' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ci-private-v4-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # compression-level 0: the archive is already zstd, and re-zipping
      # 250 MB of incompressible data costs a minute and saves nothing.
      # retention 1 day - nothing outside this run ever reads it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        with:
          name: nextest-archive-linux
          path: nextest-archive.tar.zst
          retention-days: 1
          compression-level: 0

  # The Linux suite, four ways, off `check`'s archive. This job compiles
  # NOTHING: no toolchain step, no cache, no target/ - `cargo-nextest`
  # is invoked directly rather than through the `cargo` shim, which is
  # what lets a shard skip rustup's toolchain resolution entirely
  # (verified locally with cargo and rustup removed from PATH: the
  # archive carries its own standard library). A shard is a checkout, a
  # 3 MB binary and a download.
  #
  # The checkout IS required and is not decoration: the source-scanning
  # reflection tests (tests/settings_catalogue.rs) read crates/ at
  # RUNTIME - CLAUDE.md's "compiling is not passing" note - and the
  # fixture-backed RAR and PAR2 tests read files from the tree.
  # `--workspace-remap` is what points the archived binaries' baked-in
  # manifest paths at this checkout.
  #
  # Shard count 4 was chosen from the measurement, not from taste: 13m11s
  # of Linux execution over 4 is ~3m20s, against ~60-90s of fixed
  # per-shard overhead. Past about 4 the overhead dominates and the
  # billed minutes buy nothing.
  #
  # `count:i/N` not `hash:i/N`: count assigns round-robin over the
  # ordered test list, which balances the long tail (the chase and
  # crypto tests are 15-50s each and cluster in one binary) far better
  # than hashing does. Verified: the four partitions sum to exactly the
  # 5175 tests the unpartitioned list reports, so nothing is dropped and
  # nothing is run twice.
  linux-tests:
    # `!cancelled()` plus a REAL precondition, the TODO 116.4 form. NOT
    # `needs: check` on its own - see the `archive` output above. When
    # that precondition is not met these four rows read `skipped`, and
    # `suites-ran` at the foot of this file is what tells the two
    # reasons for that apart.
    if: ${{ !cancelled() && github.repository != 'nzbfast/nzbfast' && needs.check.outputs.archive == 'success' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: ci-linux-tests-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install cargo-nextest
        run: |
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 -o cargo-nextest.tar.gz \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NT_VERSION}/cargo-nextest-${NT_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${NT_SHA_LINUX}  cargo-nextest.tar.gz" | sha256sum -c -
          tar -xzf cargo-nextest.tar.gz
          sudo mv cargo-nextest /usr/local/bin/
          rm cargo-nextest.tar.gz
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive-linux
      # nextest instead of libtest, and the reason is diagnostic: a flake
      # must never again appear as an anonymous 505/506 tally - nextest
      # names the failing test and the retry outcome. The retry policy in
      # .config/nextest.toml (retries = 1, fail-fast off) CAPTURES flakes
      # as named FLAKY results instead of hiding them.
      #
      # Note what does NOT need saying here: `binary(daemon)` and
      # `binary(fault_contract)` are pinned to max-threads-1 test groups
      # in .config/nextest.toml, so CLAUDE.md invariant 4 holds by
      # configuration rather than by everyone remembering
      # `--test-threads=1`, and it holds INSIDE a partition too - a
      # shard that draws those tests still serialises them.
      # ---------------------------------------------------------------
      # EXTRACT TO THE WORKSPACE ROOT, and this is not a detail.
      #
      # ~30 of this repo's test files (161 sites) locate the daemon with
      # `env!("CARGO_BIN_EXE_nzbfast")`. `env!` is resolved at COMPILE
      # time, so what the archived test binaries carry is an ABSOLUTE
      # path to `<build runner's workspace>/target/debug/nzbfast` - and
      # nothing at runtime can remap it. `--workspace-remap` fixes
      # CARGO_MANIFEST_DIR; it cannot touch this.
      #
      # Left to itself nextest extracts to a fresh temp dir, that path
      # does not exist, and every daemon-spawning test dies instantly on
      # `Os { code: 2, kind: NotFound }`. Measured, not guessed: run
      # 31990300316 failed exactly this way on all four Linux shards.
      #
      # The escape is that GitHub gives every runner of an OS the SAME
      # workspace path (`/home/runner/work/<repo>/<repo>`,
      # `D:\a\<repo>\<repo>`), so the build job's baked
      # `$GITHUB_WORKSPACE/target/debug/nzbfast` is a valid path on a
      # shard too - as long as the archive is unpacked there. The
      # archive stores its members at RELATIVE `target/debug/...`, so
      # `--extract-to $GITHUB_WORKSPACE` puts every binary back exactly
      # where it was built.
      #
      # That makes a path assumption load-bearing, so the step below
      # ASSERTS it rather than trusting it: the build job publishes the
      # workspace it built in, and if that ever stops matching this
      # runner the job says so in one line instead of failing ~1,300
      # tests with a NotFound apiece.
      #
      # It compares job outputs rather than reading the archive, and
      # that is not a style choice: the first version of this guard
      # shelled out to `tar --use-compress-program=unzstd`, which does
      # not exist in Git Bash on windows-latest, so it failed on its own
      # tooling instead of on the thing it was checking (run
      # 31991506018). A guard that needs a tool the runner lacks is a
      # second failure mode, not a safety net.
      # ---------------------------------------------------------------
      - name: assert this runner's workspace matches the build's
        shell: bash
        run: |
          want='${{ needs.check.outputs.workspace }}'
          got='${{ github.workspace }}'
          if [ "$want" != "$got" ]; then
            echo "::error::this runner's workspace is '$got' but the archive was built in '$want'."
            echo "::error::env!(\"CARGO_BIN_EXE_*\") bakes an absolute path at compile time, so every"
            echo "::error::daemon-spawning test would fail NotFound. See the note above this step."
            exit 1
          fi
          echo "workspace matches the build job: $got"
      - name: workspace suite (shard ${{ matrix.shard }}/4)
        run: |
          cargo-nextest nextest run --profile ci \
            --archive-file nextest-archive.tar.zst \
            --extract-to "$GITHUB_WORKSPACE" --extract-overwrite \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --partition count:${{ matrix.shard }}/4 \
            -E "$NT_EXCLUDE"
      # THE HALF THAT MAKES A GREEN SUITE MEAN SOMETHING. nextest treats a
      # per-test TIMEOUT as an ordinary failure and RETRIES it, so a test
      # that wedges once and passes on the second attempt is reported
      # "N passed (1 flaky)" at exit 0 - which is how a 4,666-second
      # deadlock came out of CI green on 23 Aug 2026. The step above cannot
      # see that; the report it wrote can. `[profile.ci.junit]` has been
      # writing junit.xml since the profile existed and, measured 25 Aug
      # 2026, nothing had ever read it.
      #
      # `!cancelled()` rather than `success()`, deliberately: a shard that
      # is red for some OTHER reason can still carry a wedged attempt, and
      # the run's own verdict names the panic rather than the timeout. A
      # cancelled shard has no report worth reading and would refuse.
      #
      # The argument is a DIRECTORY, not target/nextest/ci/junit.xml: the
      # profile is a path component, so naming the file would hard-code a
      # path every caller has to keep in step. An empty directory REFUSES -
      # a shard whose suite wrote no report must never read as clean.
      #
      # WHY THAT PATH IS THE RIGHT ONE, and it is derived rather than
      # assumed. Measured 25 Aug 2026 with a real archive: nextest's store
      # directory follows the target dir BAKED INTO THE ARCHIVE, not
      # `--extract-to` - an archive built here and extracted somewhere else
      # entirely wrote its junit.xml back under the BUILD workspace. That
      # would be a trap, except that the step two above this one ASSERTS
      # `github.workspace == needs.check.outputs.workspace`, so on any
      # runner that gets this far the archive's baked target dir IS
      # `$GITHUB_WORKSPACE/target`. The same assert that stops 1,300 tests
      # dying NotFound is what makes this path correct; if it is ever
      # relaxed, this line has to move with it.
      - name: wedge gate (shard ${{ matrix.shard }}/4)
        if: ${{ !cancelled() }}
        run: python3 tools/wedge-gate.py --junit "$GITHUB_WORKSPACE/target/nextest"
  # ===================================================================
  # THE ONE-PROCESS UNIT SUITE. The same binaries `linux-tests` runs,
  # run the OTHER way: one process per test BINARY instead of one per
  # TEST.
  #
  # Every test job in this repo runs under nextest, and nextest gives
  # every test its own process. That is what makes the shards fast and
  # their failures attributable, and it is also a blind spot with a
  # hard edge: a test that leaves process-global state behind - a
  # `static` OnceLock/Mutex/Atomic, an env var, a cached global - can
  # never be observed by the test that then reads it, because the two
  # never share a process. Verified with a two-test probe crate on 23
  # Aug 2026: test A stores 7 into a `static AtomicU64`, test B asserts
  # it reads 0. That pair FAILS under `cargo test` and PASSES under
  # `cargo nextest run`.
  #
  # Not theoretical here. 84ae50bd7 landed two tests of the same
  # per-service property in different modules of the nzbfast bin.
  # `crate::ratelimit`'s cooldown table is a process-global
  # `OnceLock<Mutex<HashMap<..>>>`; one test ended by penalising a
  # provider for the clamped maximum of an hour, and a test over in
  # `crate::wall` read exactly that provider as its "an unrelated
  # service is untouched" control. main was red on `cargo test -p
  # nzbfast --bin nzbfast` for a full day and NO CI JOB SAID SO. The
  # collision itself is fixed (a29a8e4cc made the buckets disjoint
  # across the binary); this job is the half that was still missing.
  # The class is live in both first-party crates - 79 statics with
  # interior mutability in crates/nzbfast/src, 88 in crates/nzbkit/src.
  #
  # COMPILES NOTHING, exactly like `linux-tests`: it runs the archived
  # binaries directly, so it costs a checkout, a download and the run.
  # Two cheaper-looking spellings were measured and are BOTH wrong
  # here:
  #
  #   `cargo test -p nzbfast --bin nzbfast` - the line CLAUDE.md
  #   documents, and the right one to type by hand - resolves FEWER
  #   features than `--workspace` does (nzbfast-ffi is a workspace
  #   member and turns nzbfast's `ffi` feature on; tokio and rusqlite
  #   unify wider). Measured on a target/ warm from the archive build:
  #   it recompiles five crates, 33 s, and writes a SECOND full
  #   artifact set beside the first - on the runner whose `check` job
  #   has died of ENOSPC four times.
  #
  #   `cargo test --workspace --lib --bins` does reuse the archive's
  #   artifacts exactly (measured: zero `Compiling` lines) - but it
  #   needs a toolchain and that warm target/, which only `check` has.
  #   Putting the run in `check` buys the same coverage at the cost of
  #   the one job whose verdict interval the note above `env:` spends a
  #   page measuring, so it stays out here where it is free.
  #
  # WHICH BINARIES: every `lib`/`bin` unit binary whose package lives
  # under `crates/`, selected from nextest's own binary list rather
  # than named in this file. That auto-enrols a crate added tomorrow,
  # for the same reason the archive step takes no package selection,
  # and it leaves the vendored crates out - their unit tests are
  # upstream's and this job is about OUR globals. Today it selects four
  # binaries and 3,596 tests: nzbkit 1,803, the nzbfast bin root 1,776,
  # nzbtray 17, and the nzbfast lib root 0.
  #
  # It selected FIVE and about 5,370 until 23 Aug 2026. Both numbers
  # fell for the same reason and neither is a coverage loss. The fifth
  # binary was nzbfast-ffi's own (empty) lib root, which is no longer
  # archived at all. The 1,774 tests were the nzbfast LIB root - the
  # ffi root over the same module tree - which the note here used to
  # call "a near-duplicate second sample rather than new coverage",
  # kept only because excluding it would have meant maintaining a name.
  # That was too generous by exactly one word: it was an EXACT
  # duplicate. `feature = "ffi"` has one site in the workspace, so the
  # two roots compile the same module files under the same resolved
  # features, and its 1,774 tests were a strict SUBSET of the bin
  # root's 1,776. Nothing is named here to exclude it, then or now -
  # the archive step dropped `--workspace`, the `ffi` feature went off
  # with it, and that root now compiles to an empty binary the selector
  # still picks up and nextest still runs, in 0 s. See the long note at
  # the archive step for what else that flag was costing.
  #
  # WHAT IT COSTS, measured on the runner in the first run that had it
  # (32660095310), which was BEFORE that change - so read the nzbfast
  # lib row as the saving, not as a current cost:
  #
  #   nzbfast lib       57.9 s   -> now 0 s, the root is empty
  #   nzbfast-ffi lib      0 s   -> no longer archived
  #   nzbfast bin       56.9 s        nzbtray bin   0 s (17 tests)
  #   nzbkit lib       731.0 s
  #   fixed overhead    ~45 s (checkout, nextest, artifact, extract)
  #   ---------------------------------------------------------------
  #   job             14m55s, less the 57.9 s on the first row
  #
  # nzbkit is 82% of that and it is CPU-BOUND, so no flag recovers it.
  # Swept locally on an 18-thread box: 4 threads 164 s, 16 threads
  # 97 s, 32 threads 116 s (oversubscribed). The runner has 4 vCPUs, so
  # it is already at the bottom of that curve and raising
  # `--test-threads` past the core count buys nothing; the 4.5x between
  # 164 s there and 731 s here is core speed, not scheduling. And the
  # one thing that WOULD parallelise it - sharding - is the property
  # this job exists to remove, so it is not available by construction.
  #
  # It is kept anyway, and that is a decision rather than an oversight.
  # nzbkit's globals are mostly runtime KNOBS (`disk::ON`,
  # `pacing::ON`, `mem::OVERRIDE`, `bufpool::OVERRIDE`, `steer::V`), so
  # a test that flips one and does not put it back does not fail
  # anything - it silently changes the configuration every later test
  # in that binary measures against. That is a worse failure than the
  # ratelimit one above and nothing else in this repo can see it.
  # If the bill ever does matter, the lever is to move THIS job (not
  # its selection) to nightly.yml and leave the ~2 min of nzbfast
  # binaries per push, which is where the known incident was.
  #
  # `timeout-minutes: 30`, not 20, and for the reason `check`'s cap
  # note gives one way round: 14m55s under a 20 minute cap is 5
  # minutes of headroom against a suite that grew 2,556 -> 3,224 tests
  # inside one hour of main activity on 5 Aug. 30 matches `check`.
  #
  # DEFAULT THREAD COUNT, not `--test-threads=1`. Serial is stricter -
  # it is the sequential shape of this class, A finishes and THEN B
  # reads - and it is what a human should reach for when chasing one
  # down. It is also about 3x the wall clock (measured on the nzbfast
  # bin root: 96.7 s serial against 33.3 s parallel), and the PARALLEL
  # run is what caught the incident above. If a leak is ever found that
  # the parallel run missed, the flag is the lever, not the job.
  #
  # DELIBERATELY NOT in `suites-ran` at the foot of this file: this job
  # skips on exactly the condition `linux-tests` skips on (`check`'s
  # archive), so the Linux row there already reports the silence.
  # ===================================================================
  unit-one-process:
    # Same form and same reason as `linux-tests` above: the REAL
    # precondition is the archive, not `check`'s conclusion.
    if: ${{ !cancelled() && github.repository != 'nzbfast/nzbfast' && needs.check.outputs.archive == 'success' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-unit-one-process-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      # The checkout is not decoration, for the reasons the note above
      # `linux-tests` gives (fixture-backed tests read files from the
      # tree) and for one more of this job's own: `nextest list`
      # refuses a `--workspace-remap` directory with no workspace root
      # manifest in it, and refuses it AFTER extracting, so a missing
      # checkout would fail the step rather than quietly list nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install cargo-nextest
        run: |
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 -o cargo-nextest.tar.gz \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NT_VERSION}/cargo-nextest-${NT_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${NT_SHA_LINUX}  cargo-nextest.tar.gz" | sha256sum -c -
          tar -xzf cargo-nextest.tar.gz
          sudo mv cargo-nextest /usr/local/bin/
          rm cargo-nextest.tar.gz
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive-linux
      # The same guard `linux-tests` carries, and it is load-bearing
      # twice over here. Read the long note above that step for the
      # `env!("CARGO_BIN_EXE_*")` half; the half specific to this job is
      # that the `binary-path` nextest reports is the path the binary
      # was BUILT at, not the path it was just extracted to. Those are
      # the same string only because every runner of an OS gets the same
      # workspace, which is the assumption this step refuses to leave
      # implicit.
      - name: assert this runner's workspace matches the build's
        shell: bash
        env:
          WANT: ${{ needs.check.outputs.workspace }}
          GOT: ${{ github.workspace }}
        run: |
          if [ "$WANT" != "$GOT" ]; then
            echo "::error::this runner's workspace is '$GOT' but the archive was built in '$WANT'."
            echo "::error::The archived binaries' paths and their baked CARGO_BIN_EXE_* would both be wrong."
            exit 1
          fi
          echo "workspace matches the build job: $GOT"
      # Extracting to the workspace root is what puts every binary back
      # exactly where it was built - the archive stores its members at
      # relative `target/debug/...`. `list` rather than `run`: all this
      # invocation is asked for is the extraction and the binary
      # inventory. Nothing here needs cargo or rustup on PATH (verified
      # with both removed), same as the shards.
      - name: extract the archive and inventory its binaries
        run: |
          cargo-nextest nextest list \
            --archive-file nextest-archive.tar.zst \
            --extract-to "$GITHUB_WORKSPACE" --extract-overwrite \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --list-type binaries-only --message-format json > unit-binaries.json
      # Fixed text reading a file, no `${{ }}` interpolation - the same
      # rule every scripted step in this file follows.
      - name: select the first-party unit binaries
        run: |
          python3 - <<'PY' > unit-binaries.tsv
          import json
          inventory = json.load(open("unit-binaries.json"))["rust-binaries"]
          for binary_id, binary in sorted(inventory.items()):
              # `lib`/`bin` are the unit-test binaries; `test` is an
              # integration target, which gets no process-global
              # exposure the shards do not already give it.
              if binary.get("kind") not in ("lib", "bin"):
                  continue
              # First-party only. A package id is a path URL, so this
              # asks where the crate lives rather than what it is
              # called: `crates/` is ours, `vendor/` is upstream's.
              if "/crates/" not in binary.get("package-id", ""):
                  continue
              print(binary_id, binary["binary-path"], sep="\t")
          PY
          cat unit-binaries.tsv
      - name: run each first-party unit binary in ONE process
        shell: bash
        run: |
          # A job that selected nothing and exited 0 would be a green
          # tick over zero coverage, which is the failure mode the whole
          # note above this job exists to remove. Refuse it.
          if [ ! -s unit-binaries.tsv ]; then
            echo "::error::no first-party unit binary was selected out of the archive."
            echo "::error::Either the archive is not what it was, or the selection above stopped matching."
            exit 1
          fi
          rc=0
          while IFS=$'\t' read -r id path; do
            if [ ! -x "$path" ]; then
              echo "::error::$id: '$path' is not executable on this runner."
              rc=1
              continue
            fi
            echo "::group::$id"
            if "$path"; then
              echo "$id: ok"
            else
              rc=1
              # The id stays OUT of `title=`: a binary id contains
              # `::` (`nzbfast::bin/nzbfast`), and GitHub ends the
              # annotation's properties at the first `::` it finds, so
              # an id in the title truncates it and swallows the
              # message. In the message body a `::` is just text.
              echo "::error title=A unit binary failed with its tests sharing one process::$id failed when every one of its tests ran in a single process. If linux-tests is green on this same commit then no individual test is broken IN ISOLATION - but there are THREE shapes here and only ONE of them has a polluter, so do not reach for the bisect first. (a) POLLUTION: an earlier test left process-global state that this one read; visible even serially. (b) A CONCURRENT RACE on a process-global: two tests on different THREADS raced a counter - this job invokes the binary bare, so libtest is PARALLEL and can see it, and '-- --test-threads=1' structurally CANNOT reproduce it. (c) NO POLLUTER AT ALL: the test depends on a wall-clock duration it never sets - a window that rolls, a token that expires - and slow setup on a loaded box overran it. THE TELL, and it costs one run: re-run the failing test ALONE with the box busy. If it STILL fails there is no neighbour to find - that is (c), so read the test for a duration it depends on but never sets, and fix the TEST, never the production constant. If it passes alone and fails only in company it is (a) or (b). Reproduce with 'cargo test' - never nextest - on that target. libtest names the VICTIM and never the polluter: 'tools/pollution-bisect.py -p <crate> <the failing test>' names the polluter for (a) in minutes, but do NOT hand it a FLAKY victim - it refuses one that fails alone, and otherwise converges on an innocent neighbour and prints it with the confidence of a real answer. Never add '--test-threads=1' to make a red go away; that deletes the (b) coverage. nightly.yml's 'one-process-loaded' runs this same binary tens of times under load and reports a RATE, which is where (c) shows up on its own."
            fi
            echo "::endgroup::"
          done < unit-binaries.tsv
          exit "$rc"

  # ===================================================================
  # WINDOWS. The same fast unit suites, on every push.
  #
  # The workspace suite had NEVER run on Windows on any architecture
  # until a Windows-on-ARM probe added the public pr-check job, and that
  # first run exposed four real product bugs - `copy_tree`'s fsync alone
  # broke every cross-device move and the spool migration on the x64
  # binary we ship, and a download folder and a library on two different
  # drives is the ordinary Windows setup. Development happens in THIS
  # repo and pr-check never runs here, so a Windows regression merged to
  # main had nothing to catch it until the next nightly at best. This
  # leg names the commit. It earned its keep again on 17 Aug 2026,
  # catching a Windows-only bug every other gate passed.
  #
  # Unit suites only, and that is the cost call: Windows runners bill at
  # 2x on a private repo, the daemon and e2e targets are the slow ones,
  # and they already run on Windows nightly (nightly.yml).
  #
  # THE BILLING NOTE, because this now spawns seven Windows jobs where
  # there was one. Billed minutes are roughly FLAT, not 7x: the old job
  # spent ~19 minutes running tests one lump at a time on one 4-vCPU
  # runner, and four shards do the same total work concurrently. What is
  # genuinely new is per-job fixed cost (~1 min of runner setup each)
  # and the 2.4 GB cache restored by three jobs instead of one. That is
  # the trade for a ~35 minute wall-clock saving on the release path.
  # This is NOT the matrix TODO 116c priced NO in August: that one
  # duplicated the BUILD, which is the dominant cost. These shards
  # compile nothing.
  # ===================================================================
  windows-build:
    needs: changes
    if: ${{ github.repository != 'nzbfast/nzbfast' && needs.changes.outputs.build == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: ci-windows-build-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    outputs:
      # Same rationale as `check`'s: the shards need the ARCHIVE, not a
      # green job. This job's cache-save step can fail transiently on a
      # 2x-billed runner, and that must not cost us the Windows suites.
      archive: ${{ steps.archive.outcome }}
      # The path the archive's binaries were built at. The shards
      # compare it to their own - see the guard in those jobs.
      workspace: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
      # windows-latest is I/O bound and Defender scans every object file
      # and every one of the 54 statically linked test executables as
      # the linker writes them. Excluding the two directories that see
      # all of that write traffic is the known large win on this runner
      # class, and it costs one second.
      #
      # Wrapped in try/catch and never fatal: this is a performance
      # measure, not a gate, and a hosted image that declines the call
      # (or has Defender disabled already) must not turn the build red.
      # `-ErrorAction Stop` inside the try so a non-terminating error
      # still reaches the catch.
      - name: exclude the build tree from Defender
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Add-MpPreference -ErrorAction Stop -ExclusionPath `
              "$env:GITHUB_WORKSPACE", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$env:RUNNER_TEMP"
            Add-MpPreference -ErrorAction Stop -ExclusionProcess `
              "cargo.exe", "rustc.exe", "link.exe", "cl.exe", "lib.exe", "cargo-nextest.exe"
            Write-Host "Defender exclusions added"
          } catch {
            Write-Host "Defender exclusions unavailable, continuing: $($_.Exception.Message)"
          }
      # No toolchain step: rust-toolchain.toml pins the version and
      # rustup installs it for the msvc host on the first cargo
      # invocation. Same as the Windows jobs in pr-check.yml and
      # nightly.yml; an explicit `rustup default stable` would be
      # overridden by that pin anyway.
      #
      # shell: bash for the key step so the one script runs identically
      # on both legs - Git Bash is on every windows-latest image, and a
      # second implementation of the same hash is a second thing to keep
      # in step.
      - name: dependency cache key
        id: depkey
        shell: bash
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # runner.os is in the key, so this cannot collide with the Linux
      # job's cache. The `-v4` suffix rides with the rars opt-level
      # override in the workspace Cargo.toml (and, before it, the
      # CARGO_PROFILE_TEST_DEBUG change at the top of this file), in that
      # same commit, for the reason spelled out there: both move
      # fingerprints in the archive this key would otherwise hit.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: ci-private-v4-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # The Linux twin of this step carries the reasoning. pwsh, and
      # -ErrorAction SilentlyContinue, because Remove-Item throws on a
      # missing path where `rm -rf` does not, and a cold cache is
      # exactly when this path is missing.
      - name: drop restored incremental state
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue target\*\incremental
      # Same nextest, same pinned version and same trust model as the
      # Linux job: prebuilt, fetched by version, checked by SHA256
      # rather than trusted.
      - name: install cargo-nextest
        id: nextest
        shell: pwsh
        run: |
          $url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$env:NT_VERSION/cargo-nextest-$env:NT_VERSION-x86_64-pc-windows-msvc.zip"
          $want = $env:NT_SHA_WINDOWS
          # An EXPLICIT loop, not -MaximumRetryCount: that parameter only
          # retries HTTP 304/4xx/5xx, and what this step actually dies of
          # is `The response ended prematurely. (ResponseEnded)` - a
          # transport-level truncation it does not cover. Three Windows
          # runs were lost to it on 12 Aug 2026, at 2x private-repo
          # billing, with the workspace suite skipped every time; a
          # skipped suite reads as "Windows is fine" and it is not.
          #
          # The hash is checked INSIDE the loop so a short read retries
          # rather than failing the job, and it remains the only thing
          # that decides correctness - five bad downloads still throw.
          $ok = $false
          foreach ($i in 1..5) {
            try {
              Invoke-WebRequest -Uri $url -OutFile cargo-nextest.zip
              $got = (Get-FileHash cargo-nextest.zip -Algorithm SHA256).Hash.ToLower()
              Write-Host "attempt ${i}: cargo-nextest zip sha256 = $got"
              if ($got -eq $want) { $ok = $true; break }
              Write-Host "attempt ${i}: sha256 mismatch (expected $want)"
            } catch {
              Write-Host "attempt ${i}: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds (5 * $i)
          }
          if (-not $ok) { throw "cargo-nextest download failed after 5 attempts (expected sha256 $want)" }
          New-Item -ItemType Directory -Force -Path C:\nextest | Out-Null
          Expand-Archive cargo-nextest.zip -DestinationPath C:\nextest -Force
          Remove-Item cargo-nextest.zip
          "C:\nextest" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # The Windows half of "build once". Identical expression to the
      # Linux archive step - same absent package selection, same absent
      # heavy-tests feature - because the two legs must archive the same
      # test set or one of them is quietly narrower. Both legs dropped
      # `--workspace` on 23 Aug 2026 and they must drop it TOGETHER: the
      # long note at the Linux step has the measurements, and the reason
      # to keep the two expressions character-identical is that a
      # divergence here is invisible until a test exists on one OS only.
      # That includes --locked: the two legs must build the COMMITTED
      # dependency graph or one of them is testing a resolution the repo
      # does not contain, and this leg banks its artifacts under a cache
      # key derived from that same committed lock.
      - name: build test archive
        id: archive
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.nextest.outcome == 'success' }}
        run: cargo nextest archive --locked --archive-file nextest-archive.tar.zst
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' && steps.archive.outcome != 'skipped' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ci-private-v4-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        with:
          name: nextest-archive-windows
          path: nextest-archive.tar.zst
          retention-days: 1
          compression-level: 0

  # The name `windows-unit` is kept, because every handoff doc, memory
  # note and `gh api .../jobs` recipe in this project names it, and the
  # step people are told to confirm - `workspace suite` - is still the
  # step that decides it. It is SIX jobs since 23 Aug 2026, so the rows
  # read `windows-unit (1)` .. `windows-unit (6)`; a filter on the prefix
  # still finds them, and `ci-verdict` folds the suffix generically
  # rather than by a hardcoded count - the same fold that carries
  # `linux-tests (1)` .. `(4)`. Confirm ALL SIX reached success
  # before claiming
  # Windows coverage - `skipped` and `failure` mean opposite things and
  # the first one reads at a glance like Windows is fine. That
  # confirmation is no longer only yours to remember: `suites-ran` at
  # the foot of this file turns the build-died case into a red row of
  # its own, and its note carries the census of what `skipped` means
  # here.
  #
  # Compiles nothing, same as linux-tests: no toolchain, no cache, no
  # target/. NZBFAST_LAN_TESTS is deliberately NOT set - it opens an
  # all-interfaces listener, which on Windows raises the Defender
  # Firewall dialog, and a hosted runner has nobody to click it.
  # SIX SHARDS, NOT FOUR, since 23 Aug 2026 - and Linux deliberately
  # stays at four. Two things had to become true before this was worth
  # anything, and both did on the same day.
  #
  # The rars opt-level override removed the long pole: one test used to
  # be 272s of a 452s shard, and no amount of sharding can cut a shard
  # below its longest single test. The slowest test on any Windows shard
  # is now 16.3s, so the shard wall is finally just the sum divided by
  # the shard count, which is the only regime where adding shards pays.
  #
  # And the archive halved when nzbkit's test targets were folded
  # together (220 MB to 115 MB), so a shard's artifact download went
  # from ~12s to ~2.5s. Shard overhead is what caps how far this can go,
  # and it just got cheaper.
  #
  # Measured on run 32671981725, the four shards' own test walls were
  # 245 / 304 / 153 / 234 s, summing to 936s. That spread is the point:
  # `--partition count:` balances by test COUNT and nothing balances by
  # TIME, so the slowest shard was 70s above what an even split of the
  # same work would cost. More shards does not fix the imbalance, it
  # shrinks what the imbalance is a fraction OF. At six the even split
  # is ~156s against ~234s at four.
  #
  # The cost is honest and worth stating: two more Windows runners at 2x
  # private-repo billing, and total runner-seconds go UP slightly even
  # as wall goes down. That is the trade being made deliberately - the
  # `changes` gate above roughly halved how many runs reach this job at
  # all, and this spends a little of that back where it shortens the
  # critical path.
  #
  # Linux is left at four because it is not on that path: `check` plus
  # its slowest shard is ~861s against Windows' ~1262s, so shortening it
  # buys nothing and would only add cost.
  windows-unit:
    if: ${{ !cancelled() && github.repository != 'nzbfast/nzbfast' && needs.windows-build.outputs.archive == 'success' }}
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    concurrency:
      group: ci-windows-unit-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install cargo-nextest
        shell: pwsh
        run: |
          $url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$env:NT_VERSION/cargo-nextest-$env:NT_VERSION-x86_64-pc-windows-msvc.zip"
          $want = $env:NT_SHA_WINDOWS
          $ok = $false
          foreach ($i in 1..5) {
            try {
              Invoke-WebRequest -Uri $url -OutFile cargo-nextest.zip
              $got = (Get-FileHash cargo-nextest.zip -Algorithm SHA256).Hash.ToLower()
              if ($got -eq $want) { $ok = $true; break }
              Write-Host "attempt ${i}: sha256 mismatch (expected $want)"
            } catch {
              Write-Host "attempt ${i}: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds (5 * $i)
          }
          if (-not $ok) { throw "cargo-nextest download failed after 5 attempts (expected sha256 $want)" }
          New-Item -ItemType Directory -Force -Path C:\nextest | Out-Null
          Expand-Archive cargo-nextest.zip -DestinationPath C:\nextest -Force
          Remove-Item cargo-nextest.zip
          "C:\nextest" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive-windows
      # shell: bash so the invocation is the Linux one character for
      # character. Under the default pwsh a multi-line block only
      # propagates the LAST exit code, which has manufactured a green
      # step here before.
      # ---------------------------------------------------------------
      # EXTRACT TO THE WORKSPACE ROOT, and this is not a detail.
      #
      # ~30 of this repo's test files (161 sites) locate the daemon with
      # `env!("CARGO_BIN_EXE_nzbfast")`. `env!` is resolved at COMPILE
      # time, so what the archived test binaries carry is an ABSOLUTE
      # path to `<build runner's workspace>/target/debug/nzbfast` - and
      # nothing at runtime can remap it. `--workspace-remap` fixes
      # CARGO_MANIFEST_DIR; it cannot touch this.
      #
      # Left to itself nextest extracts to a fresh temp dir, that path
      # does not exist, and every daemon-spawning test dies instantly on
      # `Os { code: 2, kind: NotFound }`. Measured, not guessed: run
      # 31990300316 failed exactly this way on all four Linux shards.
      #
      # The escape is that GitHub gives every runner of an OS the SAME
      # workspace path (`/home/runner/work/<repo>/<repo>`,
      # `D:\a\<repo>\<repo>`), so the build job's baked
      # `$GITHUB_WORKSPACE/target/debug/nzbfast` is a valid path on a
      # shard too - as long as the archive is unpacked there. The
      # archive stores its members at RELATIVE `target/debug/...`, so
      # `--extract-to $GITHUB_WORKSPACE` puts every binary back exactly
      # where it was built.
      #
      # That makes a path assumption load-bearing, so the step below
      # ASSERTS it rather than trusting it: the build job publishes the
      # workspace it built in, and if that ever stops matching this
      # runner the job says so in one line instead of failing ~1,300
      # tests with a NotFound apiece.
      #
      # It compares job outputs rather than reading the archive, and
      # that is not a style choice: the first version of this guard
      # shelled out to `tar --use-compress-program=unzstd`, which does
      # not exist in Git Bash on windows-latest, so it failed on its own
      # tooling instead of on the thing it was checking (run
      # 31991506018). A guard that needs a tool the runner lacks is a
      # second failure mode, not a safety net.
      # ---------------------------------------------------------------
      - name: assert this runner's workspace matches the build's
        shell: bash
        run: |
          want='${{ needs.windows-build.outputs.workspace }}'
          got='${{ github.workspace }}'
          if [ "$want" != "$got" ]; then
            echo "::error::this runner's workspace is '$got' but the archive was built in '$want'."
            echo "::error::env!(\"CARGO_BIN_EXE_*\") bakes an absolute path at compile time, so every"
            echo "::error::daemon-spawning test would fail NotFound. See the note above this step."
            exit 1
          fi
          echo "workspace matches the build job: $got"
      - name: workspace suite (shard ${{ matrix.shard }}/6)
        shell: bash
        run: |
          cargo-nextest nextest run --profile ci \
            --archive-file nextest-archive.tar.zst \
            --extract-to "$GITHUB_WORKSPACE" --extract-overwrite \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --partition count:${{ matrix.shard }}/6 \
            -E "$NT_EXCLUDE"
      # The junit half, exactly as the Linux shards run it - see the long
      # note at that step for why a green suite is not enough on its own.
      # Windows gets it for the same reason it gets the suites at all: a
      # wedge is a scheduling defect, and the one platform whose scheduler
      # nobody here can reproduce is this one. `py=python3 ... || py=python`
      # is this repo's Windows idiom - the image ships both spellings and
      # only one of them is always on PATH under git bash.
      - name: wedge gate (shard ${{ matrix.shard }}/6)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          $py tools/wedge-gate.py --junit "$GITHUB_WORKSPACE/target/nextest"

  # The clippy gate that CANNOT run on Linux. Until this step existed,
  # clippy ran in exactly two jobs - `check` above and pr-check's
  # `build-and-test` - and BOTH are ubuntu-latest. clippy only lints what
  # compiles for the host, so every `#[cfg(windows)]` block in the tree
  # was linted on no runner anywhere. That is the exact mirror of the
  # trap that held main red for six pushes over one `unused_unsafe`
  # behind `cfg(target_os = "linux")` that no macOS session could
  # reproduce; macOS arms are covered in practice because development
  # happens on Macs, so Windows was the one real hole. The first run
  # found nine, including a needless_return in mem.rs's cfg(windows) arm
  # of exactly the shape that trap ended on.
  #
  # ITS OWN JOB as of this commit. It used to run third in windows-unit,
  # after the suites, with a comment explaining that the ordering was
  # deliberate - "the tests are the signal this job exists for, and a
  # lint failure must not cost us them" - and a §116.4 step guard to stop
  # a red suite skipping it. A separate job gets both properties for
  # free and costs no serialisation: this was ~4.5 min of the old job's
  # 49, spent waiting for tests it has nothing to do with.
  #
  # --keep-going because clippy stops at the first failing crate -
  # without it nzbtray's errors masked nzbkit's, which masked
  # nzbfast's, and each round surfaced only one crate's worth.
  #
  # The heavy-tests features enrol the seven build-gated targets (TODO
  # 116b/116f) so this step lints them. Without it they stop compiling
  # here at all, leaving one cfg(windows) site across the seven files
  # linted on no runner anywhere - the same hole in miniature that this
  # whole job exists to close. Check-mode links nothing, so it costs
  # none of the link time the gate saves.
  #
  # A PASSING Windows clippy log shows NO `Checking nzbkit` lines: cargo
  # prints `Compiling nzbkit` instead when that package's build.rs is
  # compiled in the same invocation, and all three workspace crates have
  # one. That has read as a green-that-scanned-nothing twice. Never read
  # an exit-0 lint run as proof until a positive control has shown the
  # harness can fail.
  windows-clippy:
    needs: changes
    if: ${{ github.repository != 'nzbfast/nzbfast' && needs.changes.outputs.build == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: ci-windows-clippy-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: exclude the build tree from Defender
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Add-MpPreference -ErrorAction Stop -ExclusionPath `
              "$env:GITHUB_WORKSPACE", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$env:RUNNER_TEMP"
            Add-MpPreference -ErrorAction Stop -ExclusionProcess `
              "cargo.exe", "rustc.exe", "link.exe", "cl.exe", "lib.exe"
            Write-Host "Defender exclusions added"
          } catch {
            Write-Host "Defender exclusions unavailable, continuing: $($_.Exception.Message)"
          }
      # NO CACHE HERE, and that is measured rather than an oversight.
      # This job restored the same ~1.1 GB archive windows-build uses,
      # and it made the job SLOWER. Four runs, 17 Aug 2026:
      #
      #   cache MISS: 436s (31990300316), 387s (31993500642)
      #   cache HIT : 487s (31991506018), 467s (31992357759)
      #
      # The restore costs 64-115s and buys about 25s of compile, because
      # this step passes `--features heavy-tests` for lint scope and
      # check-mode metadata - so its units do not share fingerprints
      # with the archive build that wrote the cache, and almost nothing
      # in it is reusable here. Restoring a gigabyte to reuse a
      # rounding error is a straight loss on a runner that bills at 2x.
      #
      # If you are tempted to add it back: measure the JOB, not the
      # clippy step. The step does get slightly faster; the job does
      # not, because the restore is on the clock too.
      #
      # --locked for the reason given at the clippy step in `check`: a
      # gate that lets cargo re-resolve an unstaged manifest edit is
      # green about a tree that is not in the repo. This job caches
      # nothing, so here it buys only the assertion - which is the half
      # that matters on a lane whose whole job is to lint cfg(windows)
      # code nobody else compiles.
      #
      # `-p nzbfast-ffi` for the reason the Linux clippy step gives at
      # length: since the archive step stopped taking `--workspace`,
      # the two clippy gates are the only things in this file that
      # compile that crate and the `ffi` crate root behind it. It is
      # here as well as on Linux because the archive step used to build
      # it on BOTH legs, so leaving it off here would be a real drop in
      # what Windows compiles rather than a move. Verified clean 23 Aug
      # 2026 against x86_64-pc-windows-gnu from the mac box (brew
      # mingw-w64 required, per the recipe in 012549847): 35.8 s ->
      # 44.5 s wall, 127 s -> 149 s CPU, zero new findings.
      - name: clippy (windows-gated code)
        run: cargo clippy -p nzbkit -p nzbfast -p nzbtray -p nzbfast-ffi --locked --all-targets --no-deps --keep-going --features nzbkit/heavy-tests,nzbfast/heavy-tests -- -D warnings

  # The ARM64 gate. `cargo clippy --target` runs in check mode - it
  # never links - so an x64 runner covers aarch64-pc-windows-msvc with
  # nothing installed but the rust target, and the ARM64 MSVC linker
  # is only needed by the release job that actually emits exes.
  #
  # What it is really guarding is not lint but COMPILATION, and two
  # specific ways this target diverges from the x64 one that shares
  # all its `cfg(windows)` code:
  #   - rapidyenc's C++ kernels are compiled here by cl.exe for ARM64
  #     rather than cl.exe for x64, taking the `_M_ARM64` arms of
  #     vendor/rapidyenc/src/common.h that no other job compiles;
  #   - nzbkit's own aarch64 paths (gf16's NEON kernels, the
  #     `is_aarch64_feature_detected!` probes in nntp.rs and
  #     sysbench.rs) meet Windows runtime feature detection for the
  #     first time - every other aarch64 build we make is macOS or
  #     Linux.
  # Neither is reachable from any other runner in CI, which is the
  # same hole - `cfg` code linted nowhere - that windows-clippy exists
  # to close, one axis over.
  #
  # nzbtray is in the list because the tray ships in the ARM64 package
  # exactly as it does in the x64 one, and it is the crate where
  # Windows-only code is ALL of the crate.
  #
  # Deliberately not --all-targets: the shipped artifacts are the lib
  # and the two bins, and pulling the test targets in would compile a
  # second copy of the dependency graph for a target we do not run
  # tests on.
  #
  # Its own job as of this commit - it was ~4 min at the very end of the
  # old serial windows-unit, and it shares nothing with the suites but a
  # dependency graph. It does NOT share the x64 cache usefully (a
  # different target triple is a different artifact tree), so it does
  # not restore one; what it pays is a dependency compile for aarch64 in
  # check mode, which is what it always paid.
  windows-arm64:
    needs: changes
    if: ${{ github.repository != 'nzbfast/nzbfast' && needs.changes.outputs.build == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: ci-windows-arm64-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: exclude the build tree from Defender
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Add-MpPreference -ErrorAction Stop -ExclusionPath `
              "$env:GITHUB_WORKSPACE", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$env:RUNNER_TEMP"
            Add-MpPreference -ErrorAction Stop -ExclusionProcess `
              "cargo.exe", "rustc.exe", "cl.exe"
            Write-Host "Defender exclusions added"
          } catch {
            Write-Host "Defender exclusions unavailable, continuing: $($_.Exception.Message)"
          }
      # --locked, as at every other cargo gate in this file: the graph
      # this cross-check compiles must be the committed one, because the
      # committed one is what release.yml builds the ARM64 package from.
      - name: cross-check aarch64-pc-windows-msvc (ARM64 beta target)
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo clippy --target aarch64-pc-windows-msvc --locked -p nzbfast -p nzbtray --no-deps -- -D warnings

  # The SLIM build - `--no-default-features`, which drops `indexer` and
  # with it the index/Spotnet/wall/enrichment stack. It is a shipped
  # configuration (phones, small boxes; see the feature's own note in
  # crates/nzbfast/Cargo.toml) and until this job nothing in CI compiled
  # it: `check`, the shards, windows-* and nightly all build with default
  # features, so `#[cfg(feature = "indexer")]` is only ever evaluated in
  # its true arm.
  #
  # Measured 22 Aug 2026: it did not compile, and had not for long enough
  # that nobody could say when it broke. Three E0599s of one shape - an
  # ungated `Daemon` method calling gated ones (`db_maintenance_ok`, from
  # the sweep-8 L12 work). That is the whole failure mode this guards:
  # nothing about the slim build is subtle, it is just never looked at,
  # and the compiler finds it in one pass the moment anything does.
  #
  # `--all-targets`, added 22 Aug 2026, and the reason it is here rather
  # than in a job of its own is a MEASUREMENT that contradicts the guess
  # that kept it out. The job shipped without it, so the slim TEST
  # targets had never been built anywhere by anyone, and that hole cost
  # a real breakage the same day: two E0425s on `WALL_HTML`, which is
  # gated with the indexer stack in serve/assets.rs and was named by two
  # UNGATED `#[cfg(test)]` sites, broken for an unknown length of time
  # and fixed in c013e1878. The guess was that `--all-targets` roughly
  # DOUBLES the job, which given the budget below would have made it a
  # bad trade - a gate cancelled while pending more often can buy less
  # than it costs. Four cold-to-cold runs on the dev Mac say otherwise:
  #
  #   quiet box   plain 21.6s / 20.7s     --all-targets 29.8s / 28.4s
  #   loaded box  plain 68.1s             --all-targets 63.0s
  #
  # So +38% on a quiet box and INSIDE THE NOISE on a loaded one, not
  # +100%: `--no-default-features` drops the six `required-features =
  # ["heavy-tests"]` targets, and what is left (the bin's own cfg(test)
  # build, the non-heavy integration tests, two examples) is 13.9s and
  # 8 MB layered onto a warm slim tree, against ~250 dependency crates
  # that both configurations pay for identically and that dominate a
  # cold run. Expect roughly 2m03s -> 2m30s on the runner, not 4m.
  #
  # Two alternatives were declined on that number. Putting the slim
  # `--all-targets` build in nightly.yml would find the breakage up to a
  # day and ~200 commits later, and nightly is where the time-MEASURING
  # suites live - this is a compile check that costs seconds. Giving it
  # its own job would pay the whole cold dependency graph (~2 min, 275
  # MB, no cache by design) a SECOND time to save eight seconds on the
  # first; that is the carve-out reasoning above `jobs:` run backwards,
  # because there the cheap half was seconds waiting behind minutes and
  # here both halves are one two-minute graph.
  #
  # What it costs by this file's own law: the honest metric is the
  # VERDICT INTERVAL, not the per-commit rate (see the long note above
  # `env:`). main is fast-forward only and the single pending slot
  # always holds the tip, so a cancelled run costs attribution, not
  # coverage. This moves slim-check's interval by about 30 seconds and
  # its blame window by well under a commit at the measured cadence.
  #
  # `cargo check`, not clippy, and no `-D warnings` - but NOT any longer
  # for the reason this comment used to give. That reason was that the
  # slim config is not warning-clean: about a dozen items are dead
  # without `indexer` (the search-log constants, the scoreboard
  # accessors, several Daemon fields) and silencing them would mean a
  # dozen more cfgs on code the default build compiles. Re-measured 22
  # Aug 2026 with `--all-targets` in hand and that is NO LONGER TRUE:
  # the slim build emits zero warnings from `nzbfast`, in the plain
  # command and this one alike, and `cargo clippy -p nzbfast
  # --no-default-features --locked --all-targets --no-deps -- -D
  # warnings` PASSES on this tree. (The three warnings you will still
  # see are rustc's, from the vendored `rars` lib, which `--no-deps`
  # does not silence because they are not clippy lints; they are
  # identical under the plain command and are nobody's change.) So the
  # standing follow-up - make the slim build warning-clean so this step
  # can be tightened - has no work left in it, and the three
  # `unused_mut` the gated-push idiom emits under `--all-targets` are
  # silenced at the `let` rather than left for it.
  #
  # The tightening was still declined, on the same measurement that
  # bought `--all-targets`, run the other way: cold on the same quiet
  # box, `cargo check --all-targets` is 29.8s and the clippy line above
  # is 82.7s. THAT is the doubling-and-more the `--all-targets` guess
  # wrongly feared, and it buys little here - `check` already lints the
  # default config with `-D warnings`, so the increment is slim-only
  # lints, against a compile check that is the entire reason this job
  # exists. Revisit if the cadence ever slackens; the precondition is
  # met and it is one line.
  #
  # Cheap enough not to need any of the machinery above it. Cold on an
  # M-series Mac: 274 MB of check-mode artifacts for the plain command
  # (53s on the day the job landed, 21s on a quiet box - the spread is
  # how many other sessions are building, and it is wider than the
  # `--all-targets` delta), 276 MB for this one, most of the graph being
  # dependencies that the default build shares. On the runner, the first
  # real run of the plain command (32589275605, green): 2m03s for the
  # job, 1m44s of it the cargo step, entirely cold. So no cache is
  # restored - a different feature set is a different artifact tree, the
  # same reason windows-arm64 does not restore one - and no disk reclaim
  # is needed.
  #
  # `--locked`, as at every other cargo gate in this file.
  slim-check:
    needs: changes
    if: ${{ github.repository != 'nzbfast/nzbfast' && needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-slim-check-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: check --no-default-features --all-targets (indexer off)
        run: cargo check -p nzbfast --no-default-features --locked --all-targets

  # ===================================================================
  # DID THE TEST SHARDS ACTUALLY RUN? One row that answers it.
  #
  # `linux-tests` and `windows-unit` are gated on their build job's
  # `archive` output, so when that build dies all four shards resolve
  # to `skipped` - a grey dash on the summary next to one red X. That
  # reads like a job with nothing to do, not like test coverage that
  # did not happen. Between 21 and 23 Aug 2026 `windows-build` was red
  # on main and the Windows suite ran ZERO tests for two days; only the
  # build job looked wrong. The note above `windows-unit` answered that
  # with an instruction to a human - "confirm all four reached success"
  # - which is exactly the shape every gate in this repo replaced.
  #
  # THE HARD PART is that `skipped` has two causes that look identical
  # on the summary and mean opposite things. Either the parent FAILED,
  # so coverage silently did not happen, or the parent was CANCELLED
  # because the next push displaced it while pending - which the long
  # note above `env:` measures as the fate of most runs on this branch.
  # Counted over the 400 runs on main of 21-23 Aug 2026, by job
  # conclusion:
  #
  #   windows-build -> windows-unit      check -> linux-tests
  #     328  cancelled -> skipped          313  cancelled -> skipped
  #      41  success   -> success           70  success   -> success
  #      20  failure   -> skipped           15  success   -> cancelled
  #       9  success   -> failure
  #
  # A detector that fires on `skipped` alone therefore fires on 348 of
  # 400 pushes and is pure noise. One that also requires the parent to
  # have FAILED fires on 20, and each of those 20 is a commit that got
  # no Windows coverage at all. `needs.<job>.result` is the field that
  # separates the two, because `outputs.archive` is empty for both.
  #
  # THE PARENT'S RESULT ALONE IS NOT ENOUGH EITHER, and this is the
  # half that reads backwards: `check` is red whenever clippy or one of
  # its gates is red, and the archive it published is still good, so
  # the shards DO run and there is nothing to report. Both halves are
  # load-bearing - the parent failed AND the shards were skipped.
  #
  # MEASURED, not reasoned, on probe run 32643713906 - a throwaway
  # branch, deleted after, the method TODO 116.4b used. Four parents,
  # a matrix child each, gated character for character as the two jobs
  # above:
  #
  #   parent red at a LATE step, archive good  -> child success
  #   parent red AT the archive step           -> child skipped
  #   parent success                           -> child success
  #   parent cancelled by a superseding push   -> child skipped
  #
  # reading `needs.<parent>.result` failure / failure / success /
  # cancelled in that order. A matrix child with one red leg and one
  # green aggregated to `failure`, so a shard set that ran and failed
  # can never be misread as one that never ran.
  #
  # TWO THINGS ABOUT `!cancelled()` THAT WERE WORTH MEASURING. On that
  # same run a job was cancelled by its own concurrency group and this
  # guard still ran, with `cancelled()` FALSE - per-job cancellation is
  # not workflow cancellation, so a guard cannot inherit its silence
  # from `!cancelled()` and has to stay quiet by its own expression.
  # Then on run 32643756850 the whole run was cancelled through the
  # API: the `!cancelled()` guard came out `cancelled` and reported
  # nothing, while an `always()` twin beside it reported anyway. That
  # is why this is `!cancelled()` and not `always()` - the same reading
  # TODO 116.4a took, now with a run behind it.
  #
  # WHAT IT COSTS, honestly: one ubuntu job per push, a few seconds of
  # runner time, and nothing at all while it waits on `needs:`. It is
  # deliberately given NO concurrency group. The arithmetic above
  # `env:` is that a grouped job loses its pending slot to the next
  # push, and a guard displaced exactly when a build is slow and red is
  # worse than no guard at all.
  #
  # THE FALSE POSITIVE, equally honestly: on a genuine build break this
  # is a SECOND red row for one cause. That is the trade, and the
  # second row is the one that says the suites did not run - which the
  # first row does not say and never did.
  #
  # THE FALSE NEGATIVE is deliberate: when the shards themselves are
  # displaced while pending (15 of 400 above) coverage also did not
  # happen, and this stays quiet. That is the push-cadence problem the
  # three costed options above `env:` decline to buy, not a broken
  # build, and firing on it would drown the case this exists for.
  # ===================================================================
  suites-ran:
    if: ${{ !cancelled() && github.repository != 'nzbfast/nzbfast' }}
    needs: [check, linux-tests, windows-build, windows-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Job results arrive through `env:` rather than inline `${{ }}`,
      # so the script is fixed text and the expressions are data. Same
      # rule as every other scripted step in this repo.
      - name: were the test shards run?
        shell: bash
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          LINUX_RESULT: ${{ needs.linux-tests.result }}
          WBUILD_RESULT: ${{ needs.windows-build.result }}
          WUNIT_RESULT: ${{ needs.windows-unit.result }}
        run: |
          rc=0
          lane() {
            printf '%-8s %-14s %-9s   shards %s\n' "$1" "$2" "$3" "$4"
            if [ "$4" = skipped ] && [ "$3" = failure ]; then
              echo "::error title=$1 tests never ran::$2 failed, so the four $1 shards were skipped. This commit has NO $1 test coverage - the red $2 row is not the whole story."
              rc=1
            fi
          }
          echo "lane     build job      result      test shards"
          lane Linux   check         "$CHECK_RESULT"  "$LINUX_RESULT"
          lane Windows windows-build "$WBUILD_RESULT" "$WUNIT_RESULT"
          exit "$rc"
