# Nightly deep CI for the PRIVATE repo. ci-private stays lean on purpose
# (format + lint + fast unit suites on every push); this picks up the
# long daemon and e2e suites on a schedule so a regression in them shows
# up within a day instead of at the next local pre-push run. Gated to
# the private repo like ci-private.yml (cost rationale in pr-check.yml).
name: nightly
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: "Minutes of mixed-queue soak (TODO 82). The scheduled run uses 150."
        required: false
        default: "150"
permissions:
  contents: read
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  long-suites:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This job's debug `target/` plus the restored cache had run the
      # runner down to 1.3 GB free by 15 Aug 2026, and the daemon's own
      # `min_free` floor is 2 GB - so the queue runner held EVERY job
      # before it started and the daemon suite reported 50-odd unrelated
      # 30 s timeouts, none of which said "disk". The suites now pass
      # `--min-free 0` so they cannot be held that way again, but the
      # headroom is worth having on its own: a debug build of this
      # workspace with the seven heavy targets linked is tens of GB, and
      # the next thing a full disk breaks is the build, not a guard.
      #
      # Nothing removed here is used by a Rust job. The toolchain lives
      # under ~/.rustup and par2 arrives via apt below, neither of which
      # is touched. `|| true` throughout: a runner image that drops one
      # of these must not turn into a red nightly.
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Same fixture dependency as pr-check: the e2e repair tests CREATE
      # their PAR2 sets with the external `par2` and skip without it.
      - name: test deps (par2 for repair e2e)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq par2
      # Cargo.lock moves on EVERY release (packaging/bump-version.sh
      # rewrites it), and this key used to be `hashFiles('Cargo.lock')` -
      # so the first nightly after a release ran cold on every job.
      # Measured 17 Aug 2026 on run 32014400559: all four cache restores
      # took 0-1s, every one a miss, and `long-suites` spent 4m08s
      # building where the one warm run in the same sample took 1m32s.
      # tools/dep-cache-key.py hashes the lockfile with the workspace
      # members' own version lines normalised out, so our own version
      # bumps stop throwing away ~600 compiled crates. Same tool, same
      # rationale, same `-v2`-style suffix discipline as ci-private.yml.
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # restore + save as SEPARATE steps, not the combined actions/cache:
      # its post step does NOT save when the job FAILED, so one red night
      # left the next night cold as well. That is not hypothetical here -
      # on run 32014400559 `armv7-cross` failed and its
      # `Post Run actions/cache` reads `skipped`. The save below is
      # `if: always()` and sits immediately after the build, so the
      # dependency artifacts are banked whatever the suites then do.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # nextest, not libtest, and the reason is diagnostic rather than
      # speed: with `retries = 1` in .config/nextest.toml a flake is
      # reported as a NAMED FLAKY test with both attempts' output, where
      # bare `cargo test` gave an anonymous pass/fail tally. These are
      # the flakiest suites in the repo, so they are the ones that most
      # needed it - and they were the last place in CI still on libtest.
      # Prebuilt, pinned by version, checked by SHA256 rather than
      # trusted: same pattern as the armv7 job below and ci-private.yml.
      - name: install cargo-nextest
        run: |
          set -euo pipefail
          ver="0.9.140"
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 -o cargo-nextest.tar.gz \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${ver}/cargo-nextest-${ver}-x86_64-unknown-linux-gnu.tar.gz"
          echo "4ee9aaa0d0171a985a5d0eb735b87355894c1c455972e9674fb9fdbd1387c9a3  cargo-nextest.tar.gz" | sha256sum -c -
          tar -xzf cargo-nextest.tar.gz
          sudo mv cargo-nextest /usr/local/bin/
          rm cargo-nextest.tar.gz
      - name: build
        id: build
        run: cargo build -p nzbfast --locked
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # EVERY suite step below carries the same `if`, and that is the
      # point: a red suite must not hide the ones after it.
      #
      # It used to. The suites ran as plain sequential steps, so one
      # failure skipped the whole rest of the job, and the four
      # elapsed-time targets were additionally chained inside ONE
      # `run: |` block under `bash -e`, which hid them from each other
      # too. Both layers fired at once for four nights (7-10 Aug 2026):
      # the e2e `speculative_prefetch` panic skipped the elapsed-time
      # step entirely, so index_size_cap, http_wedge and queue_soak had
      # no CI verdict from 6 Aug, and the 10 Aug dispatched re-run that
      # finally reached the step died on index_size_cap and still never
      # reached http_wedge. Four days of three targets not running read
      # exactly like "one known test is broken" (TODO 143).
      #
      # `!cancelled()` rather than `always()`: a cancelled run (the
      # concurrency group superseding it) should stop, not grind through
      # every suite. And gated on the build having SUCCEEDED, so a
      # compile failure still reports once instead of six identical
      # times.
      #
      # NZBFAST_NO_ENRICH keeps enrichment workers off the real
      # internet; NZBFAST_REQUIRE_PAR2 turns a broken par2 install into
      # a red run instead of silently skipped repair coverage
      # (rationale in pr-check.yml). --test-threads=1 is a hard
      # requirement for the daemon suite (CLAUDE.md invariant 4); the
      # e2e suite tolerates parallelism but carries timing-sensitive
      # stall/watchdog tests (8-10s abort windows), so it runs
      # single-threaded here too - nightly has the time budget.
      - name: daemon suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo nextest run --profile ci -p nzbfast --locked --features heavy-tests --test daemon
      - name: e2e suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo nextest run --profile ci -p nzbfast --locked --features heavy-tests --test e2e
      # The other half of ci-private's exclusion list. That job runs
      # `--workspace` minus seven names; three of them (daemon, e2e,
      # leak_soak) already had a home here, and these four did not have
      # one anywhere - so without this step the exclusion would not be
      # deferring them, it would be dropping them.
      #
      # They are excluded from the push path because they MEASURE
      # ELAPSED TIME, not because they are merely slow: conn_tuner races
      # a throttled mock over a connection ladder, index_size_cap and
      # queue_soak fill real stores, http_wedge waits on a bounded pool.
      # Roughly 80% of the workspace's runtime between them, and the kind
      # of test that wants a machine with time rather than a push gate.
      #
      # Named explicitly rather than globbed, deliberately: a target
      # added to crates/*/tests/ tomorrow must inherit "runs on push"
      # from ci-private's --workspace, never "runs nightly, maybe" from a
      # pattern here. The push path is the default; this list is the
      # exception, and an exception should be a decision.
      #
      # Every heavy-suite invocation in this file passes `--features
      # heavy-tests`: since TODO 116b the seven targets carry
      # required-features in their Cargo.toml so the push path stops
      # LINKING what it never runs. Forgetting the flag cannot silently
      # skip a suite - cargo refuses the --test name loudly, naming the
      # feature.
      #
      # One step per target, not one block of four: see the `if` note
      # above. These four are the ones the old shape hid.
      - name: elapsed-time suite - conn_tuner
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo nextest run --profile ci -p nzbkit --locked --features heavy-tests --test conn_tuner
      - name: elapsed-time suite - index_size_cap
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo nextest run --profile ci -p nzbfast --locked --features heavy-tests --test index_size_cap
      - name: elapsed-time suite - http_wedge
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo nextest run --profile ci -p nzbfast --locked --features heavy-tests --test http_wedge
      - name: elapsed-time suite - queue_soak
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo nextest run --profile ci -p nzbfast --locked --features heavy-tests --test queue_soak
      # The FFI contract on the host, moved here from the push path on
      # 23 Aug 2026. ci-private's archive step used to take
      # `--workspace`, which is the only thing that pulls in
      # crates/nzbfast-ffi, and these two tests came along for the ride
      # - but the ride cost the push path 1,774 duplicate nzbfast tests,
      # 2.23 GB of cached target/ and a 637 MB iOS staticlib no CI job
      # links, because `--workspace` overrides the `default-members`
      # line that exists to keep the `ffi` feature off. The long note at
      # that step has the measurements.
      #
      # These two are worth keeping SOMEWHERE and this is the right
      # somewhere: at 24.4 s and 32.5 s they were the two slowest tests
      # in the whole non-heavy set, they start and stop a real in-process
      # daemon and bind a real port, and they are the host rehearsal for
      # an acceptance the iOS Simulator harness re-proves on-target
      # (research/SPIKE-IOS-STATICLIB-2026-08-05.md). The clippy gates in
      # ci-private still COMPILE and `-D warnings` lint this crate on
      # every push, so a build break in it is still same-day; what moved
      # here is only the running.
      #
      # `-p nzbfast-ffi` and nothing else, so this step and this step
      # alone pays for the ffi feature unification - the four suites
      # above build `-p nzbfast`, whose feature set this does not touch.
      # armv7-cross below reaches these two as well, under qemu on a
      # cross target; that is a second sample, not this one.
      - name: ffi contract on the host
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
        run: cargo nextest run --profile ci -p nzbfast-ffi --locked

  # ===================================================================
  # ONE PROCESS PER TARGET, SERIAL. TODO 270 items 2, 3 and 4.
  #
  # Every other test job in this repo runs under nextest, which gives
  # EVERY TEST ITS OWN PROCESS. That is what makes the shards fast and
  # their failures attributable, and it is a hole with a hard edge: a
  # test that leaves process-global state behind - a static
  # OnceLock/Mutex/Atomic, an env var, a cached global - can never be
  # observed by the test that then reads it, because the two never share
  # a process. The incident is 84ae50bd7 (a wall test and a ratelimit
  # test on opposite ends of one process-global cooldown table; main red
  # for a day with every CI job green), and 79 statics with interior
  # mutability in crates/nzbfast/src and 88 in crates/nzbkit/src say the
  # class is live in both.
  #
  # ci-private's `unit-one-process` closes that for the LINUX UNIT
  # binaries, on every push. These two jobs close the rest of it, and
  # the rest of it is where the questions actually are: the very first
  # hand-run of `e2e` in this shape, on 23 Aug 2026, went red in a way
  # no CI job in this repo could have seen (TODO 272). Measurement later
  # the same day put that particular victim down to a low-rate flake in
  # isolation rather than to pollution - and the point stands either
  # way, because until that run happened NOTHING anywhere ran these
  # targets in one process, so neither answer was available at all.
  #
  # WHY NIGHTLY AND NOT PER PUSH. Serial is the expensive direction:
  # measured on the nzbfast bin root, same binary and same box, 96.7 s
  # serial against 33.3 s parallel. `unit-one-process` costs 14m55s on a
  # runner while running PARALLEL inside each binary, so the serial
  # shape over a bigger target set is an hour-scale job. That is a
  # nightly, and a nightly is the right cadence for it anyway: this
  # class arrives with a commit that lands a static, and the push path
  # already has the parallel one-process run that caught 84ae50bd7.
  #
  # WHY SERIAL AT ALL, given the push job is parallel: A-then-B is the
  # literal shape of this class, and only the serial run puts the tests
  # in a defined order (libtest sorts the filtered set by name, so
  # `--test-threads=1` runs alphabetically). It is also what makes a red
  # run tractable - tools/pollution-bisect.py names the POLLUTER rather
  # than the victim, and it searches on exactly that ordering.
  #
  # A red run here names the BINARY. libtest reports the failing
  # assertion, which is the victim; the polluter is not in the output.
  # Every step below points at the bisect tool, which is the whole
  # remedy: it takes minutes and prints the guilty test.
  one-process-light:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    # `--tests` over both crates is 31 targets and ~3,851 tests, about
    # thirteen minutes on the dev box (measured 23 Aug 2026). The runner
    # ratio this workflow's sibling job measured for nzbkit is ~6x for
    # CPU-bound parallel work and less for serial, so budget under an
    # hour and allow for a bad night.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: test deps (par2 for repair fixtures)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq par2
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # Same restore/save split and same reason as long-suites above: the
      # combined actions/cache does not save when the job FAILED, so one
      # red night would leave the next night cold as well.
      # RESTORE ONLY, no matching save, and that is deliberate. long-suites
      # (and windows-daemon on the Windows side) already save this key, so
      # the ~600 dependency crates arrive warm; a save here would race two
      # other jobs for the same key with a DIFFERENT artifact set behind
      # it, and whichever landed first would decide what every job
      # restores tomorrow. The test binaries this job links are its own
      # and are not worth that.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # TWO invocations, and each one matches a run step below exactly.
      # `-p nzbfast -p nzbkit` in one command resolves features over the
      # union of the two packages, which is NOT what `-p nzbkit` alone
      # resolves - so a single combined build would compile one set of
      # artifacts and the run steps would then quietly compile a second.
      # That is the trap the note above `unit-one-process` in
      # ci-private.yml measured at 33 s and a duplicate artifact set.
      - name: build
        id: build
        run: |
          cargo test --locked -p nzbfast --tests --no-run
          cargo test --locked -p nzbkit --tests --no-run
      # `--tests` is every target with `test = true`, so this reaches the
      # LIB and BIN unit binaries as well as the integration ones -
      # which is the point of running it here rather than leaving the
      # unit binaries to the push job. That job runs them PARALLEL; this
      # is the serial run TODO 270 called the lever, and nightly is where
      # its price is affordable. The heavy targets are NOT in `--tests`:
      # required-features (TODO 116b) keeps them out without
      # `--features heavy-tests`, and the job below is theirs.
      #
      # Which means the split between the two crates here is lopsided,
      # and worth knowing before reading a red run. All six of the
      # nzbfast test targets that are a bare `tests/*.rs` are
      # heavy-gated, so its step is three binaries - the lib root, the
      # bin root, and the one directory-shaped target,
      # `tests/integration/main.rs`, which is where its ~30 non-heavy
      # integration modules live. nzbkit's step is its lib root plus the
      # ~27 targets that are not `conn_tuner`.
      #
      # `--no-fail-fast`, and it is not decoration: without it cargo stops
      # at the FIRST test binary that fails, so one red target would hide
      # every target after it in the same crate - and hiding the rest is
      # the exact failure mode every suite step in long-suites is split
      # up to avoid. One step per crate on top of that, so a red nzbfast
      # cannot skip nzbkit either.
      - name: nzbfast - lib and bin roots, one process each, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbfast --tests --no-fail-fast -- --test-threads=1
      - name: nzbkit - every non-heavy target, one process each, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbkit --tests --no-fail-fast -- --test-threads=1
      # Gated on the BUILD having succeeded, or a compile error would
      # print an annotation about cross-test pollution, which is a
      # confident answer to a question nobody asked.
      - name: how to read a red run
        if: ${{ failure() && steps.build.outcome == 'success' }}
        run: |
          echo "::error title=A target failed with its tests sharing one process::If the nextest suites are green on this same commit then no individual test is broken: one test in that binary is leaving process-global state that a later one reads. Do NOT make the victim order-independent - find the polluter. 'tools/pollution-bisect.py -p <crate> --test <target> <the failing test>' names it in minutes."

  one-process-heavy:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    # daemon alone is 519 s serial on the dev box (129 passed, 0 failed,
    # 9 ignored) and e2e is 306-327 s over three runs (148 passed, 1
    # ignored), all measured 23 Aug 2026 on a box under a load average
    # around 20, so on a runner this job is the hour-plus one. It is
    # also the one carrying the targets nothing had ever run this way.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: test deps (par2 for repair fixtures)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq par2
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # RESTORE ONLY, no matching save, and that is deliberate. long-suites
      # (and windows-daemon on the Windows side) already save this key, so
      # the ~600 dependency crates arrive warm; a save here would race two
      # other jobs for the same key with a DIFFERENT artifact set behind
      # it, and whichever landed first would decide what every job
      # restores tomorrow. The test binaries this job links are its own
      # and are not worth that.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # One invocation per package, each matching its run steps below -
      # see the note on the same step in one-process-light above for why
      # a combined `-p nzbfast -p nzbkit` would build a set of artifacts
      # nothing then runs. The targets are named here rather than swept
      # with `--tests` for the smaller reason that a sweep would also
      # link this crate's lib, bin and `integration` test binaries,
      # which are one-process-light's job and not this one's.
      - name: build
        id: build
        run: |
          cargo test --locked -p nzbfast --features heavy-tests --no-run \
            --test daemon --test e2e --test index_size_cap \
            --test http_wedge --test queue_soak
          cargo test --locked -p nzbkit --features heavy-tests --no-run --test conn_tuner
      # Named one at a time rather than swept, for the reason long-suites
      # gives about its own list: a target added to crates/*/tests/
      # tomorrow must inherit "runs on push" from ci-private's
      # --workspace, never "runs nightly, maybe" from a pattern here, and
      # an exception should be a decision. It is also the only way to get
      # one step per target, which is what stops a red one hiding the
      # rest.
      #
      # SIX of the seven heavy targets, and the missing one is
      # arithmetic rather than an oversight: `leak_soak` contains
      # exactly ONE test. A binary with one test cannot have a test
      # pollute another test, so a one-process run of it is bit-for-bit
      # the run nextest already does nightly, at the same multi-hour
      # price. If it ever grows a second test, it belongs here.
      - name: daemon - one process, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbfast --features heavy-tests --test daemon -- --test-threads=1
      - name: e2e - one process, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbfast --features heavy-tests --test e2e -- --test-threads=1
      - name: index_size_cap - one process, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbfast --features heavy-tests --test index_size_cap -- --test-threads=1
      - name: http_wedge - one process, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbfast --features heavy-tests --test http_wedge -- --test-threads=1
      - name: queue_soak - one process, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbfast --features heavy-tests --test queue_soak -- --test-threads=1
      - name: conn_tuner - one process, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbkit --features heavy-tests --test conn_tuner -- --test-threads=1
      # Gated on the BUILD having succeeded, or a compile error would
      # print an annotation about cross-test pollution, which is a
      # confident answer to a question nobody asked.
      - name: how to read a red run
        if: ${{ failure() && steps.build.outcome == 'success' }}
        run: |
          echo "::error title=A heavy target failed with its tests sharing one process::If the nextest run of the same target is green on this commit then no individual test is broken: one test in it is leaving process-global state that a later one reads. Do NOT make the victim order-independent - find the polluter. 'tools/pollution-bisect.py -p nzbfast --features heavy-tests --test <target> <the failing test>' names it in minutes."

  # Windows leg for the PRIVATE repo. The test suite had NEVER run on
  # Windows until a Windows-on-ARM build probe added the public-repo
  # pr-check job, and that first run exposed four real product bugs -
  # `copy_tree`'s fsync alone broke every cross-device move and the
  # spool migration on the shipping x64 binary. Development happens in
  # THIS repo, so a Windows regression merged here would otherwise sit
  # invisible until it reached a public-repo PR or a release. Windows
  # runners bill at 2x on private repos, which is why pr-check keeps
  # its Windows job public-only.
  #
  # This job ran the fast unit suites until ci-private.yml took them on
  # every push (TODO 81), which is strictly better: per-push names the
  # commit that broke it. So the split now mirrors the Linux one -
  # ci-private has the fast suites, nightly has the slow one. The
  # daemon suite is the slow one, it is the suite most likely to break
  # on Windows specifically (it spawns real daemons, binds ports and
  # moves files across the paths where every one of those four bugs
  # lived), and it had no Windows CI coverage here at all. e2e stays
  # out: it needs the external par2 as a fixture creator, and it does
  # run on Windows in pr-check's workspace pass on public PRs.
  windows-daemon:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: windows-latest
    # The Linux long-suites job above allows 90; Windows compiles this
    # workspace a good deal slower, so it gets no less.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain step: rust-toolchain.toml pins the version and
      # rustup installs it for the msvc host on the first cargo
      # invocation (same rationale as pr-check.yml's Windows job).
      #
      # No par2 fetch, unlike pr-check's Windows job: par2 there is a
      # fixture tool for the e2e repair tests, which do not run here.
      # Cargo.lock moves on EVERY release (packaging/bump-version.sh
      # rewrites it), and this key used to be `hashFiles('Cargo.lock')` -
      # so the first nightly after a release ran cold on every job.
      # Measured 17 Aug 2026 on run 32014400559: all four cache restores
      # took 0-1s, every one a miss, and `long-suites` spent 4m08s
      # building where the one warm run in the same sample took 1m32s.
      # tools/dep-cache-key.py hashes the lockfile with the workspace
      # members' own version lines normalised out, so our own version
      # bumps stop throwing away ~600 compiled crates. Same tool, same
      # rationale, same `-v2`-style suffix discipline as ci-private.yml.
      - name: dependency cache key
        id: depkey
        shell: bash
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # restore + save as SEPARATE steps, not the combined actions/cache:
      # its post step does NOT save when the job FAILED, so one red night
      # left the next night cold as well. That is not hypothetical here -
      # on run 32014400559 `armv7-cross` failed and its
      # `Post Run actions/cache` reads `skipped`. The save below is
      # `if: always()` and sits immediately after the build, so the
      # dependency artifacts are banked whatever the suites then do.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # runner.os is in the key, so this cannot collide with the
          # Linux job's cache.
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # nextest, not libtest, and the reason is diagnostic rather than
      # speed: with `retries = 1` in .config/nextest.toml a flake is
      # reported as a NAMED FLAKY test with both attempts' output, where
      # bare `cargo test` gave an anonymous pass/fail tally. These are
      # the flakiest suites in the repo, so they are the ones that most
      # needed it - and they were the last place in CI still on libtest.
      # Prebuilt, pinned by version, checked by SHA256 rather than
      # trusted: same pattern as the armv7 job below and ci-private.yml.
      - name: install cargo-nextest
        shell: pwsh
        run: |
          $ver = "0.9.140"
          $url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$ver/cargo-nextest-$ver-x86_64-pc-windows-msvc.zip"
          $want = "ec39698dfe5bcfffb7d5da037f226bc1670584ba247123f4e684a0f224fe828d"
          # Explicit loop, not -MaximumRetryCount: what this dies of is
          # `The response ended prematurely`, a transport truncation that
          # parameter does not cover. Hash checked INSIDE the loop so a
          # short read retries rather than failing the job.
          $ok = $false
          foreach ($i in 1..5) {
            try {
              Invoke-WebRequest -Uri $url -OutFile cargo-nextest.zip
              $got = (Get-FileHash cargo-nextest.zip -Algorithm SHA256).Hash.ToLower()
              if ($got -eq $want) { $ok = $true; break }
              Write-Host "attempt ${i}: sha256 mismatch (expected $want)"
            } catch { Write-Host "attempt ${i}: $($_.Exception.Message)" }
            Start-Sleep -Seconds (5 * $i)
          }
          if (-not $ok) { throw "cargo-nextest download failed after 5 attempts" }
          New-Item -ItemType Directory -Force -Path C:\nextest | Out-Null
          Expand-Archive cargo-nextest.zip -DestinationPath C:\nextest -Force
          Remove-Item cargo-nextest.zip
          "C:\nextest" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: build
        run: cargo build -p nzbfast --locked
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # --test-threads=1 is a hard requirement for the daemon suite
      # (CLAUDE.md invariant 4), same as the Linux leg above.
      #
      # NZBFAST_NO_ENRICH keeps enrichment workers off the real
      # internet. NZBFAST_LAN_TESTS is deliberately NOT set: it opens an
      # all-interfaces listener, which on Windows raises the Defender
      # Firewall dialog, and a hosted runner has nobody to click it
      # (same rationale as pr-check.yml's Windows job). NZBFAST_REQUIRE_PAR2
      # is not set either, since no par2 is installed on this runner. One
      # test in the suite DOES create a recovery set since 23 Aug 2026 -
      # daemon_bomb's post-repair route (TODO 222), which needs the
      # external par2 both as a fixture creator and as the repairer on
      # the materialize path - and it skips itself without one. The Linux
      # leg above installs par2 and sets the variable, so that route is
      # covered there; if it is ever wanted on Windows too, the cure is a
      # par2 install here plus the variable, never dropping the guard.
      - name: daemon suite
        env:
          NZBFAST_NO_ENRICH: "1"
        run: cargo nextest run --profile ci -p nzbfast --locked --features heavy-tests --test daemon

  # ===================================================================
  # THE SAME HOLE, ON WINDOWS. TODO 270 item 1.
  #
  # `windows-unit` in ci-private.yml is four nextest shards off
  # `windows-build`'s archive, so every Windows unit test runs in its
  # own process and a Windows-ONLY process global is exactly as
  # invisible there as the Linux ones were before `unit-one-process`
  # landed. There are Windows-only arms in nzbkit::mem and nzbkit::disk,
  # and nzbtray is a Windows binary with no Linux counterpart at all -
  # so this is not a theoretical port of a Linux concern, it is the only
  # job anywhere that can see the class in code the Linux jobs never
  # compile.
  #
  # NIGHTLY, AND THAT IS THE DECISION rather than the default. Per-push
  # was priced and refused: `unit-one-process` costs 14m55s of Linux
  # runner, Windows runners bill at 2x on a private repo, and this leg
  # would sit on top of a `windows-build` plus four shards that already
  # run on every push. ~30 billed minutes per push to re-run tests that
  # just ran, for a class that arrives with a commit landing a static,
  # is the wrong trade; a night's delay on a class this rare is not.
  #
  # PARALLEL INSIDE EACH BINARY, unlike the two Linux jobs above, and
  # for the same cost reason: serial is ~3x (96.7 s against 33.3 s,
  # measured on the nzbfast bin root) and 3x of a 2x-billed runner is
  # not worth buying twice. Parallel one-process is the shape that
  # caught 84ae50bd7, so it is not a token run.
  #
  # No archive to ride here - `windows-build`'s belongs to ci-private's
  # run - so this builds its own, and `--workspace` is chosen to match
  # what that archive resolves rather than the narrower `-p nzbfast
  # --bin nzbfast`, which resolves FEWER features and would test a
  # configuration nothing ships. The two vendored crates are excluded
  # the way `unit-one-process` excludes them: first-party only.
  #
  # nzbfast-ffi is excluded too, and here that is a saving rather than a
  # rule. It is not a default member precisely because it turns on
  # nzbfast's `ffi` feature, so including it compiles the whole nzbfast
  # module tree a SECOND time - and its lib root is that same module
  # tree, which makes its test binary a near-duplicate sample rather
  # than new coverage. `unit-one-process` keeps it only because it
  # selects out of an archive and dropping it would mean maintaining a
  # name; this job is already naming exclusions, so it pays nothing to
  # drop it, and what is left is the configuration that ships.
  windows-one-process:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain step and no par2, for the reasons windows-daemon
      # above gives: rust-toolchain.toml pins the version and rustup
      # installs it on the first cargo call, and no target here needs
      # par2 as a fixture creator.
      - name: dependency cache key
        id: depkey
        shell: bash
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # RESTORE ONLY, no matching save, and that is deliberate. long-suites
      # (and windows-daemon on the Windows side) already save this key, so
      # the ~600 dependency crates arrive warm; a save here would race two
      # other jobs for the same key with a DIFFERENT artifact set behind
      # it, and whichever landed first would decide what every job
      # restores tomorrow. The test binaries this job links are its own
      # and are not worth that.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      - name: build
        id: build
        run: cargo test --locked --workspace --exclude rars --exclude tiny_http --exclude nzbfast-ffi --lib --bins --no-run
      # NZBFAST_LAN_TESTS is deliberately NOT set: it opens an
      # all-interfaces listener, which on Windows raises the Defender
      # Firewall dialog and a hosted runner has nobody to click it. Same
      # rationale as windows-daemon above.
      - name: every first-party unit binary, one process each
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
        run: cargo test --locked --workspace --exclude rars --exclude tiny_http --exclude nzbfast-ffi --lib --bins --no-fail-fast
      # Gated on the BUILD having succeeded, or a compile error would
      # print an annotation about cross-test pollution, which is a
      # confident answer to a question nobody asked.
      - name: how to read a red run
        if: ${{ failure() && steps.build.outcome == 'success' }}
        run: |
          echo "::error title=A Windows unit binary failed with its tests sharing one process::If windows-unit is green on this same commit then no individual test is broken: one test in that binary is leaving process-global state that another one reads. Do NOT make the victim order-independent - find the polluter. 'tools/pollution-bisect.py -p <crate> <the failing test>' names it in minutes, and needs a Windows box to do it on."

  # TODO 82: the long-run soak. One daemon, a mixed queue (store RAR5,
  # compressed RAR5, 7z, PAR2 repair, password) driven round and round
  # against the in-process mock NNTP server for hours, with the daemon's
  # RSS, fd count and thread count sampled at a quiescent point in every
  # cycle and gated against the recorded baseline in
  # crates/nzbfast/tests/leak-soak-baseline.json.
  #
  # Its own job rather than a step in long-suites: those two suites are a
  # 90-minute budget and must stay able to go red fast, and a soak that
  # shares their runner would serialise behind them AND compete for the
  # CPU it is measuring.
  #
  # RELEASE, not debug. The soak measures the binary users run, and a
  # debug build's decode throughput would cut the cycle count (and so the
  # number of samples the drift fit is built from) several-fold. The cache
  # key is soak-specific so it cannot collide with the debug caches the
  # other jobs write under the same runner.os.
  #
  # Cost: ~2.5 h of private-repo Linux minutes a night at 1x. That is the
  # single most expensive thing in this workflow, and it is deliberate -
  # a slow leak is invisible to every other suite here, all of which
  # start a fresh daemon per test. Turn the schedule down to weekly (or
  # lower soak_minutes) if the bill needs it before the leak class does.
  soak:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # par2 is a FIXTURE tool here (runtime repair is native): the soak
      # builds its damaged-post shape with `par2 create`. REQUIRE_PAR2
      # below turns a broken install into a red run rather than a soak
      # that quietly covers one shape fewer.
      - name: test deps (par2 for the repair shape)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq par2
      # Cargo.lock moves on EVERY release (packaging/bump-version.sh
      # rewrites it), and this key used to be `hashFiles('Cargo.lock')` -
      # so the first nightly after a release ran cold on every job.
      # Measured 17 Aug 2026 on run 32014400559: all four cache restores
      # took 0-1s, every one a miss, and `long-suites` spent 4m08s
      # building where the one warm run in the same sample took 1m32s.
      # tools/dep-cache-key.py hashes the lockfile with the workspace
      # members' own version lines normalised out, so our own version
      # bumps stop throwing away ~600 compiled crates. Same tool, same
      # rationale, same `-v2`-style suffix discipline as ci-private.yml.
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # restore + save as SEPARATE steps, not the combined actions/cache:
      # its post step does NOT save when the job FAILED, so one red night
      # left the next night cold as well. That is not hypothetical here -
      # on run 32014400559 `armv7-cross` failed and its
      # `Post Run actions/cache` reads `skipped`. The save below is
      # `if: always()` and sits immediately after the build, so the
      # dependency artifacts are banked whatever the suites then do.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-soak-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # nextest, not libtest, and the reason is diagnostic rather than
      # speed: with `retries = 1` in .config/nextest.toml a flake is
      # reported as a NAMED FLAKY test with both attempts' output, where
      # bare `cargo test` gave an anonymous pass/fail tally. These are
      # the flakiest suites in the repo, so they are the ones that most
      # needed it - and they were the last place in CI still on libtest.
      # Prebuilt, pinned by version, checked by SHA256 rather than
      # trusted: same pattern as the armv7 job below and ci-private.yml.
      - name: install cargo-nextest
        run: |
          set -euo pipefail
          ver="0.9.140"
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 -o cargo-nextest.tar.gz \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${ver}/cargo-nextest-${ver}-x86_64-unknown-linux-gnu.tar.gz"
          echo "4ee9aaa0d0171a985a5d0eb735b87355894c1c455972e9674fb9fdbd1387c9a3  cargo-nextest.tar.gz" | sha256sum -c -
          tar -xzf cargo-nextest.tar.gz
          sudo mv cargo-nextest /usr/local/bin/
          rm cargo-nextest.tar.gz
      - name: build (release)
        run: cargo build --release -p nzbfast --locked
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-soak-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      - name: soak
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
          # Scheduled runs get the full 150; a manual dispatch can ask for
          # a short one to check the harness itself.
          NZBFAST_SOAK_MINUTES: ${{ github.event.inputs.soak_minutes || '150' }}
          NZBFAST_SOAK_REPORT: ${{ github.workspace }}/soak-report.json
        # --nocapture so the per-cycle lines stream into the log: a job
        # that prints nothing for two and a half hours is indistinguishable
        # from a hung one.
        run: cargo nextest run --profile ci --release -p nzbfast --locked --features heavy-tests --test leak_soak --run-ignored only --no-capture
      # Uploaded on failure TOO - a red soak's sample series is the whole
      # diagnosis, and it is also what a legitimate new baseline gets
      # re-recorded from.
      - name: upload the sample series
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-report
          path: soak-report.json
          if-no-files-found: warn

  # 32-bit ARM (armv7), BETA - TODO 178. A CROSS-BUILD PROVES ALMOST
  # NOTHING HERE, which is why this job runs the suite instead of just
  # compiling it. `usize` is 32 bits on this target and the engine
  # deliberately handles large declared sizes from untrusted input, so
  # the interesting failures are silent truncations and overflow panics
  # that only appear when the code RUNS. The three found on 15 Aug 2026
  # were all invisible to a clean build: an `i64` where the target's
  # `c_long` is 32-bit, a 2^32 constant that wrapped to a budget of
  # zero, and a >4 GiB extent a `Range<usize>` cannot hold.
  #
  # The ORACLE is `debug-assertions` + `overflow-checks`, not the word
  # "debug" - see the qemu step, which pins both ON and then compiles at
  # opt-level 2 anyway. That distinction is the whole reason this job can
  # finish: qemu-user emulates every instruction, so an unoptimized build
  # pays the emulator for work an optimizer would have deleted, and on
  # 16 Aug that was measured at 8-23x on the tests that dominate the run.
  # Even so this is a nightly, not a per-push job.
  # The seven heavy targets are excluded exactly as ci-private excludes
  # them; `heavy-tests` is not passed, so they are not even built.
  armv7-cross:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    # 150, not 120: the 15 Aug run was killed by its own timeout at
    # 2916/4981 tests with 35 GB free, which GitHub reports as
    # `cancelled` and reads like a human cancelling it. opt-level 2 below
    # is what actually buys the headroom - MEASURED end to end on 16 Aug,
    # the whole job is 61 minutes with a COLD cache, so this is ~2.5x the
    # worst case rather than a guess. The per-test ceiling in the `qemu`
    # nextest profile is what names the culprit if it is ever blown.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pinned toolchain, not `stable`: this target is in
      # rust-toolchain.toml's `targets` list, so rustup installs the
      # std for it here without a separate `target add`.
      - name: toolchain
        run: rustc -vV && rustup target list --installed
      # This job builds the whole workspace for a SECOND target - a
      # release binary plus ~40 debug test binaries, every one of them
      # statically linked - on top of the host artifacts cargo still
      # needs for build scripts and proc macros. On 15 Aug that filled
      # the runner's disk, and it did not look like disk: zig cc died on
      # the nzbfast link with a bare `signal: 6 (SIGABRT) (core dumped)`
      # and an EMPTY stderr, which reads exactly like a linker crash. The
      # rustc still running alongside it said what zig would not, 22
      # seconds later - `No space left on device`, with the runner
      # reporting 6 MB free. So reclaim the preinstalled toolchains this
      # job never touches (~25 GB) and print the free space either side,
      # so a repeat is diagnosable from the log instead of guessed at.
      - name: reclaim disk
        run: |
          set -euo pipefail
          echo "free before: $(df -h --output=avail / | tail -1)"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/powershell || true
          echo "free after:  $(df -h --output=avail / | tail -1)"
      # zig supplies the musl cross-toolchain (Ubuntu packages none for
      # armv7, and rapidyenc is C++ so musl-gcc alone would not do);
      # qemu-user-static plus binfmt is what lets the test binaries -
      # and the daemon processes some of them spawn - actually execute.
      - name: cross + emulation toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          # A venv, not `pip install --user`: Ubuntu 24.04 marks its
          # system Python externally-managed (PEP 668) and refuses. Same
          # recipe and same pins as release.yml's `packages` job - see
          # the comments there.
          python3 -m venv /tmp/zigvenv
          /tmp/zigvenv/bin/pip install --quiet ziglang==0.16.0
          printf '#!/bin/sh\nexec /tmp/zigvenv/bin/python -m ziglang "$@"\n' \
            | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version
          ver=0.23.0
          sha=f0aa9cc8220a84788c6e4a9b6d80422f041659227b680fdef982d5a8ddffddb4
          url="https://github.com/rust-cross/cargo-zigbuild/releases/download/v${ver}/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz"
          curl -fsSL -o cargo-zigbuild.tar.xz "$url"
          echo "$sha  cargo-zigbuild.tar.xz" | sha256sum -c -
          # --strip-components=1: the release archive nests its payload
          # one directory down (cargo-zigbuild-<triple>/cargo-zigbuild),
          # so a bare `tar xf` leaves nothing named cargo-zigbuild in cwd
          # and the mv below fails - after the sha check has printed OK,
          # which is why this read as a pinning problem and was not one.
          tar xf cargo-zigbuild.tar.xz --strip-components=1
          sudo mv cargo-zigbuild /usr/local/bin/
          rm -f cargo-zigbuild.tar.xz
          # Plain shims for the step that is NOT cargo-zigbuild. The
          # release build below goes through cargo-zigbuild because that
          # is the recipe we ship (packaging/build-linux-tarballs.sh) and
          # this job should gate it; nextest shells out to a bare
          # `cargo test --no-run`, which never sees cargo-zigbuild, so it
          # needs the linker and the C/C++ compilers named directly.
          # Same zig, same libc, either way.
          mkdir -p "$HOME/zigshim"
          T=arm-linux-musleabihf
          # The cc crate appends rustc's triple as --target=..., and it
          # lands AFTER the -target these shims pin, so it is the one zig
          # actually reads. zig calls this target arm-linux-musleabihf and
          # does not know the arch spelling `armv7`, so aws-lc-sys died
          # with `unknown architecture: 'armv7'` before it compiled a
          # single object. Drop any --target= and let the pinned one
          # stand. release.yml's two zig jobs never hit this: they set no
          # CC_*, so cargo-zigbuild translates the triple itself.
          # The loop pops each argument off the front and pushes the
          # keepers onto the back, exactly $# times.
          strip='n=$#\nwhile [ "$n" -gt 0 ]; do\n  a=$1; shift; n=$((n-1))\n  case "$a" in --target=*) ;; *) set -- "$@" "$a" ;; esac\ndone\n'
          printf "#!/bin/sh\n${strip}exec zig cc -target %s \"\$@\"\n"  "$T" > "$HOME/zigshim/zig-cc"
          printf "#!/bin/sh\n${strip}exec zig c++ -target %s \"\$@\"\n" "$T" > "$HOME/zigshim/zig-cxx"
          printf '#!/bin/sh\nexec zig ar "$@"\n'                  > "$HOME/zigshim/zig-ar"
          printf '#!/bin/sh\nexec zig ranlib "$@"\n'              > "$HOME/zigshim/zig-ranlib"
          chmod +x "$HOME/zigshim"/zig-*
          echo "--- generated zig-cc shim ---"; cat "$HOME/zigshim/zig-cc"
          # NOT the linker: cargo-zigbuild installs its own linker wrapper,
          # and overriding it with the plain shim made rustc's
          # self-contained musl crt and zig's crt BOTH get linked -
          # `ld.lld: duplicate symbol: _start`. The release build below
          # is a cargo-zigbuild build and wants zigbuild's wrapper; the
          # nextest step, which never sees cargo-zigbuild, names the
          # linker for itself.
          {
            echo "CC_armv7_unknown_linux_musleabihf=$HOME/zigshim/zig-cc"
            echo "CXX_armv7_unknown_linux_musleabihf=$HOME/zigshim/zig-cxx"
            echo "AR_armv7_unknown_linux_musleabihf=$HOME/zigshim/zig-ar"
            echo "RANLIB_armv7_unknown_linux_musleabihf=$HOME/zigshim/zig-ranlib"
          } >> "$GITHUB_ENV"
      # Prebuilt binary pinned by version and checked by SHA256 rather
      # than trusted - the same pattern (and rationale) as ci-private's
      # nextest step and the cargo-deny step below.
      - name: install cargo-nextest
        run: |
          set -euo pipefail
          ver="0.9.140"
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 -o cargo-nextest.tar.gz \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${ver}/cargo-nextest-${ver}-x86_64-unknown-linux-gnu.tar.gz"
          echo "4ee9aaa0d0171a985a5d0eb735b87355894c1c455972e9674fb9fdbd1387c9a3  cargo-nextest.tar.gz" | sha256sum -c -
          tar -xzf cargo-nextest.tar.gz
          sudo mv cargo-nextest /usr/local/bin/
          rm cargo-nextest.tar.gz
      # Cargo.lock moves on EVERY release (packaging/bump-version.sh
      # rewrites it), and this key used to be `hashFiles('Cargo.lock')` -
      # so the first nightly after a release ran cold on every job.
      # Measured 17 Aug 2026 on run 32014400559: all four cache restores
      # took 0-1s, every one a miss, and `long-suites` spent 4m08s
      # building where the one warm run in the same sample took 1m32s.
      # tools/dep-cache-key.py hashes the lockfile with the workspace
      # members' own version lines normalised out, so our own version
      # bumps stop throwing away ~600 compiled crates. Same tool, same
      # rationale, same `-v2`-style suffix discipline as ci-private.yml.
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # restore + save as SEPARATE steps, not the combined actions/cache:
      # its post step does NOT save when the job FAILED, so one red night
      # left the next night cold as well. That is not hypothetical here -
      # on run 32014400559 `armv7-cross` failed and its
      # `Post Run actions/cache` reads `skipped`. The save below is
      # `if: always()` and sits immediately after the build, so the
      # dependency artifacts are banked whatever the suites then do.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-armv7-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # Release binary first: it is the shipped artifact, and a link
      # failure here is a different (and cheaper) verdict than a test
      # failure below.
      - name: build the release binary
        run: cargo zigbuild --release --locked -p nzbfast --target armv7-unknown-linux-musleabihf
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-armv7-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      - name: it is a 32-bit ARM static binary
        run: |
          set -euo pipefail
          out=$(file target/armv7-unknown-linux-musleabihf/release/nzbfast)
          echo "$out"
          # Assert the positive of each claim: an unreadable `file` line
          # must fail here rather than pass by not matching a negative.
          echo "$out" | grep -q "ELF 32-bit"
          echo "$out" | grep -q "ARM"
          echo "$out" | grep -q "statically linked"
          qemu-arm-static target/armv7-unknown-linux-musleabihf/release/nzbfast --version
      # The memory ladder is a shipped feature and every cap under the
      # budget is a `usize`. Print it rather than assume it: this is the
      # one place a truncation between the budget and its caps shows.
      - name: memory ladder on a 32-bit target
        run: |
          set -euo pipefail
          cargo zigbuild --release --locked -p nzbkit --example memprobe \
            --target armv7-unknown-linux-musleabihf
          probe=target/armv7-unknown-linux-musleabihf/release/examples/memprobe
          qemu-arm-static "$probe"
          # An over-large --mem-limit must CLAMP, never wrap. A wrapped
          # budget prints a resolved total unrelated to both the request
          # and the ceiling, so pin the ceiling exactly.
          qemu-arm-static "$probe" 8G | tee ladder.txt
          grep -q "resolved budget: 1.00 GB" ladder.txt
      - name: unit suites under qemu
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_RUNNER: /usr/bin/qemu-arm-static
          # This step shells out to a bare `cargo test --no-run`, so
          # there is no cargo-zigbuild wrapper here and the linker has to
          # be named. link-self-contained=no is the other half: without
          # it rustc adds its own musl crt on top of the one zig already
          # links, and every test binary dies on a duplicate _start.
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: /home/runner/zigshim/zig-cc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_RUSTFLAGS: "-C link-self-contained=no"
          # Debuginfo off for the cross test build - this is the other
          # half of `reclaim disk` above. These test binaries are STATIC,
          # so DWARF is paid once per binary instead of being shared
          # through a libstd everyone links dynamically, and ~40 of them
          # at `debuginfo=2` is what actually filled the disk. Setting it
          # on the profile rather than in RUSTFLAGS is deliberate: it
          # also flips the `DEBUG` variable cargo hands build scripts, so
          # the cc crate drops its own `-g` and aws-lc-sys stops emitting
          # thousands of debug-laden objects. Nothing here asserts on
          # debuginfo; panics keep their symbol names, just not lines.
          # `test` inherits `dev`, so the first line is the one that
          # bites - the second is a belt if that ever stops being true.
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          # OPTIMIZED, with the oracle pinned by flag. `dev` and `test`
          # both default to debug-assertions + overflow-checks ON and
          # opt-level 0; naming all three means the checks this job
          # exists for survive the optimization, and survive a future
          # edit to [profile.dev] in Cargo.toml. Nothing is lost: the
          # three bugs this job found are arch-WIDTH bugs (a 32-bit
          # `c_long`, a 2^32 constant wrapping to zero, a >4 GiB extent
          # in a `Range<usize>`), and every one of them is caught by an
          # overflow check or a panic that opt-level does not remove.
          # Measured 16 Aug on the tests that dominated the killed run:
          # decrypt_shards 6.47s -> 0.28s (23x), instream_decrypt 14.84s
          # -> 1.08s (13.7x), chase_multi_volume 16.52s -> 2.04s (8.1x).
          # End to end that is 96 minutes for 58% of the sweep before,
          # against 21 minutes for ALL of it after (run 31928396709).
          # DEV is the load-bearing half - dependencies of a test target
          # (aws-lc-sys, rapidyenc, rars, and nzbkit itself when an
          # integration test links it) build under `dev`, and that is
          # where the emulated instructions actually are. It also sets
          # the OPT_LEVEL cargo hands build scripts, so the cc crate
          # compiles the C and C++ at -O2 too. TEST covers the unit-test
          # targets' own code. Build cost is the trade: ~4x the compile
          # CPU, against a run that could not finish in two hours.
          CARGO_PROFILE_DEV_OPT_LEVEL: "2"
          CARGO_PROFILE_TEST_OPT_LEVEL: "2"
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
          CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
          # Incremental state is dead weight for a one-shot CI build, and
          # it is written into the same target dir that ran out of room.
          CARGO_INCREMENTAL: "0"
          NZBFAST_NO_ENRICH: "1"
        run: |
          set -euo pipefail
          # On the EXIT trap, not after the run: this step's shell is
          # `bash -e`, so a red suite would skip a trailing plain `df` -
          # and a red suite is the one case where the number is wanted.
          trap 'echo "free after build+run: $(df -h --output=avail / | tail -1)"' EXIT
          echo "free before build: $(df -h --output=avail / | tail -1)"
          # The one test excluded by NAME rather than by binary, and the
          # only red in the first sweep that ever ran to completion
          # (5050 tests, 5049 passed). `compute_report_is_sane` asserts
          # `decode_simd.all_core > md5.all_core` - a claim about
          # HARDWARE, that SIMD yEnc decode beats MD5 by ~5x. Under
          # qemu-user it inverts, because the emulator charges per
          # instruction and SIMD is the expensive path to emulate, so
          # the wide decode loses to scalar MD5. It is a property of the
          # rig, not of armv7: TODO 178 records it failing on x86_64 on
          # the qemu box as well. Excluded HERE rather than loosened in
          # the test, which is worth having on real silicon - a bound
          # widened to survive an emulator would assert nothing anywhere.
          #
          # `--workspace` here is the LAST one left in either workflow
          # file, and it is deliberate. ci-private's two archive steps
          # and CLAUDE.md's sweep all dropped it on 23 Aug 2026 because
          # it overrides `default-members`, turns nzbfast's `ffi`
          # feature on and compiles the whole module tree a second time
          # as the lib target (measurements at ci-private's archive
          # step). Here that is worth paying for: this is the only place
          # in CI that builds crates/nzbfast-ffi for a 32-bit or a
          # non-x86 architecture, which is the shape the iOS staticlib
          # actually ships in, and a nightly can afford the emulator.
          # If this job ever needs its wall clock back, `not
          # binary_id(nzbfast)` drops the duplicated lib-root suite
          # while keeping the ffi build and its two tests - do that
          # before dropping the flag.
          cargo nextest run --profile qemu --workspace --no-fail-fast \
            --target armv7-unknown-linux-musleabihf \
            -E 'not binary(conn_tuner) and not binary(index_size_cap) and
                not binary(http_wedge) and not binary(queue_soak) and
                not binary(daemon) and not binary(e2e) and not binary(leak_soak) and
                not test(=sysbench::tests::compute_report_is_sane)'

  # Full cargo-deny pass (advisories, licenses, bans, sources) against
  # deny.toml at the repo root. ci-private runs the same check on every
  # push; the nightly run is what catches a NEW advisory published
  # against an unchanged tree.
  deny:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Prebuilt binary, pinned by tag and checked by SHA256 rather than
      # trusted, since it is fetched from a third party and put on PATH
      # (same pattern as the par2 fetch in pr-check.yml). A cargo
      # install would cost several minutes of compile per run.
      - name: install cargo-deny
        run: |
          ver="0.20.2"
          curl -sSfL -o cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${ver}/cargo-deny-${ver}-x86_64-unknown-linux-musl.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz
          sudo mv "cargo-deny-${ver}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/
          rm -rf cargo-deny.tar.gz "cargo-deny-${ver}-x86_64-unknown-linux-musl"
      - name: cargo deny
        run: cargo deny check
