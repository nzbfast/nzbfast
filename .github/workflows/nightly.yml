# Nightly deep CI for the PRIVATE repo. ci-private stays lean on purpose
# (format + lint + fast unit suites on every push); this picks up the
# long daemon suite and the heavy elapsed-time targets on a schedule so
# a regression in them shows up within a day instead of at the next
# local pre-push run. Gated to the private repo like ci-private.yml
# (cost rationale in pr-check.yml).
#
# THE e2e AND DAEMON SUITES ARE NO LONGER ONLY HERE. Since 2 Sep 2026
# ci-private.yml runs the parallel e2e subset on every push sharded four
# ways (8m47s of pipeline) and the whole daemon suite sharded six ways
# (6m40s), both out of one archive. The steps below are KEPT anyway and
# the duplication is deliberate on three counts: the shipped-threshold
# e2e tests and the `#[ignore]`d complexity rigs need a box with nothing
# else on it, which a push job can never promise; `one-process-heavy`
# runs the daemon tests in ONE process, where cross-test pollution is
# visible and nextest structurally cannot see it; and a per-push job
# carries that file's cancellation arithmetic - a commit whose shards
# were displaced while pending has no verdict of its own, and this is
# what covers it. Read a red here as "the tip a day ago", exactly as
# before.
name: nightly
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: "Minutes of mixed-queue soak (TODO 82). The scheduled run uses 150."
        required: false
        default: "150"
permissions:
  contents: read
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  long-suites:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This job's debug `target/` plus the restored cache had run the
      # runner down to 1.3 GB free by 15 Aug 2026, and the daemon's own
      # `min_free` floor is 2 GB - so the queue runner held EVERY job
      # before it started and the daemon suite reported 50-odd unrelated
      # 30 s timeouts, none of which said "disk". The suites now pass
      # `--min-free 0` so they cannot be held that way again, but the
      # headroom is worth having on its own: a debug build of this
      # workspace with the eight heavy targets linked is tens of GB, and
      # the next thing a full disk breaks is the build, not a guard.
      #
      # Nothing removed here is used by a Rust job. The toolchain lives
      # under ~/.rustup and par2 arrives via apt below, neither of which
      # is touched. `|| true` throughout: a runner image that drops one
      # of these must not turn into a red nightly.
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Same fixture dependency as pr-check: the e2e repair tests CREATE
      # their PAR2 sets with the external `par2` and skip without it.
      - name: test deps (par2 for repair e2e)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq par2
      # Cargo.lock moves on EVERY release (packaging/bump-version.sh
      # rewrites it), and this key used to be `hashFiles('Cargo.lock')` -
      # so the first nightly after a release ran cold on every job.
      # Measured 17 Aug 2026 on run 32014400559: all four cache restores
      # took 0-1s, every one a miss, and `long-suites` spent 4m08s
      # building where the one warm run in the same sample took 1m32s.
      # tools/dep-cache-key.py hashes the lockfile with the workspace
      # members' own version lines normalised out, so our own version
      # bumps stop throwing away ~600 compiled crates. Same tool, same
      # rationale, same `-v2`-style suffix discipline as ci-private.yml.
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # restore + save as SEPARATE steps, not the combined actions/cache:
      # its post step does NOT save when the job FAILED, so one red night
      # left the next night cold as well. That is not hypothetical here -
      # on run 32014400559 `armv7-cross` failed and its
      # `Post Run actions/cache` reads `skipped`. The save below is
      # `if: always()` and sits immediately after the build, so the
      # dependency artifacts are banked whatever the suites then do.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # nextest, not libtest, and the reason is diagnostic rather than
      # speed: with `retries = 1` in .config/nextest.toml a flake is
      # reported as a NAMED FLAKY test with both attempts' output, where
      # bare `cargo test` gave an anonymous pass/fail tally. These are
      # the flakiest suites in the repo, so they are the ones that most
      # needed it - and they were the last place in CI still on libtest.
      # Prebuilt, pinned by version, checked by SHA256 rather than
      # trusted: same pattern as the armv7 job below and ci-private.yml.
      - name: install cargo-nextest
        run: |
          set -euo pipefail
          ver="0.9.140"
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 -o cargo-nextest.tar.gz \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${ver}/cargo-nextest-${ver}-x86_64-unknown-linux-gnu.tar.gz"
          echo "4ee9aaa0d0171a985a5d0eb735b87355894c1c455972e9674fb9fdbd1387c9a3  cargo-nextest.tar.gz" | sha256sum -c -
          tar -xzf cargo-nextest.tar.gz
          sudo mv cargo-nextest /usr/local/bin/
          rm cargo-nextest.tar.gz
      - name: build
        id: build
        run: cargo build -p nzbfast --locked
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # EVERY suite step below carries the same `if`, and that is the
      # point: a red suite must not hide the ones after it.
      #
      # It used to. The suites ran as plain sequential steps, so one
      # failure skipped the whole rest of the job, and the four
      # elapsed-time targets were additionally chained inside ONE
      # `run: |` block under `bash -e`, which hid them from each other
      # too. Both layers fired at once for four nights (7-10 Aug 2026):
      # the e2e `speculative_prefetch` panic skipped the elapsed-time
      # step entirely, so index_size_cap, http_wedge and queue_soak had
      # no CI verdict from 6 Aug, and the 10 Aug dispatched re-run that
      # finally reached the step died on index_size_cap and still never
      # reached http_wedge. Four days of three targets not running read
      # exactly like "one known test is broken" (TODO 143).
      #
      # `!cancelled()` rather than `always()`: a cancelled run (the
      # concurrency group superseding it) should stop, not grind through
      # every suite. And gated on the build having SUCCEEDED, so a
      # compile failure still reports once instead of six identical
      # times.
      #
      # NZBFAST_NO_ENRICH keeps enrichment workers off the real
      # internet; NZBFAST_REQUIRE_PAR2 turns a broken par2 install into
      # a red run instead of silently skipped repair coverage
      # (rationale in pr-check.yml). --test-threads=1 is a hard
      # requirement for the daemon suite (CLAUDE.md invariant 4); the
      # e2e suite tolerates parallelism but carries timing-sensitive
      # stall/watchdog tests (8-10s abort windows), so it ran
      # single-threaded here too - nightly has the time budget.
      #
      # THAT LAST CLAUSE STOPPED BEING THE TRADE ON 31 Aug 2026. The
      # judgement above is right and is why the threshold tests are
      # isolated in `.config/nextest.toml` rather than merely run; what
      # changed is that "nightly has the time budget" was paying 1434 s
      # for 733 s of tests that are 92% IDLE. e2e now runs in the two
      # steps below, 210 s + ~304 s, with the timing-sensitive tests
      # still getting a box to themselves. Six tests in the suite are
      # measurably contention-sensitive and named in
      # research/E2E-SERIALIZATION-COST-2026-08-31.md; `retries = 1`
      # reports them as FLAKY rather than hiding them.
      # ALSO RUN PER PUSH SINCE 2 Sep 2026, across six `daemon` shards
      # in ci-private.yml off their own archive. This step runs the same
      # binary with no filter at all, so the two cannot drift the way a
      # filtered pair can - what it still buys is the schedule's own
      # coverage of a commit whose shards were displaced while pending,
      # and a box with nothing else on it.
      - name: daemon suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo nextest run --profile ci -p nzbfast --locked --features heavy-tests --test daemon
      # THE HALF THAT MAKES A GREEN SUITE MEAN SOMETHING, and in this job
      # it has to be repeated after EVERY suite rather than run once at
      # the end. `[profile.ci.junit]` writes ONE path, so each suite here
      # OVERWRITES the report the last one left: a check at the foot of
      # this job would read the ffi step's report and nothing else, and
      # the six suites in front of it - the daemon-spawning ones, where a
      # wedge is most likely - would be exactly as unwatched as they were
      # before this gate existed.
      #
      # What it refuses: a test whose FIRST attempt was killed at the
      # ceiling and whose SECOND passed. nextest treats a TIMEOUT as an
      # ordinary failure and retries it, so that run is reported "N passed
      # (1 flaky)" at exit 0 - which is how a 4,666-second deadlock came
      # out of CI green on 23 Aug 2026. `!cancelled()` rather than
      # `success()`: a suite that is red for another reason can still
      # carry a wedged attempt, and its own verdict names the panic.
      - name: wedge check - daemon
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/wedge-gate.py --junit target/nextest
      # ALSO RUN PER PUSH SINCE 2 Sep 2026. This exact filter is what
      # ci-private.yml's `e2e` shards run, four ways off their own
      # archive - so the two must move together: if the
      # `_at_shipped_thresholds` suffix is ever renamed, the filter
      # here, the complementary one below and the one there all change
      # in the same commit or a whole slice of the binary stops being
      # run by anything.
      #
      # SPLIT IN TWO on 31 Aug 2026, and the split IS the speed. Run as
      # one command this suite is 1434 s serial; the same tests in two
      # invocations are 210 s + ~304 s. The reason is not parallelism as
      # such - `.config/nextest.toml` gives the three
      # `_at_shipped_thresholds` tests `threads-required =
      # 'num-test-threads'`, which is correct (they measure a 69 s
      # demotion window and lose it under load) and which makes nextest
      # DRAIN the run before each one. This suite holds other 145 s,
      # 126 s and 71 s tests, so each barrier stalls the box for as long
      # as whatever is still in flight: measured, the isolation costs
      # 556 s of wall to execute 304 s of test. Splitting spends that
      # once, at a step boundary, instead of three times mid-run.
      # Keep the three e2e steps ADJACENT and keep the filters
      # COMPLEMENTARY - together they are the whole binary, which is what
      # makes this a scheduling change and not a coverage cut. It was two
      # steps until 1 Sep 2026; the third is below and covers what
      # `#[ignore]` took OUT of this one. The full measurement, including
      # the two hypotheses it refuted, is in
      # research/E2E-SERIALIZATION-COST-2026-08-31.md.
      - name: e2e suite (parallel)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo nextest run --profile ci -p nzbfast --locked --features heavy-tests --test e2e -E 'not test(/_at_shipped_thresholds$/)'
      # Same as the first one above: this job's suites share one junit
      # path, so each needs its own check before the next overwrites it.
      - name: wedge check - e2e (parallel)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/wedge-gate.py --junit target/nextest
      - name: e2e suite (shipped thresholds, one at a time)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo nextest run --profile ci -p nzbfast --locked --features heavy-tests --test e2e -E 'test(/_at_shipped_thresholds$/)'
      - name: wedge check - e2e (shipped thresholds)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/wedge-gate.py --junit target/nextest
      # The third e2e step, and the reason the two above are not the
      # whole binary any more (claim `e2e-wave5-cost-quiet-box`, 1 Sep
      # 2026). `e2e_wave5_cost`'s three rows are wall-clock COMPLEXITY
      # assertions: each times the same work at two input sizes and
      # asserts the growth RATIO is near-linear (bars 8.0 / 6.0 / 6.0
      # against ~4.2x on a healthy tree, so 1.4-1.9x of clearance).
      # Under competing load both timings go noisy and the ratio breaks
      # on a tree with nothing wrong with it - measured inside a parallel
      # `--test e2e` run, 6.6x. Two of the three flakes in the 1.3.1
      # release verification ("447 passed (8 slow, 3 flaky)", laundered
      # green by `retries = 1`) were rows from that file.
      #
      # A `test-group` was tried FIRST and is not the fix, which is the
      # thing to know before anyone moves this back into the parallel
      # step: a group holds a test apart from its SIBLINGS, and a ratio
      # of two timings is sensitive to the whole machine - the other
      # ~430 tests of this binary included. It still failed. So the rows
      # are `#[ignore]`d at the site, with the reason on each attribute,
      # and this step is the quiet box they need: their own step (nothing
      # else in this job runs beside it) at `--test-threads 1` (so the
      # three do not measure each other either).
      #
      # `[profile.ci]`'s `retries = 1` is KEPT here, and that was the
      # decision on this step rather than the default. `retries = 1` is
      # what laundered these rows green in the 1.3.1 release
      # verification ("3 flaky", exit 0), so `--retries 0` was written
      # first and then measured OUT: 18 runs of this exact command on
      # the dev Mac lost x5_17 once, on a healthy tree, because that box
      # carries other sessions and the row needs only 1.9x of
      # interference to redden (its own header says so at length). A
      # nightly step that reds on a healthy tree is a step somebody
      # switches off.
      #
      # A retry is not laundering HERE, and the difference from the
      # parallel step is the whole reason this one exists. There the
      # interference was permanent, so a retry hid a standing condition.
      # Here the step is quiet and single-threaded, and the thing being
      # caught is DETERMINISTIC: the regressed sorted-`Vec` shape these
      # bars were derived against measures 8.97x and 9.29x against bars
      # of 6.0, on every attempt, so it cannot pass a retry. What a
      # retry absorbs is VM steal, which is noise. Read a "1 flaky" line
      # here as the box, and a genuine FAIL as a finding: the assertion
      # messages name the healthy ratio and the regressed one, and the
      # module header says which knobs may move (TRIALS, the counts) and
      # which may NOT (the bars).
      #
      # THE FILTER IS THE WHOLE IGNORED POPULATION OF THE BINARY, and it
      # was `test(/^e2e_wave5_cost::/)` for one day (claim
      # `payout-crc-storm-rig-no-job`, 1 Sep 2026). The narrow filter was
      # deliberate rather than an oversight: `e2e.rs` holds one other
      # ignored test, `payout_crc_retry_prices_corrupt_storm_end_to_end`,
      # a TODO 111 pricing rig that had run in NO job at all, and
      # sweeping an unrun rig in blind is how the pool rigs above turned
      # up 5 red BY DESIGN against thresholds a product change had moved
      # under them (research/IGNORED-POOL-RIGS-RED-2026-08-31.md).
      #
      # So it was RUN before it was wired, which is the whole of that
      # item, and the answer came back the opposite way: it is green,
      # 10 runs for 10 on a box at load 16-20, and it still prices what
      # it was written to price. Off 2.14-2.23 s, on 273-282 ms, against
      # the 2.38 s / 0.28 s recorded when the rig was built on 4 Aug 2026
      # (research/SPECULATION-EXPERIMENTS-2026-08-04.md section 6a) - a
      # month and two deliberate changes to this exact seam later. It
      # also has no threshold to re-price: despite the "measurement"
      # wording its assertions are FUNCTIONAL (off takes damage and pays
      # a repair, on finishes clean and does not), and the two walls are
      # printed, never asserted. Full write-up, including why the
      # 31 Aug same-server re-ask did not move it, in
      # research/E2E-IGNORED-PAYOUT-RIG-WIRED-2026-09-01.md.
      #
      # With that answered the bare sweep is the better filter, and not
      # only because it is shorter. It makes the three e2e steps an
      # EXHAUSTIVE PARTITION of the binary rather than three filters that
      # happen to leave a gap - non-ignored minus thresholds (449),
      # non-ignored thresholds (3), ignored (4), summing to the 456 that
      # `--run-ignored all` lists - so the "together they are the whole
      # binary" claim above is now literally checkable. And it cannot go
      # blind to a RENAME: an `-E 'test(=some_exact_name)'` that stops
      # matching is a green step about tests nobody ran, which is a
      # failure mode this repo has hit several times. A fourth ignored
      # test added anywhere in `e2e.rs` is covered the day it lands.
      #
      # What that costs, stated: an ignored test landed here red-by-
      # design reds this step. That is the correct default (the push path
      # is the default, an exception should be a decision) and it is why
      # the payout rig was measured first rather than swept in. Name a
      # rig OUT here, with the product decision that made it
      # unsatisfiable, exactly as the pool-rigs step above does.
      #
      # `retries = 1` above is about the ratio rows; the payout rig is
      # deterministic (its assertions are functional and its own spread
      # over 10 runs is under 2.5%), so a retry launders nothing there.
      - name: e2e suite (ignored rigs - complexity ratios and payout, quiet box)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: >
          cargo nextest run --profile ci -p nzbfast --locked
          --features heavy-tests --test e2e
          --run-ignored only --test-threads 1 --no-capture
          -E 'binary(e2e)'
      # Same as the first one above: this job's suites share one junit
      # path, so each needs its own check before the next overwrites it.
      - name: wedge check - e2e (ignored rigs)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/wedge-gate.py --junit target/nextest
      # The other half of ci-private's exclusion list. That job runs
      # `--workspace` minus seven names; three of them (daemon, e2e,
      # leak_soak) already had a home here, and these four did not have
      # one anywhere - so without this step the exclusion would not be
      # deferring them, it would be dropping them.
      #
      # They are excluded from the push path because they MEASURE
      # ELAPSED TIME, not because they are merely slow: conn_tuner races
      # a throttled mock over a connection ladder, index_size_cap and
      # queue_soak fill real stores, http_wedge waits on a bounded pool.
      # Roughly 80% of the workspace's runtime between them, and the kind
      # of test that wants a machine with time rather than a push gate.
      #
      # Named explicitly rather than globbed, deliberately: a target
      # added to crates/*/tests/ tomorrow must inherit "runs on push"
      # from ci-private's --workspace, never "runs nightly, maybe" from a
      # pattern here. The push path is the default; this list is the
      # exception, and an exception should be a decision.
      #
      # Every heavy-suite invocation in this file passes `--features
      # heavy-tests`: since TODO 116b the eight targets carry
      # required-features in their Cargo.toml so the push path stops
      # LINKING what it never runs. Forgetting the flag cannot silently
      # skip a suite - cargo refuses the --test name loudly, naming the
      # feature.
      #
      # One step per target, not one block of four: see the `if` note
      # above. These four are the ones the old shape hid.
      - name: elapsed-time suite - conn_tuner
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo nextest run --profile ci -p nzbkit --locked --features heavy-tests --test conn_tuner
      # Same as the first one above: this job's suites share one junit
      # path, so each needs its own check before the next overwrites it.
      - name: wedge check - conn_tuner
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/wedge-gate.py --junit target/nextest
      # par2gen at scale: tens of megabytes of GENERATED fixture and a
      # real repair round-trip over thousands of slices, plus the only
      # interop assertion in the tree that runs at that size (par2cmdline
      # verifying a wide set we wrote, which is why the par2 install
      # above is load-bearing for this step too - and note ubuntu's
      # `par2` is 0.8.1, which grades five of the six members: it
      # predates upstream's empty-file fix and the test says so on
      # stderr, see `par2_describes_empty_members` in that file). Heavy
      # for the same
      # reason its neighbours are - it is seconds rather than
      # milliseconds - and NOT because it measures elapsed time: nothing
      # in it is timing-sensitive, so it carries no wall-clock budget to
      # be starved out of. Measured 31 Aug 2026 on the dev Mac, DEBUG,
      # which is the profile this job builds and the profile every
      # fixture in it was sized against: 4.7 s at load 77 under nextest,
      # and 23 s at load 130 run serially, which is the shape the
      # one-process job below uses. Both are noise against the
      # multi-hour suites either side of it.
      - name: large-set suite - par2gen
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo nextest run --profile ci -p nzbkit-base --locked --features heavy-tests --test par2gen_large_set
      - name: wedge check - par2gen_large_set
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/wedge-gate.py --junit target/nextest
      - name: elapsed-time suite - index_size_cap
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo nextest run --profile ci -p nzbfast --locked --features heavy-tests --test index_size_cap
      # Same as the first one above: this job's suites share one junit
      # path, so each needs its own check before the next overwrites it.
      - name: wedge check - index_size_cap
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/wedge-gate.py --junit target/nextest
      - name: elapsed-time suite - http_wedge
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo nextest run --profile ci -p nzbfast --locked --features heavy-tests --test http_wedge
      # Same as the first one above: this job's suites share one junit
      # path, so each needs its own check before the next overwrites it.
      - name: wedge check - http_wedge
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/wedge-gate.py --junit target/nextest
      - name: elapsed-time suite - queue_soak
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo nextest run --profile ci -p nzbfast --locked --features heavy-tests --test queue_soak
      # Same as the first one above: this job's suites share one junit
      # path, so each needs its own check before the next overwrites it.
      - name: wedge check - queue_soak
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/wedge-gate.py --junit target/nextest
      # The pool rigs (claim `pool-rigs-run-in-no-job`, 31 Aug 2026). 26
      # `#[ignore]`d wall-clock rigs under crates/nzbkit/src/pool/ ran in
      # NO CI job at all, nightly included, until this - the only
      # `--ignored` anywhere in .github/workflows/ was leak_soak above.
      # Two causes found the same day left 5 of the 26 red BY DESIGN
      # against thresholds that predate a deliberate product change and
      # were never re-priced against it (full numbers:
      # research/IGNORED-POOL-RIGS-RED-2026-08-31.md). Both are product
      # judgements to make on purpose, not edits to make quietly, so
      # those 5 are named OUT of this filter rather than fixed or
      # loosened:
      #   - payout_adaptive_timeout_cuts_dead_air_stalls and
      #     payout_adaptive_timeout_survives_cgnat_evictions assert a
      #     ratio the §275 sole-server pre-byte floor doubling
      #     (23 Aug 2026) made unsatisfiable at ANY load - the floor
      #     alone bounds the ratio at >= 0.667 where the two assert
      #     < 0.6 and < 0.5.
      #   - fight_flap_clamp_still_reaches_missing_verdicts,
      #     fight_recycle_slow_must_not_churn_the_flap_keeper and
      #     gauntlet_four_faults_three_config_tiers count a "sessions
      #     flapping" announcement that cap-aware keepers (ON by
      #     default) make unreachable when the fixture's accept cap
      #     equals the keeper target - the clamp still ENGAGES, only its
      #     note is never emitted, so the rig-sanity line reads "the
      #     clamp never engaged" when it did.
      # The other 21 are real regression coverage that has simply never
      # run; they pass clean today (verified individually and as a
      # group, 31 Aug 2026). `--run-ignored ignored-only` so this step
      # runs ONLY the named ignored tests, never the ordinary pool::
      # unit tests the main sweep already covers on every push.
      # `.config/nextest.toml`'s `pool-rigs-serial` test-group forces
      # `max-threads = 1` on this exact name list (not on the four
      # modules, which also hold fast parallel tests the push sweep
      # must not slow down) - more than half of these carry "...flaky
      # under suite load..." in their own #[ignore] reason, and it was
      # not idle: two of the 26 failed once each in a census run
      # alongside unrelated compiles and passed clean 3-for-3 each in
      # isolation immediately after.
      - name: elapsed-time suite - pool rigs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
        run: >
          cargo nextest run --profile ci -p nzbkit --locked --lib
          --features heavy-tests --run-ignored ignored-only
          -E 'package(nzbkit) and binary(nzbkit) and test(/^pool::(fault_rigs::fight_slope_plus_adaptive_must_not_double_punish|queue_tests::queue_control_cancel_cost_at_field_scale|rig_tests::(payout_brownout_recovery_across_config_tiers|payout_channel_depth_smooths_a_stalling_write_side|payout_flap_breaker_collapses_ip_cap_churn|payout_flap_cap_keepers_hold_the_caps_worth|payout_hedge_rescues_stalls_in_under_a_second_not_eight|payout_hot_spare_hides_reconnect_latency|payout_hot_spare_skips_the_slow_start_trickle|payout_multiwan_fanout_rescues_the_frozen_wan|payout_rain_fade_drains_to_the_healthy_wan|payout_recycle_slope_probes_an_asymmetric_multiwan|payout_slope_recycle_frees_a_degraded_session|payout_ttfb_hedge_beats_the_budget_on_dead_air|payout_ttfb_hedge_still_pays_when_dials_cost|safety_adaptive_timeout_kills_nothing_on_a_jittery_link|safety_shipped_defaults_survive_starlink_handovers|safety_ttfb_hedge_kills_nothing_on_a_jittery_link)|tail_rigs::(the_queue_dry_tail_is_the_dial_not_the_job|the_taper_costs_nothing_when_the_client_is_the_bottleneck|the_taper_shortens_the_drain_without_paying_wall_for_it))$/)'
      # Same as the first one above: this job's suites share one junit
      # path, so each needs its own check before the next overwrites it.
      - name: wedge check - pool rigs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/wedge-gate.py --junit target/nextest
      # The FFI contract on the host, moved here from the push path on
      # 23 Aug 2026. ci-private's archive step used to take
      # `--workspace`, which is the only thing that pulls in
      # crates/nzbfast-ffi, and these tests came along for the ride
      # - but the ride cost the push path 1,774 duplicate nzbfast tests,
      # 2.23 GB of cached target/ and a 637 MB iOS staticlib no CI job
      # links, because `--workspace` overrides the `default-members`
      # line that exists to keep the `ffi` feature off. The long note at
      # that step has the measurements.
      #
      # They are worth keeping SOMEWHERE and this is the right
      # somewhere: at 24.4 s and 32.5 s cycle.rs and reclaim.rs were the
      # two slowest tests in the whole non-heavy set, they start and stop
      # a real in-process daemon and bind a real port, and they are the
      # host rehearsal for an acceptance the iOS Simulator harness
      # re-proves on-target
      # (research/SPIKE-IOS-STATICLIB-2026-08-05.md). `-p nzbfast-ffi`
      # takes the whole crate, so a test added there needs no edit here:
      # stop_bound.rs (TODO 307 item 3, 26 Aug 2026, ~0.6 s) arrived that
      # way and pins the bound on nzbfast_stop. The clippy gates in
      # ci-private still COMPILE and `-D warnings` lint this crate on
      # every push, so a build break in it is still same-day; what moved
      # here is only the running.
      #
      # `-p nzbfast-ffi` and nothing else, so this step and this step
      # alone pays for the ffi feature unification - the four suites
      # above build `-p nzbfast`, whose feature set this does not touch.
      # armv7-cross below reaches the same set under qemu on a cross
      # target; that is a second sample, not this one.
      - name: ffi contract on the host
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
        run: cargo nextest run --profile ci -p nzbfast-ffi --locked
      # Same as the first one above: this job's suites share one junit
      # path, so each needs its own check before the next overwrites it.
      - name: wedge check - ffi contract
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/wedge-gate.py --junit target/nextest

  # ===================================================================
  # ONE PROCESS PER TARGET, SERIAL. TODO 270 items 2, 3 and 4.
  #
  # Every other test job in this repo runs under nextest, which gives
  # EVERY TEST ITS OWN PROCESS. That is what makes the shards fast and
  # their failures attributable, and it is a hole with a hard edge: a
  # test that leaves process-global state behind - a static
  # OnceLock/Mutex/Atomic, an env var, a cached global - can never be
  # observed by the test that then reads it, because the two never share
  # a process. The incident is 84ae50bd7 (a wall test and a ratelimit
  # test on opposite ends of one process-global cooldown table; main red
  # for a day with every CI job green), and 79 statics with interior
  # mutability in crates/nzbfast/src and 88 in crates/nzbkit/src say the
  # class is live in both.
  #
  # ci-private's `unit-one-process` closes that for the LINUX UNIT
  # binaries, on every push. These two jobs close the rest of it, and
  # the rest of it is where the questions actually are: the very first
  # hand-run of `e2e` in this shape, on 23 Aug 2026, went red in a way
  # no CI job in this repo could have seen (TODO 272). Measurement later
  # the same day put that particular victim down to a low-rate flake in
  # isolation rather than to pollution - and the point stands either
  # way, because until that run happened NOTHING anywhere ran these
  # targets in one process, so neither answer was available at all.
  #
  # WHY NIGHTLY AND NOT PER PUSH. Serial is the expensive direction:
  # measured on the nzbfast bin root, same binary and same box, 96.7 s
  # serial against 33.3 s parallel. `unit-one-process` costs 14m55s on a
  # runner while running PARALLEL inside each binary, so the serial
  # shape over a bigger target set is an hour-scale job. That is a
  # nightly, and a nightly is the right cadence for it anyway: this
  # class arrives with a commit that lands a static, and the push path
  # already has the parallel one-process run that caught 84ae50bd7.
  #
  # WHY SERIAL AT ALL, given the push job is parallel: A-then-B is the
  # literal shape of this class, and only the serial run puts the tests
  # in a defined order (libtest sorts the filtered set by name, so
  # `--test-threads=1` runs alphabetically). It is also what makes a red
  # run tractable - tools/pollution-bisect.py names the POLLUTER rather
  # than the victim, and it searches on exactly that ordering.
  #
  # A red run here names the BINARY. libtest reports the failing
  # assertion, which is the victim; the polluter is not in the output.
  # Every step below points at the bisect tool, which is the whole
  # remedy: it takes minutes and prints the guilty test.
  one-process-light:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    # `--tests` over both crates is 31 targets and ~3,851 tests, about
    # thirteen minutes on the dev box (measured 23 Aug 2026). The runner
    # ratio this workflow's sibling job measured for nzbkit is ~6x for
    # CPU-bound parallel work and less for serial, so budget under an
    # hour and allow for a bad night.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: test deps (par2 for repair fixtures)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq par2
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # Same restore/save split and same reason as long-suites above: the
      # combined actions/cache does not save when the job FAILED, so one
      # red night would leave the next night cold as well.
      # RESTORE ONLY, no matching save, and that is deliberate. long-suites
      # (and windows-daemon on the Windows side) already save this key, so
      # the ~600 dependency crates arrive warm; a save here would race two
      # other jobs for the same key with a DIFFERENT artifact set behind
      # it, and whichever landed first would decide what every job
      # restores tomorrow. The test binaries this job links are its own
      # and are not worth that.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # TWO invocations, and each one matches a run step below exactly.
      # `-p nzbfast -p nzbkit` in one command resolves features over the
      # union of the two packages, which is NOT what `-p nzbkit` alone
      # resolves - so a single combined build would compile one set of
      # artifacts and the run steps would then quietly compile a second.
      # That is the trap the note above `unit-one-process` in
      # ci-private.yml measured at 33 s and a duplicate artifact set.
      - name: build
        id: build
        run: |
          cargo test --locked -p nzbfast --tests --no-run
          cargo test --locked -p nzbkit --tests --no-run
      # `--tests` is every target with `test = true`, so this reaches the
      # LIB and BIN unit binaries as well as the integration ones -
      # which is the point of running it here rather than leaving the
      # unit binaries to the push job. That job runs them PARALLEL; this
      # is the serial run TODO 270 called the lever, and nightly is where
      # its price is affordable. The heavy targets are NOT in `--tests`:
      # required-features (TODO 116b) keeps them out without
      # `--features heavy-tests`, and the job below is theirs.
      #
      # Which means the split between the two crates here is lopsided,
      # and worth knowing before reading a red run. All six of the
      # nzbfast test targets that are a bare `tests/*.rs` are
      # heavy-gated, so its step is three binaries - the lib root, the
      # bin root, and the one directory-shaped target,
      # `tests/integration/main.rs`, which is where its ~30 non-heavy
      # integration modules live. nzbkit's step is its lib root plus the
      # ~27 targets that are not `conn_tuner`.
      #
      # `--no-fail-fast`, and it is not decoration: without it cargo stops
      # at the FIRST test binary that fails, so one red target would hide
      # every target after it in the same crate - and hiding the rest is
      # the exact failure mode every suite step in long-suites is split
      # up to avoid. One step per crate on top of that, so a red nzbfast
      # cannot skip nzbkit either.
      - name: nzbfast - lib and bin roots, one process each, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbfast --tests --no-fail-fast -- --test-threads=1
      - name: nzbkit - every non-heavy target, one process each, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbkit --tests --no-fail-fast -- --test-threads=1
      # POLLUTION-ONLY on purpose, and it differs from the annotations on
      # `unit-one-process` and `one-process-loaded` for a reason rather
      # than by drift: every command in this job ends `--test-threads=1`,
      # so a race between two THREADS on a process-global cannot occur
      # here at all, and the runner is idle, so a test with a hidden
      # wall-clock budget will not overrun it. Serial and quiet leaves
      # exactly one shape, which is the one named below.
      # Gated on the BUILD having succeeded, or a compile error would
      # print an annotation about cross-test pollution, which is a
      # confident answer to a question nobody asked.
      - name: how to read a red run
        if: ${{ failure() && steps.build.outcome == 'success' }}
        run: |
          echo "::error title=A target failed with its tests sharing one process::If the nextest suites are green on this same commit then no individual test is broken: one test in that binary is leaving process-global state that a later one reads. Do NOT make the victim order-independent - find the polluter. 'tools/pollution-bisect.py -p <crate> --test <target> <the failing test>' names it in minutes."

  one-process-heavy:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    # daemon alone is 519 s serial on the dev box (129 passed, 0 failed,
    # 9 ignored) and e2e is 306-327 s over three runs (148 passed, 1
    # ignored), all measured 23 Aug 2026 on a box under a load average
    # around 20, so on a runner this job is the hour-plus one. It is
    # also the one carrying the targets nothing had ever run this way.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: test deps (par2 for repair fixtures)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq par2
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # RESTORE ONLY, no matching save, and that is deliberate. long-suites
      # (and windows-daemon on the Windows side) already save this key, so
      # the ~600 dependency crates arrive warm; a save here would race two
      # other jobs for the same key with a DIFFERENT artifact set behind
      # it, and whichever landed first would decide what every job
      # restores tomorrow. The test binaries this job links are its own
      # and are not worth that.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # One invocation per package, each matching its run steps below -
      # see the note on the same step in one-process-light above for why
      # a combined `-p nzbfast -p nzbkit` would build a set of artifacts
      # nothing then runs. The targets are named here rather than swept
      # with `--tests` for the smaller reason that a sweep would also
      # link this crate's lib, bin and `integration` test binaries,
      # which are one-process-light's job and not this one's.
      - name: build
        id: build
        run: |
          cargo test --locked -p nzbfast --features heavy-tests --no-run \
            --test daemon --test e2e --test index_size_cap \
            --test http_wedge --test queue_soak
          cargo test --locked -p nzbkit --features heavy-tests --no-run \
            --test conn_tuner
          # par2gen_large_set went down with par2/par2gen/par2repair at the
          # nzbkit-base cut (3 Sep 2026), so it is a target of that crate
          # now. One invocation per package, same reason as the two above.
          cargo test --locked -p nzbkit-base --features heavy-tests --no-run \
            --test par2gen_large_set
      # Named one at a time rather than swept, for the reason long-suites
      # gives about its own list: a target added to crates/*/tests/
      # tomorrow must inherit "runs on push" from ci-private's
      # --workspace, never "runs nightly, maybe" from a pattern here, and
      # an exception should be a decision. It is also the only way to get
      # one step per target, which is what stops a red one hiding the
      # rest.
      #
      # SEVEN of the eight heavy targets, and the missing one is
      # arithmetic rather than an oversight: `leak_soak` contains
      # exactly ONE test. A binary with one test cannot have a test
      # pollute another test, so a one-process run of it is bit-for-bit
      # the run nextest already does nightly, at the same multi-hour
      # price. If it ever grows a second test, it belongs here.
      # `par2gen_large_set` IS here, on that same arithmetic read the
      # other way - five tests in one binary is a binary where one test
      # can pollute another - and it is the cheapest step in this job by
      # two orders of magnitude (seconds, against the multi-hour suites
      # above), so there is nothing to trade against enrolling it.
      - name: daemon - one process, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbfast --features heavy-tests --test daemon -- --test-threads=1
      # `cargo test` skips `#[ignore]`d tests, so none of this binary's
      # four ignored rigs runs here (1 Sep 2026) - the three
      # `e2e_wave5_cost::` complexity ratios and
      # `payout_crc_retry_prices_corrupt_storm_end_to_end`. That is
      # deliberate and not a coverage cut: this job asks whether one test
      # leaves process-global state a later one reads, and all four are
      # graded on wall clock in `long-suites`' own quiet-box step
      # instead. Do not add `--include-ignored` to get them back - a
      # one-process serial run of the whole binary is the loudest box in
      # this workflow, which is the one thing every one of the four is
      # `#[ignore]`d to stay off.
      - name: e2e - one process, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbfast --features heavy-tests --test e2e -- --test-threads=1
      - name: index_size_cap - one process, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbfast --features heavy-tests --test index_size_cap -- --test-threads=1
      - name: http_wedge - one process, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbfast --features heavy-tests --test http_wedge -- --test-threads=1
      - name: queue_soak - one process, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbfast --features heavy-tests --test queue_soak -- --test-threads=1
      - name: conn_tuner - one process, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbkit --features heavy-tests --test conn_tuner -- --test-threads=1
      - name: par2gen_large_set - one process, serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: cargo test --locked -p nzbkit-base --features heavy-tests --test par2gen_large_set -- --test-threads=1
      # THIS ANNOTATION USED TO SAY "POLLUTION-ONLY", AND THAT WAS WRONG -
      # measured 1 Sep 2026 over the eleven nightlies from 25 Aug, in
      # research/NIGHTLY-ONE-PROCESS-HEAVY-STANDING-RED-2026-09-01.md.
      # The old reasoning was that `--test-threads=1` rules out a race
      # between two THREADS on a process-global, and an idle runner rules
      # out a test with a hidden wall-clock budget, so serial and quiet
      # leaves cross-test pollution as the only shape left. The first
      # half still holds. The SECOND half does not: this runner is four
      # vCPU and is not the box any of these budgets were written on, and
      # the eleven-night measurement found no pollution at all. This
      # job's verdict matched `long-suites`' on TEN of the eleven, and
      # twelve of its thirteen victims had ALSO lost a first attempt in
      # `long-suites` THE SAME NIGHT - which is nextest, one process per
      # test, where cross-test pollution cannot reach them. What this job
      # was actually reporting for those eleven nights is `long-suites`
      # minus the retry that launders a flake, which is a real service
      # and is not the one the annotation named.
      #
      # So the annotation leads with the DISCRIMINATOR now. It stays an
      # `::error` and the pollution branch stays in it, because pollution
      # is still the shape only this job and `unit-one-process` can see,
      # and because the one victim that did NOT fail in `long-suites`
      # (e2e_chaserepair::a_paged_out_wedged_chase_repairs_in_place_too,
      # 29 Aug) is exactly the shape that branch is for.
      # Gated on the BUILD having succeeded, or a compile error would
      # print an annotation about cross-test pollution, which is a
      # confident answer to a question nobody asked.
      - name: how to read a red run
        if: ${{ failure() && steps.build.outcome == 'success' }}
        run: |
          echo "::error title=A heavy target failed with its tests sharing one process::FIRST open 'long-suites' ON THIS RUN and look for the same test. It runs these same seven targets under nextest - one process per test - so a test that also FAILED or went flaky there was not polluted by a neighbour, and a bisect over this job would converge on an innocent. Measured over the eleven nightlies to 1 Sep 2026, that is what twelve of thirteen victims did: research/NIGHTLY-ONE-PROCESS-HEAVY-STANDING-RED-2026-09-01.md. ONLY when 'long-suites' passed the same test on the same run is this cross-test pollution - then do NOT make the victim order-independent, find the polluter: 'tools/pollution-bisect.py -p nzbfast --features heavy-tests --test <target> <the failing test>' names it in minutes."

  # ===================================================================
  # THE LOADED ONE-PROCESS RUN. The only job in this repo that can see a
  # test carrying a hidden WALL-CLOCK budget, and the only one that
  # reports a RATE instead of a verdict.
  #
  # A one-process failure is one of three shapes, and TODO 270's
  # build-out reaches two of them:
  #
  #   (a) POLLUTION - test A leaves process-global state test B reads.
  #       Needs one process, visible even serial. Every one-process job
  #       here reaches it, and tools/pollution-bisect.py solves it.
  #   (b) A CONCURRENT RACE on a process-global - two tests on different
  #       THREADS of one process race a counter. Needs one process AND
  #       parallel threads, so `--test-threads=1` structurally cannot
  #       produce it. ci-private's `unit-one-process` reaches it (it
  #       invokes each binary bare, so libtest is parallel), and
  #       `windows-one-process` below reaches it once a night;
  #       one-process-light and one-process-heavy above CANNOT, because
  #       every command in them ends `-- --test-threads=1`.
  #   (c) A HIDDEN WALL-CLOCK BUDGET in the test - production correctly
  #       rolls a window or expires a token after N seconds and the
  #       test's setup is inside it. Needs LOAD, not neighbours: it
  #       fails SOLO once the box is slow enough, so there is no
  #       polluter and a bisect over it converges on an innocent.
  #
  # Nothing ran the one-process shape under LOAD, so (c) was invisible
  # to every job in this repo - and on 24 Aug 2026 BOTH of the flakes
  # that were fixed had been found by a human running the one-process
  # command by hand on a busy box, not by any of them.
  # `serve::mover::lane_tests::concurrent_pacers_share_one_bucket` was
  # (c): `mover_pacer` zeroes `sent` once 2 s pass and the window is
  # born inside `test_daemon`, so slow construction zeroed the counter
  # before the first assertion (4 failures in 4 loaded runs, 0 in 5
  # quiet ones; fixed in the TEST, 0a5834795). The sibling
  # `get::workers::mem_sampler_tests::stopping_an_old_sampler_leaves_the_new_one_running`
  # was (b) racing `MEM_SAMPLER_RUN` at 73 failures in 200 runs
  # (a676367fb). This job also takes (b) from "roughly one chance a
  # night" to near-certain, because it runs the binary tens of times.
  #
  # IT REPORTS A RATE, and that is the whole design. A run that fails 3
  # times in 40 is a real finding and NOT a red build; a job that goes
  # red on any single failure gets muted inside a week, and a muted job
  # is worse than no job. So the rate goes to the step summary and to a
  # warning annotation per test, and the exit code is red only at or
  # over 25% - a threshold calibrated on the two defects above, which
  # sat at 100% and 36.5%. What IS a hard red is the driver deciding it
  # could not do its job: a dilation that says the load never happened,
  # too few iterations to read a zero, a binary that ran almost no tests,
  # a pace probe that never reported, or a `--starve` whose lever did
  # nothing. Those five are the anti-rubber-stamp arms and they are the
  # ones never to soften - the whole risk of a job like this is that it
  # reports a clean rate over nothing, forever.
  #
  # ONE LEG PER BINARY, and until 24 Aug 2026 there was one leg and four
  # binaries. That was a deliberate choice about the DENOMINATOR - and it
  # cost this job the exact defect it exists to find.
  # nzbfast's unit binary is ~1750 tests and 56.9 s parallel on a runner
  # (measured in run 32660095310), so a loaded iteration is roughly 95 s
  # and 3000 s buys about thirty of them; nzbkit's lib root is 731 s in
  # that same measurement, so a campaign over it needs its own, much
  # larger budget or it lands under `--min-runs` and two observations is
  # not a rate. The original note said so and prescribed exactly this
  # remedy - "a second job with its own budget" - and then ran one leg
  # anyway, so `pool::fault_rigs::the_line_peak_reads_the_line_with_the_fleet_dialled_together`
  # (nzbkit LIB) went red twice in the 400 main runs of 23-24 Aug 2026,
  # was found by a human on a busy box, and was fixed in 2e4614940
  # without this job ever having run the binary it lives in.
  #
  # THE ROSTER IS DERIVED, NOT WRITTEN. `tools/one-process-roster.py`
  # reads the workspace manifests and holds the matrix below to every
  # first-party unit target `ci-private.yml`'s `unit-one-process` runs on
  # every push - each one either a leg or a `one-process-uncovered:` line
  # with a reason. A list is a gate that cannot see the third binary, and
  # the third binary was already there: `nzbtray`'s bin root carries 23
  # tests on every host, because `probe_body` is declared
  # `#[cfg(any(windows, test))]` and not `#[cfg(windows)]`.
  #
  # NOT ON THE PUSH PATH, deliberately. It is slow, and it is
  # flaky-SEEKING by construction: reddening somebody's push with a
  # probabilistic result is how this gets switched off.
  # ===================================================================
  one-process-loaded:
    # Named, or the Actions list renders every matrix field in the job
    # title and the two legs are told apart by reading a budget number.
    name: one-process-loaded (${{ matrix.id }})
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    # Per-leg, because the two binaries are an order of magnitude apart:
    # the campaign will not START an iteration it has no room to FINISH,
    # so the worst case is the budget plus one iteration plus the build.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # Never fail-fast: the whole output of this job is a RATE per
      # binary, and cancelling nzbkit's campaign because nzbfast's found
      # something throws away the measurement that costs the most to
      # make.
      fail-fast: false
      matrix:
        include:
          # `id` is what tools/one-process-roster.py holds to the
          # workspace; `select` is the cargo target spelling, and the two
          # have to agree by hand because cargo has no `--bin` for a lib.
          #
          # `min_tests` IS PER LEG, and it must be, because the driver's
          # own default is 1000 and EIGHT of these ten legs legitimately
          # run fewer. That default was written when this matrix had two
          # legs, nzbfast (1,461 tests) and nzbkit (2,753); the 2-3 Sep
          # crate splits added eight more, every one of them smaller, and
          # nothing set a floor for them - so the first nightly to run
          # them refused all eight with "the binary ran N test(s), under
          # the 1000 floor" (run 33737735769 on 7ec5395d: 59, 141, 224,
          # 311, 363, 368, 700, 904). The guard was right to refuse - a
          # floor it cannot meet is exactly how a silently emptied binary
          # would look - and the fix is the POINTER, so each leg now
          # carries its own, at roughly 70% of what it measured, with
          # that measurement in a comment beside it.
          #
          # It is a RATCHET: raise it when a leg grows, never lower it to
          # make a red go away. A leg that has genuinely lost most of its
          # tests is the thing this number exists to catch, and the way
          # to tell the two apart is to look at where the tests WENT -
          # for `nzbfast:lib` below they went to the nzbfast-daemon,
          # nzbfast-api and nzbfast-tasks legs in this same matrix, which
          # is why its floor is 40 and not a bug.
          # THE LIB, not `--bin nzbfast`, since the crate-split step 4.5
          # (2 Sep 2026): this package had two crate roots and the BIN
          # was the real one, and now `src/lib.rs` carries the module
          # tree while `main.rs` is a shim over its `cli_main`. That
          # move kept all 1,461 tests here and the bin's runs zero of
          # them, which is why the bin is excused by name at the foot of
          # this job rather than left as a leg. **The 1,461 is HISTORY
          # now**: the 3 Sep serve split (lanes 2, 3a, 3b) carried the
          # daemon, api and tasks layers out to their own crates and
          # their tests with them, so this binary is 59 tests and
          # `crates/nzbfast/src` holds 52 `#[test]` attributes. The three
          # legs that received them are in this matrix.
          # No features on the `select` for the reason the core leg
          # below states in reverse: THIS crate's default set is
          # `indexer, dashboard`, which is exactly what the archive
          # `unit-one-process` runs resolves, so a bare `--lib` builds
          # the same binary.
          - id: nzbfast:lib
            package: nzbfast
            select: --lib
            budget: 3000
            timeout: 90
            # ran 59 on 7ec5395d; see the floor note above the matrix
            min_tests: 40
          # MEASURED 25 Aug 2026 and the budget is NOT thin, which this
          # comment claimed on an estimate. On a hosted runner
          # `unit-one-process` runs this binary idle in 369.77 s (1833
          # tests, run 32795946947); the 731 s this line was written
          # from is the other end of a wide spread and is a runner-day,
          # not the number. And loading it costs about NOTHING in wall
          # clock: the nzbfast leg measured 39-49 s loaded against 49.5 s
          # idle, because the campaign runs `--test-threads=6` where the
          # bare binary defaults to `nproc` = 2, and the extra threads
          # pay for the spinners. So expect roughly 10-22 iterations
          # here, not the six to ten guessed above. Cut the budget if the
          # minutes are not wanted - but the reason is cost, not
          # `--min-runs`, which has far more headroom than this said.
          # This is the leg the 24 Aug defect lived in.
          #
          # IT IS ALSO THE EXPENSIVE ONE: worst case this is a ~2.5-4 h
          # nightly runner where there was none, on a repo that bills.
          # The budget is the knob, and it is the FIRST thing to cut if
          # those minutes are not wanted - but cut it and watch
          # `--min-runs`, because a leg that stops completing three
          # iterations exits 2 every night, and a permanently red job is
          # how this whole family gets switched off. Three or four
          # iterations is the floor worth having; below that, drop the
          # leg on purpose with a `one-process-uncovered:` line rather
          # than leaving it red.
          - id: nzbkit:lib
            package: nzbkit
            select: --lib
            budget: 9000
            timeout: 240
            # ran 1553 on 7ec5395d; see the floor note above the matrix
            min_tests: 1000
          # The nzbkit split's lane 2 cut (3 Sep 2026). The leg above
          # kept the larger half: nzbkit's 2,753 lib tests are 1,553 in
          # the facade (extract, pool, index) and 1,200 here, and
          # serially on the dev box this binary is 119.4 s. So the
          # budget is a THIRD of nzbkit's rather than a match for it -
          # the campaign is a rate per binary, and a binary that runs in
          # two minutes buys the same order of iterations from 3000 s
          # that the facade needs 9000 for. If it stops completing three
          # iterations, cut the leg with a `one-process-uncovered:` line
          # rather than leaving it red.
          #
          # THE FEATURES ARE ON THE `select` FOR THE REASON THE CORE LEG
          # BELOW STATES. `test-support` is a dev-dependency switch in
          # the facade, so a bare `--lib` here builds a SMALLER test
          # binary than the archive `unit-one-process` runs - renameclaim
          # and `memgauge::one_gauge_test_at_a_time` are both behind it -
          # and the two jobs would campaign over different test sets
          # while reporting the same target name. `indexer` is this
          # crate's own default and is named for the same reason: so the
          # line says what it builds.
          - id: nzbkit-base:lib
            package: nzbkit-base
            select: --lib --features indexer,test-support
            budget: 3000
            timeout: 90
            # ran 1200 on 7ec5395d; see the floor note above the matrix
            min_tests: 800
          # The crate-split step 2 cut (2 Sep 2026) made this a unit
          # binary of its own, so `unit-one-process` runs it on every
          # push and this job owes it a leg.
          #
          # THE FEATURES ARE ON THE `select` FOR A REASON. This crate's
          # own default set is EMPTY - nzbfast forwards its `indexer` to
          # it, and `test-support` is a dev-dependency switch there - so
          # a bare `--lib` builds a smaller test binary than the archive
          # `unit-one-process` runs, and the two jobs would be
          # campaigning over different test sets while reporting the same
          # target name. Measured on the dev box with them on: 327 tests,
          # 7.72 s serial.
          #
          # THE SMALLEST BUDGET OF THE THREE, and it is arithmetic rather
          # than a guess about risk. This binary is ~1/5 of nzbfast's
          # test count and runs serially in seconds, so 1200 s buys the
          # same order of iterations the nzbkit leg gets from 9000 - and
          # the campaign will not start an iteration it cannot finish, so
          # the timeout is the budget plus one iteration plus the build.
          # If it stops completing three iterations, cut the leg with a
          # `one-process-uncovered:` line rather than leaving it red.
          - id: nzbfast-core:lib
            package: nzbfast-core
            select: --lib --features indexer,test-support
            budget: 1200
            timeout: 60
            # ran 363 on 7ec5395d; see the floor note above the matrix
            min_tests: 250
          # The crate-split step 3 cut (2 Sep 2026), same reasoning one
          # layer up. The features are on the `select` for the reason the
          # core leg states: this crate's default set is EMPTY and
          # `test-support` is a dev-dependency switch in `nzbfast`, so a
          # bare `--lib` builds a smaller binary than the archive
          # `unit-one-process` runs. There is no `indexer` here - unlike
          # core, nothing in this crate carries that gate, and naming a
          # feature that does not exist fails the build.
          #
          # THE BUDGET IS PROPORTIONAL TO THE CORE LEG'S and measured the
          # same way: 699 tests, 23.55 s serial on the 32-core dev box
          # against core's 327 tests and 7.72 s. 1800 s buys ~76 dev
          # iterations, which is the same order of runner iterations core
          # gets from 1200 - comfortably above the three-iteration floor
          # the nzbfast leg's note sets. It is 3x core's test count and
          # the binary does real file I/O (extraction, filing, trash), so
          # this is the leg most likely to find an ordering defect that
          # nextest's process-per-test can never see. If it stops
          # completing three iterations, cut the leg with a
          # `one-process-uncovered:` line rather than leaving it red.
          - id: nzbfast-unpack:lib
            package: nzbfast-unpack
            select: --lib --features test-support
            budget: 1800
            timeout: 60
            # ran 700 on 7ec5395d; see the floor note above the matrix
            min_tests: 500
          # The crate-split step 3 cut's other half. `--features indexer`
          # for the core leg's reason and no `test-support`: nothing in
          # this crate is a test seam another crate reaches, so it has no
          # such feature to name and naming one that does not exist fails
          # the build. Without `indexer` the binary is a THIRD of its real
          # size - six of the twelve modules compile out - so it would be
          # campaigning over a different test set from the one
          # `unit-one-process` runs under the same target name.
          #
          # THE SMALLEST BUDGET OF THE FOUR, and it is arithmetic: 222
          # tests, 0.64 s SERIAL on the dev box, against the unpack leg's
          # 699 and 23.55 s. These are parsers, feed readers and gate
          # predicates - no file I/O, no timers - so an iteration is
          # cheap and 600 s buys hundreds of them, far past the
          # three-iteration floor the nzbfast leg's note sets. If it stops
          # completing three, cut the leg with a
          # `one-process-uncovered:` line rather than leaving it red.
          - id: nzbfast-meta:lib
            package: nzbfast-meta
            select: --lib --features indexer
            budget: 600
            timeout: 45
            # ran 224 on 7ec5395d; see the floor note above the matrix
            min_tests: 150
          # The crate-split step 4 cut: the `get` download pipeline. No
          # feature flag at all, and that is measured rather than copied
          # - this crate declares neither `indexer` nor `test-support`
          # (nothing in `get` carries an indexer site, and nothing in it
          # is a test seam another crate reaches), and naming a feature
          # that does not exist fails the build.
          #
          # BUDGET 1200, between core's and unpack's, and it is
          # arithmetic: 308 tests, 4.37 s SERIAL on the dev box, against
          # the unpack leg's 699 / 23.55 s at 1800 and the meta leg's
          # 222 / 0.64 s at 600. A runner is slower than the dev box and
          # loaded, so budget for well under an order of magnitude of
          # iterations rather than for one - 1200 s buys dozens, far
          # past the three-iteration floor the nzbfast leg's note sets.
          # This is the leg most likely to find a fleet or settle
          # ordering defect: `MEM_SAMPLER_RUN` and the settle gauges are
          # process-global, which is precisely what nextest's
          # process-per-test can never see. If it stops completing
          # three iterations, cut the leg with a
          # `one-process-uncovered:` line rather than leaving it red.
          - id: nzbfast-engine:lib
            package: nzbfast-engine
            select: --lib
            budget: 1200
            timeout: 50
            # ran 311 on 7ec5395d; see the floor note above the matrix
            min_tests: 200
          # The serve split's lane 2: the daemon layer of serve. BOTH
          # features on the `select`, for the reason the core leg states
          # and then some - this crate's default set is EMPTY, `indexer`
          # is forwarded to it by nzbfast and `test-support` is a
          # dev-dependency switch there, so a bare `--lib` builds a
          # binary missing the indexer half of the layer AND the two
          # seam modules the archive `unit-one-process` compiles. The
          # two jobs would be campaigning over different test sets under
          # one target name.
          #
          # THE SECOND-LARGEST BUDGET, and it is arithmetic against the
          # legs above rather than a guess: 904 tests, 65.99 s SERIAL on
          # the 32-core dev box, against the unpack leg's 699 / 23.55 s
          # at 1800 and nzbfast's at 3000. 3000 s buys ~45 dev
          # iterations, which on a slower runner is comfortably past the
          # three-iteration floor the nzbfast leg's note sets.
          #
          # IT IS THE LEG MOST LIKELY TO FIND SOMETHING. `Daemon` is the
          # shared state of the whole product and this binary is 904
          # tests over one type's queue, history, settings and
          # persistence - process-global by construction, which is
          # exactly the class nextest's process-per-test can never see.
          # If it stops completing three iterations, cut the leg with a
          # `one-process-uncovered:` line rather than leaving it red.
          - id: nzbfast-daemon:lib
            package: nzbfast-daemon
            select: --lib --features indexer,test-support
            budget: 3000
            timeout: 90
            # ran 904 on 7ec5395d; see the floor note above the matrix
            min_tests: 650
          # The serve split's lane 3: the background-lane layer of serve.
          # `--features indexer` for the reason the core leg states -
          # this crate's default set is EMPTY and nzbfast forwards
          # `indexer` to it, and without the feature the binary is HALF
          # its real size (72 tests against 142; the whole indexer lane,
          # the scoreboard and the name hunt compile out), so it would be
          # campaigning over a different test set from the one the
          # archive `unit-one-process` runs under the same target name.
          # There is no `test-support` here: nothing in this crate is a
          # seam another crate reaches, it only CONSUMES the daemon's,
          # and naming a feature that does not exist fails the build.
          #
          # BUDGET 900, and it is arithmetic against the legs above
          # rather than a guess: 142 tests, 15.13 s SERIAL on the 32-core
          # dev box, against the meta leg's 222 / 0.64 s at 600 and the
          # unpack leg's 699 / 23.55 s at 1800. 900 s buys ~59 dev
          # iterations, comfortably past the three-iteration floor the
          # nzbfast leg's note sets even on a slower, loaded runner.
          #
          # WHAT IT IS LIKELY TO FIND: every test in here drives a lane
          # over a shared `Daemon` with tokio timers and stand-down
          # latches, which is the shape a process-per-test runner cannot
          # see at all. If it stops completing three iterations, cut the
          # leg with a `one-process-uncovered:` line rather than leaving
          # it red.
          - id: nzbfast-tasks:lib
            package: nzbfast-tasks
            select: --lib --features indexer
            budget: 900
            timeout: 45
            # ran 141 on 7ec5395d; see the floor note above the matrix
            min_tests: 100
          # The serve split's lane 3, the other half: the request layer of
          # serve. `--features indexer` for the reason the core leg
          # states - this crate's default set is EMPTY, nzbfast forwards
          # `indexer` to it, and that feature PULLS IN `dashboard`, so a
          # bare `--lib` builds a binary with the whole browser-facing
          # half and every wall and browse arm compiled out (250 tests
          # against 371). It would be campaigning over a different test
          # set from the one the archive `unit-one-process` runs under
          # the same target name. No `test-support`: nothing in this
          # crate is a seam another crate reaches, it only CONSUMES the
          # daemon's, and naming a feature that does not exist fails the
          # build.
          #
          # BUDGET 1500, arithmetic against the legs above: 371 tests,
          # 15.37 s SERIAL on the 32-core dev box, against the unpack
          # leg's 699 / 23.55 s at 1800 and the tasks leg's 142 /
          # 15.13 s at 900. ~97 dev iterations, comfortably past the
          # three-iteration floor the nzbfast leg's note sets.
          #
          # WHAT IT IS LIKELY TO FIND: this binary carries serve's four
          # big `tests_*` modules, which build a Daemon, drive the whole
          # request surface against it and assert on process-global
          # counters (`STORAGE_PROBES`, `KEPT_RETRY_STALL_MS`) and a
          # two-party delete barrier - the exact class a
          # process-per-test runner can never see. If it stops
          # completing three iterations, cut the leg with a
          # `one-process-uncovered:` line rather than leaving it red.
          - id: nzbfast-api:lib
            package: nzbfast-api
            select: --lib --features indexer
            budget: 1500
            timeout: 60
            # ran 368 on 7ec5395d; see the floor note above the matrix
            min_tests: 250
          # The posting-layout generator. Cut 3 Sep 2026 with one
          # constant and one test, and excused here on that basis; by
          # the end of that day chips 02 to 10 had taken it to 136, so
          # the excuse this leg replaces had stopped being true. The
          # crate is deterministic and seeded by contract - one profile
          # and one seed give one layout on every machine and every run
          # - which is an argument for campaigning over it rather than
          # against: that contract is exactly what a loaded run can
          # falsify and a process-per-test runner cannot.
          #
          # BUDGET 900, arithmetic against the legs above: 136 tests,
          # 0.91 s SERIAL on the 32-core dev box, against the tasks
          # leg's 142 / 15.13 s at the same 900. It is the cheapest leg
          # in the matrix by an order of magnitude, so the budget is
          # the matrix floor rather than a measurement.
          #
          # WHAT IT IS LIKELY TO FIND: `recovery.rs` holds the crate's
          # only process-global, a `STAGE_SEQ` atomic counter that names
          # each PAR2 staging directory under `$TMPDIR` alongside the
          # pid. Uniqueness is correct by construction, and by
          # construction is what a campaign is for - two stages racing
          # to the same name, or a stage reading a directory another
          # test left, is the one shape here that a process-per-test
          # runner can never see. If it stops completing three
          # iterations, cut the leg with a `one-process-uncovered:`
          # line rather than leaving it red.
          - id: postfast:lib
            package: postfast
            select: --lib
            budget: 900
            timeout: 45
            # ran 136 on 8099d6543; see the floor note above the matrix
            min_tests: 100
    # nzbfast's BIN root is a SHIM since the crate-split step 4.5
    # (2 Sep 2026) - `main.rs` sets the allocator and calls
    # `nzbfast::cli_main()`, and every test in the package belongs to the
    # lib unit above. So its test binary carries no tests at all, and a
    # loaded campaign over an empty binary would trip `--min-tests` every
    # night, which is a permanently red job over nothing. This exclusion
    # and the `nzbfast:lib` leg above swapped places that day; before it,
    # the LIB was the empty one (it was `#![cfg(feature = "ffi")]` and
    # nothing in default-members turns that feature on).
    # one-process-uncovered: nzbfast:bin/nzbfast - a shim over the lib's cli_main, so it carries no tests to load
    # nzbtray's 23 tests are pure functions in `probe_body` - no timer, no
    # process-global, no I/O - so there is nothing for load to perturb,
    # and the binary runs in well under a second. `unit-one-process` runs
    # it on every push, which is where a pollution or race shape in it
    # would show.
    # one-process-uncovered: nzbtray:bin/nzbtray - 23 pure-function tests, no timer and no process-global for load to perturb
    # Chip 03 (b50c50bea) then added `src/bin/postfast.rs`, a one-verb
    # CLI over the same generator, and the roster caught that nothing
    # covered or excused it - red from that commit, surfaced by the next
    # push whose run reached this gate. The bin carries ZERO `#[test]`
    # attributes: `postfast gen` loads a profile, builds a Layout and
    # writes it, and every assertion about that lives in the lib. So
    # there is not a test for a loaded campaign to perturb, which is the
    # same reason `nzbfast:bin/nzbfast` is excused three lines up. This
    # line is about the BIN only. The `postfast:lib` excuse this note
    # used to call stale was answered on 3 Sep 2026: that lane read it,
    # agreed, and replaced the excuse with a real matrix leg above (136
    # tests, 0.91 s serial), so the LIB is campaigned over and only the
    # bin is excused. The bin is still worth re-reading if `postfast
    # gen` ever grows assertions of its own.
    # one-process-uncovered: postfast:bin/postfast - a one-verb CLI over the lib's generator with zero tests, so a loaded campaign has nothing to run
    # `parfast`, the par2cmdline-dialect CLI over the PAR2 engine
    # (chip 13, 3 Sep 2026). BOTH targets excused, and the reason is the
    # same for each: this crate carries no process-global state and no
    # timer for load to perturb. Its library is the argument parser, the
    # verbosity ladder and the help screen - pure functions over a string
    # and a struct - and the tests over them are pure too, so ordering
    # and load cannot reach them. Its binary is a shim that reads argv
    # and calls `parfast::run`. Everything with real state in it - the
    # slice grid, the fold, the repair solve - lives in nzbkit-base and
    # is campaigned over by the `nzbkit-base:lib` leg above.
    #
    # RE-READ THIS if parfast ever grows a test that touches the
    # filesystem or the engine in the LIB target. The one test here that
    # does (the byte-for-byte create comparison against par2cmdline) is
    # an integration target and not a unit binary, so it is outside this
    # gate's population either way.
    # one-process-uncovered: parfast:lib - the parser, the verbosity ladder and the help screen; pure functions with no process-global state or timer for load to perturb
    # one-process-uncovered: parfast:bin/parfast - a shim that reads argv and calls parfast::run, so it carries no tests to load
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # FIRST, and it needs neither the toolchain nor the cache below, so
      # a disagreement costs seconds rather than a disk clean, a rustup
      # install, an apt-get and a cache restore. A leg naming a target
      # that no longer exists would otherwise fail deep in the build with
      # a cargo error; a first-party binary nobody covers would not fail
      # at all, which is the whole reason this gate exists.
      - name: the matrix covers every first-party unit binary
        run: |
          tools/one-process-roster.py --selftest
          tools/one-process-roster.py
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: test deps (par2 for repair fixtures)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq par2
      # ---------------------------------------------------------------
      # THE postfast LEG NEEDS A DIFFERENT par2, and the apt one above
      # reddens it 49 runs out of 49.
      #
      # `recovery::tests::par2cmdline_verifies_every_unpatched_set_the_catalog_emits`
      # is a postfast LIB test, so this campaign draws it - and it asks
      # the reference tool to verify every set the layout catalog emits.
      # Ubuntu's par2 is 0.8.1, which cannot verify ANY set describing a
      # 0-byte member (upstream #128, fixed in 1.0.0), and the catalog
      # carries three such rows. So the guard meets a tool two majors
      # too old and fails deterministically: measured on run
      # 33857298155, 49 of 49 loaded runs red at a 100% rate, which is
      # not the cross-test pollution this job hunts and would send a
      # bisect after an innocent.
      #
      # ci-private's `unit-one-process` met the same wall on 4 Sep 2026
      # and answered it with a par2cmdline built from tag and cached at
      # ~/par2ref/par2 (a19d74376). That commit deliberately left
      # nightly alone - "the nightly jobs that install par2 install
      # 0.8.1 on purpose and their assertions name the version they
      # got" - and this leg is the one place that is not true, because
      # its assertion is the catalog guard rather than a repair fixture.
      #
      # THE TAG IS READ OUT OF ci-private.yml rather than typed again.
      # A second copy of the version is a second thing to bump, and the
      # cache key is built from the same two values, so a drifted copy
      # would also silently stop hitting the warm cache that job fills.
      # Failing to find is failing: the step refuses if either pin has
      # moved or been renamed.
      - name: the pinned par2cmdline reference, per ci-private
        id: par2pin
        if: matrix.id == 'postfast:lib'
        shell: bash
        run: |
          set -euo pipefail
          f=.github/workflows/ci-private.yml
          tag=$(sed -n 's/^  PAR2REF_TAG: "\(.*\)"$/\1/p' "$f" | head -1)
          suffix=$(sed -n 's/^  PAR2REF_KEY_SUFFIX: "\(.*\)"$/\1/p' "$f" | head -1)
          if [ -z "$tag" ] || [ -z "$suffix" ]; then
            echo "::error::PAR2REF_TAG / PAR2REF_KEY_SUFFIX not found in $f."
            echo "::error::This leg reads them from there so the version and the cache key"
            echo "::error::cannot drift from the per-push job that fills that cache."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
      - name: cache the pinned par2cmdline reference
        id: par2ref
        if: matrix.id == 'postfast:lib'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/par2ref
          key: par2cmdline-${{ steps.par2pin.outputs.tag }}-${{ runner.os }}-${{ steps.par2pin.outputs.suffix }}
      - name: build par2cmdline from tag ${{ steps.par2pin.outputs.tag }}
        if: matrix.id == 'postfast:lib' && steps.par2ref.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.par2pin.outputs.tag }}" \
            https://github.com/Parchive/par2cmdline.git "$RUNNER_TEMP/par2src"
          cd "$RUNNER_TEMP/par2src"
          ./automake.sh
          ./configure
          make -j"$(nproc)"
          ./par2 --version
          mkdir -p ~/par2ref
          cp par2 ~/par2ref/par2
      # NZBFAST_PAR2_BIN rather than a PATH prepend, for the reason
      # `unit-one-process` gives: it is explicit in the log and it
      # cannot be defeated by the apt par2 installed two steps up, which
      # on THIS job is still on PATH and is still wanted by the other
      # legs' repair fixtures.
      - name: point the catalog conformance guard at the pinned reference
        if: matrix.id == 'postfast:lib'
        shell: bash
        run: |
          set -euo pipefail
          if ! "$HOME/par2ref/par2" -V; then
            echo "::error::the pinned par2cmdline reference is not at ~/par2ref/par2."
            echo "::error::postfast's catalog conformance guard would meet apt's 0.8.1 instead."
            exit 1
          fi
          echo "NZBFAST_PAR2_BIN=$HOME/par2ref/par2" >> "$GITHUB_ENV"
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # RESTORE ONLY, no matching save, for the reason the sibling jobs
      # above give: long-suites owns this key, and a save here would race
      # it with a different artifact set behind it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # Built with EXACTLY the command the campaign then runs, matrix
      # field for matrix field. `-p nzbfast --lib` resolves fewer
      # features than `--workspace` does, so a build spelled any other
      # way would leave the run steps quietly compiling a second artifact
      # set - the trap measured at 33 s and a duplicate `target/` in the
      # note above `unit-one-process` in ci-private.yml.
      - name: build
        id: build
        run: cargo test --locked -p ${{ matrix.package }} ${{ matrix.select }} --no-run
      # The spinners and the thread count are derived from `nproc` inside
      # the driver rather than written here, because the ratio is what
      # transfers between boxes and the numbers are not: the dev box that
      # reproduced both defects ran 32 spinners with `--test-threads=96`
      # on 32 cores. Its own docstring carries the derivation, the two
      # dilation tiers and the measurements behind them.
      #
      # `--starve` is deliberately NOT passed, and since 25 Aug 2026 that
      # is a measurement on THIS runner rather than an inference from a
      # dev box. A hosted runner is TWO cores, so the derivation above
      # puts 4 spinners and `--test-threads=6` on it, and the plain
      # nzbfast leg reads pace 0.88 - UNDER the driver's 0.90 slip floor,
      # so it already claims the timer-paced class without any lever.
      # `nice -n 5` moves that to 0.84 and costs 2.0x of the campaign's
      # own throughput (39-49 s an iteration -> 74-87 s), i.e. 0.04 of
      # pace for half the denominator that makes this job a rate. Worse,
      # it ARMS a refusal the plain leg does not have: `--starve` with a
      # pace at or over 0.90 is exit 2 by design, where the same reading
      # unstarved is deliberately not even a warning, and a permanently
      # red job is how this family gets switched off.
      # The dev-box numbers in the driver's header are a statement about
      # SPINNERS, not about this job - probe-only on this runner, with no
      # test binary beside them, pace reads 0.982. It is the TEST
      # THREADS that dilate the pacing on a two-core box. TODO 289 carries
      # both tables. Reach for `--starve` by hand on one suspect test,
      # which is how both 24 Aug flakes were actually found.
      - name: loaded, repeated one-process runs of the ${{ matrix.id }} unit binary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
        run: |
          python3 tools/loaded-one-process.py --selftest
          python3 tools/loaded-one-process.py --budget-seconds ${{ matrix.budget }} \
            --min-tests ${{ matrix.min_tests }} -- \
            cargo test --locked -p ${{ matrix.package }} ${{ matrix.select }} -- --test-threads={threads}
      # No `how to read a red run` step, and its absence is the point:
      # the driver writes its own annotations, one per failing test with
      # the three shapes and the tell that separates them, plus a step
      # summary table carrying the rate. A second annotation here would
      # be a confident answer over the top of a measured one.

  # Windows leg for the PRIVATE repo. The test suite had NEVER run on
  # Windows until a Windows-on-ARM build probe added the public-repo
  # pr-check job, and that first run exposed four real product bugs -
  # `copy_tree`'s fsync alone broke every cross-device move and the
  # spool migration on the shipping x64 binary. Development happens in
  # THIS repo, so a Windows regression merged here would otherwise sit
  # invisible until it reached a public-repo PR or a release. Windows
  # runners bill at 2x on private repos, which is why pr-check keeps
  # its Windows job public-only.
  #
  # This job ran the fast unit suites until ci-private.yml took them on
  # every push (TODO 81), which is strictly better: per-push names the
  # commit that broke it. So the split now mirrors the Linux one -
  # ci-private has the fast suites, nightly has the slow one. The
  # daemon suite is the slow one, it is the suite most likely to break
  # on Windows specifically (it spawns real daemons, binds ports and
  # moves files across the paths where every one of those four bugs
  # lived), and it had no Windows CI coverage here at all. e2e stays
  # out: it needs the external par2 as a fixture creator, and it does
  # run on Windows in pr-check's workspace pass on public PRs.
  windows-daemon:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: windows-latest
    # The Linux long-suites job above allows 90; Windows compiles this
    # workspace a good deal slower, so it gets no less.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain step: rust-toolchain.toml pins the version and
      # rustup installs it for the msvc host on the first cargo
      # invocation (same rationale as pr-check.yml's Windows job).
      #
      # No par2 fetch, unlike pr-check's Windows job: par2 there is a
      # fixture tool for the e2e repair tests, which do not run here.
      # Cargo.lock moves on EVERY release (packaging/bump-version.sh
      # rewrites it), and this key used to be `hashFiles('Cargo.lock')` -
      # so the first nightly after a release ran cold on every job.
      # Measured 17 Aug 2026 on run 32014400559: all four cache restores
      # took 0-1s, every one a miss, and `long-suites` spent 4m08s
      # building where the one warm run in the same sample took 1m32s.
      # tools/dep-cache-key.py hashes the lockfile with the workspace
      # members' own version lines normalised out, so our own version
      # bumps stop throwing away ~600 compiled crates. Same tool, same
      # rationale, same `-v2`-style suffix discipline as ci-private.yml.
      - name: dependency cache key
        id: depkey
        shell: bash
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # restore + save as SEPARATE steps, not the combined actions/cache:
      # its post step does NOT save when the job FAILED, so one red night
      # left the next night cold as well. That is not hypothetical here -
      # on run 32014400559 `armv7-cross` failed and its
      # `Post Run actions/cache` reads `skipped`. The save below is
      # `if: always()` and sits immediately after the build, so the
      # dependency artifacts are banked whatever the suites then do.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # runner.os is in the key, so this cannot collide with the
          # Linux job's cache.
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # nextest, not libtest, and the reason is diagnostic rather than
      # speed: with `retries = 1` in .config/nextest.toml a flake is
      # reported as a NAMED FLAKY test with both attempts' output, where
      # bare `cargo test` gave an anonymous pass/fail tally. These are
      # the flakiest suites in the repo, so they are the ones that most
      # needed it - and they were the last place in CI still on libtest.
      # Prebuilt, pinned by version, checked by SHA256 rather than
      # trusted: same pattern as the armv7 job below and ci-private.yml.
      - name: install cargo-nextest
        shell: pwsh
        run: |
          $ver = "0.9.140"
          $url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$ver/cargo-nextest-$ver-x86_64-pc-windows-msvc.zip"
          $want = "ec39698dfe5bcfffb7d5da037f226bc1670584ba247123f4e684a0f224fe828d"
          # Explicit loop, not -MaximumRetryCount: what this dies of is
          # `The response ended prematurely`, a transport truncation that
          # parameter does not cover. Hash checked INSIDE the loop so a
          # short read retries rather than failing the job.
          $ok = $false
          foreach ($i in 1..5) {
            try {
              Invoke-WebRequest -Uri $url -OutFile cargo-nextest.zip
              $got = (Get-FileHash cargo-nextest.zip -Algorithm SHA256).Hash.ToLower()
              if ($got -eq $want) { $ok = $true; break }
              Write-Host "attempt ${i}: sha256 mismatch (expected $want)"
            } catch { Write-Host "attempt ${i}: $($_.Exception.Message)" }
            Start-Sleep -Seconds (5 * $i)
          }
          if (-not $ok) { throw "cargo-nextest download failed after 5 attempts" }
          New-Item -ItemType Directory -Force -Path C:\nextest | Out-Null
          Expand-Archive cargo-nextest.zip -DestinationPath C:\nextest -Force
          Remove-Item cargo-nextest.zip
          "C:\nextest" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: build
        run: cargo build -p nzbfast --locked
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # --test-threads=1 is a hard requirement for the daemon suite
      # (CLAUDE.md invariant 4), same as the Linux leg above.
      #
      # NZBFAST_NO_ENRICH keeps enrichment workers off the real
      # internet. NZBFAST_LAN_TESTS is deliberately NOT set: it opens an
      # all-interfaces listener, which on Windows raises the Defender
      # Firewall dialog, and a hosted runner has nobody to click it
      # (same rationale as pr-check.yml's Windows job). NZBFAST_REQUIRE_PAR2
      # is not set either, since no par2 is installed on this runner. One
      # test in the suite DOES create a recovery set since 23 Aug 2026 -
      # daemon_bomb's post-repair route (TODO 222), which needs the
      # external par2 both as a fixture creator and as the repairer on
      # the materialize path - and it skips itself without one. The Linux
      # leg above installs par2 and sets the variable, so that route is
      # covered there; if it is ever wanted on Windows too, the cure is a
      # par2 install here plus the variable, never dropping the guard.
      - name: daemon suite
        env:
          NZBFAST_NO_ENRICH: "1"
        run: cargo nextest run --profile ci -p nzbfast --locked --features heavy-tests --test daemon
      # The junit half - see the long note in `long-suites` above. Windows
      # gets it for the same reason it gets this suite at all: a wedge is
      # a scheduling defect, and this is the one platform's scheduler
      # nobody on this fleet can reproduce by hand.
      # `!cancelled()` alone, NOT `&& steps.build.outcome == 'success'`
      # the way the long-suites checks are written: this job's build step
      # carries no `id`, so that reference would resolve to null, the
      # condition would be false on every run, and this check would never
      # fire. Caught by reading the step ids rather than by copying the
      # sibling - which is how a gate that never runs gets shipped.
      - name: wedge check - daemon
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          $py tools/wedge-gate.py --junit target/nextest

  # ===================================================================
  # THE SAME HOLE, ON WINDOWS. TODO 270 item 1.
  #
  # `windows-unit` in ci-private.yml is four nextest shards off
  # `windows-build`'s archive, so every Windows unit test runs in its
  # own process and a Windows-ONLY process global is exactly as
  # invisible there as the Linux ones were before `unit-one-process`
  # landed. There are Windows-only arms in nzbkit::mem and nzbkit::disk,
  # and nzbtray is a Windows binary with no Linux counterpart at all -
  # so this is not a theoretical port of a Linux concern, it is the only
  # job anywhere that can see the class in code the Linux jobs never
  # compile.
  #
  # NIGHTLY, AND THAT IS THE DECISION rather than the default. Per-push
  # was priced and refused: `unit-one-process` costs 14m55s of Linux
  # runner, Windows runners bill at 2x on a private repo, and this leg
  # would sit on top of a `windows-build` plus four shards that already
  # run on every push. ~30 billed minutes per push to re-run tests that
  # just ran, for a class that arrives with a commit landing a static,
  # is the wrong trade; a night's delay on a class this rare is not.
  #
  # PARALLEL INSIDE EACH BINARY, unlike the two Linux jobs above, and
  # for the same cost reason: serial is ~3x (96.7 s against 33.3 s,
  # measured on the nzbfast bin root) and 3x of a 2x-billed runner is
  # not worth buying twice. Parallel one-process is the shape that
  # caught 84ae50bd7, so it is not a token run.
  #
  # No archive to ride here - `windows-build`'s belongs to ci-private's
  # run - so this builds its own, and `--workspace` is chosen to match
  # what that archive resolves rather than the narrower `-p nzbfast
  # --lib`, which resolves FEWER features and would test a
  # configuration nothing ships. The two vendored crates are excluded
  # the way `unit-one-process` excludes them: first-party only.
  #
  # nzbfast-ffi is excluded too, and here that is a saving rather than a
  # rule: it is a staticlib whose own unit root is EMPTY, so linking it
  # buys no test at all. (Until the crate-split step 4.5 the reason was
  # bigger - `ffi` gated a second nzbfast crate root, so including this
  # crate compiled the whole module tree a SECOND time for a test binary
  # that was a strict duplicate. That root is now the package's only
  # one and the duplicate is gone.) `unit-one-process` keeps it only
  # because it selects out of an archive and dropping it would mean
  # maintaining a
  # name; this job is already naming exclusions, so it pays nothing to
  # drop it, and what is left is the configuration that ships.
  windows-one-process:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain step and no par2, for the reasons windows-daemon
      # above gives: rust-toolchain.toml pins the version and rustup
      # installs it on the first cargo call, and no target here needs
      # par2 as a fixture creator.
      - name: dependency cache key
        id: depkey
        shell: bash
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # RESTORE ONLY, no matching save, and that is deliberate. long-suites
      # (and windows-daemon on the Windows side) already save this key, so
      # the ~600 dependency crates arrive warm; a save here would race two
      # other jobs for the same key with a DIFFERENT artifact set behind
      # it, and whichever landed first would decide what every job
      # restores tomorrow. The test binaries this job links are its own
      # and are not worth that.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      - name: build
        id: build
        run: cargo test --locked --workspace --exclude rars --exclude tiny_http --exclude nzbfast-ffi --lib --bins --no-run
      # NZBFAST_LAN_TESTS is deliberately NOT set: it opens an
      # all-interfaces listener, which on Windows raises the Defender
      # Firewall dialog and a hosted runner has nobody to click it. Same
      # rationale as windows-daemon above.
      - name: every first-party unit binary, one process each
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NZBFAST_NO_ENRICH: "1"
        run: cargo test --locked --workspace --exclude rars --exclude tiny_http --exclude nzbfast-ffi --lib --bins --no-fail-fast
      # Gated on the BUILD having succeeded, or a compile error would
      # print an annotation about cross-test pollution, which is a
      # confident answer to a question nobody asked.
      - name: how to read a red run
        if: ${{ failure() && steps.build.outcome == 'success' }}
        run: |
          echo "::error title=A Windows unit binary failed with its tests sharing one process::If windows-unit is green on this same commit then no individual test is broken IN ISOLATION - but this step runs libtest PARALLEL (no --test-threads), so there are TWO shapes and only one has a polluter. (a) POLLUTION: an earlier test left process-global state that this one read. (b) A CONCURRENT RACE on a process-global: two tests on different THREADS raced a counter, which '-- --test-threads=1' structurally CANNOT reproduce - so do not narrow with it and do not add it to make the red go away. Do NOT make the victim order-independent either: find the cause. 'tools/pollution-bisect.py -p <crate> <the failing test>' names the polluter for (a) in minutes and needs a Windows box to do it on, and it is meaningless on a FLAKY victim - it refuses one that fails alone, and otherwise converges on an innocent neighbour with the confidence of a real answer. A third shape, a test that depends on a wall-clock duration it never sets, needs LOAD rather than neighbours and is 'one-process-loaded' above."

  # TODO 82: the long-run soak. One daemon, a mixed queue (store RAR5,
  # compressed RAR5, 7z, PAR2 repair, password) driven round and round
  # against the in-process mock NNTP server for hours, with the daemon's
  # RSS, fd count and thread count sampled at a quiescent point in every
  # cycle and gated against the recorded baseline in
  # crates/nzbfast/tests/leak-soak-baseline.json.
  #
  # Its own job rather than a step in long-suites: those two suites are a
  # 90-minute budget and must stay able to go red fast, and a soak that
  # shares their runner would serialise behind them AND compete for the
  # CPU it is measuring.
  #
  # RELEASE, not debug. The soak measures the binary users run, and a
  # debug build's decode throughput would cut the cycle count (and so the
  # number of samples the drift fit is built from) several-fold. The cache
  # key is soak-specific so it cannot collide with the debug caches the
  # other jobs write under the same runner.os.
  #
  # Cost: ~2.5 h of private-repo Linux minutes a night at 1x. That is the
  # single most expensive thing in this workflow, and it is deliberate -
  # a slow leak is invisible to every other suite here, all of which
  # start a fresh daemon per test. Turn the schedule down to weekly (or
  # lower soak_minutes) if the bill needs it before the leak class does.
  soak:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # par2 is a FIXTURE tool here (runtime repair is native): the soak
      # builds its damaged-post shape with `par2 create`. REQUIRE_PAR2
      # below turns a broken install into a red run rather than a soak
      # that quietly covers one shape fewer.
      - name: test deps (par2 for the repair shape)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq par2
      # Cargo.lock moves on EVERY release (packaging/bump-version.sh
      # rewrites it), and this key used to be `hashFiles('Cargo.lock')` -
      # so the first nightly after a release ran cold on every job.
      # Measured 17 Aug 2026 on run 32014400559: all four cache restores
      # took 0-1s, every one a miss, and `long-suites` spent 4m08s
      # building where the one warm run in the same sample took 1m32s.
      # tools/dep-cache-key.py hashes the lockfile with the workspace
      # members' own version lines normalised out, so our own version
      # bumps stop throwing away ~600 compiled crates. Same tool, same
      # rationale, same `-v2`-style suffix discipline as ci-private.yml.
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # restore + save as SEPARATE steps, not the combined actions/cache:
      # its post step does NOT save when the job FAILED, so one red night
      # left the next night cold as well. That is not hypothetical here -
      # on run 32014400559 `armv7-cross` failed and its
      # `Post Run actions/cache` reads `skipped`. The save below is
      # `if: always()` and sits immediately after the build, so the
      # dependency artifacts are banked whatever the suites then do.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-soak-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # nextest, not libtest, and the reason is diagnostic rather than
      # speed: with `retries = 1` in .config/nextest.toml a flake is
      # reported as a NAMED FLAKY test with both attempts' output, where
      # bare `cargo test` gave an anonymous pass/fail tally. These are
      # the flakiest suites in the repo, so they are the ones that most
      # needed it - and they were the last place in CI still on libtest.
      # Prebuilt, pinned by version, checked by SHA256 rather than
      # trusted: same pattern as the armv7 job below and ci-private.yml.
      - name: install cargo-nextest
        run: |
          set -euo pipefail
          ver="0.9.140"
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 -o cargo-nextest.tar.gz \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${ver}/cargo-nextest-${ver}-x86_64-unknown-linux-gnu.tar.gz"
          echo "4ee9aaa0d0171a985a5d0eb735b87355894c1c455972e9674fb9fdbd1387c9a3  cargo-nextest.tar.gz" | sha256sum -c -
          tar -xzf cargo-nextest.tar.gz
          sudo mv cargo-nextest /usr/local/bin/
          rm cargo-nextest.tar.gz
      - name: build (release)
        run: cargo build --release -p nzbfast --locked
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-soak-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      - name: soak
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
          # Scheduled runs get the full 150; a manual dispatch can ask for
          # a short one to check the harness itself.
          NZBFAST_SOAK_MINUTES: ${{ github.event.inputs.soak_minutes || '150' }}
          NZBFAST_SOAK_REPORT: ${{ github.workspace }}/soak-report.json
        # --nocapture so the per-cycle lines stream into the log: a job
        # that prints nothing for two and a half hours is indistinguishable
        # from a hung one.
        run: cargo nextest run --profile ci --release -p nzbfast --locked --features heavy-tests --test leak_soak --run-ignored only --no-capture
      # The junit half - see the long note in `long-suites` above. The
      # soak is ONE test with a 200-minute ceiling of its own (the
      # `leak_soak` override in .config/nextest.toml says how that number
      # was reached), so what this can catch is narrow but is exactly the
      # case the job cannot otherwise report: a wedge killed at that
      # ceiling and then PASSED on a retry would be reported green, and
      # `retries = 0` on that override is the only other thing standing
      # between that and a silent night.
      # `!cancelled()` alone, NOT `&& steps.build.outcome == 'success'`
      # the way the long-suites checks are written: this job's build step
      # carries no `id`, so that reference would resolve to null, the
      # condition would be false on every run, and this check would never
      # fire. Caught by reading the step ids rather than by copying the
      # sibling - which is how a gate that never runs gets shipped.
      - name: wedge check - soak
        if: ${{ !cancelled() }}
        run: python3 tools/wedge-gate.py --junit target/nextest
      # Uploaded on failure TOO - a red soak's sample series is the whole
      # diagnosis, and it is also what a legitimate new baseline gets
      # re-recorded from.
      - name: upload the sample series
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-report
          path: soak-report.json
          if-no-files-found: warn

  # 32-bit ARM (armv7), BETA - TODO 178. A CROSS-BUILD PROVES ALMOST
  # NOTHING HERE, which is why this job runs the suite instead of just
  # compiling it. `usize` is 32 bits on this target and the engine
  # deliberately handles large declared sizes from untrusted input, so
  # the interesting failures are silent truncations and overflow panics
  # that only appear when the code RUNS. The three found on 15 Aug 2026
  # were all invisible to a clean build: an `i64` where the target's
  # `c_long` is 32-bit, a 2^32 constant that wrapped to a budget of
  # zero, and a >4 GiB extent a `Range<usize>` cannot hold.
  #
  # The ORACLE is `debug-assertions` + `overflow-checks`, not the word
  # "debug" - see the qemu step, which pins both ON and then compiles at
  # opt-level 2 anyway. That distinction is the whole reason this job can
  # finish: qemu-user emulates every instruction, so an unoptimized build
  # pays the emulator for work an optimizer would have deleted, and on
  # 16 Aug that was measured at 8-23x on the tests that dominate the run.
  # Even so this is a nightly, not a per-push job.
  # The eight heavy targets are excluded exactly as ci-private excludes
  # them; `heavy-tests` is not passed, so they are not even built.
  armv7-cross:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    # 150, not 120: the 15 Aug run was killed by its own timeout at
    # 2916/4981 tests with 35 GB free, which GitHub reports as
    # `cancelled` and reads like a human cancelling it. opt-level 2 below
    # is what actually buys the headroom - MEASURED end to end on 16 Aug,
    # the whole job is 61 minutes with a COLD cache, so this is ~2.5x the
    # worst case rather than a guess. The per-test ceiling in the `qemu`
    # nextest profile is what names the culprit if it is ever blown.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pinned toolchain, not `stable`: this target is in
      # rust-toolchain.toml's `targets` list, so rustup installs the
      # std for it here without a separate `target add`.
      - name: toolchain
        run: rustc -vV && rustup target list --installed
      # This job builds the whole workspace for a SECOND target - a
      # release binary plus ~40 debug test binaries, every one of them
      # statically linked - on top of the host artifacts cargo still
      # needs for build scripts and proc macros. On 15 Aug that filled
      # the runner's disk, and it did not look like disk: zig cc died on
      # the nzbfast link with a bare `signal: 6 (SIGABRT) (core dumped)`
      # and an EMPTY stderr, which reads exactly like a linker crash. The
      # rustc still running alongside it said what zig would not, 22
      # seconds later - `No space left on device`, with the runner
      # reporting 6 MB free. So reclaim the preinstalled toolchains this
      # job never touches (~25 GB) and print the free space either side,
      # so a repeat is diagnosable from the log instead of guessed at.
      - name: reclaim disk
        run: |
          set -euo pipefail
          echo "free before: $(df -h --output=avail / | tail -1)"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/powershell || true
          echo "free after:  $(df -h --output=avail / | tail -1)"
      # zig supplies the musl cross-toolchain (Ubuntu packages none for
      # armv7, and rapidyenc is C++ so musl-gcc alone would not do);
      # qemu-user-static plus binfmt is what lets the test binaries -
      # and the daemon processes some of them spawn - actually execute.
      - name: cross + emulation toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          # A venv, not `pip install --user`: Ubuntu 24.04 marks its
          # system Python externally-managed (PEP 668) and refuses. Same
          # recipe and same pins as release.yml's `packages` job - see
          # the comments there.
          python3 -m venv /tmp/zigvenv
          /tmp/zigvenv/bin/pip install --quiet ziglang==0.16.0
          printf '#!/bin/sh\nexec /tmp/zigvenv/bin/python -m ziglang "$@"\n' \
            | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version
          ver=0.23.0
          sha=f0aa9cc8220a84788c6e4a9b6d80422f041659227b680fdef982d5a8ddffddb4
          url="https://github.com/rust-cross/cargo-zigbuild/releases/download/v${ver}/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz"
          curl -fsSL -o cargo-zigbuild.tar.xz "$url"
          echo "$sha  cargo-zigbuild.tar.xz" | sha256sum -c -
          # --strip-components=1: the release archive nests its payload
          # one directory down (cargo-zigbuild-<triple>/cargo-zigbuild),
          # so a bare `tar xf` leaves nothing named cargo-zigbuild in cwd
          # and the mv below fails - after the sha check has printed OK,
          # which is why this read as a pinning problem and was not one.
          tar xf cargo-zigbuild.tar.xz --strip-components=1
          sudo mv cargo-zigbuild /usr/local/bin/
          rm -f cargo-zigbuild.tar.xz
          # Plain shims for the step that is NOT cargo-zigbuild. The
          # release build below goes through cargo-zigbuild because that
          # is the recipe we ship (packaging/build-linux-tarballs.sh) and
          # this job should gate it; nextest shells out to a bare
          # `cargo test --no-run`, which never sees cargo-zigbuild, so it
          # needs the linker and the C/C++ compilers named directly.
          # Same zig, same libc, either way.
          mkdir -p "$HOME/zigshim"
          T=arm-linux-musleabihf
          # The cc crate appends rustc's triple as --target=..., and it
          # lands AFTER the -target these shims pin, so it is the one zig
          # actually reads. zig calls this target arm-linux-musleabihf and
          # does not know the arch spelling `armv7`, so aws-lc-sys died
          # with `unknown architecture: 'armv7'` before it compiled a
          # single object. Drop any --target= and let the pinned one
          # stand. release.yml's two zig jobs never hit this: they set no
          # CC_*, so cargo-zigbuild translates the triple itself.
          # The loop pops each argument off the front and pushes the
          # keepers onto the back, exactly $# times.
          strip='n=$#\nwhile [ "$n" -gt 0 ]; do\n  a=$1; shift; n=$((n-1))\n  case "$a" in --target=*) ;; *) set -- "$@" "$a" ;; esac\ndone\n'
          printf "#!/bin/sh\n${strip}exec zig cc -target %s \"\$@\"\n"  "$T" > "$HOME/zigshim/zig-cc"
          printf "#!/bin/sh\n${strip}exec zig c++ -target %s \"\$@\"\n" "$T" > "$HOME/zigshim/zig-cxx"
          printf '#!/bin/sh\nexec zig ar "$@"\n'                  > "$HOME/zigshim/zig-ar"
          printf '#!/bin/sh\nexec zig ranlib "$@"\n'              > "$HOME/zigshim/zig-ranlib"
          chmod +x "$HOME/zigshim"/zig-*
          echo "--- generated zig-cc shim ---"; cat "$HOME/zigshim/zig-cc"
          # NOT the linker: cargo-zigbuild installs its own linker wrapper,
          # and overriding it with the plain shim made rustc's
          # self-contained musl crt and zig's crt BOTH get linked -
          # `ld.lld: duplicate symbol: _start`. The release build below
          # is a cargo-zigbuild build and wants zigbuild's wrapper; the
          # nextest step, which never sees cargo-zigbuild, names the
          # linker for itself.
          {
            echo "CC_armv7_unknown_linux_musleabihf=$HOME/zigshim/zig-cc"
            echo "CXX_armv7_unknown_linux_musleabihf=$HOME/zigshim/zig-cxx"
            echo "AR_armv7_unknown_linux_musleabihf=$HOME/zigshim/zig-ar"
            echo "RANLIB_armv7_unknown_linux_musleabihf=$HOME/zigshim/zig-ranlib"
          } >> "$GITHUB_ENV"
      # Prebuilt binary pinned by version and checked by SHA256 rather
      # than trusted - the same pattern (and rationale) as ci-private's
      # nextest step and the cargo-deny step below.
      - name: install cargo-nextest
        run: |
          set -euo pipefail
          ver="0.9.140"
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 -o cargo-nextest.tar.gz \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${ver}/cargo-nextest-${ver}-x86_64-unknown-linux-gnu.tar.gz"
          echo "4ee9aaa0d0171a985a5d0eb735b87355894c1c455972e9674fb9fdbd1387c9a3  cargo-nextest.tar.gz" | sha256sum -c -
          tar -xzf cargo-nextest.tar.gz
          sudo mv cargo-nextest /usr/local/bin/
          rm cargo-nextest.tar.gz
      # Cargo.lock moves on EVERY release (packaging/bump-version.sh
      # rewrites it), and this key used to be `hashFiles('Cargo.lock')` -
      # so the first nightly after a release ran cold on every job.
      # Measured 17 Aug 2026 on run 32014400559: all four cache restores
      # took 0-1s, every one a miss, and `long-suites` spent 4m08s
      # building where the one warm run in the same sample took 1m32s.
      # tools/dep-cache-key.py hashes the lockfile with the workspace
      # members' own version lines normalised out, so our own version
      # bumps stop throwing away ~600 compiled crates. Same tool, same
      # rationale, same `-v2`-style suffix discipline as ci-private.yml.
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # restore + save as SEPARATE steps, not the combined actions/cache:
      # its post step does NOT save when the job FAILED, so one red night
      # left the next night cold as well. That is not hypothetical here -
      # on run 32014400559 `armv7-cross` failed and its
      # `Post Run actions/cache` reads `skipped`. The save below is
      # `if: always()` and sits immediately after the build, so the
      # dependency artifacts are banked whatever the suites then do.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-armv7-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # Release binary first: it is the shipped artifact, and a link
      # failure here is a different (and cheaper) verdict than a test
      # failure below.
      - name: build the release binary
        run: cargo zigbuild --release --locked -p nzbfast --target armv7-unknown-linux-musleabihf
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-armv7-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      - name: it is a 32-bit ARM static binary
        run: |
          set -euo pipefail
          out=$(file target/armv7-unknown-linux-musleabihf/release/nzbfast)
          echo "$out"
          # Assert the positive of each claim: an unreadable `file` line
          # must fail here rather than pass by not matching a negative.
          echo "$out" | grep -q "ELF 32-bit"
          echo "$out" | grep -q "ARM"
          echo "$out" | grep -q "statically linked"
          qemu-arm-static target/armv7-unknown-linux-musleabihf/release/nzbfast --version
      # The memory ladder is a shipped feature and every cap under the
      # budget is a `usize`. Print it rather than assume it: this is the
      # one place a truncation between the budget and its caps shows.
      - name: memory ladder on a 32-bit target
        run: |
          set -euo pipefail
          cargo zigbuild --release --locked -p nzbkit --example memprobe \
            --target armv7-unknown-linux-musleabihf
          probe=target/armv7-unknown-linux-musleabihf/release/examples/memprobe
          qemu-arm-static "$probe"
          # An over-large --mem-limit must CLAMP, never wrap. A wrapped
          # budget prints a resolved total unrelated to both the request
          # and the ceiling, so pin the ceiling exactly.
          qemu-arm-static "$probe" 8G | tee ladder.txt
          grep -q "resolved budget: 1.00 GB" ladder.txt
      - name: unit suites under qemu
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_RUNNER: /usr/bin/qemu-arm-static
          # This step shells out to a bare `cargo test --no-run`, so
          # there is no cargo-zigbuild wrapper here and the linker has to
          # be named. link-self-contained=no is the other half: without
          # it rustc adds its own musl crt on top of the one zig already
          # links, and every test binary dies on a duplicate _start.
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: /home/runner/zigshim/zig-cc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_RUSTFLAGS: "-C link-self-contained=no"
          # Debuginfo off for the cross test build - this is the other
          # half of `reclaim disk` above. These test binaries are STATIC,
          # so DWARF is paid once per binary instead of being shared
          # through a libstd everyone links dynamically, and ~40 of them
          # at `debuginfo=2` is what actually filled the disk. Setting it
          # on the profile rather than in RUSTFLAGS is deliberate: it
          # also flips the `DEBUG` variable cargo hands build scripts, so
          # the cc crate drops its own `-g` and aws-lc-sys stops emitting
          # thousands of debug-laden objects. Nothing here asserts on
          # debuginfo; panics keep their symbol names, just not lines.
          # `test` inherits `dev`, so the first line is the one that
          # bites - the second is a belt if that ever stops being true.
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          # OPTIMIZED, with the oracle pinned by flag. `dev` and `test`
          # both default to debug-assertions + overflow-checks ON and
          # opt-level 0; naming all three means the checks this job
          # exists for survive the optimization, and survive a future
          # edit to [profile.dev] in Cargo.toml. Nothing is lost: the
          # three bugs this job found are arch-WIDTH bugs (a 32-bit
          # `c_long`, a 2^32 constant wrapping to zero, a >4 GiB extent
          # in a `Range<usize>`), and every one of them is caught by an
          # overflow check or a panic that opt-level does not remove.
          # Measured 16 Aug on the tests that dominated the killed run:
          # decrypt_shards 6.47s -> 0.28s (23x), instream_decrypt 14.84s
          # -> 1.08s (13.7x), chase_multi_volume 16.52s -> 2.04s (8.1x).
          # End to end that is 96 minutes for 58% of the sweep before,
          # against 21 minutes for ALL of it after (run 31928396709).
          # DEV is the load-bearing half - dependencies of a test target
          # (aws-lc-sys, rapidyenc, rars, and nzbkit itself when an
          # integration test links it) build under `dev`, and that is
          # where the emulated instructions actually are. It also sets
          # the OPT_LEVEL cargo hands build scripts, so the cc crate
          # compiles the C and C++ at -O2 too. TEST covers the unit-test
          # targets' own code. Build cost is the trade: ~4x the compile
          # CPU, against a run that could not finish in two hours.
          CARGO_PROFILE_DEV_OPT_LEVEL: "2"
          CARGO_PROFILE_TEST_OPT_LEVEL: "2"
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
          CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
          # Incremental state is dead weight for a one-shot CI build, and
          # it is written into the same target dir that ran out of room.
          CARGO_INCREMENTAL: "0"
          NZBFAST_NO_ENRICH: "1"
        run: |
          set -euo pipefail
          # On the EXIT trap, not after the run: this step's shell is
          # `bash -e`, so a red suite would skip a trailing plain `df` -
          # and a red suite is the one case where the number is wanted.
          trap 'echo "free after build+run: $(df -h --output=avail / | tail -1)"' EXIT
          echo "free before build: $(df -h --output=avail / | tail -1)"
          # The one test excluded by NAME rather than by binary, and the
          # only red in the first sweep that ever ran to completion
          # (5050 tests, 5049 passed). `compute_report_is_sane` asserts
          # `decode_simd.all_core > md5.all_core` - a claim about
          # HARDWARE, that SIMD yEnc decode beats MD5 by ~5x. Under
          # qemu-user it inverts, because the emulator charges per
          # instruction and SIMD is the expensive path to emulate, so
          # the wide decode loses to scalar MD5. It is a property of the
          # rig, not of armv7: TODO 178 records it failing on x86_64 on
          # the qemu box as well. Excluded HERE rather than loosened in
          # the test, which is worth having on real silicon - a bound
          # widened to survive an emulator would assert nothing anywhere.
          #
          # `--workspace` here is the LAST one left in either workflow
          # file, and it is deliberate. ci-private's two archive steps
          # and CLAUDE.md's sweep all dropped it on 23 Aug 2026 because
          # it overrides `default-members`, turns nzbfast's `ffi`
          # feature on and compiles the whole module tree a second time
          # as the lib target (measurements at ci-private's archive
          # step). Here that is worth paying for: this is the only place
          # in CI that builds crates/nzbfast-ffi for a 32-bit or a
          # non-x86 architecture, which is the shape the iOS staticlib
          # actually ships in, and a nightly can afford the emulator.
          # If this job ever needs its wall clock back, `not
          # binary_id(nzbfast)` drops the duplicated lib-root suite
          # while keeping the ffi build and its two tests - do that
          # before dropping the flag.
          cargo nextest run --profile qemu --workspace --no-fail-fast \
            --target armv7-unknown-linux-musleabihf \
            -E 'not binary(conn_tuner) and not binary(index_size_cap) and
                not binary(http_wedge) and not binary(queue_soak) and
                not binary(daemon) and not binary(e2e) and not binary(leak_soak) and
                not binary(par2gen_large_set) and
                not test(=sysbench::tests::compute_report_is_sane)'

  # Full cargo-deny pass (advisories, licenses, bans, sources) against
  # deny.toml at the repo root. ci-private runs the same check on every
  # push; the nightly run is what catches a NEW advisory published
  # against an unchanged tree.
  deny:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Prebuilt binary, pinned by tag and checked by SHA256 rather than
      # trusted, since it is fetched from a third party and put on PATH
      # (same pattern as the par2 fetch in pr-check.yml). A cargo
      # install would cost several minutes of compile per run.
      - name: install cargo-deny
        run: |
          ver="0.20.2"
          curl -sSfL -o cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${ver}/cargo-deny-${ver}-x86_64-unknown-linux-musl.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz
          sudo mv "cargo-deny-${ver}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/
          rm -rf cargo-deny.tar.gz "cargo-deny-${ver}-x86_64-unknown-linux-musl"
      - name: cargo deny
        run: cargo deny check

  # THE EXTRACTION ROBUSTNESS CORPUS - `tools/robustness/`, scheduled for
  # the first time on 3 Sep 2026 (research/RAR-PERF-AUDIT-2026-09-02.md
  # round 43).
  #
  # WHY IT IS HERE. The 2-3 September optimisation campaign rewrote the
  # RAR5 decoder's inner loops and merged 32 vendored commits - Huffman
  # metadata packed into previously unused LUT bits, unrolled 16-byte
  # copy strides, a removed "impossible" zero-length branch, an inlined
  # bit-cache path, a per-worker file-handle cache, a 192 KiB read-ahead
  # window, a direct source view for small stored members. Every one was
  # gated on SPEED and on digest-comparing about ten shapes. The defect
  # class that work creates is SILENT WRONG BYTES, and `fuzz-smoke.yml`
  # cannot see that class at all: it hunts panics and out-of-bounds, not
  # incorrect output. This job is the arm that reads the OUTPUT.
  #
  # It builds a 44-fixture corpus covering every RAR version, solid,
  # split, encrypted, recovery records, PAR2 repair at four damage
  # levels, obfuscated names, nested archives five deep, `.rev` rebuild,
  # SFX, 7z, zip, and foreign shapes that must be REFUSED cleanly - then
  # scores byte-identical reproduction against each fixture's own
  # `expected/`. The corpus is deliberately NOT committed: it is
  # regenerated here every night, so a fixture cannot rot into agreeing
  # with a bug.
  #
  # NOT ON THE PER-PUSH PATH, deliberately: it needs `rar` and `par2` on
  # the runner and the generate+score pass is minutes, not seconds.
  #
  # THE JOB FAILS ON ANY FAIL. `run.sh` exits non-zero iff FAIL > 0;
  # XFAIL is a PASS by design (a shape we decline on purpose, scored on
  # declining it without crashing) and SKIP is not - `unrar` is
  # installed below precisely so the three legacy RAR1.3/RAR3 fixtures
  # are SCORED rather than skipped, because "0 scored" is the shape of
  # every rubber-stamp incident in this repo's history.
  #
  # WHEN IT REDS: read the report artifact, not this log. Then check
  # whether the SAME corpus is red against a PRE-change binary before
  # blaming the newest commit - that discriminator is what proved on
  # 3 Sep that all four of the FAILs found that day predated the whole
  # campaign. Never fix a hit by editing the fixture's `expect` until a
  # real archive of that shape has been checked by hand.
  robustness-corpus:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    # Measured on the dev Mac 3 Sep 2026: generate ~40 s, score ~60 s,
    # release build dominates. Budget for a cold cache and a bad night.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # `rar` is the ARCHIVER the corpus is built with and `unrar` is the
      # reference the three legacy RAR1.3/RAR3 fixtures are scored
      # against; both are multiverse. `7zip` gives `/usr/bin/7z` and no
      # `7zz` on noble, which the generator resolves either way.
      # No `|| true` anywhere here: a missing tool must red the job
      # loudly, because the alternative is a corpus that silently scores
      # a smaller set than its name claims.
      - name: corpus deps (rar, unrar, par2, 7z)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rar unrar par2 7zip
          rar -? 2>&1 | head -1; unrar 2>&1 | head -1; par2 -h 2>&1 | head -1; 7z | head -2
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # Restore only, no save - same reason as `one-process-light` above:
      # other jobs own this key, and a second writer with a different
      # artifact set behind it decides what everyone restores tomorrow.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      - name: build
        run: cargo build --release --locked -p nzbfast
      - name: generate the corpus
        run: tools/robustness/gen_fixtures.sh "$RUNNER_TEMP/robustness-corpus"
      # PROVE THE SCORER CAN FAIL, before believing that it passed. This
      # scores the corpus with a null extractor and demands the
      # reference-compared fixtures FAIL; on 4 Sep 2026 they PASSED under
      # exactly that control, because the reference tree was written
      # inside the directory being hashed and every expected hash was
      # found by construction. A rubber stamp is invisible from a green
      # run. It refuses rather than guesses when `unrar` is missing.
      - name: selftest the scorer
        run: tools/robustness/run.sh "$RUNNER_TEMP/robustness-corpus" --selftest
      - name: score it
        run: |
          tools/robustness/run.sh "$RUNNER_TEMP/robustness-corpus" \
            --md robustness-report.md
      # `always()`, so a RED run publishes the table that says which
      # fixture and how - which is the whole point of keeping a report.
      - name: upload the scorecard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: robustness-report
          path: robustness-report.md
          if-no-files-found: warn
