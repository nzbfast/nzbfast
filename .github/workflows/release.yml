name: release

# Manual or tag-triggered. Builds cross-platform binaries and the beta
# packages, and attaches them to a GitHub release.
#
# It deliberately does NOT build the container image. That used to be an
# `image` job here, and it was both broken and wrong:
#   - Broken: it tagged `ghcr.io/${{ github.repository }}`. A registry
#     requires a lowercase repository name, and the upstream repo this
#     workflow is developed in has an uppercase letter in its owner, so
#     buildx refused the tag outright on EVERY release from v1.0.22 to
#     v1.1.3. Because `release` needed it, `release` was skipped every
#     one of those times and no CI job had ever attached an asset.
#   - Wrong: it built the repo-root Dockerfile, which COMPILES from
#     source. The shipped image is packaging/docker/Dockerfile.release,
#     which COPYs the released static musl binaries, pushed and attested
#     by provenance-release.yml's opt-in `image` job on the public repo.
#     Had the casing been the only problem, fixing it would have pushed
#     an unattested source build over `:latest`.
# So the image is provenance-release.yml's job, the symbol-bearing
# diagnostic image is debug-image.yml's, and this workflow only ships
# binaries. Do not add an `image` job back here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; the one job that publishes (`release`) escalates
# for itself. A workflow-wide `contents: write, packages: write` handed
# the same push-anything token to the four binary build runners, which
# only ever check out and compile. No job here needs `packages: write`
# any more - the only one that did was the deleted `image` job.
permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        # rust-toolchain.toml pins the exact rustc; just add the target to
        # the pinned toolchain (no `rustup update stable`, which would build
        # the shipped bits with an unpinned compiler - inconsistent with the
        # attested provenance-release.yml build).
        run: rustup target add ${{ matrix.target }}
      - name: Cross toolchain (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
      - name: Build
        # --locked: build the committed dependency graph, or fail.
        run: cargo build --release --locked -p nzbfast --target ${{ matrix.target }}
      # A plain `tar czf` records the BUILDING ACCOUNT's uid/gid and user
      # and group names in every member header - `runner`/`runner` on these
      # runners - and this project is anonymous in public. bsdtar on the two
      # mac legs additionally stores an AppleDouble `._name` member beside
      # every file carrying an xattr, and macOS 15+ stamps
      # com.apple.provenance on anything it has built, which yields a SECOND
      # top-level entry and breaks every unpacker that collapses a lone
      # wrapper directory (v1.1.2 shipped both Linux tarballs that way).
      #
      # provenance-release.yml, which builds the `nzbfast-<triple>.tar.gz`
      # assets that actually reach the release page, has passed these flags
      # since it was written. This job, its sibling, never did. GNU tar
      # rejects the bsd spellings outright ("unrecognized option '--uid'"),
      # so the flavour has to be asked rather than assumed.
      - name: Package
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/nzbfast
          ART=nzbfast-${{ matrix.target }}.tar.gz
          if tar --version | grep -q GNU; then
            tar --owner=0 --group=0 --numeric-owner \
                -czf "$ART" -C "$(dirname "$BIN")" nzbfast
          else
            COPYFILE_DISABLE=1 tar --uid 0 --gid 0 --uname "" --gname "" \
                -czf "$ART" -C "$(dirname "$BIN")" nzbfast
          fi
      # On the bytes, not on the yaml above. Do NOT swap this for
      # `tar tzvf`: on the mac legs bsdtar CONSUMES AppleDouble members on
      # read, so a broken tarball lists clean - which is exactly how v1.1.2
      # shipped five junk members in each Linux tarball. This reads the
      # headers as stored.
      - name: No builder identity in the archive
        run: python3 packaging/check-archive-identity.py nzbfast-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nzbfast-${{ matrix.target }}
          path: nzbfast-${{ matrix.target }}.tar.gz

  # 32-bit ARM (armv7), BETA - TODO 178. Raspberry Pi 2/3/Zero 2 W on
  # 32-bit Raspberry Pi OS, a common home-server shape that got nothing
  # from this workflow before.
  #
  # NOT a row in the `binaries` matrix above, and that is the whole point:
  # `release` requires `needs.binaries.result == 'success'`, so a beta leg
  # inside that matrix could withhold an otherwise-good release - exactly
  # the trap the Windows ARM64 job below documents. A separate
  # continue-on-error job is what makes "beta" mean "ships if it builds"
  # rather than "everyone waits on it".
  #
  # MUSL, not gnu. The images this targets carry a glibc older than any
  # runner's, so the -gnu build the matrix produces would not start on a
  # single one of them. Same zig recipe as the `packages` job below,
  # pinned the same way.
  #
  # The asset is `nzbfast-armv7-unknown-linux-musleabihf-beta.tar.gz`:
  # the triple, so it sits with its siblings, plus `-beta`, because the
  # assets box is what a downloader actually reads. The human download
  # (`nzbfast-X.Y.Z-linux-armv7-beta.tar.gz`, with LICENSE and MANUAL
  # beside the binary) is built on the release Mac by
  # packaging/build-linux-tarballs.sh.
  linux-armv7-beta:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust target
        run: rustup target add armv7-unknown-linux-musleabihf
      - name: Install zig + cargo-zigbuild
        # Byte-for-byte the `packages` job's recipe, pins included - see
        # the comments there for why a venv and why both pins.
        run: |
          python3 -m venv /tmp/zigvenv
          /tmp/zigvenv/bin/pip install --quiet ziglang==0.16.0
          printf '#!/bin/sh\nexec /tmp/zigvenv/bin/python -m ziglang "$@"\n' \
            | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version
          ver=0.23.0
          sha=f0aa9cc8220a84788c6e4a9b6d80422f041659227b680fdef982d5a8ddffddb4
          url="https://github.com/rust-cross/cargo-zigbuild/releases/download/v${ver}/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz"
          curl -fsSL -o cargo-zigbuild.tar.xz "$url"
          echo "$sha  cargo-zigbuild.tar.xz" | sha256sum -c -
          # --strip-components=1: the release archive nests its payload
          # one directory down (cargo-zigbuild-<triple>/cargo-zigbuild),
          # so a bare `tar xf` leaves nothing named cargo-zigbuild in cwd
          # and the mv below fails - after the sha check has printed OK,
          # which is why this read as a pinning problem and was not one.
          tar xf cargo-zigbuild.tar.xz --strip-components=1
          sudo mv cargo-zigbuild /usr/local/bin/
          rm -f cargo-zigbuild.tar.xz
      - name: Build
        run: cargo zigbuild --release --locked -p nzbfast --target armv7-unknown-linux-musleabihf
      - name: It really is a 32-bit ARM static binary
        # Assert the positive of each claim. A `file` line that cannot be
        # read must fail here rather than pass by not matching a negative -
        # the same rule upload-release-assets.sh's linkage gate follows.
        # Cheap, and it is the only check between a silently mis-targeted
        # build and a release asset nobody can run.
        run: |
          set -euo pipefail
          out=$(file target/armv7-unknown-linux-musleabihf/release/nzbfast)
          echo "$out"
          echo "$out" | grep -q "ELF 32-bit"
          echo "$out" | grep -q "ARM"
          echo "$out" | grep -q "statically linked"
      # --owner/--group/--numeric-owner: without them every member header
      # names the account that ran the build (`runner`/`runner` here), and
      # this project is anonymous in public. GNU tar on this runner; see the
      # `binaries` job above for the flavour branch and the full reasoning.
      - name: Package
        run: |
          set -euo pipefail
          NAME=nzbfast-armv7-unknown-linux-musleabihf-beta
          tar --owner=0 --group=0 --numeric-owner -czf "$NAME.tar.gz" \
            -C target/armv7-unknown-linux-musleabihf/release nzbfast
      - name: No builder identity in the archive
        run: python3 packaging/check-archive-identity.py nzbfast-armv7-unknown-linux-musleabihf-beta.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nzbfast-armv7-unknown-linux-musleabihf-beta
          path: nzbfast-armv7-unknown-linux-musleabihf-beta.tar.gz

  packages:
    # BETA .deb / .rpm for amd64 + arm64. Linux was the one platform with
    # no package at all - every user hand-wrote a systemd unit - while
    # SABnzbd and NZBGet both ship distro packages.
    #
    # These are built from STATIC MUSL binaries, not from the glibc ones
    # the `binaries` job above produces, and that is not a preference: a
    # binary linked against a current runner's glibc does not start on
    # Debian 12 (measured 28 Jul: `GLIBC_2.39 not found`), which is most
    # of a .deb's audience. packaging/upload-release-assets.sh enforces
    # the same rule for the human tarballs; make-packages.sh enforces it
    # for these.
    #
    # The packages are NOT referenced by the signed update manifest
    # (packaging/make-latest-json.sh) while they are beta.
    runs-on: ubuntu-latest
    # BETA, like the Windows ARM64 job below: the `release` job waits for
    # this one but ignores its result, so a packaging failure cannot
    # withhold a release whose tarballs, DMG and installer are all fine.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust targets
        # rust-toolchain.toml pins rustc; only the targets are added, for
        # the same reason the `binaries` job does not update the toolchain.
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - name: Install zig + cargo-zigbuild
        # One cross-compiler for both musl targets, including the C in
        # vendor/rapidyenc and the aws-lc-rs build. Both are pinned: the
        # zig toolchain by PyPI version, cargo-zigbuild by release sha256
        # (a version tag alone is mutable, and this binary compiles what
        # gets published).
        run: |
          # A venv, not `pip install --user`: Ubuntu 24.04 marks its
          # system Python externally-managed (PEP 668) and refuses. The
          # shim gives cargo-zigbuild a plain `zig` on PATH, which is
          # what it looks for first.
          python3 -m venv /tmp/zigvenv
          /tmp/zigvenv/bin/pip install --quiet ziglang==0.16.0
          printf '#!/bin/sh\nexec /tmp/zigvenv/bin/python -m ziglang "$@"\n' \
            | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version
          ver=0.23.0
          sha=f0aa9cc8220a84788c6e4a9b6d80422f041659227b680fdef982d5a8ddffddb4
          url="https://github.com/rust-cross/cargo-zigbuild/releases/download/v${ver}/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz"
          curl -fsSL -o cargo-zigbuild.tar.xz "$url"
          echo "$sha  cargo-zigbuild.tar.xz" | sha256sum -c -
          # --strip-components=1: the release archive nests its payload
          # one directory down (cargo-zigbuild-<triple>/cargo-zigbuild),
          # so a bare `tar xf` leaves nothing named cargo-zigbuild in cwd
          # and the mv below fails - after the sha check has printed OK,
          # which is why this read as a pinning problem and was not one.
          tar xf cargo-zigbuild.tar.xz --strip-components=1
          sudo mv cargo-zigbuild /usr/local/bin/
          rm -f cargo-zigbuild.tar.xz
      - name: Build static musl binaries
        run: |
          cargo zigbuild --release --locked -p nzbfast \
            --target x86_64-unknown-linux-musl \
            --target aarch64-unknown-linux-musl
      - name: Packaging tools
        # dpkg-deb is already on the runner; rpmbuild and file are not.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm file
      - name: Build the packages
        run: packaging/linux/make-packages.sh --out "$PWD/dist"
      - name: Show what was built
        run: |
          ls -l dist
          for f in dist/*.deb; do dpkg-deb -I "$f" | sed -n '2,12p'; done
          for f in dist/*.rpm; do rpm -qip "$f" | head -12; done
      # Both formats reach root:root today - dpkg-deb via --root-owner-group
      # and rpm via its own default - but neither is asserted anywhere, and
      # rpm in particular takes its FILEUSERNAME straight from the files in
      # the buildroot, so a change in how the stage is assembled would put
      # the CI account's name in the header of every path with nothing to
      # notice. Measured clean on the shipped 1.1.3 packages; this is what
      # keeps it that way.
      - name: No builder identity in the packages
        run: python3 packaging/check-archive-identity.py dist/*.deb dist/*.rpm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nzbfast-linux-packages
          path: dist/*
  # Windows on ARM (Snapdragon X and friends), BETA.
  #
  # Its own job rather than a row in the `binaries` matrix above, because
  # nothing about it fits that matrix: it needs a Windows runner, it builds
  # the tray as well as the engine, and it ships a zip and an installer
  # instead of a tar.gz.
  #
  # WHY A WINDOWS RUNNER AND NOT A CROSS-BUILD. Every Windows binary we
  # ship today is cross-compiled from a Mac with mingw, and that road ends
  # here: mingw emits x86_64 PE objects only, and aarch64-pc-windows-msvc
  # links with MSVC's link.exe, which does not run on macOS. A
  # `windows-latest` runner already carries the ARM64 MSVC toolchain (the
  # VS "MSVC v143 - ARM64/ARM64EC build tools" component is in the image),
  # so the x64 runner cross-compiles to ARM64 with nothing to install but
  # the rust target. That is also why this is CI-only: there is no ARM64
  # Windows machine in the loop, here or on any desk we own.
  #
  # BETA, and the whole job is arranged around that word. The `release`
  # job below explicitly ignores this one's result, so a red ARM64 build
  # can never hold up a release; the assets carry `-beta` in their names;
  # the installer says so on its first screen; and the payload is
  # deliberately absent from latest.json - see the note in
  # packaging/make-latest-json.sh. Nobody has run this binary on the
  # hardware it targets.
  windows-arm64-beta:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust target
        # Same reasoning as the `binaries` job: rust-toolchain.toml pins
        # the exact rustc, so only the target is added. Never `rustup
        # update stable` - that would build shipped bits with an unpinned
        # compiler.
        run: rustup target add aarch64-pc-windows-msvc
      - name: Read version from Cargo.toml
        id: ver
        shell: bash
        run: echo "v=$(grep '^version' crates/nzbfast/Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      # Both packages in ONE invocation. Building -p nzbtray alone yields a
      # crate graph without the engine's feature unification and a
      # correspondingly smaller, wrong tray - the release-bundle skill
      # records the x64 numbers (~940 KB alone against ~2.39 MB together).
      #
      # No CARGO_TARGET_*_RUSTFLAGS here, for the reason .cargo/config.toml
      # spells out: that env var REPLACES the config rustflags rather than
      # adding to them, and the --remap-path-prefix that keeps build-host
      # paths out of shipped binaries lives there.
      - name: Build nzbfast.exe + nzbtray.exe (aarch64)
        run: cargo build --release --locked -p nzbfast -p nzbtray --target aarch64-pc-windows-msvc
      # Same staging make-installer.sh does, and the manual is GENERATED
      # rather than copied: docs/MANUAL.html carries a __NZBFAST_UI_TOKENS__
      # placeholder the daemon substitutes at serve time, so the raw file
      # renders the marker as body text and styles itself against CSS
      # variables nothing declared.
      - name: Stage payload
        shell: bash
        run: |
          STAGE=packaging/windows/stage
          rm -rf "$STAGE" && mkdir -p "$STAGE" packaging/windows/out
          BIN=target/aarch64-pc-windows-msvc/release
          cp "$BIN/nzbfast.exe" "$BIN/nzbtray.exe" "$STAGE/"
          packaging/make-offline-manual.sh docs/MANUAL.html "$STAGE/MANUAL.html"
          cp LICENSE COPYRIGHT.md "$STAGE/"
      # Inner directory is nzbfast-windows-arm64/, NOT the nzbfast-windows/
      # the x64 zip uses. Deliberate: a tester comparing the two extracts
      # both, and one inner name would have the beta silently overwrite the
      # build it is being compared against. Contents otherwise match the
      # x64 zip, nzbtray.exe included (publish-release SKILL §2).
      - name: Portable zip
        shell: bash
        env:
          APPVER: ${{ steps.ver.outputs.v }}
        run: |
          DIR="nzbfast-windows-arm64"
          rm -rf "$DIR" && mkdir "$DIR"
          cp packaging/windows/stage/nzbfast.exe \
             packaging/windows/stage/nzbtray.exe \
             packaging/windows/stage/MANUAL.html \
             packaging/windows/stage/LICENSE \
             packaging/windows/stage/COPYRIGHT.md \
             "packaging/windows/Start nzbfast.bat" \
             packaging/windows/README.txt \
             "$DIR/"
          # pwsh (PowerShell 7, .NET Core), NOT `powershell` (5.1, .NET
          # Framework). Same cmdlet, different zip: 5.1 writes entry names
          # with BACKSLASH separators, which APPNOTE 4.4.17.1 forbids -
          # Explorer and 7-Zip forgive it, python zipfile and unix unzip
          # do not, and they hand you one file literally named
          # "nzbfast-windows-arm64\nzbfast.exe" instead of a directory.
          # The x64 zip is built on the Mac with `zip -X`, so it has
          # always been conformant; this is the only asset that was not.
          # It matters most for exactly the tester the inner-directory
          # comment above describes: someone unpacking both to compare.
          pwsh -NoProfile -Command \
            "Compress-Archive -Path '$DIR' -DestinationPath 'nzbfast-$APPVER-windows-arm64-beta.zip'"
      # Inno Setup isn't preinstalled on windows-latest; choco is. Same
      # invocation make-installer.sh and sign-windows.yml use, plus
      # /DArm64, which is what switches ArchitecturesAllowed to arm64 and
      # the output filename to -windows-arm64-beta-setup.exe.
      #
      # Inno itself is an x86 program building an ARM64 package, which is
      # fine and normal: it never inspects the payload, it stores it.
      - name: Compile Inno Setup installer (arm64)
        shell: cmd
        # Via %APPVER% rather than direct ${{ }} interpolation, so a
        # malformed Cargo.toml version cannot inject into the cmd shell.
        env:
          APPVER: ${{ steps.ver.outputs.v }}
        run: |
          choco install innosetup -y --no-progress
          cd packaging\windows
          ISCC /DAppVersion=%APPVER% /DStageDir=stage /DArm64 /Oout installer.iss
      # Both assets must sit at the SAME directory level before upload.
      # upload-artifact roots an artifact at the least common ancestor of
      # everything it matched, so uploading the zip from the workspace root
      # and the exe from packaging/windows/out/ would preserve that second
      # path inside the artifact - and the `release` job below, which
      # downloads every artifact flat into dist/ and globs dist/*-setup.exe,
      # would silently match nothing and publish the zip alone.
      - name: Collect assets
        shell: bash
        run: mv packaging/windows/out/nzbfast-*-windows-arm64-beta-setup.exe .
      # Zip has no uid/gid/uname/gname fields, so there is no owner to leak
      # here and nothing on a Windows runner makes AppleDouble members. The
      # check runs anyway: "the format cannot carry it" is an inference, and
      # the point of this gate is that every archive asset is measured. The
      # runner image ships python under both names depending on the release,
      # so take whichever is there rather than guessing.
      - name: No builder identity in the archive
        shell: bash
        run: |
          set -euo pipefail
          PY=$(command -v python3 || command -v python)
          "$PY" packaging/check-archive-identity.py nzbfast-*-windows-arm64-beta.zip
      # if-no-files-found: error, because both names are computed from a
      # version string and an .iss #define, and a silently empty artifact
      # is exactly how a rename goes unnoticed until someone downloads the
      # release.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nzbfast-windows-arm64-beta
          path: |
            nzbfast-*-windows-arm64-beta.zip
            nzbfast-*-windows-arm64-beta-setup.exe
          if-no-files-found: error

  freebsd-beta:
    # FreeBSD x86_64, BETA. Same tier as the Windows ARM64 and Linux
    # package jobs: attached to the release, absent from the signed
    # update manifest, and its failure cannot withhold a release.
    #
    # WHY A VM AND NOT A CROSS-BUILD. x86_64-unknown-freebsd is a Rust
    # tier-2 target with no GitHub-hosted runner, so the two roads are a
    # cross-compile against a FreeBSD sysroot, or a real FreeBSD. A
    # cross-build works - packaging/freebsd/README.md documents the exact
    # recipe, and it is what the platform audit for this port was done
    # with - but what it proves is that the code COMPILES and LINKS for
    # FreeBSD. It says nothing about whether the binary runs: every
    # difference that actually bites (a syscall the kernel does not have,
    # a struct field with a different width at runtime, an rlimit the
    # kernel refuses, a libc.so.7 the linker resolved from a sysroot that
    # is not the sysroot on the box) survives a clean cross-build
    # untouched. Publishing a tarball on that evidence is publishing a
    # tarball nobody has run.
    #
    # So the shipped bytes are built by a FreeBSD-hosted rustc and
    # clang inside a real FreeBSD kernel, and then that same binary
    # downloads a synthetic release over loopback NNTP before anything
    # is packaged - packaging/freebsd/smoke.sh, which drives the whole
    # one-pass path (pipelined NNTP, in-place yEnc decode, incremental
    # PAR2 verify, preallocation, positioned writes) with no network and
    # no provider, and asserts on the bytes that come out. A red smoke
    # means no tarball, which is the point.
    #
    # It is still a BETA, and the word is doing real work: a qemu guest
    # is not a NAS. Nobody has run this on FreeBSD on real hardware, on
    # ZFS, in a jail, or on the NAS distributions this exists for. The
    # asset name says beta and packaging/freebsd/README.md asks for a
    # tester.
    #
    # aarch64-unknown-freebsd is NOT built here. It is a tier-3 target:
    # `rustup target add aarch64-unknown-freebsd` fails on the pinned
    # stable toolchain because upstream ships no rust-std for it
    # (rust-std-1.97.0-aarch64-unknown-freebsd.tar.xz is a 404), so it
    # needs a nightly `-Z build-std` and the pin in rust-toolchain.toml
    # is stable by policy. Nothing to do here until that changes.
    runs-on: ubuntu-latest
    continue-on-error: true
    # The build runs under emulation, so it is slow by construction: the
    # ceiling is deliberately generous rather than tuned, because this
    # job failing cannot delay a release and a timeout that fires on a
    # slow runner would just be noise.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, smoke-test and package inside a FreeBSD VM
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          # The oldest FreeBSD still publishing releases. FreeBSD binaries
          # run FORWARD (a 14.3 build runs on 14.4 and on 15.x) and not
          # back, so building on the oldest supported release is what
          # makes the tarball usable on the widest range of boxes. 13.x
          # is EOL and off the mirrors, which is also why TrueNAS CORE
          # (FreeBSD 13.3) is out of reach - see packaging/freebsd/README.md.
          release: '14.3'
          # FreeBSD's /bin/sh, not bash: nothing in the base system has
          # bash, and both scripts this job runs are POSIX sh on purpose.
          usesh: true
          mem: 8192
          prepare: |
            # rustup, not `pkg install rust`: rust-toolchain.toml pins the
            # exact rustc for every shipped binary, and a pkg-installed
            # cargo ignores that file silently (the pin is a rustup
            # mechanism). `--default-toolchain none` hands the choice to
            # the toolchain file, so this VM builds with the same compiler
            # as the Linux, macOS and Windows legs.
            #
            # fetch(1) and clang are both in the FreeBSD base system, so
            # this installs nothing from ports - which also means no pkg
            # mirror to go stale underneath the job.
            set -eu
            fetch -o /tmp/rustup-init \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-freebsd/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --profile minimal --default-toolchain none \
              --no-modify-path
          run: |
            set -eu
            . "$HOME/.cargo/env"
            # OUTSIDE the synced workspace: the action rsyncs the work
            # directory back to the runner when the step ends, and a
            # multi-GB target/ would be copied byte for byte to produce a
            # 15 MB tarball.
            CARGO_TARGET_DIR=/root/nzbfast-target
            export CARGO_TARGET_DIR
            # No --target: on a FreeBSD host x86_64-unknown-freebsd IS the
            # host triple, and naming it would only add a redundant std.
            # --locked: build the committed dependency graph, or fail.
            cargo build --release --locked -p nzbfast
            BIN=$CARGO_TARGET_DIR/release/nzbfast
            # THE GATE. An offline end-to-end download on the target OS,
            # before anything is packaged. See the header above.
            packaging/freebsd/smoke.sh "$BIN" /root/smoke
            # The tarball carries the rc.d script and the beta/tester
            # notice as well as the binary: there is no FreeBSD package
            # yet, so this tarball is the only vehicle either of them has.
            # Named like the other human downloads on the release page
            # (nzbfast-X.Y.Z-<platform>[-beta].<ext>), not like the
            # `nzbfast-<triple>.tar.gz` provenance assets the `binaries`
            # job produces: the release notes point FreeBSD users at this
            # file, so it belongs in the family the notes table names.
            VERSION=$(grep '^version' crates/nzbfast/Cargo.toml | head -1 | cut -d'"' -f2)
            mkdir -p dist/nzbfast-freebsd/rc.d
            cp "$BIN" dist/nzbfast-freebsd/nzbfast
            cp packaging/freebsd/rc.d/nzbfast dist/nzbfast-freebsd/rc.d/nzbfast
            cp packaging/freebsd/README.md dist/nzbfast-freebsd/README.md
            cp packaging/config.example.json dist/nzbfast-freebsd/
            chmod 755 dist/nzbfast-freebsd/nzbfast dist/nzbfast-freebsd/rc.d/nzbfast
            # Owner metadata. A plain `tar czf` writes the building
            # account's uid/gid and user/group names into every member
            # header, and this project is anonymous in public. Building as
            # root in a VM does not make that harmless: the 1.1.3 tarball
            # came out of here with `uid=0 gid=1001 uname='root' gname=''`
            # on every entry and upload-release-assets.sh refused the whole
            # batch. FreeBSD's base tar is bsdtar, but ask rather than
            # assume - a wrong flag is a hard error mid-release and a
            # missing one is a silent leak. The two spellings cannot share
            # one variable in POSIX sh either: --uname "" --gname "" are
            # EMPTY STRING arguments, which no word splitting can carry.
            if tar --version 2>&1 | head -1 | grep -qi bsdtar; then
              tar --uid 0 --gid 0 --uname "" --gname "" \
                -czf "dist/nzbfast-$VERSION-freebsd-x64-beta.tar.gz" \
                -C dist nzbfast-freebsd
            else
              tar --owner=0 --group=0 --numeric-owner \
                -czf "dist/nzbfast-$VERSION-freebsd-x64-beta.tar.gz" \
                -C dist nzbfast-freebsd
            fi
            rm -rf dist/nzbfast-freebsd
            ls -l dist/
      # OUTSIDE the VM, on the runner: FreeBSD's base system has no
      # python3 and this job installs nothing from ports on purpose. The
      # action rsyncs the work directory back when the step ends, so dist/
      # is here - and these are the same bytes upload-artifact takes.
      - name: No builder identity in the archive
        run: python3 packaging/check-archive-identity.py dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nzbfast-freebsd-beta
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [binaries, windows-arm64-beta, packages, linux-armv7-beta, freebsd-beta]
    # `needs` waits for the four BETA jobs (Windows ARM64, Linux
    # packages, 32-bit ARM, FreeBSD) so their artifacts are
    # downloadable here, and this `if` then ignores whether they PASSED.
    #
    # The QNAP .qpkg is NOT among them and its absence is deliberate:
    # its payload is the release's own published linux tarballs, checked
    # against the release's SHA256SUMS.txt, so it cannot be built until
    # this job has put those files on the page. It is built afterwards by
    # the `qnap-qpkg` workflow and uploaded by hand, exactly like the
    # Synology .spk - see step 4c of the publish-release skill. Until
    # 16 Aug 2026 it was built here instead, from a separate cross-build
    # of the same source, which shipped a package whose binaries matched
    # no checksum on the release page (measured on 1.1.3).
    # A job-level
    # continue-on-error stops a failure sinking the workflow run, but
    # `needs` still reads the result and would skip this job, which would
    # mean an unproven beta build could withhold the whole release - the
    # opposite of what shipping it as a beta is for. So the one job that
    # must be green (binaries) is named explicitly, and !cancelled()
    # keeps a genuine cancellation from publishing a partial set.
    #
    # Nothing about publishing a container image belongs in this
    # condition. Coupling them is what cost v1.0.22-v1.1.3 their assets:
    # a registry outcome silently withheld every binary. Anything added
    # to this `if` later must be something that makes the BINARIES wrong.
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/')
          && needs.binaries.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: dist, merge-multiple: true }
      # The .zip and -setup.exe globs are the Windows ARM64 beta and match
      # nothing else today. They must stay tolerant of matching nothing:
      # action-gh-release only errors on an unmatched glob when
      # fail_on_unmatched_files is set, and it deliberately is not - a
      # release whose ARM64 leg went red still publishes everything else.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # dist/*.deb and dist/*.rpm are the BETA Linux packages, and the
          # version says beta rather than the file name alone (`0beta1` /
          # `0.beta1`, which both package managers sort below the eventual
          # release revision). Like the ARM64 assets above they are
          # release downloads only - nothing in the signed update
          # manifest points at either.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
            dist/*.deb
            dist/*.rpm
          generate_release_notes: true
