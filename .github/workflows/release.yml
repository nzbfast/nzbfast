name: release

# Manual or tag-triggered. Builds cross-platform binaries + a multi-arch
# container image, attaches everything to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; the two jobs that publish escalate for themselves.
# A workflow-wide `contents: write, packages: write` handed the same
# push-anything token to the four binary build runners, which only ever
# check out and compile.
permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        # rust-toolchain.toml pins the exact rustc; just add the target to
        # the pinned toolchain (no `rustup update stable`, which would build
        # the shipped bits with an unpinned compiler - inconsistent with the
        # attested provenance-release.yml build).
        run: rustup target add ${{ matrix.target }}
      - name: Cross toolchain (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
      - name: Build
        # --locked: build the committed dependency graph, or fail.
        run: cargo build --release --locked -p nzbfast --target ${{ matrix.target }}
      - name: Package
        run: |
          BIN=target/${{ matrix.target }}/release/nzbfast
          tar czf nzbfast-${{ matrix.target }}.tar.gz -C "$(dirname "$BIN")" nzbfast
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nzbfast-${{ matrix.target }}
          path: nzbfast-${{ matrix.target }}.tar.gz

  image:
    # Tags only - the same guard `release` carries. Without it a
    # workflow_dispatch from ANY branch pushed that branch's build to
    # `:latest`, and every `docker pull nzbfast:latest` got it. The
    # `:${{ github.ref_name }}` tag was just as wrong (a branch name).
    # workflow_dispatch still builds the binaries for a smoke test; it
    # just no longer publishes.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # ghcr push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  release:
    needs: [binaries, image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
