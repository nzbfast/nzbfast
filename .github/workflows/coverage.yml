# Coverage ratchet for the PRIVATE repo. TODO 106 phase 1.2.
#
# test:code ratio (0.69, best in the five-way field) is a VOLUME metric
# and says nothing about what the tests actually reach - measured for the
# first time on 4 Aug: nzbkit lib 86.25% lines, nzbfast bins 47.78%. The
# split between those two numbers is where the §106 phase-3 work goes.
#
# The floors below are deliberately UNDER the measured values (rustnzb's
# pattern, the only competitor with a coverage gate: floors below
# baseline so the gate fires only on a real regression, never on noise).
# Raise a floor deliberately, after the number has moved for a reason -
# the bins floor went 45 -> 46 when phase 3 landed 139 daemon-file unit
# tests (measured 47.97, 5 Aug). Never lower one to make a run pass; a
# refactor that quietly drops a branch is exactly what this exists to
# catch. The nzbkit floor was under water for most of 5 Aug (83.98,
# then 83.81): the pool campaign landed code only the integration and
# daemon suites exercise, which a --lib measurement cannot see. Fixed
# the way the rule demands - 21 pool lib tests plus 4 over preflight's
# STAT sweep, not a lower floor - and green again at 84.61 (b7e8d9c7).
# That leaves ~0.6pp of headroom, and pool.rs alone took ~190 lines of
# mostly uncovered product code on 5 Aug: the next red is more likely
# to be honest drift than a regression, and the answer is still tests.
#
# Measurement policy (6 Aug, TODO 122.5): the nzbkit lib denominator
# excludes the crate's test-infrastructure files - mock.rs (the mock
# NNTP chaos server), sysbench.rs and benchserve.rs (bench tools) -
# via --ignore-filename-regex on that step. These files exist to test
# the product; covering a mock's fault-injection arms with tests whose
# only purpose is covering the mock is test theater, and their growth
# is exactly what dragged an honest floor red on 6 Aug (82.44 at
# aa595e96): the §117 round-3 chaos arms put ~900 missed lines into
# mock.rs that only the chaos-serve BIN ever drives. The metric now
# reads "how well tested is the product", not "how well tested are the
# test rigs". The floor stays 84 - never lower it, and never widen the
# exclusion list to make a run pass: a new entry must BE test
# infrastructure, argued here, in the commit that adds it.
#
# Nightly, not per-push: a full coverage build recompiles the workspace
# instrumented, which is minutes, and ci-private is deliberately lean.
name: coverage
on:
  schedule:
    # 07:00 UTC, two hours before nightly.yml, so the two never compete
    # for the same cache write.
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    if: github.repository != 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain
        run: rustup toolchain install stable --profile minimal --component llvm-tools && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Its own key: instrumented artifacts must never poison the
          # plain debug caches the other workflows share.
          key: coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      # Prebuilt binary pinned by version and checked by SHA256 rather
      # than trusted - same pattern (and rationale) as nextest and
      # cargo-deny in ci-private.yml.
      - name: install cargo-llvm-cov
        run: |
          ver="0.8.7"
          curl -sSfL -o cargo-llvm-cov.tar.gz \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${ver}/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
          echo "967b5cc996c29d8baa52bbb4595ef1f53af35255af8e2036ddbc6468d7b523c7  cargo-llvm-cov.tar.gz" | sha256sum -c -
          tar -xzf cargo-llvm-cov.tar.gz
          sudo mv cargo-llvm-cov /usr/local/bin/
          rm cargo-llvm-cov.tar.gz
      # Two floors, measured per crate, because one workspace-wide number
      # would let a regression in the weak crate hide behind the strong
      # one. NZBFAST_NO_ENRICH is CLAUDE.md invariant 5 - the bin suite
      # runs product code that consults it at the network boundary.
      # Product files only - see the measurement-policy paragraph in the
      # header for why mock/sysbench/benchserve sit outside the metric.
      # TODO 122.4: every red so far cost someone a bisect to answer
      # "did coverage fall, or did the file grow?". The cache below
      # carries the previous run's per-file table; the step after the
      # measurement diffs against it and names the files whose MISSED
      # count grew, with the denominator movement beside it. Advisory
      # only - it never fails the job - and if: always() so the answer
      # exists exactly when the run is red. Restore-keys prefix match
      # pulls the most recent table; the per-run key stores this one.
      - name: previous per-file coverage table
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: coverage-table
          key: coverage-table-${{ github.run_id }}
          restore-keys: coverage-table-
      - name: nzbkit lib coverage (floor 84, product files only)
        env:
          NZBFAST_NO_ENRICH: "1"
        run: >
          cargo llvm-cov --locked -p nzbkit --lib --fail-under-lines 84
          --ignore-filename-regex 'nzbkit/src/(mock|sysbench|benchserve)\.rs$'
      # Must run HERE, before the bins step: `report` globs every
      # binary in the llvm-cov target dir, and after the -p nzbfast
      # --bins run it would charge nzbfast's monomorphized generics to
      # nzbkit source (the §122.3 reused-worktree trap, same mechanism
      # on CI).
      - name: which way did it break (nzbkit per-file drift)
        if: always()
        env:
          NZBFAST_NO_ENRICH: "1"
        run: |
          mkdir -p coverage-table
          cargo llvm-cov report --locked --json \
            --ignore-filename-regex 'nzbkit/src/(mock|sysbench|benchserve)\.rs$' \
            | jq -r '.data[0].files[]
                | [.filename,
                   .summary.lines.count,
                   (.summary.lines.count - .summary.lines.covered)]
                | @tsv' \
            | sed 's#.*/crates/#crates/#' | grep '^crates/nzbkit/' > coverage-table/new.tsv
          if [ -s coverage-table/prev.tsv ]; then
            echo "== nzbkit files whose MISSED lines grew since the previous run =="
            awk -F'\t' 'NR==FNR { prevmiss[$1]=$3; prevtotal[$1]=$2; next }
              { pm = ($1 in prevmiss) ? prevmiss[$1] : 0
                pt = ($1 in prevtotal) ? prevtotal[$1] : 0
                d = $3 - pm
                if (d > 0) printf "  %-58s missed +%d (%d -> %d), file lines %d -> %d\n",
                                  $1, d, pm, $3, pt, $2 }' \
              coverage-table/prev.tsv coverage-table/new.tsv
            echo "== (a file appearing only because it grew is drift; a file whose"
            echo "==  missed grew at the same size is a coverage regression) =="
          else
            echo "no previous table cached - baseline stored for the next run"
          fi
          mv coverage-table/new.tsv coverage-table/prev.tsv
      # if: always() so a breach of one floor never hides the other
      # crate's measurement - the nightly that caught nzbkit under 84
      # also needed the bins figure, and got neither.
      - name: nzbfast bin coverage (floor 46, measured 47.90)
        if: always()
        env:
          NZBFAST_NO_ENRICH: "1"
        run: cargo llvm-cov --locked -p nzbfast --bins --fail-under-lines 46
