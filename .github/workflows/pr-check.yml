# PR validation: build + test every pull request. Read-only, publishes
# nothing (releases are cut by maintainers; release.yml stays disabled).
name: pr-check
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build-and-test:
    if: github.repository == 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    # 60, raised from 45 on 24 Aug 2026 as a stopgap, and DELIBERATELY
    # left at 60 by the nextest conversion below even though that
    # conversion is what the raise was standing in for.
    #
    # This job had never once finished inside 45 minutes. It only looked
    # like it did because it FAILED FAST: linux-tarballs.sh has been red
    # on every public PR since it was wired in (it executes a scanner
    # that is deliberately stripped from the public export), so the run
    # stopped before the expensive tail. Fix that gate and the job runs
    # to completion, reaches clippy, and is cancelled at 45.3 minutes.
    #
    # WHERE THE TIME WENT, measured on run 32768611010 while the suite
    # was still two `cargo test` passes: `test (nzbfast,
    # single-threaded)` 30.1 min, `test (workspace minus nzbfast)`
    # 9.7 min, build 2.1, clippy 2.0, cache restore 0.4. So 40 of the 45
    # were the two test steps and the cache was HITTING - never a
    # cold-build problem.
    #
    # WHY 60 STAYS. The test steps are nextest now and the projection is
    # ~25 minutes for the whole job, which would make 45 comfortable
    # again. That projection is a projection: the 3.03x behind it was
    # measured on a developer box, not on this runner, and lowering a
    # timeout on the strength of it would kill contributor PRs if it is
    # optimistic. Lower it once one green public run has reported the
    # real step timings - that is a one-line change with the numbers in
    # front of you, and there is no cost to waiting.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # par2 CREATES the recovery sets the repair e2e then damages and
      # repairs (nzbfast's own verify and repair are built in, so this is
      # a fixture tool, not a runtime one).
      #
      # unrar is TODO 60b, and the same kind of dependency: the
      # `prefer_external_unrar` setting routes a named compressed set to
      # an unrar SUBPROCESS, and the test that proves it skipped itself
      # on every runner because only par2 was installed - so the routing
      # direction was pinned on a developer machine and nowhere else.
      # This is NOT a reversal of the §11 stage-4 decision to stop
      # embedding unrar: it is a test dependency OF THE RUNNER, never a
      # shipped or bundled binary, exactly as par2 and rar already are.
      # It comes from multiverse; `unrar-free` is a different
      # implementation, not a drop-in, so do not swap it in if this ever
      # fails to install.
      - name: test deps (par2 and unrar for the unpack suites)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq par2 unrar
      # Cargo.lock moves on EVERY release (packaging/bump-version.sh
      # rewrites it), so `hashFiles('Cargo.lock')` sent this job cold on
      # every release for the sake of two changed lines. Measured on
      # ci-private's twin of this bug, 17 Aug 2026: the whole gate went
      # from 49 min to 19. tools/dep-cache-key.py normalises the
      # workspace members' own version lines out of the hash; its
      # --selftest asserts that a third-party change still moves the key.
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # restore + save as SEPARATE steps: the combined actions/cache does
      # NOT save when the job FAILED, so one red run left the next run
      # cold too - worst exactly while someone iterates on a fix.
      - name: cache cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pr-cargo-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      - name: build
        run: cargo build --workspace --locked
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pr-cargo-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # Prebuilt binary pinned by version and checked by SHA256 rather
      # than trusted - the same pattern the private CI uses, and the
      # reason it is a pinned download rather than `cargo install` is
      # that installing it from source on this runner costs more than
      # the whole saving below.
      #
      # --retry-all-errors, not bare --retry: a mid-transfer drop is not
      # one of the "transient" conditions plain --retry covers, and a
      # truncated tarball is what actually happens. The sha256 is still
      # the correctness gate - retrying only removes the
      # single-packet-drop failure mode, it never accepts a bad file.
      - name: install cargo-nextest
        env:
          NT_VERSION: "0.9.140"
          NT_SHA_LINUX: "4ee9aaa0d0171a985a5d0eb735b87355894c1c455972e9674fb9fdbd1387c9a3"
        run: |
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 -o cargo-nextest.tar.gz \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NT_VERSION}/cargo-nextest-${NT_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${NT_SHA_LINUX}  cargo-nextest.tar.gz" | sha256sum -c -
          tar -xzf cargo-nextest.tar.gz
          sudo mv cargo-nextest /usr/local/bin/
          rm cargo-nextest.tar.gz
      # The suite runs as TWO passes, split on the nzbfast package, and
      # the reason for the SPLIT is no longer the reason it was written.
      #
      # It used to be serialisation. The daemon suite is single-threaded
      # by invariant (CLAUDE.md invariant 4), and under a plain parallel
      # `cargo test --workspace` it flaked about 1 run in 3 on an
      # unmodified tree (cancelling_a_download_leaves_its_duplicate_held),
      # measured against a clean checkout - so it was the invocation, not
      # a regression in any change under review. cargo cannot exclude one
      # test TARGET from a workspace pass, so the whole nzbfast package
      # got its own pass with --test-threads=1: a blanket answer to a
      # narrow problem, and it cost 30.1 of this job's 45 minutes.
      #
      # `.config/nextest.toml` answers it narrowly instead, with
      # per-binary `max-threads = 1` test groups (daemon-serial,
      # e2e-serial, fault-contract-serial), so daemon and e2e run
      # concurrently with each other while everything else runs fully
      # parallel. Measured like for like on one developer box, 24 Aug
      # 2026: 1989 s for `cargo test -- --test-threads=1` against 656 s
      # for nextest over the same tree, 2377/2377 passing under the
      # groups. That config now ships (packaging/PUBLIC_MANIFEST), which
      # is the one thing that had kept this job on the slow path.
      #
      # SO WHAT THE SPLIT IS FOR NOW is the ENV, and only the env: the
      # second pass sets NZBFAST_REQUIRE_UNRAR and NZBFAST_LAN_TESTS that
      # the first must not have. Both passes therefore build the SAME
      # thing - identical flags, identical features, no package selection
      # - and select what to RUN with `-E`, so the second pass compiles
      # nothing and the whole job pays for one build.
      #
      # NO `--workspace`, and that is not a translation of the old
      # `--workspace --exclude nzbfast`: it is dropping it. That flag
      # OVERRIDES default-members (see the comment in the root
      # Cargo.toml), which exists to hold nzbfast-ffi out, and that crate
      # turns nzbfast's `ffi` feature on so feature unification compiles
      # the whole module tree a second time as the lib target. Excluding
      # nzbfast did not exclude nzbfast-ffi, so the old first pass was
      # paying that duplicate. clippy below still reaches nzbfast-ffi by
      # NAME, which is the cheap way to cover that crate root.
      #
      # NO `--profile ci` EITHER, and it is worth knowing why the obvious
      # flag is absent. That profile pairs a per-test ceiling with
      # `retries = 1`, so a wedged test is killed, retried, and reported
      # "N passed (1 flaky)" at exit 0 - the hidden-wedge class. It is
      # safe in the private CI only because a companion step reads the
      # junit report the profile writes and reddens the run, and that
      # reader is not part of the public tree. Taking the ceiling without
      # the reader would be strictly worse than taking neither: with no
      # ceiling a wedge simply runs on to this job's own timeout, which
      # is loud. The default profile carries the same test groups (they
      # are declared under `profile.default.overrides`), so none of the
      # speed above depends on the profile.
      #
      # The heavy-tests features (TODO 116b): the eight heavy targets
      # carry required-features in their Cargo.toml so the private
      # repo's per-push archive stops LINKING what no shard reading it
      # runs. (Since 2 Sep 2026 ONE of the eight, `e2e`, is built and
      # run per push there too - out of its own archive, in its own
      # jobs, so that archive is unchanged.) This
      # job DOES run them - it always has, it is a public-PR gate where
      # the extra minutes buy real coverage - so both passes here (and
      # the Windows twins below) pass the feature to keep that exactly
      # as it was. Forget it and cargo builds a suite short SILENTLY
      # here (nothing names the targets), which is why the flag stays.
      # leak_soak is `#[ignore]`d at the test and is not run by either
      # runner, exactly as before.
      - name: test (everything but nzbfast)
        env:
          NZBFAST_NO_ENRICH: "1"
          # par2 is installed above, so a PAR2 test that cannot find it is a
          # broken job. Without this they SKIP, and a broken install reads as
          # a green run with silently reduced coverage.
          NZBFAST_REQUIRE_PAR2: "1"
        # --no-fail-fast is not tidiness: a runner that stops at the first
        # failing binary reports one binary's result as if it had covered
        # the workspace - a single red test in the nzbfast bin used to
        # mean nzbkit's suites (yEnc, PAR2, RAR) never ran at all. The
        # shipped config sets `fail-fast = false` too; the flag stays on
        # the line so this job keeps the guarantee whatever that file
        # says next.
        run: cargo nextest run --locked --features nzbkit/heavy-tests,nzbfast/heavy-tests --no-fail-fast -E 'not package(nzbfast)'
      - name: test (nzbfast)
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
          # The unrar twin of the pin above, and for the same reason:
          # unrar is installed for this job, so a routing test that
          # cannot find one is a broken job rather than a test with
          # nothing to say. Linux only - the Windows twin fetches no
          # unrar, and the routing logic is platform-independent.
          NZBFAST_REQUIRE_UNRAR: "1"
          # Opens an all-interfaces listener to prove the wide bind still
          # reaches the LAN (NAS boxes and remote *arrs depend on it).
          # Off by default because on a developer's macOS it means a
          # firewall prompt on every rebuild; a Linux runner has no such
          # prompt, so CI is where this belongs.
          NZBFAST_LAN_TESTS: "1"
        # Same flags as the pass above on purpose - only the filter and
        # the env differ - so this step compiles nothing.
        run: cargo nextest run --locked --features nzbkit/heavy-tests,nzbfast/heavy-tests --no-fail-fast -E 'package(nzbfast)'
      - name: fmt
        run: cargo fmt -p nzbkit -p nzbfast -p nzbtray --check
      # Parity with ci-private.yml; see TODO 102b for why this is a script
      # rather than clippy's disallowed-methods.
      - name: lock gate
        run: tools/lock-gate.py --selftest && tools/lock-gate.py
      # Parity with ci-private.yml; TODO 106's regrowth ratchet.
      # `--selftest` first, same reason as the lock gate above - the same
      # brace-less `#[cfg(test)]` hole lived in this gate's scope resolver.
      - name: size gate
        run: tools/size-gate.py --selftest && tools/size-gate.py
      # The .deb/.rpm packaging, checked without installing anything: the
      # generated systemd unit, and the property that no maintainer
      # script can remove or replace /var/lib/nzbfast (which is where the
      # user's settings.json and API key live). Pure shell, under a
      # second. The install itself is tested by installing -
      # packaging/tests/linux-install.sh, which needs docker.
      - name: linux packaging gate
        run: packaging/tests/linux-packages.sh
      # The human-download tarballs: that the builder's own owner flags
      # actually zero the headers, and that the upload gate refuses an
      # asset naming the account that built it. Structural, because the
      # pattern scanner only catches the one build account it knows.
      - name: linux tarball gate
        run: packaging/tests/linux-tarballs.sh
      # The same rule over the OTHER archive formats a release ships -
      # .spk, .deb, .rpm, .zip and the .qpkg the upload script's owner
      # gate skips by name, plus nested tars and AppleDouble members. The
      # 1.1.3 .qpkg shipped `uname='runner'` on every member because
      # nothing looked; this is what looks. Pure shell and python, no
      # cross-compiler.
      - name: archive identity gate
        run: packaging/tests/archive-identity.sh
      # The upload script's macOS-metadata gate over the .qpkg, which it
      # skipped by name until TODO 173's last open item wired
      # packaging/qnap/unpack-qpkg.sh in. `._name` at the top level is a
      # SECOND top-level entry and breaks every unpacker that collapses a
      # lone wrapper directory - that is how the Proxmox install could not
      # start its service. Also pins that the gate reads the raw inner
      # archives rather than an unpacked tree, because bsdtar consumes
      # AppleDouble members on extract and a tree walk would see none.
      - name: qpkg junk gate
        run: packaging/tests/qpkg-junk-gate.sh
      # The DSM package's postinst: where a Synology user's downloads
      # land, which is the one decision in that package that cannot be
      # tried before a NAS installs it. Fake volume trees, pure shell,
      # under a second. It had never been wired into a workflow, so it
      # had rotted quietly until a developer ran it by hand.
      - name: synology postinst gate
        run: packaging/tests/synology-postinst.sh
      - name: clippy
        # No escapes: every warning blocks. The categories still allowed
        # are named in the workspace lints table in Cargo.toml, each with
        # its reason.
        #
        # `-p nzbfast-ffi` mirrors ci-private's clippy step, which took
        # it on 23 Aug 2026 when the archive step there stopped taking
        # `--workspace`. It is not only that crate's own few lines: it is
        # what turns nzbfast's `ffi` feature on, and that feature has
        # exactly one site in the workspace - the `#![cfg]` at
        # crates/nzbfast/src/lib.rs:21 - so without it the iOS staticlib's
        # crate root compiles to nothing and its two `#![expect(...)]`
        # waivers are never judged. `crates` ships whole, so a public
        # contributor can break that root; this is the gate that says so.
        run: cargo clippy -p nzbkit -p nzbfast -p nzbtray -p nzbfast-ffi --all-targets --no-deps -- -D warnings

  # Windows, x64. The workspace suite had NEVER run on Windows on any
  # architecture until a Windows-on-ARM build probe added a job that ran
  # it, and eight tests failed - three of them on real product code, in
  # `copy_tree`'s fsync, which made every cross-device move and the spool
  # migration fail with "Access is denied." on the x64 binary we ship
  # today. A download folder and a library on two different drives is the
  # ordinary Windows setup, so that gap was reaching users. This job exists
  # so it cannot come back unnoticed.
  #
  # Same gate as the Linux job above, deliberately: pr-check runs on the
  # PUBLIC repo only. Windows runners bill at 2x on private repos, and the
  # private dev repo runs no pr-check at all by design - so this executes
  # on public-repo pull requests, exactly where the Linux leg already does,
  # and nowhere else.
  build-and-test-windows:
    if: github.repository == 'nzbfast/nzbfast'
    runs-on: windows-latest
    # Windows compiles this workspace a good deal slower than Linux does:
    # a cold-cache release build of it measured 38 minutes. 75 rather
    # than 60 since the nzbfast package's tests went single-threaded
    # (see the test steps below); nightly.yml budgets 90 for build plus
    # the serial daemon suite alone on this runner class.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same test dependency the Linux job installs with apt, for the
      # same reason: the e2e fixtures CREATE the PAR2 recovery sets they then
      # damage and repair, and `par2` is the creator. nzbfast itself needs no
      # external par2 - verify and repair are built in - so this is a fixture
      # tool, not a runtime one. Pinned by tag and checked by SHA256 rather
      # than trusted, since it is fetched from a third party and put on PATH.
      - name: test deps (par2 for repair e2e)
        shell: pwsh
        run: |
          $ver = "1.4.0"
          $url = "https://github.com/animetosho/par2cmdline-turbo/releases/download/v$ver/par2cmdline-turbo-$ver-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile par2.zip
          $want = "7905d1d6aced2b2ca30d824b4954e6bf740dc9d6cfec718b0ab146b5fc0d6327"
          $got = (Get-FileHash par2.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "par2 zip sha256 = $got"
          if ($got -ne $want) { throw "par2 zip sha256 mismatch: got $got, expected $want" }
          New-Item -ItemType Directory -Force -Path C:\par2 | Out-Null
          Expand-Archive par2.zip -DestinationPath C:\par2 -Force
          "C:\par2" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # No toolchain step: rust-toolchain.toml pins 1.97.0 and rustup
      # installs it for the msvc host on the first cargo invocation. An
      # explicit `rustup default stable` would be overridden by that pin
      # anyway - which is already what happens on the Linux job.
      # Cargo.lock moves on EVERY release (packaging/bump-version.sh
      # rewrites it), so `hashFiles('Cargo.lock')` sent this job cold on
      # every release for the sake of two changed lines. Measured on
      # ci-private's twin of this bug, 17 Aug 2026: the whole gate went
      # from 49 min to 19. tools/dep-cache-key.py normalises the
      # workspace members' own version lines out of the hash; its
      # --selftest asserts that a third-party change still moves the key.
      - name: dependency cache key
        id: depkey
        shell: bash
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # restore + save as SEPARATE steps: the combined actions/cache does
      # NOT save when the job FAILED, so one red run left the next run
      # cold too - worst exactly while someone iterates on a fix.
      - name: cache cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # runner.os is in the key, so this cannot collide with the Linux
          # job's cache.
          key: pr-cargo-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      - name: build
        run: cargo build --workspace --locked
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pr-cargo-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      # Same two-pass split as the Linux leg, for the reason that leg
      # USED to have: the daemon suite is single-threaded by invariant
      # (CLAUDE.md invariant 4) and flakes under a parallel workspace
      # pass, and cargo cannot exclude one test target from --workspace.
      # `.config/nextest.toml` answers it narrowly, with per-binary
      # `max-threads = 1` groups, exactly as the Linux leg's own comment
      # above explains.
      #
      # CONVERTED TO NEXTEST 27 Aug 2026, per the recipe this comment
      # used to carry: the same pwsh install step ci-private.yml's
      # windows-build job uses (prebuilt, pinned by version, checked by
      # SHA256, an explicit retry loop rather than -MaximumRetryCount -
      # see that job's own comment for why the loop exists), the same two
      # `-E` filters the Linux leg uses, and
      # `--skip ladder_finds_the_knee_and_soaks_the_line` folded into the
      # first filter as `and not test(ladder_finds_the_knee_and_soaks_the_line)`.
      # Both passes build the SAME thing - identical flags, identical
      # features - and select what to RUN with `-E`, so the second pass
      # compiles nothing, same as the Linux leg.
      #
      # NOT verified on this runner: nothing here has run on the public
      # repo yet (pr-check is gated to it), so the on-runner timing stays
      # an open question until the next public PR - see TODO 285's tail.
      # `timeout-minutes` above is left at 75 for exactly that reason.
      - name: install cargo-nextest
        shell: pwsh
        env:
          NT_VERSION: "0.9.140"
          NT_SHA_WINDOWS: "ec39698dfe5bcfffb7d5da037f226bc1670584ba247123f4e684a0f224fe828d"
        run: |
          $url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$env:NT_VERSION/cargo-nextest-$env:NT_VERSION-x86_64-pc-windows-msvc.zip"
          $want = $env:NT_SHA_WINDOWS
          # An EXPLICIT loop, not -MaximumRetryCount: that parameter only
          # retries HTTP 304/4xx/5xx, and what this step actually dies of
          # is `The response ended prematurely. (ResponseEnded)` - a
          # transport-level truncation it does not cover (ci-private.yml's
          # windows-build job lost three runs to it on 12 Aug 2026, at 2x
          # private-repo billing, with the workspace suite skipped every
          # time). The hash is checked INSIDE the loop so a short read
          # retries rather than failing the job; it remains the only thing
          # that decides correctness.
          $ok = $false
          foreach ($i in 1..5) {
            try {
              Invoke-WebRequest -Uri $url -OutFile cargo-nextest.zip
              $got = (Get-FileHash cargo-nextest.zip -Algorithm SHA256).Hash.ToLower()
              Write-Host "attempt ${i}: cargo-nextest zip sha256 = $got"
              if ($got -eq $want) { $ok = $true; break }
              Write-Host "attempt ${i}: sha256 mismatch (expected $want)"
            } catch {
              Write-Host "attempt ${i}: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds (5 * $i)
          }
          if (-not $ok) { throw "cargo-nextest download failed after 5 attempts (expected sha256 $want)" }
          New-Item -ItemType Directory -Force -Path C:\nextest | Out-Null
          Expand-Archive cargo-nextest.zip -DestinationPath C:\nextest -Force
          Remove-Item cargo-nextest.zip
          "C:\nextest" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: test (workspace minus nzbfast)
        env:
          NZBFAST_NO_ENRICH: "1"
          # As on the Linux leg: par2 is fetched above, so a skip here means
          # the install or the PATH broke and the run must say so.
          NZBFAST_REQUIRE_PAR2: "1"
        # not test(ladder_finds_the_knee_and_soaks_the_line): that test
        # measures wall-clock throughput of a simulated 8 MB/s line and
        # asserts the tuner's knee lands at ~8 connections. On hosted
        # windows-latest the 8-conn rung under-delivers (~78% of the
        # line) and the knee reads as 16, so the test failed EVERY
        # public Windows run from 7 to 14 Aug 2026 while the Linux twin
        # passed every one of them. A check that always fails gates
        # nothing. The Linux leg keeps running it, and the private
        # repo's Windows lane never ran it (its per-push sweep excludes
        # the time-measuring targets wholesale) - so this exclusion
        # removes a red light, not coverage. The other conn_tuner tests
        # stay.
        run: cargo nextest run --locked --features nzbkit/heavy-tests,nzbfast/heavy-tests --no-fail-fast -E 'not package(nzbfast) and not test(ladder_finds_the_knee_and_soaks_the_line)'
      - name: test (nzbfast)
        env:
          NZBFAST_NO_ENRICH: "1"
          NZBFAST_REQUIRE_PAR2: "1"
          # NZBFAST_LAN_TESTS is deliberately NOT set here. It belongs to
          # the Linux runner: it opens an all-interfaces listener, which on
          # Windows is exactly what raises the Defender Firewall dialog,
          # and a hosted runner has nobody to click it.
        # Same flags as the pass above on purpose - only the filter and
        # the env differ - so this step compiles nothing.
        run: cargo nextest run --locked --features nzbkit/heavy-tests,nzbfast/heavy-tests --no-fail-fast -E 'package(nzbfast)'
      # Parity with the Linux leg above, which has run clippy all along
      # while this job did not - and clippy only lints what compiles for
      # the host, so `#[cfg(windows)]` code was gated on no runner at all.
      # nightly.yml's windows-unit job carries the same step for the
      # private repo, where development actually happens; this one keeps a
      # contributor PR from landing Windows-only lint debt.
      # --keep-going because clippy otherwise stops at the first failing
      # crate and reports one crate's worth per round.
      # `-p nzbfast-ffi` for the reason the Linux clippy step above
      # gives; verified clean against x86_64-pc-windows-gnu on 23 Aug
      # 2026 before it was added to any gate.
      - name: clippy
        run: cargo clippy -p nzbkit -p nzbfast -p nzbtray -p nzbfast-ffi --all-targets --no-deps --keep-going -- -D warnings
      # The ARM64 gate. `cargo clippy --target` runs in check mode - it
      # never links - so an x64 runner covers aarch64-pc-windows-msvc with
      # nothing installed but the rust target, and the ARM64 MSVC linker
      # is only needed by the release job that actually emits exes.
      #
      # What it is really guarding is not lint but COMPILATION, and two
      # specific ways this target diverges from the x64 one that shares
      # all its `cfg(windows)` code:
      #   - rapidyenc's C++ kernels are compiled here by cl.exe for ARM64
      #     rather than cl.exe for x64, taking the `_M_ARM64` arms of
      #     vendor/rapidyenc/src/common.h that no other job compiles;
      #   - nzbkit's own aarch64 paths (gf16's NEON kernels, the
      #     `is_aarch64_feature_detected!` probes in nntp.rs and
      #     sysbench.rs) meet Windows runtime feature detection for the
      #     first time - every other aarch64 build we make is macOS or
      #     Linux.
      # Neither is reachable from any other runner in CI, which is the
      # same hole - `cfg` code linted nowhere - that the clippy step above
      # exists to close, one axis over.
      #
      # nzbtray is in the list because the tray ships in the ARM64 package
      # exactly as it does in the x64 one, and it is the crate where
      # Windows-only code is ALL of the crate.
      #
      # Deliberately not --all-targets: the shipped artifacts are the lib
      # and the two bins, and pulling the test targets in would compile a
      # second copy of the dependency graph for a target we do not run
      # tests on. Runs last, so a lint here cannot cost us the suites.
      - name: cross-check aarch64-pc-windows-msvc (ARM64 beta target)
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo clippy --target aarch64-pc-windows-msvc -p nzbfast -p nzbtray --no-deps -- -D warnings
