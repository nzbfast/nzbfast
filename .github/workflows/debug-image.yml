# Issue #38: a symbol-bearing container image, for giving a wedged daemon
# a usable backtrace.
#
# WHY THIS EXISTS AS ITS OWN WORKFLOW. The repo-root Dockerfile has built
# with symbols and split them into a debuglink sidecar since the
# active_stream/queue deadlock fix, but NOTHING published that: the
# release image comes from `packaging/docker/Dockerfile.release` via
# push-image.sh, which COPYs the prebuilt static musl binaries attached
# to the release, and those are stripped by the release profile
# (`strip = "symbols"` in Cargo.toml). So v1.0.23 and v1.1.1 alike
# resolve every frame to `??` under gdb, which is exactly what the #38
# reporter hit when he did the work of capturing a live wedge. The
# capability existed and reached no artifact.
#
# The sidecar cannot be built on a maintainer's Mac and shipped as a
# release asset instead: DWARF records absolute source paths, and the
# ones a host build bakes in (the zig cache, and cargo's registry for the
# cc-compiled C dependencies - ring, libmimalloc, md5-asm, libsql) are
# not covered by the `--remap-path-prefix` in .cargo/config.toml. The
# asset scanner refuses them, correctly. Building in the container puts
# every path under /src and the problem does not arise.
#
# WHAT IT PUBLISHES: `ghcr.io/nzbfast/nzbfast:<version>-debug`, a
# SEPARATE tag. It never touches `:latest` or the release tag, so the
# attested digest those carry cannot be replaced by this. Diagnostic
# artifact, deliberately not attested and deliberately not pushed to
# Docker Hub: Docker Hub's tag list is what NAS users browse in Container
# Manager and Community Apps, and a debug tag there is a trap for
# somebody looking for the app. ghcr serves public images without auth,
# so `docker pull` works for anyone who is given the name.
#
# linux/amd64 only. This Dockerfile COMPILES rather than copying a
# prebuilt binary, and a Rust build of this size under arm64 emulation
# does not finish in a sane amount of time. Add a native arm64 runner
# here if an arm64 wedge ever needs one.
#
# USE, once the image is pushed:
#   docker run ... ghcr.io/nzbfast/nzbfast:1.1.1-debug
#   docker exec -it <container> sh -c 'apt-get update && apt-get install -y gdb'
#   docker exec -it <container> sh -c \
#     'gdb -p $(pidof nzbfast) -batch -ex "thread apply all bt"'
# The container needs SYS_PTRACE for gdb to attach:
#   docker run --cap-add=SYS_PTRACE ...
name: debug-image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the symbol-bearing image from (e.g. v1.1.1)"
        required: true

env:
  TAG: ${{ inputs.tag }}

# Job-level permissions only, matching provenance-release.yml.
permissions: {}

jobs:
  debug-image:
    if: github.repository == 'nzbfast/nzbfast'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write       # push the tag to ghcr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      # The image must be built from the tag's own source, or its symbols
      # describe a binary nobody is running. Unlike provenance-release.yml
      # this does NOT also require the dispatch ref to be the tag: nothing
      # here is signed, so there is no OIDC claim that could disagree with
      # the checkout, and requiring it would make the workflow
      # undispatchable for any tag cut before this file existed.
      - name: Verify the checkout is the tag
        run: |
          set -euo pipefail
          want=$(git rev-parse "refs/tags/$TAG^{commit}")
          have=$(git rev-parse HEAD)
          if [ "$want" != "$have" ]; then
            echo "checkout is $have but tag $TAG is $want" >&2
            exit 1
          fi
          # Image tags carry no `v`, matching every other tag on this
          # package (push-image.sh uses "${TAG#v}" for the same reason).
          echo "VER=${TAG#v}" >> "$GITHUB_ENV"
          echo "building the symbol-bearing image for $TAG at $have"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Build the symbol-bearing image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/nzbfast/nzbfast:${{ env.VER }}-debug

      # The whole point of the workflow, asserted rather than assumed.
      # Without this the job could go green having pushed another stripped
      # image, which is the failure it exists to correct. Pulled back from
      # the registry so what is checked is what was published.
      - name: The image really does carry symbols
        run: |
          set -euo pipefail
          img="ghcr.io/nzbfast/nzbfast:${VER}-debug"
          docker pull -q "$img"
          echo "== the sidecar is where gdb's debuglink search looks"
          docker run --rm --entrypoint sh "$img" -c \
            'ls -l /usr/lib/debug/usr/local/bin/nzbfast.debug'
          echo "== the shipped binary names it"
          docker run --rm --entrypoint sh "$img" -c \
            'grep -aqc nzbfast.debug /usr/local/bin/nzbfast \
             && echo "  .gnu_debuglink present"'
          echo "== and the sidecar carries named symbols, not just sections"
          docker run --rm --entrypoint sh "$img" -c \
            'n=$(grep -ac "nzbfast" /usr/lib/debug/usr/local/bin/nzbfast.debug || true); \
             echo "  $n symbol-bearing lines"; \
             [ "${n:-0}" -ge 1 ] || { echo "no recognisable symbols - refusing" >&2; exit 1; }'
          echo "== it still starts"
          docker run --rm --entrypoint /usr/local/bin/nzbfast "$img" --version

      - name: Where to find it
        run: |
          echo "pushed ghcr.io/nzbfast/nzbfast:${VER}-debug"
          echo "pull it with:  docker pull ghcr.io/nzbfast/nzbfast:${VER}-debug"
