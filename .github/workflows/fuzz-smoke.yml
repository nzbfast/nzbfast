# Bounded fuzz smoke: a short libFuzzer burst over each untrusted-input
# parser (yEnc, NZB, PAR2, RAR, zip, media containers). This is NOT a full
# campaign - long campaigns run offline - just enough to catch a change
# that makes a parser panic/OOB/hang on the seed corpus plus fresh
# mutations. A crash fails the job and uploads the reproducing input.
#
# Runs on BOTH repos, which it did not until 4 Aug. It was gated to the
# public repo and triggered on pull_request only, and the public repo has
# had two PRs ever - so eleven fuzz targets had never once run in CI, on
# either side, while all the actual work lands as direct pushes here. That
# is the gap the 4 Aug scorecard round found.
#
# Scheduled rather than per-push on purpose: a burst is ~11 minutes of
# fuzzing plus a build, which is too much to pay on every commit for a
# check that is looking for a slow-moving class of bug. Nightly at 05:00
# UTC, four hours clear of nightly.yml's 09:00 so the two are not
# competing for runners.
name: fuzz-smoke
on:
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # PR number when there is one, ref otherwise - without the fallback every
  # scheduled run shares one empty group key and cancels the last.
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  # Superseding a PR push is right; killing a half-finished nightly burst
  # because a dispatch fired is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nightly toolchain
        run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - name: cache cargo (+ cargo-fuzz binary + fuzz target dir)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/nzbkit/fuzz/target
          key: fuzz-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: install cargo-fuzz
        # No-op (exit 0) when the cached binary already matches.
        run: cargo install cargo-fuzz --locked
      - name: seed corpora from in-tree fixtures
        working-directory: crates/nzbkit/fuzz
        run: |
          mkdir -p corpus/rar_extract corpus/par2_parse corpus/mkv_parse corpus/zip_parse
          mkdir -p corpus/rar_map corpus/rar_recovery_scan corpus/sevenz_name_probe
          # rar_name_probe takes a bare volume head - no selector byte,
          # unlike rar_map - so real .rar files seed it verbatim.
          mkdir -p corpus/rar_name_probe
          cp ../testdata/rar4/*.rar ../testdata/rar5/*.rar \
             ../../../vendor/rars/tests/fixtures/rar*/*.rar \
             corpus/rar_name_probe/ 2>/dev/null || true
          # sevenz seeds include a header-bomb container (a kEncodedHeader
          # declaring 512 MiB decoded from 16 pack bytes) - the probe's
          # declared-size gate must keep rejecting it within the low rss
          # limit this target runs under.
          cp ../tests/fixtures/sevenz/* corpus/sevenz_name_probe/ 2>/dev/null || true
          cp ../../../vendor/rars/tests/fixtures/rar*/*.rar corpus/rar_extract/ 2>/dev/null || true
          cp ../tests/fixtures/par2/*.par2 corpus/par2_parse/ 2>/dev/null || true
          cp ../tests/fixtures/mkv/*.mkv corpus/mkv_parse/ 2>/dev/null || true
          cp ../tests/fixtures/zip/*.zip corpus/zip_parse/ 2>/dev/null || true
          cp ../../../vendor/rars/tests/fixtures/rar*/*.rar corpus/rar_recovery_scan/ 2>/dev/null || true
          # url_authority_diff needs the scheme prefix in the corpus:
          # "http://" is a 7-byte magic that coverage feedback alone is
          # slow to discover, and everything interesting is behind it.
          mkdir -p corpus/url_authority_diff
          i=0
          for u in 'http://indexer.example/api?t=get' \
                   'https://Indexer.Example:8443/api' \
                   'http://user:p@ss@127.0.0.1:9696/x' \
                   'http://[::1]:5076/api' \
                   'https://192.168.1.1\@indexer.example/x' \
                   'http://0x7f.1/' 'https://b%C3%BCcher.example/'; do
            printf '%s' "$u" > "corpus/url_authority_diff/seed-$i"
            i=$((i+1))
          done
          # rar_map reads byte 0 as a feed-shape selector, so every seed
          # carries one: 0x09 = whole-file spans WITH a password, which is
          # what reaches the encrypted paths. Without the prefix each seed
          # would lose its signature byte to the selector and parse as junk.
          i=0
          for f in ../testdata/rar4/*.rar ../testdata/rar5/*.rar \
                   ../../../vendor/rars/tests/fixtures/rar*/*.rar; do
            [ -f "$f" ] || continue
            { printf '\011'; cat "$f"; } > "corpus/rar_map/seed-$i.bin"
            i=$((i+1))
          done
      - name: fuzz burst (60s per target)
        working-directory: crates/nzbkit/fuzz
        run: |
          set -e
          # All sixteen targets (sevenz_name_probe runs separately below
          # with its own rss limit). Targets that land after this list was
          # last touched belong here too - absence is an accident, not an
          # exclusion: zip_stream is the chase's call order over an
          # in-memory source, mediaprobe runs over a file still arriving
          # off Usenet before PAR2 has verified anything, pesto_msgid and
          # sevenz_name_probe parse bytes anonymous posters chose, and
          # par2_verify_diff is the only one that fuzzes a VERDICT rather
          # than a parser (TODO 133.3 - H7's input parsed fine), and
          # rar_name_probe is the layer above rar_map: the blocker
          # mapping whose EncryptedHeader answer writes a TERMINAL
          # classification (TODO 131 rung 5).
          for t in yenc_decode nzb_parse nzblnk_parse par2_parse rar_extract \
                   rar_map rar_recovery_scan mkv_parse zip_parse zip_stream \
                   mediaprobe pesto_msgid par2_verify_diff url_authority_diff \
                   rar_name_probe; do
            echo "::group::fuzz $t"
            cargo +nightly fuzz run "$t" -- \
              -max_total_time=60 -rss_limit_mb=4096 -timeout=10
            echo "::endgroup::"
          done
          # sevenz_name_probe runs under a deliberately LOW rss limit: a
          # legitimate probe peaks at a few MiB, so a header decompression
          # bomb slipping past the declared-size gate shows up as an OOM
          # here instead of hiding under the 4 GiB ceiling.
          echo "::group::fuzz sevenz_name_probe"
          cargo +nightly fuzz run sevenz_name_probe -- \
            -max_total_time=60 -rss_limit_mb=512 -timeout=10
          echo "::endgroup::"
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: crates/nzbkit/fuzz/artifacts/
          if-no-files-found: ignore
