# Bounded fuzz smoke: a short libFuzzer burst over each untrusted-input
# parser (yEnc, NZB, PAR2, RAR, zip, media containers). This is NOT a full
# campaign - long campaigns run offline - just enough to catch a change
# that makes a parser panic/OOB/hang on the seed corpus plus fresh
# mutations. A crash fails the job and uploads the reproducing input.
#
# Runs on BOTH repos, which it did not until 4 Aug. It was gated to the
# public repo and triggered on pull_request only, and the public repo has
# had two PRs ever - so eleven fuzz targets had never once run in CI, on
# either side, while all the actual work lands as direct pushes here. That
# is the gap the 4 Aug scorecard round found.
#
# Scheduled rather than per-push on purpose: a burst is ~11 minutes of
# fuzzing plus a build, which is too much to pay on every commit for a
# check that is looking for a slow-moving class of bug. Nightly at 05:00
# UTC, four hours clear of nightly.yml's 09:00 so the two are not
# competing for runners.
name: fuzz-smoke
on:
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # PR number when there is one, ref otherwise - without the fallback every
  # scheduled run shares one empty group key and cancels the last.
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  # Superseding a PR push is right; killing a half-finished nightly burst
  # because a dispatch fired is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nightly toolchain
        run: rustup toolchain install nightly --profile minimal && rustup default nightly
      # Cargo.lock moves on EVERY release (packaging/bump-version.sh
      # rewrites it), so `hashFiles('Cargo.lock')` sent this job cold on
      # every release for the sake of two changed lines. Measured on
      # ci-private's twin of this bug, 17 Aug 2026: the whole gate went
      # from 49 min to 19. tools/dep-cache-key.py normalises the
      # workspace members' own version lines out of the hash; its
      # --selftest asserts that a third-party change still moves the key.
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # NOTE the interaction with `install cargo-fuzz` below: that step is
      # skipped on a cache HIT because `cargo install` errors rather than
      # no-opping on an existing binary. Changing the key here means one
      # miss, one reinstall, then the guarded path resumes as designed.
      - name: cache cargo (+ cargo-fuzz binary + fuzz target dir)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/nzbkit/fuzz/target
          key: fuzz-cargo-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      - name: install cargo-fuzz
        # Skip when the cache above restored the binary. `cargo install`
        # does NOT no-op on an existing binary the way this step used to
        # claim - it errors with "binary `cargo-fuzz` already exists in
        # destination". That is what reds the SECOND push to any PR whose
        # Cargo.lock is unchanged: the cache key hits, ~/.cargo/bin/
        # cargo-fuzz comes back, and the install fails in ~60s (seen on
        # PR #26, run 31703586147, after a green first push).
        # Guarding rather than `--force` also skips a pointless rebuild.
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin/cargo-fuzz"
          [ -x "$bin" ] || cargo install cargo-fuzz --locked
      # Carry the corpus forward between runs. Without this the burst
      # starts COLD every time: the cache above covers ~/.cargo and the
      # fuzz target dir but not `corpus/`, and the seed step below rebuilds
      # it from in-tree fixtures, so every coverage-expanding input
      # libFuzzer discovers is thrown away when the job ends. Sixty seconds
      # from a fixed seed set is a fixed-depth sample, and it re-samples the
      # same shallow shell nightly rather than going deeper.
      #
      # That is not theoretical. The `rar_name_probe` out-of-bounds panic in
      # `v4_header_crc` (13 Aug) needed a torn 8-byte header, a shape no
      # fixture has: three runs found it and run b8010a14 came back GREEN on
      # a commit that did not contain the fix. A green burst was not
      # evidence, and the reason was that nothing accumulated.
      #
      # Keyed on `run_id` so every run writes a fresh entry, with a prefix
      # restore-key so each one resumes from the newest existing corpus.
      # PR runs restore from the default branch's cache and write to their
      # own scope, which expires with the branch - so a PR cannot poison
      # what the nightly builds up.
      - name: restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/nzbkit/fuzz/corpus
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ runner.os }}-
      # What the restore actually delivered, BEFORE the seed step adds
      # in-tree fixtures on top. Without this the two are indistinguishable:
      # a target showing 5 files at INITED looks the same whether the cache
      # carried 5 inputs forward or the restore missed entirely and those 5
      # are just the fixtures. On 14 Aug that ambiguity cost real time -
      # run 31785434617 was read as having a 1,311-file corpus when it had
      # started from 5, because the only corpus report ran AFTER the burst.
      #
      # The mechanism does work: PR run 31774036760 logs "Cache restored
      # from key: fuzz-corpus-Linux-31744525472". What it had not done yet
      # is work ON MAIN - caches written by a pull_request run are scoped
      # to that PR and a run on main cannot read them, and the corpus steps
      # only landed 13 Aug 14:30 UTC, so 31785434617 was the first
      # scheduled run to reach them and had nothing main-scoped to restore.
      # It saved one, so this step is also how we find out whether the next
      # scheduled run picks that chain up. Non-zero totals = restored;
      # zeros = cold start.
      - name: corpus carried forward (restore check)
        working-directory: crates/nzbkit/fuzz
        run: |
          if [ -d corpus ]; then
            printf '%8s  %5s files  %s\n' \
              "$(du -sh corpus 2>/dev/null | cut -f1)" \
              "$(find corpus -type f | wc -l | tr -d ' ')" "corpus (restored)"
            for d in corpus/*/; do
              printf '%8s  %5s files  %s\n' \
                "$(du -sh "$d" 2>/dev/null | cut -f1)" \
                "$(find "$d" -type f | wc -l | tr -d ' ')" "$d"
            done
          else
            echo "corpus/ absent - restore missed, this burst starts COLD"
          fi
      - name: seed corpora from in-tree fixtures
        working-directory: crates/nzbkit/fuzz
        run: |
          mkdir -p corpus/rar_extract corpus/par2_parse corpus/mkv_parse corpus/zip_parse
          mkdir -p corpus/rar_map corpus/rar_recovery_scan corpus/sevenz_name_probe
          mkdir -p corpus/sevenz_disk_gate corpus/remux
          # Every .rar in the rars fixture tree, at ANY depth, into a
          # flat corpus dir under a path-qualified name.
          #
          # The three call sites below used to share a `rar*/*.rar`
          # glob, which is ONE level deep and therefore reached 54 of
          # the tree's 141 archives: everything under rar15_40/rar300/,
          # rar15_40/encrypted/, rar50/wild/ and eleven more subdirs was
          # invisible to all three targets. TODO 16k measured the cost
          # on this tree and left it alone as another target's business;
          # this is that look. Measured at INITED on this tree, in the
          # shape CI actually assembles (committed seeds/ replayed on
          # top): rar_extract 2,685 -> 5,722 edges (ft 5,519 -> 14,764),
          # rar_name_probe 450 -> 553 (ft 931 -> 1,261), and
          # rar_recovery_scan - whose committed seeds already carry its
          # gated entry points, so it has the least to gain - 2,417 ->
          # 2,538 (ft 4,275 -> 4,933). The archive sweep alone, without
          # those seeds, is 1,601 -> 2,243 there.
          #
          # The name is path-qualified rather than the basename because
          # a libFuzzer corpus dir is FLAT: `solid.rar`, `stored.rar`
          # and `with_comment.rar` each exist in more than one fixture
          # subdir, so a plain `find -exec cp` silently lands 138 of the
          # 141 and the three it drops are exactly the ones a
          # depth-widening was for.
          seed_rars() {
            find ../../../vendor/rars/tests/fixtures -name '*.rar' -type f \
            | while read -r f; do
                cp "$f" "$1/$(printf '%s' "${f##*fixtures/}" | tr / _)" \
                  2>/dev/null || true
              done
          }
          # rar_name_probe takes a bare volume head - no selector byte,
          # unlike rar_map - so real .rar files seed it verbatim.
          #
          # testdata is path-qualified for the same flat-dir reason as
          # seed_rars, and it is not hypothetical here: FIVE of the
          # thirteen names exist in BOTH testdata/rar4 and
          # testdata/rar5 (enc-hdrs, enc-store, enc-vols.part1..3), so
          # the plain `cp` landed 8 of 13 and the five it dropped were
          # the ENCRYPTED-header ones - the shape whose verdict writes
          # this target's terminal `header_encrypted` classification.
          mkdir -p corpus/rar_name_probe
          for f in ../testdata/rar4/*.rar ../testdata/rar5/*.rar; do
            [ -f "$f" ] || continue
            cp "$f" "corpus/rar_name_probe/$(printf '%s' "${f#../testdata/}" | tr / _)" \
              2>/dev/null || true
          done
          seed_rars corpus/rar_name_probe
          # sevenz seeds include a header-bomb container (a kEncodedHeader
          # declaring 512 MiB decoded from 16 pack bytes) - the probe's
          # declared-size gate must keep rejecting it within the low rss
          # limit this target runs under.
          cp ../tests/fixtures/sevenz/* corpus/sevenz_name_probe/ 2>/dev/null || true
          # The disk-gate target takes whole containers; the same seeds
          # cover it (it also self-seals raw windows, like the probe).
          cp ../tests/fixtures/sevenz/* corpus/sevenz_disk_gate/ 2>/dev/null || true
          seed_rars corpus/rar_extract
          cp ../tests/fixtures/par2/*.par2 corpus/par2_parse/ 2>/dev/null || true
          cp ../tests/fixtures/mkv/*.mkv corpus/mkv_parse/ 2>/dev/null || true
          # remux walks sample tables and block lacing, and a mutator
          # starting from noise does not reach either: an EBML header is
          # a 4-byte magic followed by structure. The same fixture the
          # parse target uses is the cheapest way in.
          cp ../tests/fixtures/mkv/*.mkv corpus/remux/ 2>/dev/null || true
          cp ../tests/fixtures/zip/*.zip corpus/zip_parse/ 2>/dev/null || true
          # rar_recovery_scan's own gated entry points are seeded from
          # seeds/ below - everything it parses sits behind a CRC64, a
          # REV header or a volume signature - but the archive sweep is
          # free coverage for the RAR5 leg on top of that, and it now
          # actually reaches rar15_40/rar300/, where all three legacy
          # protect-record fixtures live.
          seed_rars corpus/rar_recovery_scan
          # Committed seeds (seeds/README.md): corpus/ is gitignored, so a
          # crash CI found would be lost with its artifact, and a target
          # whose gates no mutator guesses would start cold every run.
          # Both live there; replay them all.
          for d in seeds/*/; do
            t=$(basename "$d")
            mkdir -p "corpus/$t"
            find "$d" -type f ! -name README.md -exec cp {} "corpus/$t/" \;
          done
          # nzb_parse rides that loop since 30 Aug 2026 (seeds/nzb_parse,
          # 19 files / 33 KB) and there is deliberately NO `cp
          # ../testdata/nzb/*.nzb` beside it, which is what the fuzz
          # README used to recommend. libFuzzer takes `max_len` from the
          # largest corpus UNIT, so seeding the 84,880-byte garbled
          # fixture drops this 60 s burst from 120k execs to 54k and
          # lands on FEWER edges (2,102 -> 2,072, measured that day); the
          # 1.18 MiB undefined-entity fixture is far past that again.
          # Both shapes are carried by seeds under 600 bytes instead. If
          # you want the big fixtures, they belong in a long campaign
          # with an explicit -max_len, not here.
          # nzb_semantic rides the same loop since 31 Aug 2026
          # (seeds/nzb_semantic, 18 files / 606 bytes). Those are CHOICE
          # STREAMS rather than documents - that target builds a manifest
          # model from its input - and they are what reaches the hostile
          # arm at INITED: eight `Schema` breaks, six capped fields, and
          # the two N6-09 count ceilings. The four `nzbc-*` build
          # documents of up to nineteen MB, so the target holds them
          # behind a magic prefix and a per-process budget; without the
          # budget they take this burst from 1,557 exec/s to 287.
          # Measured worst unit 1.5 s on the dev Mac against the
          # -timeout=10 below.
          # url_authority_diff needs the scheme prefix in the corpus:
          # "http://" is a 7-byte magic that coverage feedback alone is
          # slow to discover, and everything interesting is behind it.
          mkdir -p corpus/url_authority_diff
          i=0
          for u in 'http://indexer.example/api?t=get' \
                   'https://Indexer.Example:8443/api' \
                   'http://user:p@ss@127.0.0.1:9696/x' \
                   'http://[::1]:5076/api' \
                   'https://192.168.1.1\@indexer.example/x' \
                   'http://0x7f.1/' 'https://b%C3%BCcher.example/'; do
            printf '%s' "$u" > "corpus/url_authority_diff/seed-$i"
            i=$((i+1))
          done
          # rar_map reads byte 0 as a feed-shape selector, so every seed
          # carries one: 0x09 = whole-file spans WITH a password, which is
          # what reaches the encrypted paths. Without the prefix each seed
          # would lose its signature byte to the selector and parse as junk.
          #
          # This loop was the fourth `rar*/*.rar` call site 20ccfdb8f left
          # behind - it fixed rar_extract, rar_name_probe and
          # rar_recovery_scan through the shared seed_rars() helper above,
          # named "three targets" in its own message, and this one is a
          # separate loop (it writes a numbered, selector-prefixed file
          # rather than a bare copy) that the sweep never touched. Same
          # one-level-deep gap: `rar*/*.rar` reached 54 of the fixture
          # tree's 141 archives. Sequential naming already avoids the
          # basename collision seed_rars was written to solve, so the fix
          # here is only the depth: a recursive `find` in place of the
          # glob, with `i` carried through both loops so no name repeats.
          i=0
          for f in ../testdata/rar4/*.rar ../testdata/rar5/*.rar; do
            [ -f "$f" ] || continue
            { printf '\011'; cat "$f"; } > "corpus/rar_map/seed-$i.bin"
            i=$((i+1))
          done
          find ../../../vendor/rars/tests/fixtures -name '*.rar' -type f | while read -r f; do
            { printf '\011'; cat "$f"; } > "corpus/rar_map/seed-$i.bin"
            i=$((i+1))
          done
      - name: fuzz burst (60s per target)
        working-directory: crates/nzbkit/fuzz
        run: |
          # No `set -e`: this step used to die on the first crash, which
          # left every target after it unreached with no record at all -
          # not "passed", not "skipped", absent from the log entirely.
          # Measured twice, both times on par2_verify_diff (14th of 18):
          # each run lost the seven targets below it, `remux` among them
          # on the run meant to prove it runs at all. Each invocation
          # below is checked on its own, `failed` collects the names that
          # crashed, and the step exits non-zero at the end if `failed` is
          # non-empty - the job still FAILS on any crash, it just no
          # longer hides what came after it.
          failed=""
          # Eighteen targets here; sevenz_name_probe, sevenz_disk_gate
          # and remux run separately below, each with a malloc ceiling of
          # its own. That is all twenty-one `[[bin]]` names in
          # fuzz/Cargo.toml as of 2 Sep 2026 - remux was the one this file
          # had never named, and it is wired in below rather than added
          # here. Targets that land after this list was last touched
          # belong here too - absence is an accident, not an exclusion:
          # zip_stream is the chase's call order over an in-memory
          # source, mediaprobe runs over a file still arriving
          # off Usenet before PAR2 has verified anything, pesto_msgid and
          # sevenz_name_probe parse bytes anonymous posters chose, and
          # par2_verify_diff is the only one that fuzzes a VERDICT rather
          # than a parser (TODO 133.3 - H7's input parsed fine), and
          # rar_name_probe is the layer above rar_map: the blocker
          # mapping whose EncryptedHeader answer writes a TERMINAL
          # classification (TODO 131 rung 5), audio_tags reads a NAME out
          # of a poster's own metadata and puts it on a file (issue #55),
          # and tar_parse drives nzbkit::tar::Reader - the container with
          # no tail structure, so its bomb guard is the declared total
          # rather than a promote window (TODO 163 item 6's fuzz debt).
          for t in yenc_decode nzb_parse nzb_semantic nzblnk_parse par2_parse \
                   rar_extract rar_map rar_recovery_scan mkv_parse zip_parse \
                   zip_stream mediaprobe pesto_msgid par2_verify_diff \
                   url_authority_diff rar_name_probe audio_tags tar_parse; do
            echo "::group::fuzz $t"
            if ! cargo +nightly fuzz run "$t" -- \
              -max_total_time=60 -rss_limit_mb=4096 -timeout=10; then
              failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          # sevenz_name_probe keeps a deliberately LOW ceiling - but on the
          # MALLOC hook, not on RSS. The intent is unchanged: a header
          # decompression bomb slipping past the declared-size gate must
          # trip here rather than hide under the 4 GiB ceiling.
          #
          # It was `-rss_limit_mb=512` until 14 Aug, and that number was
          # measuring the wrong thing. `-rss_limit_mb` bounds the WHOLE
          # process, and most of that process is libFuzzer, not the probe.
          # Run 31785434617 OOMed at 566Mb with a live heap of just 27.8 MB:
          # the other ~540 MB was ASan's quarantine (212 MB) plus redzone
          # metadata over 730k chunks, and every allocation context in the
          # top 95% went through libstdc++ `operator new` - libFuzzer's C++,
          # with no Rust frame in it. RSS tracked EXEC COUNT, not input
          # (251Mb at 59k execs, 388Mb at 708k, 566Mb at 1.2M), so the
          # failure was a race between a fast runner and the 60s budget:
          # three reds in ten runs, and the reproducer libFuzzer saved was
          # the EMPTY unit, which this target returns on before doing any
          # work. A local run over an EMPTY corpus reaches 284Mb of RSS on
          # nothing but sub-1 KB generated inputs - over half the old
          # ceiling was harness overhead before a byte of 7z was parsed.
          #
          # `-malloc_limit_mb` is the single-allocation hook, and it only
          # DEFAULTS to -rss_limit_mb when left unset. Pinning it keeps the
          # exact guard we want - "never allocate from an untrusted declared
          # length" - and lets RSS breathe. 128 MiB is the number because
          # the gates themselves permit one legitimate allocation that big:
          # SEVENZ_END_MAX caps a decoded header at 2 MiB, and
          # SEVENZ_PPMD_MEM_MAX caps a declared PPMd model at 64 MiB, so
          # 128 MiB clears the largest legal single allocation 2x over
          # while sitting far below any bomb.
          #
          # Verified able to fire, not just assumed: with encoded_header_bomb
          # stubbed to `false`, the seed fixture
          # crates/nzbkit-base/tests/fixtures/sevenz/ppmd-mem-window.bin
          # aborts immediately as
          # `ERROR: libFuzzer: out-of-memory (malloc(4179881744))` - a 4.18 GB
          # single allocation.
          #
          # And it earned its keep immediately: within seven minutes of
          # running under the malloc ceiling it found a REAL unbounded
          # allocation the RSS ceiling had never surfaced - a 33-byte window
          # declaring 9 bytes of output but a 384 MiB LZMA2 dictionary, which
          # `LzDecoder::ensure_capacity` allocated whole because the gate
          # capped the decoded size and the PPMd memSize but not the
          # dictionary. Fixed by SEVENZ_DICT_MAX; the reproducer is pinned as
          # a unit fixture and as a seed in fuzz/seeds/sevenz_name_probe/.
          # Note the 60s burst did NOT find it and the 420s soak did - one
          # more reason a green burst is weak evidence.
          echo "::group::fuzz sevenz_name_probe"
          if ! cargo +nightly fuzz run sevenz_name_probe -- \
            -max_total_time=60 -rss_limit_mb=4096 -malloc_limit_mb=128 -timeout=10; then
            failed="$failed sevenz_name_probe"
          fi
          echo "::endgroup::"
          # sevenz_disk_gate runs the whole-container declared-size gate
          # (start geometry, packed-header decode, content dictionary
          # accounting - bug-sweep H1+H2, 14 Aug). Same malloc ceiling
          # and for the same reason: the gate's own legal allocations
          # top out at a 2 MiB header window plus a 2 MiB packed-header
          # decode, so any big single allocation is a finding.
          echo "::group::fuzz sevenz_disk_gate"
          if ! cargo +nightly fuzz run sevenz_disk_gate -- \
            -max_total_time=60 -rss_limit_mb=4096 -malloc_limit_mb=128 -timeout=10; then
            failed="$failed sevenz_disk_gate"
          fi
          echo "::endgroup::"
          # remux was the ONE declared target this workflow never named -
          # the accident the loop's own comment above predicted, found by
          # diffing the [[bin]] names in fuzz/Cargo.toml against every
          # target named anywhere in this file
          # (research/SANDBOX-SCOPING-2026-08.md section 2.5, gap i). It
          # is not in that loop because it wants a malloc ceiling of its
          # own: "bounded allocation" is one of the four properties its
          # header claims, and a fragment it emits is capped at 80 MiB, so
          # 512 MiB clears the largest legal single allocation six times
          # over while still catching an unbounded one.
          #
          # The ceiling is on MALLOC, not RSS, and the difference is this
          # target's own history: §73 phase 4 lost its first remux
          # campaign to `-rss_limit_mb=512` at SEVEN SECONDS, because RSS
          # is mostly libFuzzer's corpus and ASan's quarantine rather than
          # anything the remuxer allocated. Measured before wiring it in
          # here, on 2 Sep 2026 at 8fb0cd74a: a 300 s local burst reached
          # 278,929 runs with a peak RSS of 247 MB and no crash, OOM or
          # timeout, which is why this lands as one more green step rather
          # than as a finding.
          echo "::group::fuzz remux"
          if ! cargo +nightly fuzz run remux -- \
            -max_total_time=60 -rss_limit_mb=4096 -malloc_limit_mb=512 -timeout=10; then
            failed="$failed remux"
          fi
          echo "::endgroup::"
          # Fail the step now that every target has had its turn - this is
          # the whole point: a crash must still red the job, it just must
          # not stop the burst from reaching the targets after it.
          if [ -n "$failed" ]; then
            echo "::error::fuzz targets crashed or hung:$failed"
            exit 1
          fi
      # yenc_decode ran once above, on whichever SIMD kernel this runner's
      # CPU happens to select. That is one of SIX: rapidyenc compiles five
      # x86 decode kernels plus a scalar one into the shipped binary and
      # dispatches on runtime CPU detection, and it is the ONLY
      # memory-unsafe parse code nzbfast ships - about 4,000 lines of
      # hand-written SIMD C++ (research/SANDBOX-SCOPING-2026-08.md section
      # 2.5, gap ii, "the single highest-value gap in the list"). The
      # other four x86 kernels are reached on users' machines and were
      # reached by nothing here.
      #
      # NZBFAST_FUZZ_YENC_KERNEL pins the kernel for a run, through
      # rapidyenc's own per-kernel setters (crates/nzbkit/csrc/
      # yenc_kernel_pin.cc). A pin only ever goes DOWN, so a runner covers
      # everything at or below what its CPU supports - typically generic,
      # sse2, ssse3, avx and avx2 on a GitHub x86 runner - and a kernel
      # this CPU cannot run exits 0 immediately rather than re-fuzzing the
      # detected one under someone else's label. That is why the whole
      # list is named here rather than a per-runner subset: neon costs
      # nothing on x86 today and is covered for free the day this moves to
      # an arm runner. A misspelled name ABORTS, because a silently
      # skipped kernel is how coverage is lost without anyone noticing.
      #
      # Every run PRINTS the kernel actually in force, so the log says
      # what was covered instead of leaving it to be inferred from the
      # runner. 45 s each rather than 60 keeps the added cost near four
      # minutes; the unpinned 60 s run above is untouched, so this is
      # additive and the existing gate is unchanged.
      #
      # `!cancelled()` because this step's coverage has NOTHING to do with
      # whether the loop above found a crash, and without it the two are
      # welded together: the loop is one `set -e` shell, so the FIRST target
      # to crash ends the step and every kernel here is skipped. That is not
      # hypothetical - run 33678333481, the first run after the per-kernel
      # step landed and the one meant to prove it works on x86, reported
      # `fuzz burst: failure` / `one run per SIMD kernel: skipped` because
      # `par2_verify_diff` (an unrelated target, and the fourteenth of
      # eighteen) found a real divergence 22 minutes in. Six kernels lost
      # their run to a bug in a different parser, which is the same silent
      # loss of coverage this step exists to prevent - a crash anywhere must
      # not quietly cost the yEnc kernels their run. The job still FAILS on
      # the loop's failure; this only stops the skip.
      - name: fuzz burst - yenc_decode, one run per SIMD kernel
        if: ${{ !cancelled() }}
        working-directory: crates/nzbkit/fuzz
        run: |
          set -e
          for k in generic sse2 ssse3 avx avx2 vbmi2 neon; do
            echo "::group::fuzz yenc_decode [kernel $k]"
            NZBFAST_FUZZ_YENC_KERNEL="$k" cargo +nightly fuzz run yenc_decode -- \
              -max_total_time=45 -rss_limit_mb=4096 -timeout=10
            echo "::endgroup::"
          done
      # rapidyenc's CRC is a SECOND dispatch with a second CPU probe, a
      # second `_crc32_isa` and three function pointers of its own
      # (crc_folding.cc, crc_folding_256.cc, crc_arm.cc, crc_arm_pmull.cc)
      # - the same class of code as the decode kernels, on the same path,
      # and until 2 Sep 2026 nothing pinned it either.
      #
      # The exhaustive answer-differential lives in a UNIT test
      # (yenc_simd::tests::every_reachable_crc_kernel_matches_the_oracle),
      # which runs on every push including the x86 shards where PCLMUL and
      # VPCLMUL actually live: a CRC branches on no byte VALUE, so its
      # reachable paths are exactly (start alignment x length residue) and
      # that test enumerates them. What a unit test CANNOT do is watch for
      # an out-of-bounds read, and this build has AddressSanitizer - which
      # is the whole reason for these runs and why they are short. Three
      # names cover x86; armcrc/armpmull exit 0 here and cost nothing, and
      # are covered for free the day this moves to an arm runner.
      #
      # `!cancelled()` for the reason its decode twin above carries it, one
      # step further down the chain: this step is skipped when EITHER the
      # burst loop or the decode-kernel step fails, so without the guard a
      # crash in any of the eighteen targets silently costs all five CRC
      # kernels their run too.
      - name: fuzz burst - yenc_decode, one run per CRC kernel
        if: ${{ !cancelled() }}
        working-directory: crates/nzbkit/fuzz
        run: |
          set -e
          for k in generic pclmul vpclmul armcrc armpmull; do
            echo "::group::fuzz yenc_decode [crc kernel $k]"
            NZBFAST_FUZZ_CRC_KERNEL="$k" cargo +nightly fuzz run yenc_decode -- \
              -max_total_time=45 -rss_limit_mb=4096 -timeout=10
            echo "::endgroup::"
          done
      # Report what the corpus is costing before saving it. A corpus that
      # accumulates forever eventually evicts itself against the repo-wide
      # 10 GB cache ceiling, and it would do it SILENTLY - the burst would
      # quietly go back to starting cold, which is the exact failure this
      # step exists to prevent. `cargo fuzz cmin <target>` is the lever when
      # these numbers get uncomfortable; libFuzzer only keeps inputs that
      # expand coverage, so the growth is slow, not linear in runtime.
      #
      # Note this step measures the corpus AFTER the burst, so it cannot
      # tell a warm start from a cold one - the numbers are what THIS run
      # produced in 60s, and they look healthy either way. It read "1311
      # files / 5.3M" for sevenz_name_probe on 14 Aug in a run that had
      # started from 5. The `corpus carried forward (restore check)` step,
      # up before the seed step, reports the other end.
      # restore + save as SEPARATE steps: the combined actions/cache does
      # NOT save when the job FAILED, so one red run left the next run
      # cold too - worst exactly while someone iterates on a fix.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/nzbkit/fuzz/target
          key: fuzz-cargo-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      - name: corpus size
        if: always()
        working-directory: crates/nzbkit/fuzz
        run: |
          du -sh corpus 2>/dev/null || true
          for d in corpus/*/; do
            printf '%8s  %5s files  %s\n' \
              "$(du -sh "$d" 2>/dev/null | cut -f1)" \
              "$(find "$d" -type f | wc -l | tr -d ' ')" "$d"
          done
      # `always()` on purpose: a CRASHING run is the one whose corpus is
      # most worth keeping - it holds the inputs that walked up to the
      # crash. The default post-job save would skip exactly that case and
      # discard the most valuable corpus the job ever built.
      - name: save fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/nzbkit/fuzz/corpus
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: crates/nzbkit/fuzz/artifacts/
          if-no-files-found: ignore

  # THE ARM64 LEG, added 2 Sep 2026, and it exists because of what the
  # first arm64 run of `yenc_decode` under AddressSanitizer found: an
  # out-of-bounds read in rapidyenc's NEON decode kernel, on a
  # WELL-FORMED article, three seconds in. It had been shipping to every
  # Apple user, every arm64 NAS and both phone targets, and nothing here
  # could see it, because everything above this line runs on x86.
  #
  # Three preconditions had to line up before it was findable at all, and
  # the last two landed the same day (research/YENC-NEON-OVERREAD-2026-09-02.md):
  # ASan had to reach the `cc`-built C++ (e0dedc105), the decode kernel
  # had to be pinnable (e0dedc105) - and the run had to happen on an ARM
  # CPU, which is what this job is. The bug is arm-only: the x86 kernels
  # load exactly the four bytes the algorithm reserves for
  # (decoder_sse_base.h), so the ubuntu leg was green over the very same
  # seed that aborts here.
  #
  # WHY NOT A LONGER x86 RUN INSTEAD. That was the other candidate, and
  # it is measured-and-declined in section 2.5 of
  # research/SANDBOX-SCOPING-2026-08.md. Every x86 kernel already gets a
  # pinned run per PR and per night from the job above; what had never
  # run was an ARCHITECTURE, and that is where the only defect this
  # module has ever yielded was sitting. Breadth of configuration bought
  # more than depth on ground already covered, and a rotating
  # one-kernel-per-night x86 campaign would have cost about 120 minutes a
  # night to keep re-covering it.
  #
  # Scoped as tightly as it can be: ONE target, nightly and on demand
  # only, never on a pull_request. macOS runner minutes bill at a
  # multiple of ubuntu's on a private repo, so this is deliberately not a
  # per-push gate; it is the same slow-moving class the job above is
  # looking for, on the architecture that job cannot reach.
  #
  # The kernel lists are the FULL lists, identical to the two steps
  # above, not an arm-only subset. A name this CPU cannot run exits 0
  # immediately and costs a process start, and holding both legs to the
  # same list means a kernel added to rapidyenc tomorrow is either named
  # in both places or missing from both - never quietly covered on one
  # architecture only, which is the failure this whole file is about.
  fuzz-arm:
    runs-on: macos-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nightly toolchain
        run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - name: dependency cache key
        id: depkey
        run: |
          py=python3; command -v $py >/dev/null 2>&1 || py=python
          echo "hash=$($py tools/dep-cache-key.py)" >> "$GITHUB_OUTPUT"
      # `runner.os` is in every cache key in this file, so this leg gets
      # its own namespace for free and cannot collide with the ubuntu
      # one - which matters more here than usual, since the two build
      # different object code from the same sources.
      - name: cache cargo (+ cargo-fuzz binary + fuzz target dir)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/nzbkit/fuzz/target
          key: fuzz-cargo-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      - name: install cargo-fuzz
        # Same guard and same reason as the ubuntu leg: `cargo install`
        # ERRORS on an existing binary rather than no-opping, so a cache
        # hit must skip it.
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin/cargo-fuzz"
          [ -x "$bin" ] || cargo install cargo-fuzz --locked
      - name: restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/nzbkit/fuzz/corpus
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ runner.os }}-
      - name: corpus carried forward (restore check)
        working-directory: crates/nzbkit/fuzz
        run: |
          if [ -d corpus/yenc_decode ]; then
            printf '%8s  %5s files  corpus/yenc_decode (restored)\n' \
              "$(du -sh corpus/yenc_decode 2>/dev/null | cut -f1)" \
              "$(find corpus/yenc_decode -type f | wc -l | tr -d ' ')"
          else
            echo "corpus/yenc_decode absent - restore missed, this burst starts COLD"
          fi
      # Only this target's seeds. The fixture sweeps in the ubuntu leg
      # feed the RAR / 7z / zip targets, which this leg does not run.
      # `crash-8937f376...` in here is the repro for the NEON over-read
      # above (seeds/README.md), so every run of this job replays the
      # exact bytes that found it.
      - name: replay committed seeds - yenc_decode
        working-directory: crates/nzbkit/fuzz
        run: |
          mkdir -p corpus/yenc_decode
          find seeds/yenc_decode -type f ! -name README.md \
            -exec cp {} corpus/yenc_decode/ \;
          find corpus/yenc_decode -type f | wc -l
      - name: fuzz burst - yenc_decode, one run per SIMD kernel
        working-directory: crates/nzbkit/fuzz
        run: |
          set -e
          for k in generic sse2 ssse3 avx avx2 vbmi2 neon; do
            echo "::group::fuzz yenc_decode [kernel $k]"
            NZBFAST_FUZZ_YENC_KERNEL="$k" cargo +nightly fuzz run yenc_decode -- \
              -max_total_time=45 -rss_limit_mb=4096 -timeout=10
            echo "::endgroup::"
          done
      - name: fuzz burst - yenc_decode, one run per CRC kernel
        working-directory: crates/nzbkit/fuzz
        run: |
          set -e
          for k in generic pclmul vpclmul armcrc armpmull; do
            echo "::group::fuzz yenc_decode [crc kernel $k]"
            NZBFAST_FUZZ_CRC_KERNEL="$k" cargo +nightly fuzz run yenc_decode -- \
              -max_total_time=45 -rss_limit_mb=4096 -timeout=10
            echo "::endgroup::"
          done
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/nzbkit/fuzz/target
          key: fuzz-cargo-v2-${{ runner.os }}-${{ steps.depkey.outputs.hash }}
      - name: corpus size
        if: always()
        working-directory: crates/nzbkit/fuzz
        run: du -sh corpus/yenc_decode 2>/dev/null || true
      - name: save fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/nzbkit/fuzz/corpus
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-arm
          path: crates/nzbkit/fuzz/artifacts/
          if-no-files-found: ignore
