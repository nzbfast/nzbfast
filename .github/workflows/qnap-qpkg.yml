# Build the QNAP package (.qpkg) for a published release. This is the
# workflow that ships it: dispatch it with the tag once the release page
# is up, then scan and upload the artifact by hand, exactly as the
# Synology .spk is done. Step 4c of the publish-release skill is the
# checklist.
#
# It USED to be the on-demand path only, with release.yml building the
# shipped package during the release run from a separate cross-build of
# the same source. That was dropped on 16 Aug 2026: the two builds are
# not the same bytes, and nothing on the release page published a
# checksum for the ones inside the package. Measured on 1.1.3 - packaged
# 72cad10c / 71d12ee9, released 9cc8c994 / a11ce1ac.
#
# WHY THIS IS A WORKFLOW AND NOT A LOCAL SCRIPT. The .qpkg is built by
# QDK, QNAP's own kit, and qbuild does not run on macOS: it finishes by
# rewriting the generated self-extractor with `sed -i "s/SCRIPT_LEN/..."`,
# and BSD sed reads the next argument as a backup suffix, so the length
# patch never lands and the package cannot unpack itself. Hand-assembling
# the layout instead would mean shipping a format we had guessed at, to
# run as root on somebody's NAS. So it is built where QDK works.
#
# The payload is not compiled here. make-qpkg.sh downloads the release's
# own static musl linux binaries and checks them against SHA256SUMS.txt,
# the same as the Synology .spk - the package ships the exact bits that
# were released, and this runner needs no Rust at all.
#
# WHAT IT DOES NOT DO: upload. Release assets go up through
# packaging/upload-release-assets.sh from a maintainer's machine, under
# the release account, and only for files carrying a local scan stamp
# (TODO 63f - nothing uploads while unscanned). This job leaves the
# package as a workflow artifact and prints the two commands to finish
# the job by hand.
#
# BETA. Nobody on the team owns a QNAP. Everything here is verified by
# taking the built package apart again and by the off-box install tests;
# none of it is proof that QTS installs it. See packaging/qnap/README.md.
name: qnap-qpkg
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the .qpkg from (default: the latest release)"
        required: false
      port:
        description: "Port to bake in (default 6789; anything else marks a test build)"
        required: false
        default: "6789"
  # Also on any change to the packaging itself. qbuild does not run on a
  # maintainer's Mac, so without this the only thing that ever exercises
  # a qpkg.cfg edit is a release - and the first sign of a mistake would
  # be a package somebody could not install. The smoke build uses the
  # latest published release's binaries; nothing is uploaded.
  pull_request:
    paths:
      - "packaging/qnap/**"
      - "packaging/tests/qnap-install.sh"
      - ".github/workflows/qnap-qpkg.yml"

permissions: {}

jobs:
  qpkg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Deliberately not called TAG: a job-level env var wins over one
      # written to $GITHUB_ENV by a step, so reusing the name would make
      # the resolved tag below invisible to every later step.
      INPUT_TAG: ${{ inputs.tag }}
      PORT: ${{ inputs.port }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ONLY the payload is tag-selected. Everything else in the package -
      # qpkg.cfg, package_routines, qdk-pin.txt, and through that pin the
      # QDK-supplied qinstall.sh that runs as ROOT on the user's NAS -
      # comes from whatever this run checked out. A dispatch at the default
      # branch therefore ships main's packaging code wrapped around a tag's
      # binaries, and in this repo main moves under concurrent sessions
      # daily, so "main happens to equal the tag" is the exception rather
      # than the rule. The publish-release skill already states this rule
      # for provenance-release.yml at 4b: `--ref` is not optional and is
      # not the same statement as `-f tag=`. Assert it here so a dispatch
      # that forgot it fails in ten seconds rather than producing a package
      # nobody can trace to a commit.
      #
      # Only for a tag-bearing dispatch: a pull_request run is a packaging
      # smoke against the latest release and is SUPPOSED to be the PR's
      # code, and a dispatch with no tag is explicitly "package whatever is
      # latest" from this ref.
      - name: The checkout must be the tag being packaged
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          set -euo pipefail
          want=$(git rev-parse -q --verify "refs/tags/$INPUT_TAG^{commit}" || true)
          have=$(git rev-parse HEAD)
          if [ -z "$want" ] || [ "$want" != "$have" ]; then
            echo "This run checked out $have, which is not $INPUT_TAG." >&2
            echo "The .qpkg would ship this ref's packaging code - qpkg.cfg," >&2
            echo "package_routines and the pinned qinstall.sh that runs as" >&2
            echo "root on the NAS - around $INPUT_TAG's binaries, and nothing" >&2
            echo "downstream records which commit built it. Re-dispatch AT" >&2
            echo "the tag:" >&2
            echo "  gh workflow run qnap-qpkg.yml --ref $INPUT_TAG -f tag=$INPUT_TAG" >&2
            exit 1
          fi
          echo "packaging $INPUT_TAG from $have"

      - name: Install what QDK needs
        run: |
          set -euo pipefail
          # rsync is what qbuild stages shared/ with, and it is not on
          # the runner image. Nothing else is compiled: the payload is
          # downloaded.
          #
          # fakeroot is what stops qbuild writing this runner's account
          # into every member of the package's two inner tars - the 1.1.3
          # package shipped `uname='runner'` throughout. make-qpkg.sh
          # refuses to build without it rather than leak again silently.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync file fakeroot

      # Pinned by commit, not by tag or branch: qinstall.sh is COPIED
      # INTO the package and runs as root on the user's NAS, so the QDK
      # revision is code we ship. packaging/qnap/qdk-pin.txt says so and
      # holds the sha.
      - name: Fetch the pinned QDK
        run: |
          set -euo pipefail
          commit=$(grep -v '^#' packaging/qnap/qdk-pin.txt | grep -m1 .)
          echo "QDK pinned at $commit"
          git clone --quiet https://github.com/qnap-dev/QDK.git "$RUNNER_TEMP/qdk"
          git -C "$RUNNER_TEMP/qdk" checkout --quiet --detach "$commit"
          chmod 755 "$RUNNER_TEMP/qdk/shared/bin/qbuild"
          # qpkg_encrypt stamps the checksum into the package trailer and
          # is a C program QDK ships as source. Without it qbuild prints
          # one "command not found" line among its progress messages and
          # still exits 0, leaving App Center to find the blank field.
          make -C "$RUNNER_TEMP/qdk/src"
          echo "$RUNNER_TEMP/qdk/shared/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/qdk/src/bin" >> "$GITHUB_PATH"

      # The install-time decisions - where the data goes, which binary to
      # keep, what an upgrade must not touch - are the part of a NAS
      # package that cannot be tried out before a NAS installs it. They
      # run here so a red build is the thing that stops the package,
      # rather than a user's first upgrade.
      - name: Off-box install tests
        run: packaging/tests/qnap-install.sh

      # A dispatch names the tag - which is what a release does. A pull
      # request has none, so it builds against whatever is currently
      # released. Either way the payload is
      # the published static musl binaries, checked against the release's
      # own SHA256SUMS.txt by make-qpkg.sh.
      - name: Resolve the release to package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo nzbfast/nzbfast --json tagName -q .tagName)
            echo "no tag given - packaging the latest release, $tag"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "tag must look like vX.Y.Z, got: $tag" >&2; exit 1 ;;
          esac
          echo "VER=${tag#v}" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Build the .qpkg
        run: |
          set -euo pipefail
          packaging/qnap/make-qpkg.sh "$VER" dist "${PORT:-6789}"
          ls -l dist/
      # Unlike the identity SCANNER, this one ships in the public tree
      # (it holds no private vocabulary - it reads tar/ar/rpm headers),
      # so a public PR can run it and this step is not a red check on
      # somebody else's branch. It splits the .qpkg the way
      # packaging/qnap/unpack-qpkg.sh documents and reads the owner
      # fields of both inner tars without extracting.
      - name: No builder identity in the package
        run: python3 packaging/check-archive-identity.py dist/*.qpkg

      # No identity leak scan here on purpose. That scanner is one of the
      # few things .github ships without - it contains the private
      # vocabulary it greps for, so publish-public.sh strips it - and a
      # workflow step that shells out to a file the public repo does not
      # have is a red check on somebody else's PR. It is not skipped, it
      # is moved: nothing reaches a release without it, because
      # upload-release-assets.sh refuses any asset whose current sha256
      # has no scan stamp. The two commands below are in that order for
      # that reason.

      # A pull_request run resolves the SAME version (it has no tag input,
      # so it packages the latest release) and so used to produce an
      # artifact with the SAME name as the release dispatch's. Step 4c
      # downloads by name, so a PR that touched packaging/qnap/** and
      # finished between the dispatch and the download could substitute an
      # unmerged installer into a release asset, silently - the scan gate
      # certifies contents, not which run produced them. Naming PR
      # artifacts apart makes that impossible: `-n qnap-qpkg-X.Y.Z` can
      # only ever match a dispatch.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "qnap-qpkg-${{ env.VER }}${{ github.event_name == 'pull_request' && format('-pr{0}', github.event.number) || '' }}"
          path: dist/*.qpkg
          if-no-files-found: error

      - name: How to finish the job
        run: |
          f=$(ls dist/*.qpkg)
          cat <<EOF
          Built $(basename "$f").

          It is NOT uploaded. Download the artifact, then from the repo:

            packaging/scan-release-assets.sh <path>/$(basename "$f")
            packaging/upload-release-assets.sh $TAG <path>/$(basename "$f")

          Do NOT add it to latest.json: the update manifest is signed and
          carries an anti-rollback serial, and this package has never run
          on real hardware. packaging/qnap/README.md has the checklist for
          promoting it once a QNAP owner confirms it works.
          EOF
