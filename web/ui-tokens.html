<!--
  ONE design system for every page nzbfast serves: the dashboard, the wall
  and the manual (all 16 translations of it).

  Before this file, each surface carried its own palette under its own
  variable names - the dashboard on #0e1014/--card, the wall on
  #0a0b10/--panel, the manual on #0f1116/--card - and only the dashboard
  read the user's theme at all. Picking "Light" in Settings gave you a
  light dashboard, a pitch-black wall and a manual that did whatever the
  OS said. There was no shared stylesheet to fix it in, because the same
  role had a different NAME on each page.

  serve.rs (ui_themed) substitutes this whole snippet for the tokens
  placeholder in each page's <head>, so it is inlined (no extra round
  trip, no flash of unstyled content) and there is exactly one copy to
  edit. Do not write the placeholder's literal name in here: it would be
  re-emitted into every served page.

  Surfaces are --surface / --surface-2, and nothing else. The dashboard's
  --card/--card2 and the wall's --panel/--panel2 were kept as aliases
  while the wall was being restructured in parallel; all 54 uses, the
  contrast report's token read, and the 16 manuals have since migrated,
  so the aliases are gone. One name per role.
-->
<script>
// Appearance, applied BEFORE first paint. This has to be an inline script
// in <head>: running it from the page's main script at the end of <body>
// means the page paints with the default dark palette first, and a
// light-theme user sees a dark flash on every load.
//
// Deliberately tiny and defensive - it runs before anything else exists,
// so it cannot call helpers, and a corrupt localStorage value must not
// stop the page loading.
(function(){
  try{
    var r=document.documentElement;
    var m=localStorage.getItem('nzbfastTheme');
    // "auto" (or absent) means no attribute, leaving prefers-color-scheme
    // in charge.
    if(m&&m!=='auto') r.setAttribute('data-theme',m);
    var a=localStorage.getItem('nzbfastAccent');
    // Only a literal #rrggbb is honoured: this value reaches a CSS custom
    // property, so anything else stays out of the stylesheet.
    if(a&&/^#[0-9a-f]{6}$/i.test(a)){
      r.style.setProperty('--user-acc',a);
      r.setAttribute('data-accent','1');
    }
    // Interface scale. This drives `zoom` (see --ui-zoom below), NOT the
    // root font-size: every size on these pages is in px, so scaling the
    // root scaled nothing at all and the slider had never once moved a
    // pixel - it wrote its value, redrew its own "140%" label, and the
    // page stayed exactly as it was (reported by a tester 2 Aug 2026,
    // who reasonably read it as a container quirk). Keep the stored key
    // and its 0.8-1.4 range so an existing setting starts working rather
    // than resetting.
    var f=parseFloat(localStorage.getItem('nzbfastFontScale'));
    if(f>=0.8&&f<=1.4) r.style.setProperty('--ui-zoom',f);
    // §Stage6 appearance layers. Same reasoning as the theme: applied
    // before first paint, so nobody watches the page change shape after
    // it has already drawn. Each value is checked against a fixed list,
    // because it reaches a CSS attribute selector.
    var L={corners:['square','round'],border:['faint','strong'],
           palette:['cb','warm'],motion:['full','none'],font:['readable','mono']};
    for(var k in L){
      var v=localStorage.getItem('nzbfast'+k[0].toUpperCase()+k.slice(1));
      if(v&&L[k].indexOf(v)>=0) r.setAttribute('data-'+k,v);
    }
    // Custom colours, literal #rrggbb only - these reach custom properties.
    var C={userbg:'--user-bg',usersurface:'--user-surface',userfg:'--user-fg'};
    for(var a in C){
      var cv=localStorage.getItem('nzbfast'+a);
      if(cv&&/^#[0-9a-f]{6}$/i.test(cv)){ r.style.setProperty(C[a],cv); r.setAttribute('data-'+a,'1'); }
    }
    var d=localStorage.getItem('nzbfastDensity');
    if(d==='compact'||d==='spacious') r.setAttribute('data-density',d);
  }catch(e){/* private mode, or a corrupt value: keep the defaults */}
})();
</script>
<style>
:root{
  /* Tell the browser this is a dark UI. Without it, every control the OS
     draws itself - <select> popups, scrollbars, number spinners, date
     pickers - is painted LIGHT while inheriting our near-white --fg, so
     the dropdown list came out white-on-white (measured 1.20:1, i.e.
     invisible). Reported from a Windows machine; macOS happened to hide
     it because its popups carry their own colours. */
  color-scheme:dark;
  --bg:#0e1014;--surface:#171a21;--surface-2:#1e222b;--fg:#e8eaf0;--dim:#8991a5;
  --line:rgba(140,150,175,.14);--acc:#4da3ff;--acc2:#8d71ff;
  --ok:#35c88a;--warn:#f5b445;--bad:#ec5a5a;
  --p0:#4da3ff;--p1:#35c88a;--p2:#f5b445;--p3:#ec5a5a;--p4:#7c5cff;--p5:#22c3d6;
  /* Identity colours: things that ARE something (a provider, a server),
     not things that MEAN something. Deliberately avoids the exact
     ok/warn/bad hues so a healthy provider is never painted error-red
     just because it is fourth in the list. */
  --id0:#4da3ff;--id1:#22c3d6;--id2:#8d71ff;--id3:#e07ab8;--id4:#7cb87c;--id5:#c9a15a;
  --gold:#f0c33c;--code:#1d222d;--mark:#4a3f14;
}
/* The light theme used to override only the neutrals and accents, so it
   inherited the DARK palette's status colours and rendered them on white:
   ok 2.15:1, warn 1.83:1, bad 2.98:1 - all below the 4.5:1 floor, which
   is why "Completed" looked washed out in light mode. These are the same
   hues walked down in lightness until they clear 4.5:1 on white, --bg and
   --surface-2 alike. The chart series (--p0..--p5) stay bright: they are
   fills read against their own legend, not body text. */
@media (prefers-color-scheme:light){:root{
  color-scheme:light;
  --bg:#eef0f5;--surface:#fff;--surface-2:#f6f7fb;--fg:#171b26;--dim:#5c6577;
  --line:rgba(30,40,70,.10);--acc:#1e6bcf;--acc2:#6d47e6;
  --ok:#217c56;--warn:#976208;--bad:#d81919;
  --code:#f0f2f7;--mark:#fff3c9;
}}
/* Explicit theme choice. These are attribute selectors, so they outrank
   the media query above whichever way the OS is set - "Auto" simply means
   no data-theme attribute at all, which leaves the media query in charge.
   Applied before first paint by the script above, so a light-theme user
   never sees a dark flash. */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef0f5;--surface:#fff;--surface-2:#f6f7fb;--fg:#171b26;--dim:#5c6577;
  --line:rgba(30,40,70,.10);--acc:#1e6bcf;--acc2:#6d47e6;
  --ok:#217c56;--warn:#976208;--bad:#d81919;
  --code:#f0f2f7;--mark:#fff3c9;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1014;--surface:#171a21;--surface-2:#1e222b;--fg:#e8eaf0;--dim:#8991a5;
  --line:rgba(140,150,175,.14);--acc:#4da3ff;--acc2:#8d71ff;
  --ok:#35c88a;--warn:#f5b445;--bad:#ec5a5a;
  --code:#1d222d;--mark:#4a3f14;
}
/* High contrast: pure black ground, white text, and a --dim that is a
   real reading colour rather than a muted one. Every pair here clears
   WCAG AAA (7:1) against --bg, and the borders stop being hairlines. */
:root[data-theme="contrast"]{
  color-scheme:dark;
  --bg:#000;--surface:#0b0b0d;--surface-2:#16161a;--fg:#fff;--dim:#d2d6e0;
  --line:rgba(255,255,255,.34);--acc:#7ac2ff;--acc2:#c0a8ff;
  --ok:#5ce0a4;--warn:#ffd166;--bad:#ff8b8b;
  --p0:#7ac2ff;--p1:#5ce0a4;--p2:#ffd166;--p3:#ff8b8b;--p4:#c0a8ff;--p5:#63dcec;
  --id0:#7ac2ff;--id1:#63dcec;--id2:#c0a8ff;--id3:#f2a5d2;--id4:#a4d6a4;--id5:#e0c08a;
  --gold:#ffd166;--code:#16161a;--mark:#5a4a12;
}
/* A user-set accent overrides whatever the theme chose. Kept as its own
   layer so switching theme does not silently discard the accent. */
:root[data-accent]{--acc:var(--user-acc)}
/* §Stage6 appearance studio. Everything below is a LAYER over the chosen
   theme rather than a replacement for it, so switching theme keeps your
   shape, density and palette, and a custom colour keeps overriding until
   you clear it. All applied before first paint by the script above. */
:root{--radius:13px;--radius-sm:7px}
:root[data-corners="square"]{--radius:3px;--radius-sm:3px}
:root[data-corners="round"]{--radius:20px;--radius-sm:12px}
/* Border strength. Composed from --fg so one rule covers light and dark:
   the theme flips --fg, and the border follows it. */
:root[data-border="faint"]{--line:color-mix(in srgb,var(--fg) 6%,transparent)}
:root[data-border="strong"]{--line:color-mix(in srgb,var(--fg) 30%,transparent)}
/* Chart series. The default set is chosen for separation on a dark
   ground; the colour-blind-safe set is Okabe-Ito, which stays
   distinguishable under deuteranopia and protanopia - the common cases,
   and the ones a red/green pair fails. */
:root[data-palette="cb"]{--p0:#56b4e9;--p1:#009e73;--p2:#e69f00;--p3:#d55e00;
  --p4:#cc79a7;--p5:#0072b2;
  --id0:#56b4e9;--id1:#0072b2;--id2:#cc79a7;--id3:#e69f00;--id4:#009e73;--id5:#d55e00}
:root[data-palette="warm"]{--p0:#f0894a;--p1:#e5c04a;--p2:#d9605e;--p3:#b07cc6;
  --p4:#5ea9c9;--p5:#7cb87c;
  --id0:#f0894a;--id1:#e5c04a;--id2:#b07cc6;--id3:#5ea9c9;--id4:#7cb87c;--id5:#d9605e}
/* Motion. The OS setting is honoured by default (the media query above);
   these let someone override it per browser in either direction. */
:root[data-motion="none"] *{animation:none!important;transition:none!important;
  scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){
  :root[data-motion="full"] *{animation-duration:revert!important;transition-duration:revert!important}
}
/* A user's own colours, applied over whichever theme is selected. */
:root[data-userbg]{--bg:var(--user-bg)}
:root[data-usersurface]{--surface:var(--user-surface);--card:var(--user-surface);--panel:var(--user-surface)}
:root[data-userfg]{--fg:var(--user-fg)}
/* Font. OpenDyslexic is not shipped (it is a licensed download), so this
   picks the most legible stacks already on the machine rather than
   pretending to install one. */
:root[data-font="readable"] body{font-family:"Atkinson Hyperlegible","Lexend",Verdana,Tahoma,
  -apple-system,BlinkMacSystemFont,system-ui,sans-serif;letter-spacing:.01em}
:root[data-font="mono"] body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* Native popup lists take neither our page background nor, on some
   engines, the color-scheme hint - so state them outright. Belt and
   braces with color-scheme above: whichever the engine honours, the list
   is legible. */
option,optgroup{background:var(--surface);color:var(--fg)}
/* Shape reaches the surfaces through these, so a page rule that names a
   literal radius simply keeps its own. */
.card,.tile,.sheet,#fsmodal,#gbmodal,.vpmenu,.setrail{border-radius:var(--radius)}
button,input.txt,select.sel,input.search,.chip{border-radius:var(--radius-sm)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style>
/* The interface-scale control, for every page that inlines these tokens.
   `zoom` rather than a root font-size: these pages size everything in px,
   so the old root-font-size approach moved nothing (see the loader
   above). Zoom takes the whole layout with it - type, spacing, controls
   and chart furniture together - which is also what a size control is
   normally expected to do, and it cannot leave text overflowing padding
   that stayed behind.

   On the BODY, not :root: zooming the root element re-scales the
   viewport that position:fixed and 100vh resolve against, so the header
   and any fixed overlay drift. Default 1 means a page with no setting is
   byte-identical to before. */
body{zoom:var(--ui-zoom,1)}

/* One icon class. 1em so an icon scales with the text it sits beside,
   including the user's text-size setting. */
.ic{width:1.05em;height:1.05em;flex:none;vertical-align:-.16em;
  fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.ic.solid{fill:currentColor;stroke:none}

/* A checkbox and its label as ONE row: the secondary toggles under a
   card's main controls. Lives here rather than in a page because it was
   defined in wall.html alone while dashboard.html used it three times -
   so on the dashboard it styled nothing, and the watchlist's three
   toggles rendered as one run-on inline sentence
   ("...wanted items [] Grab as soon as a match is posted At most [ ] of
   those checks an hour"), with the number input marooned mid-sentence.
   Reported by a tester on 1.1.5; measured in the page, all three labels
   sat at the same `top`. */
.mtog{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:12px;
  white-space:nowrap;cursor:pointer;user-select:none}
.mtog input{accent-color:var(--acc);margin:0}
</style>
