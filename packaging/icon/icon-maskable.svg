<?xml version="1.0" encoding="UTF-8"?>
<!-- nzbfast MASKABLE app icon. Same art as icon.svg, laid out for the
     Android/Chromium adaptive-icon mask instead of for a square.

     Two differences, and both are forced by what a mask does. The tile
     BLEEDS to the edge here rather than sitting inset with rounded
     corners at x=60: the platform draws the silhouette (circle, squircle,
     teardrop, rounded square - it varies by launcher and by OEM skin), so
     any corner we round ourselves is either cropped away or leaves a
     transparent notch inside the mask. And the artwork is scaled into the
     SAFE ZONE, the centred circle of diameter 80% of the canvas that every
     mask is guaranteed to keep: icon.svg's bolt and bars span a
     679x623 box centred at (471.5, 518.4), whose half-diagonal is 461
     units, so 0.86 brings it to 396 against the 409.6-unit safe radius.
     Recentre first, then scale - the art is not centred in icon.svg's
     canvas (the bars run further left than the bolt runs right).

     Geometry, colours and the bolt path are copied from icon.svg and must
     stay in step with it. Regenerate the rasters with make-favicons.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tileg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa8ff"/>
      <stop offset="1" stop-color="#6d47e6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#tileg)"/>
  <g transform="translate(512 512) scale(0.86) translate(-471.5 -518.4)">
    <g fill="#fff">
      <rect x="132" y="274" width="312" height="52" rx="26" opacity=".46"/>
      <rect x="132" y="374" width="262" height="52" rx="26" opacity=".36"/>
      <rect x="132" y="474" width="212" height="52" rx="26" opacity=".28"/>
    </g>
    <path d="M 531.3 237.2 Q 546.5 206.8 580.5 206.8 L 775.1 206.8 Q 809.1 206.8 789.6 234.6
             L 661.7 417.8 Q 642.2 445.7 676.2 445.7 L 798.9 445.7 Q 846.9 445.7 811.2 477.8
             L 449.6 802.8 Q 393 853.6 427.6 785.9 L 526.9 591 Q 542.3 560.7 508.3 560.7
             L 413.6 560.7 Q 369.6 560.7 389.3 521.4 Z" fill="#fff"/>
  </g>
</svg>
